# Tests every push and pull request, and publishes getgradify.com only when they pass.
#   push to main      test → (pass) → deploy to GitHub Pages
#                           (fail) → nothing is published; the live site stays as it was
#   any other branch  test only
#   pull request      test only, never deploys
# For this to be the only way the site is published, GitHub Pages must use "GitHub Actions" as its source
# (Settings → Pages → Build and deployment → Source). Until then the old branch deploy also runs.
# Only the allowlisted website files are published (scripts/build-site.mjs, tested in tests/deploy.test.mjs).
# Nothing here needs a secret.
name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pinned dev dependencies (PGlite for the database rehearsals, bcryptjs)
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Release statuses match content
        run: node scripts/audit-sites.mjs

      - name: No broken internal links
        run: node scripts/qa-audit.mjs

      - name: The public site builds from the allowlist and passes its checks
        run: node scripts/build-site.mjs --check

      - name: Generated files are up to date
        run: |
          node scripts/build-sitemap.mjs
          npm run sync
          node scripts/ix-manifest.mjs
          node scripts/build-api.mjs
          git diff --exit-code -- sitemap.xml supabase/functions/_shared/ supabase/dashboard/ kit/course/ix-manifest.js kit/api/ || {
            echo "::error::Generated files are out of date. Run node scripts/build-sitemap.mjs, npm run sync, node scripts/ix-manifest.mjs and node scripts/build-api.mjs, then commit."
            exit 1
          }

  deploy:
    # only after every test step has passed, and only from main (never from a pull request or another branch)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # only the allowlisted files the website needs (scripts/build-site.mjs); docs, scripts, migrations, server
      # functions, tests and package files stay in the repository. The build re-runs its checks and fails if any fails.
      - name: Assemble the site from the allowlist
        run: node scripts/build-site.mjs "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
