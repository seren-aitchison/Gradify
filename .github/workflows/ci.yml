# Tests every push and pull request, and publishes getgradify.com only when they pass.
#   push to main      test and signed-in → (both pass) → deploy to GitHub Pages
#                           (fail) → nothing is published; the live site stays as it was
#   any other branch  test and signed-in only
#   pull request      test and signed-in, never deploys
# For this to be the only way the site is published, GitHub Pages must use "GitHub Actions" as its source
# (Settings → Pages → Build and deployment → Source). Until then the old branch deploy also runs.
# Only the allowlisted website files are published (scripts/build-site.mjs, tested in tests/deploy.test.mjs).
# Nothing here needs a secret.
name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pinned dev dependencies (PGlite for the database rehearsals, bcryptjs)
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Release statuses match content
        run: node scripts/audit-sites.mjs

      - name: No broken internal links
        run: node scripts/qa-audit.mjs

      - name: The public site builds from the allowlist and passes its checks
        run: node scripts/build-site.mjs --check

      - name: Search pages are up to date
        # tools, guides, glossary, topics, study plans, llms.txt, canonical and link-preview tags (scripts/build-seo.mjs)
        run: |
          node scripts/build-seo.mjs --check || {
            echo "::error::Search pages are out of date. Run node scripts/build-seo.mjs, then node scripts/build-sitemap.mjs, then commit."
            exit 1
          }

      - name: Generated files are up to date
        run: |
          node scripts/build-sitemap.mjs
          npm run sync
          node scripts/ix-manifest.mjs
          node scripts/build-api.mjs
          git diff --exit-code -- sitemap.xml sitemaps/ supabase/functions/_shared/ supabase/dashboard/ kit/course/ix-manifest.js kit/api/ || {
            echo "::error::Generated files are out of date. Run node scripts/build-sitemap.mjs, npm run sync, node scripts/ix-manifest.mjs and node scripts/build-api.mjs, then commit."
            exit 1
          }

      - name: The visual learning inventory is up to date
        # docs/visual-learning/inventory.json and INVENTORY.md follow the lessons, diagrams, labs and visual plans
        run: |
          node scripts/visual/inventory.mjs --check || {
            echo "::error::The visual learning inventory is out of date. Run node scripts/visual/inventory.mjs, then commit."
            exit 1
          }

  signed-in:
    # The signed-in student journey in a real browser (scripts/check-sync.cjs): the real course pages against a stand-in
    # Supabase, as a signed-in learner. Progress and answers reach the account, a second device sees them, offline work
    # syncs once, the AI tutor's failures get plain messages, and no page errors. Everything in "test" runs signed out,
    # which is how lessons stopped opening for signed-in learners (17 to 18 Nov) without anything failing.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: signed-in-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pinned dev dependencies (including Playwright)
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Serve the site
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && exit 0; sleep 1; done
          echo "::error::The site didn't start on port 8080"; exit 1

      - name: Page speed guard (LCP and layout shift, throttled phone, gzipped like GitHub Pages)
        run: node scripts/perf-check.cjs

      - name: Signed-in journey (stand-in Supabase)
        run: node scripts/check-sync.cjs
        env:
          BASE: http://127.0.0.1:8080

  deploy:
    # only after every test step and the signed-in journey have passed, and only from main (never from a pull request
    # or another branch)
    needs: [test, signed-in]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # the build minifies CSS and JS with esbuild (the one dev dependency it needs)
      - name: Install esbuild
        run: npm ci --no-audit --no-fund --ignore-scripts

      # only the allowlisted files the website needs (scripts/build-site.mjs); docs, scripts, migrations, server
      # functions, tests and package files stay in the repository. The build re-runs its checks and fails if any fails.
      - name: Assemble the site from the allowlist
        run: node scripts/build-site.mjs "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4

      # tell Bing (and the AI search engines that use its index) which pages this deploy changed, via IndexNow
      # (scripts/indexnow.mjs). Best effort: a failure here never fails the deploy.
      - name: Ping IndexNow with the changed pages
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.before }}" 2>/dev/null && node scripts/indexnow.mjs --since "${{ github.event.before }}" || echo "No previous deploy to compare with; skipping IndexNow."
      # tell feed readers and Google (WebSub) that the RSS feed changed. Best effort, like IndexNow.
      - name: Ping WebSub with the RSS feed
        continue-on-error: true
        run: curl -fsS -X POST -d "hub.mode=publish" --data-urlencode "hub.url=https://getgradify.com/feed.xml" https://pubsubhubbub.appspot.com/ || echo "WebSub ping failed; not fatal."
