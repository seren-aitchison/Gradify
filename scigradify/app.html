<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SciGradify</title>
  <!-- SciGradify's study app, made from kit/templates/subsite by npm run new-site. The meta tag below
       tells the kit which site this is: the top bar shows its name and icon, and the app only
       shows its notes and progress. Sign-in is shared with every Gradify site. -->
  <meta name="gradify-site" content="SciGradify">
  <meta name="description" content="SciGradify: bring your notes. Turn them into flashcards you can trust, revise them, and see your progress.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../kit/styles/base.css">
  <link rel="stylesheet" href="../kit/styles/components.css">
  <link rel="stylesheet" href="../kit/app/app.css">
  <script src="../kit/vendor/supabase/supabase.js" defer></script>
  <script type="module" src="../kit/app/main.js"></script>
</head>
<body class="app-body">
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="wrap">
    <header class="bar glass app-bar">
      <a class="brand" href="./" title="Home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4641ff"/><stop offset=".35" stop-color="#f055dd"/><stop offset=".7" stop-color="#ff5600"/><stop offset="1" stop-color="#ffc002"/></linearGradient></defs><rect x=".75" y=".75" width="30.5" height="30.5" rx="9" fill="#0b0b0b" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/><path d="M22.9 10.9A8.6 8.6 0 1 0 24.6 16H16.4" fill="none" stroke="url(#gg)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Gradify
      </a>
      <nav class="app-nav" aria-label="App">
        <a href="#/today" data-route="today">Today</a>
        <a href="#/study" data-route="study">Study</a>
        <a href="#/notes" data-route="notes">Notes</a>
        <a href="#/progress" data-route="progress">Progress</a>
        <a href="#/plan" data-route="plan">Plan</a>
      </nav>
      <a class="mode-chip" id="mode" href="#/account" title="Account"></a>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" aria-label="App">
    <a href="#/today" data-route="today">Today</a>
    <a href="#/study" data-route="study">Study</a>
    <a href="#/notes" data-route="notes">Notes</a>
    <a href="#/progress" data-route="progress">Progress</a>
    <a href="#/plan" data-route="plan">Plan</a>
  </nav>
  <div class="toast lg" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
