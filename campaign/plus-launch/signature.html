<!--
  Gradify email signature: black Liquid Glass, email-safe.
  The "glass" is a near-black panel with a fine light edge and a spectrum hairline: no backdrop-filter, no images,
  so it renders the same in Gmail, Outlook (the gradient falls back to solid #f055dd) and Apple Mail.
  To install: open this file in a browser, select the signature card, copy, and paste into the mail client's
  signature settings (Gmail: Settings > See all settings > Signature. Apple Mail: Settings > Signatures, untick
  "Always match my default message font". Outlook: Settings > Mail > Compose and reply).
  Fill {{FOUNDER_NAME}}; delete the Discord cell if there's no invite yet.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif;">
  <tr>
    <td bgcolor="#0b0b0b" style="background-color:#0b0b0b;border:1px solid #2e2e34;border-radius:14px;padding:0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="340" style="width:340px;">
        <tr><td height="2" bgcolor="#f055dd" style="height:2px;line-height:2px;font-size:2px;background-color:#f055dd;background-image:linear-gradient(90deg,#4641ff,#f055dd,#ff5600,#ffc002);border-radius:14px 14px 0 0;">&nbsp;</td></tr>
        <tr>
          <td style="padding:14px 18px 4px 18px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td valign="middle" style="padding-right:12px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td width="34" height="34" align="center" valign="middle" bgcolor="#000000" style="width:34px;height:34px;background-color:#000000;border:1px solid #3a3a44;border-radius:10px;font-size:18px;font-weight:700;line-height:34px;color:#f055dd;">G</td></tr></table>
                </td>
                <td valign="middle">
                  <p style="margin:0;font-size:15px;line-height:1.3;font-weight:700;color:#ffffff;">{{FOUNDER_NAME}}</p>
                  <p style="margin:0;font-size:12px;line-height:1.4;color:#a0a0aa;">Founder, Gradify</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 18px 14px 18px;font-size:12px;line-height:1.6;color:#a0a0aa;">
            <a href="https://getgradify.com" style="color:#ffffff;text-decoration:none;font-weight:600;">getgradify.com</a>
            &nbsp;·&nbsp; <a href="mailto:hello@getgradify.com" style="color:#c8c8d0;text-decoration:none;">hello@getgradify.com</a>
            <!-- DISCORD: delete the next line if there's no invite yet -->
            &nbsp;·&nbsp; <a href="{{DISCORD_URL}}" style="color:#c8c8d0;text-decoration:none;">Discord</a>
          </td>
        </tr>
        <tr>
          <td style="padding:0 18px 12px 18px;font-size:10px;line-height:1.5;color:#6e6e78;border-top:1px solid #1e1e24;padding-top:8px;">
            Gradify Ltd · Registered in {{REGISTERED_IN}}, no. {{COMPANY_NUMBER}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
