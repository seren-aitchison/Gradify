<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Gradify mark on a black Liquid Glass tile with a rainbow border. Source for assets/email/gradify-logo-glass.png
       (render at 192 x 192: campaign/plus-launch/README.md). -->
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4641ff"/><stop offset=".35" stop-color="#f055dd"/><stop offset=".7" stop-color="#ff5600"/><stop offset="1" stop-color="#ffc002"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="1.05" r=".75">
      <stop offset="0" stop-color="#f055dd" stop-opacity=".28"/><stop offset=".6" stop-color="#4641ff" stop-opacity=".08"/><stop offset="1" stop-color="#4641ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <clipPath id="tile"><rect x="3" y="3" width="58" height="58" rx="17"/></clipPath>
  </defs>
  <!-- rainbow border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="18.5" fill="none" stroke="url(#rainbow)" stroke-width="3"/>
  <!-- glass body -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="#08080a"/>
  <g clip-path="url(#tile)">
    <rect x="3" y="3" width="58" height="58" fill="url(#glow)"/>
    <rect x="3" y="3" width="58" height="58" fill="url(#sheen)"/>
    <ellipse cx="22" cy="10" rx="20" ry="6" fill="#fff" opacity=".10"/>
  </g>
  <!-- inner rim highlight -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="url(#rim)" stroke-width="1"/>
  <!-- the G -->
  <path d="M45.8 21.8A17.2 17.2 0 1 0 49.2 32H32.8" fill="none" stroke="url(#rainbow)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(32 32) scale(.86) translate(-32 -32)"/>
</svg>
