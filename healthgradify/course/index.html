<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HealthGradify · Health and Wellbeing</title>
  <!-- HealthGradify Health and Wellbeing: the whole curriculum (kit/courses/health/) as a course, run by the shared course engine (kit/course/course.js). -->
  <meta name="gradify-site" content="HealthGradify">
  <meta name="description" content="HealthGradify Health and Wellbeing: a structured course with lessons, check questions at three levels, flashcards, quizzes, exams and progress.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../../kit/styles/base.css">
  <link rel="stylesheet" href="../../kit/styles/components.css">
  <link rel="stylesheet" href="../../kit/styles/subsite.css">
  <link rel="stylesheet" href="../../kit/styles/model.css">
  <link rel="stylesheet" href="../../kit/styles/course.css">
  <link rel="stylesheet" href="../../kit/styles/labs.css">
  <link rel="stylesheet" href="../../kit/styles/social-labs.css">
  <script src="../../kit/vendor/supabase/supabase.js" defer></script>
  <script type="module">
    import { SITES, nameHtml } from "../../kit/core/site.js";
    import { icon } from "../../kit/core/icons.js";
    import { tile, ink } from "../../kit/core/colour.js";
    import { mountCourse } from "../../kit/course/course.js";
    import course from "../../kit/courses/health/course.js";
    const s = SITES.find((x) => x.n === "HealthGradify");
    if (s) {
      document.body.style.setProperty("--accent", "#34d399");
      document.querySelectorAll(".sub-brand .icon").forEach((el) => { el.innerHTML = icon(s.i); el.style.cssText = `--c:#${s.c};--tile:${tile(s.c)};--ink:${ink(s.c)}`; });
      document.querySelectorAll("[data-site-name]").forEach((n) => { n.innerHTML = nameHtml(s); });
    }
    mountCourse(document.getElementById("course"), course);
  </script>
</head>
<body class="sub-page">
  <div class="wrap">
    <header class="sub-nav glass">
      <a class="sub-brand" href="../"><span class="icon"></span><span data-site-name>HealthGradify</span></a>
      <nav class="sub-links" aria-label="HealthGradify">
        <a href="./" aria-current="page">Course</a>
        <a href="../app.html#/study">Study</a>
        <a href="../app.html#/notes">Notes</a>
        <a href="../app.html#/progress">Progress</a>
        <a href="../map.html">Map</a>
        <a href="../3d.html">3D</a>
        <a href="/">Gradify</a>
      </nav>
      <div class="sub-right">
        <a class="signin" href="../app.html#/account">Sign in</a>
        <a class="btn btn-light lg btn-sm" href="#/learn"><span>Start free</span></a>
      </div>
    </header>
    <div id="course"></div>
    <footer class="sub-foot"><span data-site-name>HealthGradify</span> is part of <a href="/">Gradify</a>. One Gradify account is coming to every Gradify site; until then, your progress is saved in this browser.</footer>
  </div>
</body>
</html>
