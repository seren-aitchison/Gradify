<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 438.8" width="700.0" height="438.8" role="img" aria-label="An oval cell with a nucleus, a bracket above it marking the image length of 90 mm, a scale bar labelled 20 µm, and the calculation: 90 000 µm divided by 60 µm equals ×1500." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="350.0" y="18.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">A human cheek cell, as it appears in the image</text><path d="M180.0 62.0 L520.0 62.0" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M180.0 56.0 L180.0 68.0" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M520.0 56.0 L520.0 68.0" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="350.0" y="50.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">image length: 90 mm</text><ellipse cx="350" cy="179.4" rx="170" ry="105.4" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-ink, #151826)" stroke-width="2"/><ellipse cx="322.8" cy="168.86" rx="40.8" ry="33.728" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.35" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="322.8" y="168.9" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">nucleus</text><rect x="34" y="312.8" width="113.3" height="8" fill="var(--vx-ink, #151826)"/><text x="34.0" y="334.8" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">scale bar = 20 µm real length</text><text x="350.0" y="368.8" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">real length: 60 µm</text><text x="350.0" y="390.8" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">magnification = image length ÷ real length</text><text x="350.0" y="412.8" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">= 90 000 µm ÷ 60 µm = ×1 500</text></svg>