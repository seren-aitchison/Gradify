<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 370.4" width="380.0" height="370.4" role="img" aria-label="An oval cell with a nucleus, a bracket above it marking the image length of 90 mm, a scale bar labelled 20 µm, and the calculation: 90 000 µm divided by 60 µm equals ×1500." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="190.0" y="16.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">A human cheek cell, as it appears in the image</text><path d="M80.0 58.0 L300.0 58.0" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M80.0 52.0 L80.0 64.0" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M300.0 52.0 L300.0 64.0" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="190.0" y="46.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">image length: 90 mm</text><ellipse cx="190" cy="138.2" rx="110" ry="68.2" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-ink, #151826)" stroke-width="2"/><ellipse cx="172.4" cy="131.38" rx="26.4" ry="21.824" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.35" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="172.4" y="131.4" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">nucleus</text><rect x="18" y="232.4" width="73.3" height="8" fill="var(--vx-ink, #151826)"/><text x="18.0" y="254.4" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">scale bar = 20 µm real length</text><text x="14.0" y="286.4" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">real length: 60 µm</text><text x="14.0" y="306.4" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">magnification = image length ÷ real</text><text x="14.0" y="326.4" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">length</text><text x="14.0" y="346.4" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">= 90 000 µm ÷ 60 µm = ×1 500</text></svg>