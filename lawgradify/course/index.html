<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LawGradify · Law course</title>
  <!-- LawGradify's law course: the curriculum (kit/courses/law/) run by kit/course/course.js, the same engine as SciGradify Physics. -->
  <meta name="gradify-site" content="LawGradify">
  <meta name="description" content="Law for England and Wales, with Scotland and Northern Ireland: 19 schools and 480 lessons from legal foundations to SQE1, SQE2 and the Bar, with notes, single-best-answer questions, flashcards, quizzes and progress.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../../kit/styles/base.css">
  <link rel="stylesheet" href="../../kit/styles/components.css">
  <link rel="stylesheet" href="../../kit/styles/subsite.css">
  <link rel="stylesheet" href="../../kit/styles/model.css">
  <link rel="stylesheet" href="../../kit/styles/course.css">
  <script src="../../kit/vendor/supabase/supabase.js" defer></script>
  <script type="module">
    import { SITES, nameHtml, accentOf } from "../../kit/core/site.js";
    import { icon } from "../../kit/core/icons.js";
    import { tile, ink } from "../../kit/core/colour.js";
    import { mountCourse } from "../../kit/course/course.js";
    import course from "../../kit/courses/law/course.js";
    const s = SITES.find((x) => x.n === "LawGradify");
    if (s) {
      document.body.style.setProperty("--accent", accentOf(s));
      document.querySelectorAll(".sub-brand .icon").forEach((el) => { el.innerHTML = icon(s.i); el.style.cssText = `--c:#${s.c};--tile:${tile(s.c)};--ink:${ink(s.c)}`; });
      document.querySelectorAll("[data-site-name]").forEach((n) => { n.innerHTML = nameHtml(s); });
    }
    mountCourse(document.getElementById("course"), course);
  </script>
</head>
<body class="sub-page">
  <div class="wrap">
    <header class="sub-nav glass">
      <a class="sub-brand" href="../"><span class="icon"></span><span data-site-name>LawGradify</span></a>
      <nav class="sub-links" aria-label="LawGradify">
        <a href="./" aria-current="page">Course</a>
        <a href="../app.html#/study">Study</a>
        <a href="../app.html#/notes">Notes</a>
        <a href="../map.html">Map</a>
        <a href="../lifeos.html">LifeOS</a>
        <a href="/">Gradify</a>
      </nav>
      <div class="sub-right">
        <a class="signin" href="../app.html#/account">Sign in</a>
        <a class="btn btn-light lg btn-sm" href="#/learn"><span>Start free</span></a>
      </div>
    </header>
    <div id="course"></div>
    <footer class="sub-foot"><span data-site-name>LawGradify</span> is part of <a href="/">Gradify</a>. One account works on every Gradify site.</footer>
  </div>
</body>
</html>
