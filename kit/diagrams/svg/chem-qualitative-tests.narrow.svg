<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 555.0" width="380.0" height="555.0" role="img" aria-label="A tree: fizzing with dilute acid? carbonate. Otherwise white precipitate with BaCl₂? sulfate. Otherwise precipitate with AgNO₃: white chloride, cream bromide, yellow iodide." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="12.0" y="28.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Fizzes with dilute acid, gas turns</text><text x="12.0" y="45.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">limewater milky?</text><text x="28.0" y="68.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="28.0" y="78.0" width="340.0" height="46.0" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="38.0" y="92.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Carbonate</text><text x="38.0" y="109.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. Na<tspan baseline-shift="sub" font-size="8.3">2</tspan>CO<tspan baseline-shift="sub" font-size="8.3">3</tspan></text><text x="28.0" y="140.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><text x="28.0" y="160.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">White precipitate with acidified BaCl₂?</text><text x="44.0" y="183.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="44.0" y="193.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a5, #7c3aed)" fill-opacity=".1" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="54.0" y="207.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Sulfate</text><text x="54.0" y="224.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. Na<tspan baseline-shift="sub" font-size="8.3">2</tspan>SO<tspan baseline-shift="sub" font-size="8.3">4</tspan></text><text x="44.0" y="255.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><text x="44.0" y="275.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">AgNO₃: is the precipitate white?</text><text x="60.0" y="298.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="60.0" y="308.0" width="308.0" height="46.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="70.0" y="322.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Chloride</text><text x="70.0" y="339.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. NaCl</text><text x="60.0" y="370.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><text x="60.0" y="390.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it cream?</text><text x="76.0" y="413.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="76.0" y="423.0" width="292.0" height="46.0" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="86.0" y="437.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Bromide</text><text x="86.0" y="454.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. NaBr</text><text x="76.0" y="485.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="76.0" y="495.0" width="292.0" height="46.0" rx="10" fill="var(--vx-a2, #db2777)" fill-opacity=".1" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="86.0" y="509.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">Iodide (yellow)</text><text x="86.0" y="526.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. NaI</text></svg>