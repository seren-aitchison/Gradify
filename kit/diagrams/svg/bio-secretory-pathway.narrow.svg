<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 778.0" width="380.0" height="778.0" role="img" aria-label="Seven boxes in order: nucleus, ribosome on the rough endoplasmic reticulum, rough ER, transport vesicle, Golgi apparatus, secretory vesicle and plasma membrane." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 92.0 L190.0 117.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 126.0 L185.9 117.0 L194.1 117.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 216.0 L190.0 241.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 250.0 L185.9 241.0 L194.1 241.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 323.0 L190.0 348.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 357.0 L185.9 348.0 L194.1 348.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 430.0 L190.0 455.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 464.0 L185.9 455.0 L194.1 455.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 537.0 L190.0 562.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 571.0 L185.9 562.0 L194.1 562.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 644.0 L190.0 669.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 678.0 L185.9 669.0 L194.1 669.0 Z" fill="var(--vx-ink, #151826)"/><rect x="100.9" y="24.0" width="178.3" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">nucleus</text><text x="190.0" y="57.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the gene is copied into</text><text x="190.0" y="72.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">mRNA</text><rect x="100.0" y="131.0" width="180.0" height="80.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="147.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">ribosome on the rough</text><text x="190.0" y="164.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">ER</text><text x="190.0" y="181.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">translates the mRNA into a</text><text x="190.0" y="196.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">polypeptide</text><rect x="100.0" y="255.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="271.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">rough ER</text><text x="190.0" y="288.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the chain is threaded in,</text><text x="190.0" y="303.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">folded and given sugars</text><rect x="100.0" y="362.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="378.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">transport vesicle</text><text x="190.0" y="395.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">buds off and carries it to</text><text x="190.0" y="410.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the Golgi</text><rect x="100.0" y="469.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="485.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Golgi apparatus</text><text x="190.0" y="502.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">modifies it from the cis</text><text x="190.0" y="517.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">face to the trans face</text><rect x="104.2" y="576.0" width="171.6" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="592.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">secretory vesicle</text><text x="190.0" y="609.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carries it to the cell</text><text x="190.0" y="624.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">surface</text><rect x="104.2" y="683.0" width="171.6" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="699.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">plasma membrane</text><text x="190.0" y="716.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the vesicle fuses:</text><text x="190.0" y="731.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">exocytosis releases it</text></svg>