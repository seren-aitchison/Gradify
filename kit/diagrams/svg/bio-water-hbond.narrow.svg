nt-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">δ−</text></g><g data-part="water molecule"><title>water molecule: Two hydrogens bonded to one oxygen at 104.5°. Oxygen is more electronegative, so it carries a partial negative charge (δ−) and each hydrogen a partial positive charge (δ+): the molecule is polar.</title><path d="M97.3 78.0 L128.9 121.4" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle cx="128.9" cy="121.4" r="11.2" fill="#e8ecf5" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><text x="110.6" y="134.7" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">δ+</text><path d="M97.3 78.0 L47.3 97.7" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle cx="47.3" cy="97.7" r="11.2" fill="#e8ecf5" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><text x="39.0" y="76.7" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">δ+</text><circle cx="97.3" cy="78.0" r="18.7" fill="var(--vx-bad, #dc2626)" fill-opacity=".75" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><text x="97.3" y="78.0" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">O</text><text x="97.3" y="50.6" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">δ−</text></g><g data-part="hydrogen bond"><title>hydrogen bond: An attraction between a δ+ hydrogen on one molecule and the lone pair of an oxygen on another. Weak (5–30 kJ mol⁻¹) so it forms and breaks easily, but many together give water cohesion and a high boiling point.</title><path d="M220.0 159.1 L280.7 80.8" stroke="var(--vx-a1, #4f46e5)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 4" fill="none"/></g><g data-part="hydrogen bond"><title>hydrogen bond: An attraction between a δ+ hydrogen on one molecule and the lone pair of an oxygen on another. Weak (5–30 kJ mol⁻¹) so it forms and breaks easily, but many together give water cohesion and a high boiling point.</title><path d="M220.0 244.1 L280.7 322.4" stroke="var(--vx-a1, #4f46e5)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 4" fill="none"/></g><g data-part="hydrogen bond"><title>hydrogen bond: An attraction between a δ+ hydrogen on one molecule and the lone pair of an oxygen on another. Weak (5–30 kJ mol⁻¹) so it forms and breaks easily, but many together give water cohesion and a high boiling point.</title><path d="M128.9 281.7 L187.1 201.6" stroke="var(--vx-a1, #4f46e5)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 4" fill="none"/></g><g data-part="hydrogen bond"><title>hydrogen bond: An attraction between a δ+ hydrogen on one molecule and the lone pair of an oxygen on another. Weak (5–30 kJ mol⁻¹) so it forms and breaks easily, but many together give water cohesion and a high boiling point.</title><path d="M128.9 121.4 L187.1 201.6" stroke="var(--vx-a1, #4f46e5)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 4" fill="none"/></g><g transform="translate(0 397.2)"><text x="14.0" y="0.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">H–O–H angle 104.5°</text></g><g transform="translate(0 433.2)"><text x="14.0" y="0.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">O–H bond: 0.096 nm (covalent)</text></g><g transform="translate(0 469.2)"><text x="14.0" y="0.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">H···O distance: 0.177 nm (hydrogen bond)</text></g><g transform="translate(0 513.2)"><text x="14.0" y="-8.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">4 hydrogen bonds in the cluster; the central molecule</text><text x="14.0" y="8.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">makes 4</text></g><g transform="translate(0 541.2)"><text x="14.0" y="0.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">5–30 kJ mol⁻¹ each, against about 350 for C–C</text></g><path d="M14.0 577.2 L40.0 577.2" stroke="var(--vx-a1, #4f46e5)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 4" fill="none"/><text x="46.0" y="577.2" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">hydrogen bond</text></svg>