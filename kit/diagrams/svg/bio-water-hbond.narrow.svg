<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 623.2" width="380.0" height="623.2" role="img" aria-label="Five water molecules: a central one donating two hydrogen bonds from its two hydrogens and accepting two from neighbours' hydrogens, drawn as dashed lines in line with the O–H bonds, with the 104.5 degree angle and the bond lengths given." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g data-part="water molecule"><title>water molecule: Two hydrogens bonded to one oxygen at 104.5°. Oxygen is more electronegative, so it carries a partial negative charge (δ−) and each hydrogen a partial positive charge (δ+): the molecule is polar.</title><path d="M187.1 201.6 L220.0 159.1" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle cx="220.0" cy="159.1" r="11.2" fill="#e8ecf5" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><text x="237.9" y="172.9" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">δ+</text><path d="M187.1 201.6 L220.0 244.1" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle cx="220.0" cy="244.1" r="11.2" fill="#e8ecf5" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><text x="202.2" y="257.9" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">δ+</text><circle cx="187.1" cy="201.6" r="18.7" fill="var(--vx-bad, #dc2626)" fill-opacity=".75" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><text x="187.1" y="201.6" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">O</text><text x="187.1" y="174.2" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">δ−</text></g><g data-part="water molecule"><title>water molecule: Two hydrogens bonded to one oxygen at 104.5°. Oxygen is more electronegative, so 