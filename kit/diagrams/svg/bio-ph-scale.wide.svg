="super" font-size="8.3">-4</tspan></text><path d="M261.4 136 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="261.4" y="153.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5</text><text x="261.4" y="172.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-5</tspan></text><path d="M305.7 136 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="305.7" y="153.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6</text><text x="305.7" y="172.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-6</tspan></text><path d="M350.0 136 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="350.0" y="153.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7</text><text x="350.0" y="172.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-7</tspan></text><path d="M394.3 136 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="394.3" y="153.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8</text><text x="394.3" y="172.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-8</tspan></text><path d="M438.6 136 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="438.6" y="153.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">9</text><text x="438.6" y="172.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-9</tspan></text><path d="M482.9 136 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="482.9" y="153.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">10</text><text x="482.9" y="172.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-10</tspan></text><path d="M527.1 136 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="527.1" y="153.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">11</text><text x="527.1" y="172.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-11</tspan></text><path d="M571.4 136 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="571.4" y="153.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">12</text><text x="571.4" y="172.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-12</tspan></text><path d="M615.7 136 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="615.7" y="153.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">13</text><text x="615.7" y="172.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-13</tspan></text><path d="M660.0 136 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="660.0" y="153.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">14</text><text x="660.0" y="172.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-14</tspan></text><text x="350.0" y="192.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pH, and [H<tspan baseline-shift="super" font-size="8.3">+</tspan>] in mol dm<tspan baseline-shift="super" font-size="8.3">-3</tspan></text><text x="40.0" y="192.0" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">← acidic</text><text x="660.0" y="192.0" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">alkaline →</text><g data-part="stomach"><title>stomach: The stomach is at about pH 2.</title><path d="M128.6 108 V74 M128.6 108 V74" stroke="var(--vx-ink, #151826)" stroke-width="2"/></g><text x="128.6" y="70.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">stomach: about pH 2</text><g data-part="neutral (25 °C)"><title>neutral (25 °C): pH 7 is neutral at 25 °C.</title><path d="M350.0 108 V92 M350.0 108 V92" stroke="var(--vx-ink, #151826)" stroke-width="2"/></g><text x="344.0" y="88.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">neutral: pH 7</text><g data-part="human blood"><title>human blood: Human blood is kept at about pH 7.35–7.45.</title><path d="M365.5 108 V92 M369.9 108 V92" stroke="var(--vx-ink, #151826)" stroke-width="2"/><rect x="365.5" y="102" width="4.4" height="34" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/></g><text x="375.9" y="88.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">blood: 7.35–7.45</text><path d="M217.1 194 q-22.1 26 -44.3 0" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="2.2"/><text x="195.0" y="232.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">× 10</text><text x="40.0" y="260.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">[H<tspan baseline-shift="super" font-size="9.4">+</tspan>] = 1 × 10<tspan baseline-shift="super" font-size="9.4">-4</tspan> mol dm<tspan baseline-shift="super" font-size="9.4">-3</tspan>  →  pH = −log<tspan baseline-shift="sub" font-size="9.4">10</tspan>(10<tspan baseline-shift="super" font-size="9.4">-4</tspan>) = 4</text><text x="40.0" y="280.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">[H<tspan baseline-shift="super" font-size="9.4">+</tspan>] rises tenfold to 1 × 10<tspan baseline-shift="super" font-size="9.4">-3</tspan>  →  the pH falls to 3</text><text x="40.0" y="300.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">pH 3 has ten times the hydrogen ion concentration of pH 4, not twice</text></svg>