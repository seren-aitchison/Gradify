<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 326.0" width="700.0" height="326.0" role="img" aria-label="A coloured bar from pH 0 on the left to pH 14 on the right, labelled acidic and alkaline, with the hydrogen ion concentration under each unit falling from 1 to 10 to the minus 14, markers for the stomach at about pH 2, neutral at pH 7 and blood at 7.35 to 7.45, and a worked example: a tenfold rise in [H⁺] from 10 to the minus 4 to 10 to the minus 3 lowers the pH from 4 to 3." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g data-part="pH scale"><title>pH scale: pH = −log₁₀[H⁺]: low pH is acidic, high pH is alkaline.</title><rect x="40.0" y="110" width="44.8" height="26" fill="hsl(17 72% 62%)" fill-opacity=".8"/><rect x="84.3" y="110" width="44.8" height="26" fill="hsl(35 72% 62%)" fill-opacity=".8"/><rect x="128.6" y="110" width="44.8" height="26" fill="hsl(53 72% 62%)" fill-opacity=".8"/><rect x="172.9" y="110" width="44.8" height="26" fill="hsl(71 72% 62%)" fill-opacity=".8"/><rect x="217.1" y="110" width="44.8" height="26" fill="hsl(88 72% 62%)" fill-opacity=".8"/><rect x="261.4" y="110" width="44.8" height="26" fill="hsl(106 72% 62%)" fill-opacity=".8"/><rect x="305.7" y="110" width="44.8" height="26" fill="hsl(124 72% 62%)" fill-opacity=".8"/><rect x="350.0" y="110" width="44.8" height="26" fill="hsl(142 72% 62%)" fill-opacity=".8"/><rect x="394.3" y="110" width="44.8" height="26" fill="hsl(160 72% 62%)" fill-opacity=".8"/><rect x="438.6" y="110" width="44.8" height="26" fill="hsl(178 72% 62%)" fill-opacity=".8"/><rect x="482.9" y="110" width="44.8" height="26" fill="hsl(196 72% 62%)" fill-opacity=".8"/><rect x="527.1" y="110" width="44.8" height="26" fill="hsl(213 72% 62%)" fill-opacity=".8"/><rect x="571.4" y="110" width="44.8" height="26" fill="hsl(231 72% 62%)" fill-opacity=".8"/><rect x="615.7" y="110" width="44.8" height="26" fill="hsl(249 72% 62%)" fill-opacity=".8"/></g><path d="M40.0 136 v6" stroke=