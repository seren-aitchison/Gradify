<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 233.0" width="380.0" height="233.0" role="img" aria-label="Three stacked layers from the visible top to the hidden base: artefacts, espoused values, basic underlying assumptions." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="16.0" width="364.0" height="58" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="34.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Artefacts</text><text x="190.0" y="51.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">visible: dress, office layout, stories, rituals</text><rect x="8.0" y="79.0" width="364.0" height="58" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity=".14" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="97.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Espoused values</text><text x="190.0" y="114.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">stated values, strategies and goals</text><rect x="8.0" y="142.0" width="364.0" height="58" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity=".14" stroke="var(--vx-a2, #db2777)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="160.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Basic underlying assumptions</text><text x="190.0" y="177.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">invisible, taken for granted, and decisive</text><text x="190.0" y="217.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">from visible to invisible</text></svg>