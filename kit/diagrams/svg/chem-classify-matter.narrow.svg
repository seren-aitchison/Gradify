<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 440.0" width="380.0" height="440.0" role="img" aria-label="A tree: is the sample one substance? Yes leads to: can it be broken down chemically? Yes, compound; no, element. No leads to: is it uniform throughout? Yes, homogeneous mixture; no, heterogeneous mixture." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="12.0" y="28.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it one substance with a fixed</text><text x="12.0" y="45.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">composition?</text><text x="28.0" y="68.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><text x="28.0" y="88.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Can a chemical reaction break it down?</text><text x="44.0" y="111.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="44.0" y="121.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="54.0" y="135.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Compound</text><text x="54.0" y="152.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. H<tspan baseline-shift="sub" font-size="8.3">2</tspan>O, NaCl, CO<tspan baseline-shift="sub" font-size="8.3">2</tspan></text><text x="44.0" y="183.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="44.0" y="193.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="54.0" y="207.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Element</text><text x="54.0" y="224.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. O<tspan baseline-shift="sub" font-size="8.3">2</tspan>, Fe, He</text><text x="28.0" y="255.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><text x="28.0" y="275.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it the same throughout?</text><text x="44.0" y="298.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="44.0" y="308.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a5, #7c3aed)" fill-opacity=".1" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="54.0" y="322.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Homogeneous mixture</text><text x="54.0" y="339.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. salt + water, air (N<tspan baseline-shift="sub" font-size="8.3">2</tspan>, O<tspan baseline-shift="sub" font-size="8.3">2</tspan>, Ar)</text><text x="44.0" y="370.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="44.0" y="380.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="54.0" y="394.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Heterogeneous mixture</text><text x="54.0" y="411.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. sand + water</text></svg>