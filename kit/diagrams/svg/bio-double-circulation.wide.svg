<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 234.0" width="700.0" height="234.0" role="img" aria-label="A loop of eight boxes: right heart, pulmonary artery, lungs, pulmonary vein, left heart, aorta, body tissues and vena cava, with the oxygen-poor boxes in blue, the oxygen-rich ones in red and the lungs and body tissues, where gases are exchanged, in green." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M174.0 56.0 L182.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M191.0 56.0 L182.0 60.1 L182.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M339.0 56.0 L349.5 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M357.6 56.0 L348.6 60.1 L348.6 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M512.4 56.0 L525.3 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M533.4 56.0 L524.4 60.1 L524.4 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M605.0 85.0 L605.0 141.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M605.0 149.5 L600.9 140.5 L609.1 140.5 Z" fill="var(--vx-ink, #151826)"/><path d="M534.3 186.0 L517.1 186.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M509.0 186.0 L518.0 181.9 L518.0 190.1 Z" fill="var(--vx-ink, #151826)"/><path d="M361.0 186.0 L337.1 186.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M329.0 186.0 L338.0 181.9 L338.0 190.1 Z" fill="var(--vx-ink, #151826)"/><path d="M201.0 186.0 L177.1 186.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M169.0 186.0 L178.0 181.9 L178.0 190.1 Z" fill="var(--vx-ink, #151826)"/><path d="M95.0 149.5 L95.0 100.6" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M95.0 92.5 L99.1 101.5 L90.9 101.5 Z" fill="var(--vx-ink, #151826)"/><rect x="21.0" y="24.5" width="148.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="95.0" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">right heart</text><text x="95.0" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">receives blood from</text><text x="95.0" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the body</text><rect x="196.0" y="16.0" width="138.0" height="80.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="265.0" y="32.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">pulmonary</text><text x="265.0" y="49.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">artery</text><text x="265.0" y="66.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carries it to the</text><text x="265.0" y="81.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">lungs</text><rect x="362.6" y="32.0" width="144.7" height="48.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="435.0" y="48.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">lungs</text><text x="435.0" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">blood gains oxygen</text><rect x="538.4" y="32.0" width="133.2" height="48.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="605.0" y="48.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">pulmonary vein</text><text x="605.0" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carries it back</text><rect x="539.3" y="154.5" width="131.3" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="605.0" y="170.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">left heart</text><text x="605.0" y="187.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pumps it at high</text><text x="605.0" y="202.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pressure</text><rect x="366.0" y="154.5" width="138.0" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="435.0" y="170.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">aorta</text><text x="435.0" y="187.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carries it to the</text><text x="435.0" y="202.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">body</text><rect x="206.0" y="154.5" width="117.9" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="265.0" y="170.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">body tissues</text><text x="265.0" y="187.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">blood gives up</text><text x="265.0" y="202.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">oxygen</text><rect x="26.0" y="154.5" width="138.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="95.0" y="170.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">vena cava</text><text x="95.0" y="187.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">returns it to the</text><text x="95.0" y="202.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">heart</text></svg>