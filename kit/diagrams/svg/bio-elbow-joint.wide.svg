<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 236.3" width="700.0" height="236.3" role="img" aria-label="A side view of an arm bent at the elbow. The humerus is horizontal and the forearm points up to the right. A capsule round the joint holds synovial fluid, with cartilage on the bone ends and ligaments joining the bones. A thick, contracted biceps above is joined to the forearm by a tendon, and a thin, relaxed triceps below is joined by a tendon behind the elbow." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(164 8) scale(0.7143)"><g transform="translate(-36 -50) scale(1.4)"><g data-part="synovial fluid"><title>synovial fluid: Lubricates the joint.</title><ellipse cx="200" cy="160" rx="38" ry="30" fill="var(--vx-a1, #4f46e5)" fill-opacity=".22"/></g><g data-part="humerus"><title>humerus: The upper arm bone: fixed while the forearm moves.</title><path d="M40.0 160.0 L200.0 160.0" stroke="var(--vx-a3, #ea580c)" stroke-width="22" stroke-linecap="round" stroke-opacity="0.4" fill="none"/><path d="M40.0 160.0 L200.0 160.0" stroke="var(--vx-a3, #ea580c)" stroke-width="22" stroke-linecap="round" stroke-opacity="0" fill="none"/></g><g data-part="radius and ulna"><title>radius and ulna: The forearm bones, which the muscles move as a lever about the elbow.</title><path d="M200.0 160.0 L296.4 45.1" stroke="var(--vx-a3, #ea580c)" stroke-width="18" stroke-linecap="round" stroke-opacity="0.4" fill="none"/></g><g data-part="cartilage"><title>cartilage: Smooth tissue covering the bone ends, so they glide.</title><circle cx="196" cy="160" r="13" fill="var(--vx-a4, #0d9488)" fill-opacity=".7" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><circle cx="203.9" cy="155.4" r="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".7" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/></g><g data-part="joint capsule"><title>joint capsule: The capsule round a synovial joint.</title><ellipse cx="200" cy="160" rx="38" ry="30" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="2.6" stroke-dasharray="5 3"/></g><g data-part="ligament"><title>ligament: Joins bone to bone and holds the joint together.</title><path d="M180.0 146.0 L203.9 139.8" stroke="var(--vx-good, #16a34a)" stroke-width="4" stroke-linecap="round" stroke-opacity="1" fill="none"/><path d="M182.0 175.0 L217.4 156.3" stroke="var(--vx-good, #16a34a)" stroke-width="4" stroke-linecap="round" stroke-opacity="1" fill="none"/></g><g data-part="biceps"><title>biceps: Contracts and shortens to bend the elbow.</title><path d="M88.0 148.0 Q136.6 153.9 172.0 120.0 Q123.4 114.1 88.0 148.0 Z" fill="var(--vx-a2, #db2777)" fill-opacity="0.6" stroke="var(--vx-a2, #db2777)" stroke-width="2"/></g><g data-part="triceps"><title>triceps: Relaxes and lengthens as the elbow bends; it contracts to straighten it.</title><path d="M88.0 172.0 Q130.4 188.9 176.0 186.0 Q133.6 169.1 88.0 172.0 Z" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.25" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/></g><g data-part="tendon"><title>tendon: Joins muscle to bone.</title><path d="M172.0 120.0 L218.8 123.6" stroke="var(--vx-ink, #151826)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" fill="none"/><path d="M176.0 186.0 L203.5 176.0" stroke="var(--vx-ink, #151826)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" fill="none"/></g><g data-part="pull"><title>pull: A muscle can only pull: it never pushes.</title><path d="M220.8 125.6 L196.5 117.2" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M188.8 114.6 L198.7 113.6 L196.0 121.4 Z" fill="var(--vx-a2, #db2777)"/></g><g data-part="pivot"><title>pivot: The hinge joint is the pivot of the lever.</title><circle cx="200" cy="160" r="4.2" fill="var(--vx-ink, #151826)"/></g><text x="300.0" y="244.0" font-size="10" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">biceps contracts, triceps relaxes: the forearm is pulled up</text></g></g><path d="M316.3 125.3 L152.0 125.3" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="316.3" cy="125.3" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="125.3" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">cartilage</text><path d="M208.3 136.3 L152.0 151.3" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="208.3" cy="136.3" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="151.3" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">humerus</text><path d="M332.0 142.0 L152.0 177.3" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="332.0" cy="142.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="177.3" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">ligament</text><path d="M268.3 160.3 L152.0 203.3" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="268.3" cy="160.3" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="203.3" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">triceps</text><path d="M415.4 40.4 L484.0 40.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="415.4" cy="40.4" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="40.4" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">radius and ulna</text><path d="M268.3 90.3 L484.0 90.3" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="268.3" cy="90.3" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="90.3" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">biceps</text><path d="M333.7 94.1 L484.0 116.3" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="333.7" cy="94.1" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="116.3" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">tendon</text><path d="M374.3 118.3 L484.0 142.3" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="374.3" cy="118.3" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="142.3" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">joint capsule</text><path d="M338.3 132.3 L484.0 168.3" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="338.3" cy="132.3" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="168.3" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">pivot</text><path d="M365.3 147.3 L484.0 194.3" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="365.3" cy="147.3" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="194.3" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">synovial fluid</text></svg>