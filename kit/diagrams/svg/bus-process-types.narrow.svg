<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 359.0" width="380.0" height="359.0" role="img" aria-label="Five stacked layers from low volume and high variety to very high volume: project, jobbing, batch, mass, continuous." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="16.0" width="364.0" height="58" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity=".14" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="34.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Project</text><text x="190.0" y="51.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">unique, large: a bridge or ship</text><rect x="8.0" y="79.0" width="364.0" height="58" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity=".14" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="97.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Jobbing</text><text x="190.0" y="114.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">low volume, high variety: a bespoke tailor</text><rect x="8.0" y="142.0" width="364.0" height="58" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="160.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Batch</text><text x="190.0" y="177.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">groups of identical items: a bakery's loaves</text><rect x="8.0" y="205.0" width="364.0" height="58" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity=".14" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="223.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Mass</text><text x="190.0" y="240.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">high volume, standardised: cars on an assembly line</text><rect x="8.0" y="268.0" width="364.0" height="58" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity=".14" stroke="var(--vx-a2, #db2777)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="286.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Continuous</text><text x="190.0" y="303.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">very high volume, non-stop: oil refining</text><text x="190.0" y="343.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">volume rises, variety falls</text></svg>