<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 193.7" width="760.0" height="193.7" role="img" aria-label="A flow chart: if the viral DNA does not integrate into the host chromosome, the cycle is lytic and the cell bursts; if it integrates as a prophage, the cycle is lysogenic, and may later become lytic." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="30.0" y="20.0" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 48.9)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Does the viral genome integrate into the host</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">chromosome?</text></g><path d="M430.0 48.9 L479.9 48.9" stroke="var(--vx-bad, #dc2626)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 48.9 L479.0 53.1 L479.0 44.8 Z" fill="var(--vx-bad, #dc2626)"/><text x="460.0" y="37.9" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><rect x="490.0" y="23.3" width="250.0" height="51.3" rx="12" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8"/><g transform="translate(615.0 48.9)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Lytic: the virus replicates</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">immediately and the cell bursts</text></g><path d="M230.0 79.8 L230.0 103.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 111.8 L225.9 102.8 L234.1 102.8 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="95.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="115.8" width="400.0" height="57.8" rx="14" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><g transform="translate(0 144.8)"><text x="230.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Lysogenic: the genome is a prophage, copied</text><text x="230.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">with the host DNA, and later may become lytic</text></g></svg>