<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 369.1" width="380.0" height="369.1" role="img" aria-label="Two virions. A non-enveloped one: a hexagonal capsid enclosing a coiled genome. An enveloped one: a round lipid envelope with spikes of glycoprotein, enclosing a capsid and a coiled genome." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><text x="105.0" y="18.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">non-enveloped</text><text x="315.0" y="18.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">enveloped</text><g data-part="capsid"><title>capsid: The protein coat, made of repeating units called capsomeres.</title><path d="M170.8 188.0 L105.0 226.0 L39.2 188.0 L39.2 112.0 L105.0 74.0 L170.8 112.0 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".25" stroke="var(--vx-a3, #ea580c)" stroke-width="3"/><path d="M105 150 L170.8 188.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M105 150 L105.0 226.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M105 150 L39.2 188.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M105 150 L39.2 112.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M105 150 L105.0 74.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M105 150 L170.8 112.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/></g><g data-part="genome"><title>genome: DNA or RNA, single- or double-stranded.</title><path d="M71 150 q11.333333333333334 -34 22.666666666666668 0 t22.666666666666668 0 t22.666666666666668 0" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.6" stroke-linecap="round"/><path d="M84.6 167 q11.333333333333334 -27.200000000000003 28.333333333333336 0 t28.333333333333336 0" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.6" stroke-linecap="round"/></g><g data-part="envelope"><title>envelope: A lipid layer taken from the host cell membrane (only some viruses have one).</title><circle cx="315" cy="150" r="98" fill="var(--vx-a4, #0d9488)" fill-opacity=".12" stroke="var(--vx-a4, #0d9488)" stroke-width="5"/></g><g data-part="capsid"><title>capsid: The protein coat, made of repeating units called capsomeres.</title><path d="M367.0 180.0 L315.0 210.0 L263.0 180.0 L263.0 120.0 L315.0 90.0 L367.0 120.0 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".25" stroke="var(--vx-a3, #ea580c)" stroke-width="3"/><path d="M315 150 L367.0 180.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M315 150 L315.0 210.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M315 150 L263.0 180.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M315 150 L263.0 120.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M315 150 L315.0 90.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M315 150 L367.0 120.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/></g><g data-part="genome"><title>genome: DNA or RNA, single- or double-stranded.</title><path d="M288 150 q9 -27 18 0 t18 0 t18 0" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.6" stroke-linecap="round"/><path d="M298.8 163.5 q9 -21.6 22.5 0 t22.5 0" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.6" stroke-linecap="round"/></g><g data-part="glycoprotein"><title>glycoprotein: A protein with sugar chains that sticks out of the envelope; it is used to bind a host cell.</title><path d="M413.0 150.0 L436.0 150.0" stroke="var(--vx-a2, #db2777)" stroke-width="3"/><circle cx="436.0" cy="150.0" r="3.6" fill="var(--vx-a2, #db2777)"/><path d="M403.3 192.5 L424.0 202.5" stroke="var(--vx-a2, #db2777)" stroke-width="3"/><circle cx="424.0" cy="202.5" r="3.6" fill="var(--vx-a2, #db2777)"/><path d="M376.1 226.6 L390.4 244.6" stroke="var(--vx-a2, #db2777)" stroke-width="3"/><circle cx="390.4" cy="244.6" r="3.6" fill="var(--vx