<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 244.6" width="380.0" height="244.6" role="img" aria-label="Three boxes: inputs (transformed resources and transforming resources), the transformation process, and outputs (products and services)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="10.0" y="14.0" width="360.0" height="63.3" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="29.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Inputs</text><text x="19.0" y="49.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">transformed resources (materials, information, customers)</text><text x="19.0" y="62.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and transforming resources (facilities, staff)</text><rect x="10.0" y="99.3" width="360.0" height="63.3" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="114.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Transformation process</text><text x="19.0" y="134.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">changing properties, location, ownership, information or</text><text x="19.0" y="147.9" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the state of customers</text><rect x="10.0" y="184.5" width="360.0" height="50.1" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="200.0" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Outputs</text><text x="19.0" y="220.1" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">products and services, usually a mix</text><path d="M190.0 79.3 L190.0 90.0" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 97.3 L186.3 89.3 L193.7 89.3 Z" fill="var(--vx-line, #8a92a8)"/><path d="M190.0 164.5 L190.0 175.3" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 182.5 L186.3 174.5 L193.7 174.5 Z" fill="var(--vx-line, #8a92a8)"/></svg>