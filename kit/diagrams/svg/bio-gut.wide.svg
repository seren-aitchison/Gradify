<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 340.0" width="700.0" height="340.0" role="img" aria-label="Six boxes in order: mouth, oesophagus, stomach, small intestine, large intestine and rectum; a separate box for the accessory organs (liver, gall bladder and pancreas) with a dashed arrow into the small intestine." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M200.7 56.0 L267.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M276.0 56.0 L267.0 60.1 L267.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M424.0 56.0 L494.5 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M502.6 56.0 L493.6 60.1 L493.6 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M576.7 100.0 L576.7 121.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M576.7 130.0 L572.5 121.0 L580.8 121.0 Z" fill="var(--vx-ink, #151826)"/><path d="M501.2 174.0 L433.6 174.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M425.5 174.0 L434.5 169.9 L434.5 178.1 Z" fill="var(--vx-ink, #151826)"/><path d="M274.5 174.0 L205.5 174.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M197.4 174.0 L206.4 169.9 L206.4 178.1 Z" fill="var(--vx-ink, #151826)"/><path d="M428.4 251.2 L494.5 216.8" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" fill="none"/><path d="M501.7 213.0 L495.7 220.8 L491.8 213.5 Z" fill="var(--vx-ink, #151826)"/><text x="473.1" y="232.1" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width="4" paint-order="stroke">secrete into</text><rect x="51.0" y="24.5" width="144.7" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="123.3" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">mouth</text><text x="123.3" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">teeth chew; saliva</text><text x="123.3" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">has amylase</text><rect x="281.0" y="24.5" width="138.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="350.0" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">oesophagus</text><text x="350.0" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">peristalsis moves</text><text x="350.0" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the food</text><rect x="507.6" y="17.0" width="138.0" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="576.7" y="33.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">stomach</text><text x="576.7" y="50.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">churns;</text><text x="576.7" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">hydrochloric acid</text><text x="576.7" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and pepsin</text><rect x="506.2" y="135.0" width="141.0" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="576.7" y="151.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">small intestine</text><text x="576.7" y="168.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the main site of</text><text x="576.7" y="183.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">digestion and</text><text x="576.7" y="198.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">absorption</text><rect x="279.5" y="142.5" width="141.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="350.0" y="158.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">large intestine</text><text x="350.0" y="175.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">absorbs water;</text><text x="350.0" y="190.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">makes faeces</text><rect x="54.3" y="150.0" width="138.0" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="123.3" y="166.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">rectum</text><text x="123.3" y="183.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">stores the faeces</text><rect x="276.0" y="252.0" width="148.0" height="80.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="350.0" y="268.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">accessory</text><text x="350.0" y="285.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">organs</text><text x="350.0" y="302.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">liver, gall bladder</text><text x="350.0" y="317.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and pancreas</text></svg>