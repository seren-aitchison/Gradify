l-opacity=".75"/><rect x="182" y="246" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="182" y="262" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/></g><g data-part="pit"><title>pit: A thin gap in the lignin where the walls of two vessels meet: water moves sideways through it.</title><ellipse cx="179" cy="70" rx="5" ry="10" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><ellipse cx="179" cy="150" rx="5" ry="10" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><ellipse cx="179" cy="230" rx="5" ry="10" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/></g><g data-part="no end wall"><title>no end wall: Where two vessel elements meet, the cross-wall has gone, so the lumen is continuous.</title><path d="M104 110 h68" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M104 190 h68" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-dasharray="4 3"/></g></g><path d="M134.0 64.0 L454.0 64.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="134.0" cy="64.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="64.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">lignin</text><path d="M152.0 118.0 L454.0 118.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="152.0" cy="118.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="118.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">no end wall</text><path d="M193.0 158.0 L454.0 158.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="193.0" cy="158.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="158.0" font-size="12.5" font-weight="6