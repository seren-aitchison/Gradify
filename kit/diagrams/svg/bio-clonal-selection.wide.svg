<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 178.0" width="700.0" height="178.0" role="img" aria-label="Four boxes in order: antigen meets its matching B cell, helper T cell activation, clonal expansion, and plasma cells and memory cells." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M176.0 70.0 L175.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M184.0 70.0 L175.0 74.1 L175.0 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M346.0 70.0 L345.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M354.0 70.0 L345.0 74.1 L345.0 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M516.0 70.0 L515.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M524.0 70.0 L515.0 74.1 L515.0 65.9 Z" fill="var(--vx-ink, #151826)"/><rect x="19.0" y="22.5" width="152.0" height="95.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="95.0" y="38.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">antigen meets its B</text><text x="95.0" y="55.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">cell</text><text x="95.0" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">only the B cell whose</text><text x="95.0" y="87.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">receptor matches binds</text><text x="95.0" y="102.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">it</text><rect x="189.0" y="22.5" width="152.0" height="95.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="265.0" y="38.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">helper T cell</text><text x="265.0" y="55.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">activation</text><text x="265.0" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the B cell presents the</text><text x="265.0" y="87.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">antigen; a helper T cell</text><text x="265.0" y="102.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">gives the signals</text><rect x="359.0" y="38.5" width="152.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="435.0" y="54.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">clonal expansion</text><text x="435.0" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the selected B cell</text><text x="435.0" y="86.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">divides again and again</text><rect x="529.0" y="15.0" width="152.0" height="110.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="605.0" y="31.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">plasma cells and</text><text x="605.0" y="48.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">memory cells</text><text x="605.0" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">plasma cells secrete</text><text x="605.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">antibodies; memory B</text><text x="605.0" y="95.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cells wait for a second</text><text x="605.0" y="110.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">exposure</text></svg>