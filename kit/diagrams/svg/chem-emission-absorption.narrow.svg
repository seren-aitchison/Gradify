<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 248.0" width="380.0" height="248.0" role="img" aria-label="Two spectrum strips from 380 to 720 nm: emission with coloured lines at 410, 434, 486 and 656 nm on black, and a full rainbow with dark lines at the same positions." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><defs><linearGradient id="vis380" x1="0" x2="1"><stop offset="0.000" stop-color="#7a00a8"/><stop offset="0.147" stop-color="#3b00ff"/><stop offset="0.294" stop-color="#00a6ff"/><stop offset="0.412" stop-color="#00d34a"/><stop offset="0.559" stop-color="#e6e600"/><stop offset="0.647" stop-color="#ff9a00"/><stop offset="0.794" stop-color="#ff2a00"/><stop offset="1.000" stop-color="#a30000"/></linearGradient></defs><text x="20.0" y="28.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Emission spectrum: bright lines on black</text><rect x="20" y="40" width="340" height="54" fill="#0b0d14" rx="4"/><rect x="294.5" y="40" width="4" height="54" fill="#ff2a00"/><rect x="124.3" y="40" width="4" height="54" fill="#00a6ff"/><rect x="72.2" y="40" width="4" height="54" fill="#6b2bff"/><rect x="48.3" y="40" width="4" height="54" fill="#6b2bff"/><text x="20.0" y="138.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Absorption spectrum: dark lines on the continuous spectrum</text><rect x="20" y="150" width="340" height="54" fill="url(#vis380)" rx="4"/><rect x="294.5" y="150" width="4" height="54" fill="#0b0d14"/><rect x="124.3" y="150" width="4" height="54" fill="#0b0d14"/><rect x="72.2" y="150" width="4" height="54" fill="#0b0d14"/><rect x="48.3" y="150" width="4" height="54" fill="#0b0d14"/><text x="296.5" y="220.0" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">656</text><text x="126.3" y="220.0" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">486</text><text x="74.2" y="220.0" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">434</text><text x="50.3" y="220.0" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">410</text><text x="360.0" y="238.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">wavelength / nm</text></svg>