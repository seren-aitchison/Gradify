<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 427.6" width="700.0" height="427.6" role="img" aria-label="A cycle of four boxes: sprint planning, daily scrum, sprint review, retrospective, then back to sprint planning." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M408.2 80.5 L557.4 174.2" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M564.3 178.5 L554.5 177.2 L558.9 170.2 Z" fill="var(--vx-a2, #db2777)"/><path d="M564.3 237.1 L415.0 330.8" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M408.2 335.1 L413.6 326.8 L418.0 333.8 Z" fill="var(--vx-a2, #db2777)"/><path d="M291.8 335.1 L154.0 248.6" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M147.2 244.3 L157.0 245.6 L152.6 252.6 Z" fill="var(--vx-a2, #db2777)"/><path d="M147.2 171.3 L285.0 84.8" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M291.8 80.5 L286.4 88.8 L282.0 81.8 Z" fill="var(--vx-a2, #db2777)"/><rect x="275.0" y="10.5" width="150.0" height="67.0" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="350.0" y="26.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Sprint planning</text><text x="350.0" y="47.9" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pick work from the</text><text x="350.0" y="62.3" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">backlog</text><rect x="536.0" y="181.5" width="150.0" height="52.6" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="611.0" y="197.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Daily scrum</text><text x="611.0" y="218.9" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">15 minutes</text><rect x="275.0" y="338.1" width="150.0" height="67.0" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="350.0" y="354.2" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Sprint review</text><text x="350.0" y="375.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">show the result, get</text><text x="350.0" y="389.9" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">feedback</text><rect x="14.0" y="174.3" width="150.0" height="67.0" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="89.0" y="190.4" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Retrospective</text><text x="89.0" y="211.7" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">improve the way of</text><text x="89.0" y="226.1" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">working</text><text x="350.0" y="207.8" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">2 to 4 weeks</text></svg>