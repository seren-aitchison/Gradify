<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 178.0" width="700.0" height="178.0" role="img" aria-label="A cycle of four boxes, G1, S, G2 and M, with arrows between them labelled with the G1 and G2 checkpoints and the daughter cells that start the next G1." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M159.0 70.0 L175.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M184.0 70.0 L175.0 74.1 L175.0 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M346.0 70.0 L356.2 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M364.3 70.0 L355.3 74.1 L355.3 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M505.7 70.0 L515.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M524.0 70.0 L515.0 74.1 L515.0 65.9 Z" fill="var(--vx-ink, #151826)"/><rect x="36.0" y="38.5" width="117.9" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="95.0" y="54.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">G<tspan baseline-shift="sub" font-size="9.4">1</tspan></text><text x="95.0" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">growth, then a</text><text x="95.0" y="86.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">checkpoint</text><rect x="189.0" y="46.0" width="152.0" height="48.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="265.0" y="62.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">S</text><text x="265.0" y="79.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">DNA replicated: 2C to 4C</text><rect x="369.3" y="38.5" width="131.3" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="435.0" y="54.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">G<tspan baseline-shift="sub" font-size="9.4">2</tspan></text><text x="435.0" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">ready to divide?</text><text x="435.0" y="86.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">checkpoint</text><rect x="529.0" y="31.0" width="152.0" height="78.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="605.0" y="47.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">M</text><text x="605.0" y="64.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">mitosis, then</text><text x="605.0" y="79.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cytokinesis; spindle</text><text x="605.0" y="94.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">checkpoint at metaphase</text></svg>