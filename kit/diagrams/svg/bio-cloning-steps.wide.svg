<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 228.0" width="700.0" height="228.0" role="img" aria-label="Five boxes in order: isolate the gene, insert it into a vector, join with ligase, transform host cells, and select the transformed cells." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M204.1 56.0 L262.5 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M270.6 56.0 L261.6 60.1 L261.6 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M429.4 56.0 L487.8 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M495.9 56.0 L486.9 60.1 L486.9 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M576.7 101.0 L576.7 119.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M576.7 127.5 L572.5 118.5 L580.8 118.5 Z" fill="var(--vx-ink, #151826)"/><path d="M495.9 180.0 L432.1 180.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M424.0 180.0 L433.0 175.9 L433.0 184.1 Z" fill="var(--vx-ink, #151826)"/><rect x="47.6" y="9.5" width="151.5" height="93.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="123.3" y="25.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">isolate the gene</text><text x="123.3" y="42.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cut with a</text><text x="123.3" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">restriction enzyme,</text><text x="123.3" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">or make cDNA from</text><text x="123.3" y="87.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">mRNA</text><rect x="275.6" y="16.0" width="148.8" height="80.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="350.0" y="32.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">insert it into a</text><text x="350.0" y="49.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">vector</text><text x="350.0" y="66.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a plasmid cut with</text><text x="350.0" y="81.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the same enzyme</text><rect x="500.9" y="16.0" width="151.5" height="80.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="576.7" y="32.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">join with DNA</text><text x="576.7" y="49.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">ligase</text><text x="576.7" y="66.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the sticky ends are</text><text x="576.7" y="81.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">sealed</text><rect x="500.9" y="132.5" width="151.5" height="95.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="576.7" y="148.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">transform host</text><text x="576.7" y="165.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">cells</text><text x="576.7" y="182.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a few cells take up</text><text x="576.7" y="197.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the recombinant</text><text x="576.7" y="212.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">plasmid</text><rect x="281.0" y="124.0" width="138.0" height="112.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="350.0" y="140.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">select the</text><text x="350.0" y="157.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">transformed</text><text x="350.0" y="174.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">cells</text><text x="350.0" y="191.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">marker gene: only</text><text x="350.0" y="206.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">they grow on the</text><text x="350.0" y="221.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">antibiotic</text></svg>