<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640.0 404.0" width="640.0" height="404.0" role="img" aria-label="Energy levels of the lithium 2+ ion at minus 122.4, minus 30.6, minus 13.6 and minus 7.7 electronvolts, with the 2 to 1 transition at 13.5 nanometres." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Hydrogen-like Li²⁺</text><path d="M30.0 362.0 L30.0 52.3" stroke="var(--vx-ink, #151826)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M30.0 46.0 L33.2 53.0 L26.8 53.0 Z" fill="var(--vx-ink, #151826)"/><text x="24.0" y="38.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">E / eV</text><path d="M60.0 356.0 L470.0 356.0" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M470.0 356.0 L482.0 356.0" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="486.0" y="356.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">n = 1   −122 eV</text><path d="M60.0 190.2 L470.0 190.2" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M470.0 190.2 L482.0 190.2" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="486.0" y="190.2" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">n = 2   −30.6 eV</text><path d="M60.0 124.3 L470.0 124.3" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M470.0 124.3 L482.0 124.3" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="486.0" y="124.3" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">n = 3   −13.6 eV</text><path d="M60.0 56.0 L470.0 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M470.0 56.0 L482.0 56.0" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="486.0" y="56.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">n = 4   −7.65 eV</text><path d="M265.0 190.2 L265.0 347.9" stroke="var(--vx-soft, #5b6275)" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M265.0 356.0 L260.9 347.0 L269.1 347.0 Z" fill="var(--vx-soft, #5b6275)"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="270.0" y="273.1" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">13.5 nm</text><text x="60.0" y="378.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">energy axis not to scale (upper levels spread out)</text></svg>