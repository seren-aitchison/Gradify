<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 422.8" width="380.0" height="422.8" role="img" aria-label="A flow chart: temperature at the set point needs no response; above it leads to sweating, vasodilation and flattened hairs; below it leads to shivering, vasoconstriction, raised hairs and increased metabolism." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 48.9)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is core temperature different from</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">the set point, about 37 °C?</text></g><path d="M30.0 77.8 L30.0 105.8" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 105.8 L34.7 105.8" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 105.8 L34.0 109.1 L34.0 102.6 Z" fill="var(--vx-good, #16a34a)"/><rect x="42.0" y="89.8" width="270.0" height="63.3" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/><text x="177.0" y="103.8" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no</text><g transform="translate(0 137.5)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">No response needed: temperature is</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">at the set point</text></g><path d="M338.0 79.8 L338.0 171.0" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 179.1 L333.9 170.1 L342.1 170.1 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 121.5)" x="332.0" y="121.5" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="183.1" width="340.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 203.1)"><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it above the set point?</text></g><path d="M30.0 223.0 L30.0 251.0" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 251.0 L34.7 251.0" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 251.0 L34.0 254.3 L34.0 247.8 Z" fill="var(--vx-bad, #dc2626)"/><rect x="42.0" y="235.0" width="270.0" height="79.9" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.6"/><text x="177.0" y="249.0" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><g transform="translate(0 291.0)"><text x="177.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Too cold: shivering,</text><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">vasoconstriction, hairs raised, more</text><text x="177.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">metabolism</text></g><path d="M338.0 225.0 L338.0 332.9" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 341.0 L333.9 332.0 L342.1 332.0 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 275.0)" x="332.0" y="275.0" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="345.0" width="340.0" height="57.8" rx="14" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><g transform="translate(0 373.9)"><text x="190.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Too hot: sweating, vasodilation of</text><text x="190.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">skin arterioles, hairs lie flat</text></g></svg>