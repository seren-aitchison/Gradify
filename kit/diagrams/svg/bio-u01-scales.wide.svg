<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720.0 266.0" width="720.0" height="266.0" role="img" aria-label="A logarithmic size scale from 1 nanometre to 100 micrometres with bars for proteins, viruses, the light microscope limit, bacteria and eukaryotic cells." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M40.0 200.0 L680.0 200.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M40.0 194.0 L40.0 206.0" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="40.0" y="220.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">1 nm</text><path d="M168.0 194.0 L168.0 206.0" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="168.0" y="220.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10 nm</text><path d="M296.0 194.0 L296.0 206.0" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="296.0" y="220.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">100 nm</text><path d="M424.0 194.0 L424.0 206.0" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="424.0" y="220.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">1 µm</text><path d="M552.0 194.0 L552.0 206.0" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="552.0" y="220.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10 µm</text><path d="M680.0 194.0 L680.0 206.0" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="680.0" y="220.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">100 µm</text><rect x="78.5" y="23.0" width="89.5" height="14" rx="5" fill="var(--vx-a1, #4f46e5)" fill-opacity=".75"/><path d="M123.3 37.0 L123.3 200.0" stroke="var(--vx-a1, #4f46e5)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" fill="none"/><text x="176.0" y="30.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">protein (2–10 nm)</text><rect x="206.5" y="49.0" width="150.5" height="14" rx="5" fill="var(--vx-a2, #db2777)" fill-opacity=".75"/><path d="M281.8 63.0 L281.8 200.0" stroke="var(--vx-a2, #db2777)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" fill="none"/><text x="365.1" y="56.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">virus (20–300 nm)</text><rect x="334.5" y="75.0" width="6.0" height="14" rx="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><path d="M337.5 89.0 L337.5 200.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" fill="none"/><text x="348.5" y="82.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">light microscope resolution (0.2 µm)</text><rect x="424.0" y="101.0" width="89.5" height="14" rx="5" fill="var(--vx-a4, #0d9488)" fill-opacity=".75"/><path d="M468.7 115.0 L468.7 200.0" stroke="var(--vx-a4, #0d9488)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" fill="none"/><text x="521.5" y="108.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">bacterium (1–5 µm)</text><rect x="552.0" y="127.0" width="128.0" height="14" rx="5" fill="var(--vx-a5, #7c3aed)" fill-opacity=".75"/><path d="M616.0 141.0 L616.0 200.0" stroke="var(--vx-a5, #7c3aed)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" fill=