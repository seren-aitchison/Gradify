<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 824.1" width="380.0" height="824.1" role="img" aria-label="Decision tree for whether a duty of care exists in negligence, following Robinson v Chief Constable of West Yorkshire Police and Caparo v Dickman." style="color:var(--vx-ink, #151826);font-family:inherit"><rect x="20.0" y="20.0" width="340.0" height="71.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 47.9)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Did the defendant's own positive act</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">cause the harm?</text></g><text x="190.0" y="78.8" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)" font-style="italic">Robinson v Chief Constable of West Yorkshire [2018] UKSC 4</text><rect x="44.0" y="101.8" width="316.0" height="113.8" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><g transform="translate(0 158.8)"><text x="202.0" y="-41.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">No → Omission or third party:</text><text x="202.0" y="-25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">generally no duty, unless the</text><text x="202.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">defendant created the danger,</text><text x="202.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">assumed responsibility or had</text><text x="202.0" y="25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">control (Smith v Littlewoods; N v</text><text x="202.0" y="41.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Poole BC)</text></g><path d="M32.0 91.8 L32.0 158.8" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M32.0 158.8 L44.0 158.8" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M190.0 217.7 L190.0 241.6" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 249.7 L185.9 240.7 L194.1 240.7 Z" fill="var(--vx-good, #16a34a)"/><text x="200.0" y="233.7" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="253.7" width="340.0" height="75.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 291.6)"><text x="190.0" y="-17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is the situation genuinely novel,</text><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">with no established category or</text><text x="190.0" y="17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">precedent?</text></g><rect x="44.0" y="339.4" width="316.0" height="63.9" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/><g transform="translate(0 371.4)"><text x="202.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">No → Duty exists: apply the</text><text x="202.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">established category (e.g. road</text><text x="202.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">users, doctor and patient)</text></g><path d="M32.0 329.4 L32.0 371.4" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M32.0 371.4 L44.0 371.4" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M190.0 405.4 L190.0 429.3" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 437.4 L185.9 428.4 L194.1 428.4 Z" fill="var(--vx-good, #16a34a)"/><text x="200.0" y="421.4" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="441.4" width="340.0" height="75.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 479.2)"><text x="190.0" y="-17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">By analogy: was the damage</text><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">reasonably foreseeable, and was</text><text x="190.0" y="17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">there sufficient proximity?</text></g><rect x="44.0" y="527.1" width="316.0" height="30.6" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.6"/><g transform="translate(0 542.4)"><text x="202.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">No → No duty</text></g><path d="M32.0 517.1 L32.0 542.4" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M32.0 542.4 L44.0 542.4" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M190.0 559.8 L190.0 583.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 591.8 L185.9 582.8 L194.1 582.8 Z" fill="var(--vx-good, #16a34a)"/><text x="200.0" y="575.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="595.8" width="340.0" height="71.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 623.7)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it fair, just and reasonable to</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">impose a duty?</text></g><text x="190.0" y="654.6" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)" font-style="italic">Caparo Industries v Dickman [1990] 2 AC 605</text><rect x="44.0" y="677.6" width="316.0" height="30.6" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.6"/><g transform="translate(0 692.9)"><text x="202.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">No → No duty</text></g><path d="M32.0 667.6 L32.0 692.9" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M32.0 692.9 L44.0 692.9" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M190.0 710.2 L190.0 734.1" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 742.2 L185.9 733.2 L194.1 733.2 Z" fill="var(--vx-good, #16a34a)"/><text x="200.0" y="726.2" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="746.2" width="340.0" height="57.8" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 775.2)"><text x="190.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">A new duty is recognised,</text><text x="190.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">developed incrementally</text></g></svg>