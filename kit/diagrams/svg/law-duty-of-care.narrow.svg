<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 595.6" width="380.0" height="595.6" role="img" aria-label="Decision tree for whether a duty of care exists in negligence, following Robinson v Chief Constable of West Yorkshire Police, Caparo v Dickman and the omissions rule." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="111.6" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 75.8)"><text x="190.0" y="-35.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Did the defendant's own act cause</text><text x="190.0" y="-17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">the harm, or, if the claim is a</text><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">failure to protect, does an</text><text x="190.0" y="17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">exception apply (created the danger,</text><text x="190.0" y="35.8" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">assumed responsibility, or control)?</text></g><path d="M30.0 131.6 L30.0 159.6" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 159.6 L34.7 159.6" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 159.6 L34.0 162.8 L34.0 156.4 Z" fill="var(--vx-a3, #ea580c)"/><rect x="42.0" y="143.6" width="270.0" height="79.9" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="177.0" y="157.6" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><g transform="translate(0 199.6)"><text x="177.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Generally no duty to prevent harm by</text><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">third parties or to rescue (Smith v</text><text x="177.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Littlewoods; N v Poole BC)</text></g><path d="M338.0 133.6 L338.0 241.4" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 249.5 L333.9 240.5 L342.1 240.5 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 183.6)" x="332.0" y="183.6" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="253.5" width="340.0" height="71.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 281.4)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is the situation genuinely novel,</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">with no precedent deciding it?</text></g><text x="190.0" y="312.4" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)" font-style="italic">Robinson v CC West Yorkshire [2018] UKSC 4</text><path d="M30.0 325.4 L30.0 353.4" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 353.4 L34.7 353.4" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 353.4 L34.0 356.6 L34.0 350.1 Z" fill="var(--vx-a4, #0d9488)"/><rect x="42.0" y="337.4" width="270.0" height="96.6" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="177.0" y="351.4" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><g transform="translate(0 401.6)"><text x="177.0" y="-25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Follow the precedent: a duty where</text><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">it recognises one (if the harm was</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">reasonably foreseeable); no duty</text><text x="177.0" y="25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">where it excludes one</text></g><path d="M338.0 327.4 L338.0 451.8" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 459.9 L333.9 450.9 L342.1 450.9 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 385.6)" x="332.0" y="385.6" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="463.9" width="340.0" height="111.7" rx="14" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/><g transform="translate(0 510.8)"><text x="190.0" y="-26.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Develop incrementally by analogy,</text><text x="190.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">weighing foreseeability, proximity</text><text x="190.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">and whether a duty is fair, just</text><text x="190.0" y="26.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">and reasonable, together</text></g><text x="190.0" y="561.6" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)" font-style="italic">Caparo Industries v Dickman [1990] 2 AC 605</text></svg>