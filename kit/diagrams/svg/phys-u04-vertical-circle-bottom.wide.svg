e="middle" fill="var(--vx-a2, #db2777)" font-style="italic">net (centripetal)</text><text x="402.0" y="60.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">T = 11.8 N at 90°</text><text x="402.0" y="82.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">W = 1.96 N at 270°</text><text x="402.0" y="104.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">net (centripetal) = 9.8 N at 90°</text></svg>