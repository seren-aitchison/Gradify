<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 445.1" width="380.0" height="445.1" role="img" aria-label="A circular root section: an outer epidermis with root hairs, a wide cortex of packed cells, a ring of endodermis with dark Casparian strip dots, and a centre where four xylem arms form a cross with four phloem patches between them." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><g data-part="root hair"><title>root hair: Extends from an epidermal cell in the maturation zone: it greatly increases the surface area for absorbing water by osmosis and minerals by active transport.</title><path d="M329.0 150.0 Q343.8 154.9 350.7 159.8" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round"/><path d="M301.2 226.5 Q310.3 237.2 311.4 247.9" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round"/><path d="M240.8 264.9 Q242.9 276.7 236.9 288.4" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round"/><path d="M169.3 261.8 Q165.0 270.3 152.7 278.8" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round"/><path d="M106.9 209.5 Q99.1 210.7 83.3 211.8" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round"/><path d="M92.8 129.3 Q87.0 122.6 73.2 115.9" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round"/><path d="M133.5 58.8 Q134.3 47.4 127.1 35.9" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round"/><path d="M199.6 31.5 Q207.6 20.2 207.5 9.0" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round"/><path d="M269.5 46.9 Q283.2 40.0 288.8 33.1" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round"/><path d="M317.9 99.7 Q333.7 99.6 341.6 99.5" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap