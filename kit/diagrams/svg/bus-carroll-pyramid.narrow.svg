<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 296.0" width="380.0" height="296.0" role="img" aria-label="A pyramid of four layers. From the base: economic, legal, ethical, philanthropic." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="38.0" y="16.0" width="304.0" height="58" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity=".14" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="34.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Philanthropic</text><text x="190.0" y="51.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">be a good corporate citizen: donations, community</text><text x="190.0" y="65.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">work</text><rect x="28.0" y="79.0" width="324.0" height="58" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="97.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Ethical</text><text x="190.0" y="114.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">do what is right and fair, even where not required</text><rect x="18.0" y="142.0" width="344.0" height="58" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity=".14" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="160.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Legal</text><text x="190.0" y="177.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">obey the law</text><rect x="8.0" y="205.0" width="364.0" height="58" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity=".14" stroke="var(--vx-a2, #db2777)" stroke-opacity=".6" stroke-width="1.3"/><text x="190.0" y="223.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Economic</text><text x="190.0" y="240.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">be profitable: the base on which everything else rests</text><text x="190.0" y="280.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">all four are met at the same time</text></svg>