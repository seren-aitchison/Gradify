<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.0 272.0" width="680.0" height="272.0" role="img" aria-label="Energy flow: 500 J of heat in splits into 200 J of work done by the gas and 300 J of increased internal energy." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">The first law: where 500 J of heat goes</text><rect x="20.0" y="44.0" width="224.8" height="120.0" fill="var(--vx-a1, #4f46e5)" fill-opacity=".85"/><text x="28.0" y="104.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#fff">heat absorbed Q: 500 J</text><path d="M244.8 44.0 H465.0 l20 24.0 l-20 24.0 H244.8 Z" fill="var(--vx-good, #16a34a)" fill-opacity=".8"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="491.0" y="68.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">work done by gas W: 200 J</text><path d="M244.8 92.0 H250.8 A82.0 82.0 0 0 1 332.8 174.0 V228.0 l-36.0 14 l-36.0 -14 V174.0 A10.0 10.0 0 0 0 250.8 164.0 H244.8 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".78"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="296.8" y="254.0" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">rise in internal energy ΔU: 300 J</text></svg>