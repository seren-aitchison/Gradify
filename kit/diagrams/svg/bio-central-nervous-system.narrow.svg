<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 597.1" width="380.0" height="597.1" role="img" aria-label="A side view of the head, the front on the left. A large cerebrum divided into frontal, parietal, occipital and temporal lobes; a cerebellum at the back below it; the midbrain, pons and medulla stacked in the brainstem, with the spinal cord continuing down inside the vertebrae; a hypothalamus and pituitary gland above the brainstem; the meninges and the skull round the brain; and a small cross-section of the spinal cord with grey matter inside white matter." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><g data-part="skull"><title>skull: The skull, with the vertebrae, protects the CNS.</title><ellipse cx="200" cy="122" rx="178" ry="112" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="9" stroke-opacity=".75"/></g><g data-part="meninges"><title>meninges: Membranes between the bone and the brain; cerebrospinal fluid fills the space under them.</title><ellipse cx="200" cy="122" rx="166" ry="100" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="3"/></g><clipPath id="brain-cerebrum"><ellipse cx="190" cy="112" rx="146" ry="84"/></clipPath><g data-part="frontal lobe"><title>frontal lobe: Voluntary movement, decision-making and personality (as the case of Phineas Gage showed).</title><g clip-path="url(#brain-cerebrum)"><path d="M0 0 L195 0 L165 108 L100 170 L0 170 Z" fill="var(--vx-a1, #4f46e5)" fill-opacity=".3" stroke="var(--vx-ink, #151826)" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/></g></g><g data-part="parietal lobe"><title>parietal lobe: A lobe of the cerebral cortex.</title><g clip-path="url(#brain-cerebrum)"><path d="M195 0 L268 0 L292 100 L165 108 Z" fill="var(--vx-a4, #0d9488)" fill-opacity=".3" stroke="var(--vx-ink, #151826)" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/></g></g><g data-part="occipital lobe"><title>occipital lobe: Vision.</title><g clip-path="url(#brain-cerebrum)"><path d="M268 0 L400 0 L400 110 L292 100 Z" fill="var(--vx-a5, #7c3aed)" fill-opacity=".3" stroke="var(--vx-ink, #151826)" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/></g></g><g data-part="temporal lobe"><title>temporal lobe: A lobe of the cerebral cortex.</title><g clip-path="url(#brain-cerebrum)"><path d="M100 170 L165 108 L292 100 L400 110 L400 230 L100 230 Z" fill="var(--vx-a2, #db2777)" fill-opacity=".3" stroke="var(--vx-ink, #151826)" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/></g></g><g data-part="cerebral cortex"><title>cerebral cortex: The outer layer of the cerebrum, involved in higher functions.</title><ellipse cx="190" cy="112" rx="146" ry="84" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="6" stroke-opacity=".7"/></g><g data-part="vertebra"><title>vertebra: A bone of the vertebral column round the spinal cord.</title><rect x="220.0" y="231.0" width="32" height="10" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity=".45" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4" transform="rotate(14 236.0 236.0)"/><rect x="226.5" y="244.5" width="32" height="10" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity=".45" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4" transform="rotate(14 242.5 249.5)"/><rect x="233.0" y="258.0" width="32" height="10" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity=".45" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4" transform="rotate(14 249.0 263.0)"/><rect x="239.5" y="271.5" width="32" height="10" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity=".45" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4" transform="rotate(14 255.5 276.5)"/><rect x="246.0" y="285.0" width="32" height="10" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity=".45" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4" transform="rotate(14 262.0 290.0)"/></g><g data-part="spinal cord"><title>spinal cord: Carries signals between the brain and the body and processes reflexes.</title><path d="M234 224 L236 230 L262 294" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="12" stroke-linecap="round" stroke-opacity=".8"/></g><g data-part="cerebellum"><title>cerebellum: Coordinates balance and fine movement.</title><ellipse cx="285" cy="190" rx="50" ry="28" fill="var(--vx-good, #16a34a)" fill-opacity=".35" stroke="var(--vx-good, #16a34a)" stroke-width="2.4"/><path d="M250.6 176 Q285 172 319.4 176" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="1.2"/><path d="M247.4 184 Q285 180 322.6 184" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="1.2"/><path d="M245.8 192 Q285 188 324.2 192" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="1.2"/><path d="M249 200 Q285 196 321 200" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="1.2"/></g><g data-part="midbrain"><title>midbrain: Part of the brainstem, which controls breathing, heart rate and reflexes.</title><rect x="210" y="153" width="28" height="24" rx="8" fill="var(--vx-a3, #ea580c)" fill-opacity=".5" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8"/></g><g data-part="pons"><title>pons: Part of the brainstem.</title><rect x="214" y="178" width="28" height="24" rx="8" fill="var(--vx-a2, #db2777)" fill-opacity=".5" stroke="var(--vx-a2, #db2777)" stroke-width="1.8"/></g><g data-part="medulla"><title>medulla: Part of the brainstem, continuous with the spinal cord.</title><rect x="220" y="204" width="28" height="24" rx="8" fill="var(--vx-a5, #7c3aed)" fill-opacity=".5" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.8"/></g><g data-part="hypothalamus"><title>hypothalamus: Homeostasis, and the link to the pituitary gland.</title><ellipse cx="200" cy="158" rx="11" ry="8" fill="var(--vx-a2, #db2777)" fill-opacity=".7" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/></g><g data-part="pituitary gland"><title>pituitary gland: The gland controlled by the hypothalamus.</title><circle cx="196" cy="181" r="5" fill="var(--vx-a3, #ea580c)" stroke="var(--vx-a3, #ea580c)"/><path d="M200 166 L196 176" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/></g><g><g data-part="white matter"><title>white matter: Contains myelinated axons.</title><circle cx="352" cy="250" r="30" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-opacity=".7"/></g><g data-part="grey matter"><title>grey matter: Contains the nerve cell bodies.</title><path d="M352 247 C330 230 326 248 338 254 C330 264 342 272 352 258 C362 272 374 264 366 254 C378 248 374 230 352 247 Z" fill="var(--vx-a1, #4f46e5)" fill-opacity=".45" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/></g><text x="352.0" y="292.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">spinal cord, cross-section</text></g></g><circle cx="28.9" cy="95.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="28.9" y="95.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1</text><circle cx="39.1" cy="138.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="39.1" y="138.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2</text><circle cx="198.6" cy="32.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="198.6" y="32.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3</text><circle cx="91.4" cy="83.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="91.4" y="83.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4</text><circle cx="205.4" cy="57.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="205.4" y="58.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5</text><circle cx="185.7" cy="129.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="185.7" y="130.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6</text><circle cx="275.7" cy="68.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="275.7" y="68.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7</text><circle cx="271.4" cy="179.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="271.4" y="179.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8</text><circle cx="202.0" cy="149.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="202.0" y="149.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">9</text><circle cx="205.4" cy="170.9" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="205.4" y="171.4" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">10</text><circle cx="210.6" cy="193.1" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="210.6" y="193.6" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">11</text><circle cx="174.6" cy="143.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="174.6" y="143.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">12</text><circle cx="173.7" cy="165.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="173.7" y="166.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">13</text><circle cx="223.4" cy="232.6" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="223.4" y="233.1" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">14</text><circle cx="318.6" cy="227.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="318.6" y="227.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">15</text><circle cx="334.0" cy="215.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="334.0" y="215.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">16</text><text x="14.0" y="287.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1  skull</text><text x="14.0" y="306.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2  meninges</text><text x="14.0" y="325.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3  cerebral cortex</text><text x="14.0" y="344.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4  frontal lobe</text><text x="14.0" y="363.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5  parietal lobe</text><text x="14.0" y="382.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6  temporal lobe</text><text x="14.0" y="401.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7  occipital lobe</text><text x="14.0" y="420.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8  cerebellum</text><text x="14.0" y="439.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">9  midbrain</text><text x="14.0" y="458.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">10  pons</text><text x="14.0" y="477.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">11  medulla</text><text x="14.0" y="496.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">12  hypothalamus</text><text x="14.0" y="515.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">13  pituitary gland</text><text x="14.0" y="534.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">14  spinal cord</text><text x="14.0" y="553.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">15  grey matter</text><text x="14.0" y="572.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">16  white matter</text></svg>