<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 423.0" width="380.0" height="423.0" role="img" aria-label="A tree: is ΔH negative? Then: is ΔS positive? Feasible at all temperatures; otherwise only at low temperatures. If ΔH is positive: is ΔS positive? Feasible at high temperatures; otherwise never." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="12.0" y="28.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is ΔH negative (exothermic)?</text><text x="28.0" y="51.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><text x="28.0" y="71.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is ΔS positive?</text><text x="44.0" y="94.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="44.0" y="104.0" width="324.0" height="46.0" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/><text x="54.0" y="118.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Feasible at every temperature</text><text x="54.0" y="135.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. burning methane</text><text x="44.0" y="166.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="44.0" y="176.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="54.0" y="190.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Feasible at low T only</text><text x="54.0" y="207.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. N<tspan baseline-shift="sub" font-size="8.3">2</tspan> + 3H<tspan baseline-shift="sub" font-size="8.3">2</tspan> → 2NH<tspan baseline-shift="sub" font-size="8.3">3</tspan></text><text x="28.0" y="238.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><text x="28.0" y="258.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is ΔS positive?</text><text x="44.0" y="281.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="44.0" y="291.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="54.0" y="305.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Feasible at high T only</text><text x="54.0" y="322.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. CaCO<tspan baseline-shift="sub" font-size="8.3">3</tspan> → CaO + CO<tspan baseline-shift="sub" font-size="8.3">2</tspan></text><text x="44.0" y="353.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="44.0" y="363.0" width="324.0" height="46.0" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.6"/><text x="54.0" y="377.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Never feasible</text><text x="54.0" y="394.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. 3O<tspan baseline-shift="sub" font-size="8.3">2</tspan> → 2O<tspan baseline-shift="sub" font-size="8.3">3</tspan></text></svg>