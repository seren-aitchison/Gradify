<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.0 108.0" width="680.0" height="108.0" role="img" aria-label="A tree with a death branch of probability 1/100 and a survival branch of 99/100." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><circle cx="24.0" cy="52.0" r="4" fill="var(--vx-ink, #151826)"/><path d="M28.0 52.0 L458.0 30.0" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><text x="237.0" y="30.0" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">1/100</text><text x="464.0" y="30.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Dies</text><path d="M28.0 52.0 L458.0 74.0" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><text x="237.0" y="76.0" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">99/100</text><text x="464.0" y="74.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Survives</text><text x="664.0" y="30.0" font-size="13" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">P(Dies) = 1/100</text><text x="664.0" y="74.0" font-size="13" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">P(Survives) = 99/100</text></svg>