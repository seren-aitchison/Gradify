<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900.0 192.0" width="900.0" height="192.0" role="img" aria-label="A logarithmic distance scale from 1 millimetre to 1 kilometre with three regions: the reactive near field out to 4.8 mm, the radiating near field out to 67 m, and the far field beyond." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Field regions of a 1 m antenna at 10 GHz</text><path d="M34.0 100.0 L870.8 100.0" stroke="var(--vx-ink, #151826)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M878.0 100.0 L870.0 103.7 L870.0 96.3 Z" fill="var(--vx-ink, #151826)"/><path d="M34.0 95.0 L34.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="34.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-3</tspan></text><path d="M172.7 95.0 L172.7 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="172.7" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-2</tspan></text><path d="M311.3 95.0 L311.3 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="311.3" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-1</tspan></text><path d="M450.0 95.0 L450.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="450.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">0</tspan></text><path d="M588.7 95.0 L588.7 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="588.7" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">1</tspan></text><path d="M727.3 95.0 L727.3 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="727.3" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">2</tspan></text><path d="M866.0 95.0 L866.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="866.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">3</tspan></text><text x="884.0" y="16.0" font-size="12" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">distance from the antenna / m (logarithmic scale)</text><rect x="34.0" y="132.0" width="94.1" height="18" fill="var(--vx-a5, #7c3aed)" fill-opacity=".75"/><rect x="128.1" y="132.0" width="574.8" height="18" fill="var(--vx-a4, #0d9488)" fill-opacity=".75"/><rect x="702.9" y="132.0" width="163.1" height="18" fill="var(--vx-a1, #4f46e5)" fill-opacity=".75"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="81.1" y="162.0" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">reactive near field</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="415.5" y="162.0" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">radiating near field</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="784.5" y="162.0" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">far field</text><path d="M128.1 100.0 L128.1 88.0 L128.1 82.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1"/><circle cx="128.1" cy="100.0" r="3.5" fill="var(--vx-a2, #db2777)"/><text x="128.1" y="74.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">λ/2π = 4.8 mm</text><path d="M238.8 100.0 L238.8 88.0 L238.8 82.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1"/><circle cx="238.8" cy="100.0" r="3.5" fill="var(--vx-a2, #db2777)"/><text x="238.8" y="74.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">λ = 3 cm</text><path d="M450.0 100.0 L450.0 88.0 L450.0 82.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1"/><circle cx="450.0" cy="100.0" r="3.5" fill="var(--vx-a2, #db2777)"/><text x="450.0" y="74.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">D = 1 m</text><path d="M702.9 100.0 L702.9 88.0 L702.9 82.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1"/><circle cx="702.9" cy="100.0" r="3.5" fill="var(--vx-a2, #db2777)"/><text x="702.9" y="74.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2D²/λ = 67 m</text></svg>