<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 364.8" width="380.0" height="364.8" role="img" aria-label="Six boxes: political, economic, social, technological, legal and environmental, each with examples." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="12.0" width="364.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="27.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Political</text><text x="17.0" y="47.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Government policy, taxation, trade agreements</text><rect x="8.0" y="70.1" width="364.0" height="50.1" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="85.6" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Economic</text><text x="17.0" y="105.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Growth, interest rates, inflation, exchange rates</text><rect x="8.0" y="128.3" width="364.0" height="50.1" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="143.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Social</text><text x="17.0" y="163.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Demographics, lifestyles, health trends</text><rect x="8.0" y="186.4" width="364.0" height="50.1" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="201.9" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Technological</text><text x="17.0" y="221.9" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Automation, AI, e-commerce</text><rect x="8.0" y="244.5" width="364.0" height="50.1" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="260.0" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Legal</text><text x="17.0" y="280.1" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Employment, consumer, competition and data protection law</text><rect x="8.0" y="302.6" width="364.0" height="50.1" rx="9" fill="var(--vx-good, #16a34a)" fill-opacity="0.12" stroke="var(--vx-good, #16a34a)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="318.1" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Environmental</text><text x="17.0" y="338.2" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Climate change, net zero, resource scarcity</text></svg>