<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 248.0" width="700.0" height="248.0" role="img" aria-label="A payoff grid for two firms choosing a high or low price: both high £10m each; A low, B high A £12m and B £4m; A high, B low A £4m and B £12m; both low £6m each. Both low is the Nash equilibrium." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="265.0" y="24.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Firm B: high price</text><text x="551.0" y="24.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Firm B: low price</text><text x="114.0" y="76.2" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Firm A: high</text><text x="114.0" y="91.8" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">price</text><rect x="122.0" y="38.0" width="280.0" height="86.0" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-opacity=".5" stroke-width="1.3"/><text x="131.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">£10m each</text><text x="131.0" y="70.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">best joint outcome</text><rect x="408.0" y="38.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".5" stroke-width="1.3"/><text x="417.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">A £4m, B £12m</text><text x="417.0" y="70.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">B gains share</text><text x="114.0" y="168.2" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Firm A: low</text><text x="114.0" y="183.8" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">price</text><rect x="122.0" y="130.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".5" stroke-width="1.3"/><text x="131.0" y="147.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">A £12m, B £4m</text><text x="131.0" y="162.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">A gains share</text><rect x="408.0" y="130.0" width="280.0" height="86.0" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-opacity=".5" stroke-width="1.3"/><text x="417.0" y="147.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">£6m each</text><text x="417.0" y="162.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Nash equilibrium: both cut price</text><text x="408.0" y="234.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Firm B's choice →</text><g transform="translate(14 130.0) rotate(-90)"><text x="0.0" y="0.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Firm A's choice →</text></g></svg>