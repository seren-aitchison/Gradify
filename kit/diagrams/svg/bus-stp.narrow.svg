<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 218.4" width="380.0" height="218.4" role="img" aria-label="Three boxes in order: segmentation, targeting, positioning, each with its options." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="10.0" y="14.0" width="360.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="29.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Segmentation</text><text x="19.0" y="49.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">geographic, demographic, psychographic, behavioural</text><rect x="10.0" y="86.1" width="360.0" height="50.1" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="101.6" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Targeting</text><text x="19.0" y="121.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">undifferentiated, differentiated, concentrated (niche)</text><rect x="10.0" y="158.3" width="360.0" height="50.1" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="173.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Positioning</text><text x="19.0" y="193.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the place a brand holds in customers' minds</text><path d="M190.0 66.1 L190.0 76.9" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 84.1 L186.3 76.1 L193.7 76.1 Z" fill="var(--vx-line, #8a92a8)"/><path d="M190.0 138.3 L190.0 149.1" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 156.3 L186.3 148.3 L193.7 148.3 Z" fill="var(--vx-line, #8a92a8)"/></svg>