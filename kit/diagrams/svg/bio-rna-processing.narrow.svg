<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 562.0" width="380.0" height="562.0" role="img" aria-label="Five boxes in order: pre-mRNA, 5′ cap, poly-A tail, splicing and mature mRNA." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 92.0 L190.0 117.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 126.0 L185.9 117.0 L194.1 117.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 199.0 L190.0 224.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 233.0 L185.9 224.0 L194.1 224.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 306.0 L190.0 331.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 340.0 L185.9 331.0 L194.1 331.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 428.0 L190.0 453.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 462.0 L185.9 453.0 L194.1 453.0 Z" fill="var(--vx-ink, #151826)"/><rect x="100.0" y="24.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">pre-mRNA</text><text x="190.0" y="57.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">exons and introns, made in</text><text x="190.0" y="72.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the nucleus</text><rect x="100.0" y="131.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="147.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">5′ cap</text><text x="190.0" y="164.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a modified guanine added</text><text x="190.0" y="179.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">to the 5′ end</text><rect x="100.0" y="238.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="254.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">poly-A tail</text><text x="190.0" y="271.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">many adenines added to the</text><text x="190.0" y="286.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">3′ end</text><rect x="100.0" y="345.0" width="180.0" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="361.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">splicing</text><text x="190.0" y="378.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the spliceosome removes</text><text x="190.0" y="393.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the introns and joins the</text><text x="190.0" y="408.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">exons</text><rect x="100.0" y="467.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="483.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">mature mRNA</text><text x="190.0" y="500.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">leaves through the nuclear</text><text x="190.0" y="515.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pores for translation</text></svg>