<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 387.0" width="700.0" height="387.0" role="img" aria-label="A cycle: Cl• reacts with CH₄ to give CH₃• and HCl; CH₃• reacts with Cl₂ to give CH₃Cl and Cl•, which returns to the start. Initiation and termination are shown beside it." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M350.0 89.0 Q289.5 170.0 350.0 251.0" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/><path d="M343.9 241.0 L345.8 244.1" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M350.0 251.0 L341.8 245.4 L348.9 241.2 Z" fill="var(--vx-ink, #151826)"/><text x="307.8" y="170.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">+ CH<tspan baseline-shift="sub" font-size="8.3">4</tspan> → CH<tspan baseline-shift="sub" font-size="8.3">3</tspan>• + HCl</text><path d="M350.0 251.0 Q410.5 170.0 350.0 89.0" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/><path d="M356.1 99.0 L354.2 95.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M350.0 89.0 L358.2 94.6 L351.1 98.8 Z" fill="var(--vx-ink, #151826)"/><text x="392.3" y="170.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">+ Cl<tspan baseline-shift="sub" font-size="8.3">2</tspan> → CH<tspan baseline-shift="sub" font-size="8.3">3</tspan>Cl + Cl•</text><rect x="270.9" y="36.0" width="158.2" height="48.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="350.0" y="52.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">Cl•</text><text x="350.0" y="69.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">from Cl<tspan baseline-shift="sub" font-size="8.3">2</tspan> → 2Cl• (UV)</text><rect x="291.0" y="256.0" width="117.9" height="48.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="350.0" y="272.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">CH<tspan baseline-shift="sub" font-size="9.4">3</tspan>•</text><text x="350.0" y="289.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">methyl radical</text><text x="350.0" y="328.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">propagation</text><text x="350.0" y="361.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Termination: Cl• + CH<tspan baseline-shift="sub" font-size="8.6">3</tspan>• → CH<tspan baseline-shift="sub" font-size="8.6">3</tspan>Cl; 2Cl• → Cl<tspan baseline-shift="sub" font-size="8.6">2</tspan>; 2CH<tspan baseline-shift="sub" font-size="8.6">3</tspan>• → C<tspan baseline-shift="sub" font-size="8.6">2</tspan>H<tspan baseline-shift="sub" font-size="8.6">6</tspan></text></svg>