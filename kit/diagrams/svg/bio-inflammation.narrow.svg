<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 628.0" width="380.0" height="628.0" role="img" aria-label="Five boxes in order: tissue damage, vasodilation, more permeable capillaries, neutrophils then macrophages arriving, and resolution and repair." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 124.0 L190.0 149.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 158.0 L185.9 149.0 L194.1 149.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 231.0 L190.0 256.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 265.0 L185.9 256.0 L194.1 256.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 355.0 L190.0 380.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 389.0 L185.9 380.0 L194.1 380.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 479.0 L190.0 504.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 513.0 L185.9 504.0 L194.1 504.0 Z" fill="var(--vx-ink, #151826)"/><rect x="100.9" y="24.0" width="178.3" height="95.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">tissue damage or</text><text x="190.0" y="57.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">infection</text><text x="190.0" y="74.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">damaged cells and mast</text><text x="190.0" y="89.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cells release histamine</text><text x="190.0" y="104.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and other mediators</text><rect x="100.0" y="163.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="179.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">vasodilation</text><text x="190.0" y="196.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">more blood flow: redness</text><text x="190.0" y="211.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and heat</text><rect x="100.9" y="270.0" width="178.3" height="80.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="286.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">more permeable</text><text x="190.0" y="303.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">capillaries</text><text x="190.0" y="320.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">fluid and proteins leak</text><text x="190.0" y="335.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">out: swelling</text><rect x="100.0" y="394.0" width="180.0" height="80.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="410.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">neutrophils, then</text><text x="190.0" y="427.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">macrophages</text><text x="190.0" y="444.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">move into the tissue and</text><text x="190.0" y="459.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">remove the pathogen</text><rect x="100.0" y="518.0" width="180.0" height="78.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="534.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">resolution and repair</text><text x="190.0" y="551.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">acute inflammation</text><text x="190.0" y="566.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">normally ends once the</text><text x="190.0" y="581.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cause is gone</text></svg>