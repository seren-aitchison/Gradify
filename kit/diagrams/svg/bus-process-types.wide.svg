<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 329.0" width="700.0" height="329.0" role="img" aria-label="Five stacked layers from low volume and high variety to very high volume: project, jobbing, batch, mass, continuous." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="16.0" width="360.0" height="52" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity=".14" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="42.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Project</text><path d="M372.0 42.0 L384.0 42.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="42.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">unique, large: a bridge or ship</text><rect x="8.0" y="73.0" width="360.0" height="52" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity=".14" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="99.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Jobbing</text><path d="M372.0 99.0 L384.0 99.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="91.3" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">low volume, high variety: a bespoke</text><text x="390.0" y="106.8" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">tailor</text><rect x="8.0" y="130.0" width="360.0" height="52" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="156.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Batch</text><path d="M372.0 156.0 L384.0 156.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="148.3" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">groups of identical items: a bakery's</text><text x="390.0" y="163.8" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">loaves</text><rect x="8.0" y="187.0" width="360.0" height="52" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity=".14" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="213.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Mass</text><path d="M372.0 213.0 L384.0 213.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="205.3" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">high volume, standardised: cars on an</text><text x="390.0" y="220.8" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">assembly line</text><rect x="8.0" y="244.0" width="360.0" height="52" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity=".14" stroke="var(--vx-a2, #db2777)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="270.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Continuous</text><path d="M372.0 270.0 L384.0 270.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="270.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">very high volume, non-stop: oil refining</text><text x="350.0" y="313.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">volume rises, variety falls</text></svg>