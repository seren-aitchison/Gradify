<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 190.0" width="700.0" height="190.0" role="img" aria-label="A tree: is a large volume of one product needed continuously? Continuous. Otherwise: batch." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M350.0 80.0 C350.0 104.0 180.0 96.0 180.0 120.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M180.0 118.0 L180.0 121.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M180.0 129.0 L176.3 121.0 L183.7 121.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="257.0" y="101.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M350.0 80.0 C350.0 104.0 520.0 96.0 520.0 120.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M520.0 118.0 L520.0 121.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M520.0 129.0 L516.3 121.0 L523.7 121.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="443.0" y="101.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><rect x="220.0" y="30.0" width="260.0" height="50.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="350.0" y="46.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is a very large volume of one</text><text x="350.0" y="63.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">product needed all the time?</text><rect x="85.0" y="130.0" width="190.0" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="180.0" y="146.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Continuous process</text><text x="180.0" y="163.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. NH<tspan baseline-shift="sub" font-size="8.3">3</tspan>, H<tspan baseline-shift="sub" font-size="8.3">2</tspan>SO<tspan baseline-shift="sub" font-size="8.3">4</tspan></text><rect x="425.0" y="130.0" width="190.0" height="48.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="520.0" y="146.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Batch process</text><text x="520.0" y="163.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. medicines, dyes</text></svg>