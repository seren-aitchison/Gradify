<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.0 420.0" width="680.0" height="420.0" role="img" aria-label="A silica column with two separating bands: the non-polar compound lower down, the polar compound near the top." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(108.9 0) scale(1.000)"><path d="M200 40 v250 l20 30 v30 h20 v-30 l20 -30 v-250" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/><rect x="202" y="90" width="56" height="198" fill="#f1efe6"/><rect x="202" y="60" width="56" height="30" fill="#dbeafe" fill-opacity=".8"/><rect x="202" y="123.0" width="56" height="14" fill="var(--vx-a2, #db2777)" fill-opacity=".85"/><path d="M258.0 130.0 L300.0 130.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="304.0" y="130.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">alcohol (polar)</text><rect x="202" y="231.0" width="56" height="14" fill="var(--vx-a1, #4f46e5)" fill-opacity=".85"/><path d="M258.0 238.0 L300.0 238.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="304.0" y="238.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">hydrocarbon (non-polar)</text><text x="30.0" y="75.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">eluent added at the top</text><text x="30.0" y="190.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">silica (polar)</text><path d="M206 368 h48 v40 h-48 Z" fill="var(--vx-a1, #4f46e5)" fill-opacity=".35" stroke="var(--vx-ink, #151826)" stroke-width="1.8"/><text x="262.0" y="392.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">first to elute: hyd