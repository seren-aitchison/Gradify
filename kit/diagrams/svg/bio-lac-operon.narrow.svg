<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 440.7" width="380.0" height="440.7" role="img" aria-label="A flow chart: no lactose means the operon is off; lactose with glucose gives low expression; lactose without glucose gives high expression." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 40.0)"><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is lactose present?</text></g><path d="M30.0 59.9 L30.0 87.9" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 87.9 L34.7 87.9" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 87.9 L34.0 91.1 L34.0 84.7 Z" fill="var(--vx-bad, #dc2626)"/><rect x="42.0" y="71.9" width="270.0" height="63.3" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.6"/><text x="177.0" y="85.9" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><g transform="translate(0 119.6)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Off: the repressor binds the</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">operator and blocks RNA polymerase</text></g><path d="M338.0 61.9 L338.0 153.1" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 161.2 L333.9 152.2 L342.1 152.2 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 103.6)" x="332.0" y="103.6" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="165.2" width="340.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 185.2)"><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is glucose also present?</text></g><path d="M30.0 205.1 L30.0 233.1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 233.1 L34.7 233.1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 233.1 L34.0 236.3 L34.0 229.9 Z" fill="var(--vx-good, #16a34a)"/><rect x="42.0" y="217.1" width="270.0" height="79.9" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/><text x="177.0" y="231.1" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no</text><g transform="translate(0 273.1)"><text x="177.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">High: the repressor is off the</text><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">operator and cAMP–CAP helps RNA</text><text x="177.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">polymerase bind</text></g><path d="M338.0 207.1 L338.0 314.9" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 323.0 L333.9 314.0 L342.1 314.0 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 257.1)" x="332.0" y="257.1" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="327.0" width="340.0" height="93.7" rx="14" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><g transform="translate(0 373.9)"><text x="190.0" y="-26.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Low: allolactose frees the</text><text x="190.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">repressor, but with glucose</text><text x="190.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">present cAMP is low and CAP is</text><text x="190.0" y="26.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">inactive</text></g></svg>