<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 224.0" width="700.0" height="224.0" role="img" aria-label="Concentric rings for the ectoderm, mesoderm and endoderm of a gastrula, with the tissues each becomes: skin epidermis and nervous system; muscle, bone, blood, heart, kidneys and gonads; gut lining, respiratory lining, liver and pancreas." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><circle cx="114.0" cy="110.0" r="100.0" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.22" stroke="var(--vx-a1, #4f46e5)" stroke-width="2.4"/><circle cx="114.0" cy="110.0" r="68.0" fill="var(--vx-a3, #ea580c)" fill-opacity="0.22" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4"/><circle cx="114.0" cy="110.0" r="38.0" fill="var(--vx-a4, #0d9488)" fill-opacity="0.22" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><text x="114.0" y="110.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">gut cavity</text><rect x="256.0" y="12.0" width="14.0" height="14.0" rx="4" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.3" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><text x="278.0" y="19.0" font-size="14" font-weight="800" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">ectoderm (outer)</text><g transform="translate(0 40.0)"><text x="278.0" y="0.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">epidermis of the skin, nervous system, brain, spinal cord</text></g><rect x="256.0" y="76.0" width="14.0" height="14.0" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity="0.3" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><text x="278.0" y="83.0" font-size="14" font-weight="800" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">mesoderm (middle)</text><g transform="translate(0 104.0)"><text x="278.0" y="0.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">muscle, bone, blood, heart, kidneys, gonads</text></g><rect x="256.0" y="140.0" width="14.0" height="14.0" rx="4" fill="var(--vx-a4, #0d9488)" fill-opacity="0.3" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/><text x="278.0" y="147.0" font-size="14" font-weight="800" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">endoderm (inner)</text><g transform="translate(0 176.0)"><text x="278.0" y="-8.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">lining of the gut, lining of the respiratory tract, liver,</text><text x="278.0" y="8.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">pancreas</text></g></svg>