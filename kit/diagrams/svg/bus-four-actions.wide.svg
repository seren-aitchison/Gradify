<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 244.0" width="700.0" height="244.0" role="img" aria-label="Four boxes: eliminate (animal shows, star performers), reduce (thrills and danger), raise (a unique venue, artistic quality), create (themes, artistic music and dance)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="12.0" width="338.0" height="108.0" rx="9" fill="var(--vx-bad, #dc2626)" fill-opacity="0.12" stroke="var(--vx-bad, #dc2626)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Eliminate</text><text x="17.0" y="77.1" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">animal shows and star performers</text><rect x="354.0" y="12.0" width="338.0" height="108.0" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="363.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Reduce</text><text x="363.0" y="77.1" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">thrills and danger</text><rect x="8.0" y="128.0" width="338.0" height="108.0" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="171.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Raise</text><text x="17.0" y="193.1" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a unique venue and artistic quality</text><rect x="354.0" y="128.0" width="338.0" height="108.0" rx="9" fill="var(--vx-good, #16a34a)" fill-opacity="0.12" stroke="var(--vx-good, #16a34a)" stroke-opacity=".55" stroke-width="1.3"/><text x="363.0" y="164.6" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Create</text><text x="363.0" y="185.9" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">themes, artistic music and dance for theatre-goers</text><text x="363.0" y="200.3" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">as well as families</text></svg>