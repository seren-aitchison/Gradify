e</text><text x="463.3" y="163.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">molecule?</text><rect x="255.0" y="230.0" width="190.0" height="48.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="350.0" y="246.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Regioselective</text><text x="350.0" y="263.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. Markovnikov addition</text><rect x="481.7" y="230.0" width="190.0" height="48.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.1" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="576.7" y="246.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Stereoselective</text><text x="576.7" y="263.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. anti addition of Br<tspan baseline-shift="sub" font-size="8.3">2</tspan></text></svg>