<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 290.5" width="380.0" height="290.5" role="img" aria-label="A cycle of four boxes: sprint planning, daily scrum, sprint review, retrospective, then back to sprint planning." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="40.0" y="14.0" width="322.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="49.0" y="29.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Sprint planning</text><text x="49.0" y="49.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pick work from the backlog</text><rect x="40.0" y="86.1" width="322.0" height="50.1" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="49.0" y="101.6" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Daily scrum</text><text x="49.0" y="121.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">15 minutes</text><rect x="40.0" y="158.3" width="322.0" height="50.1" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="49.0" y="173.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Sprint review</text><text x="49.0" y="193.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">show the result, get feedback</text><rect x="40.0" y="230.4" width="322.0" height="50.1" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/