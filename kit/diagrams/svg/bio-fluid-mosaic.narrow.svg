nd" fill="none"/><circle cx="316.5" cy="104.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M314.0 110.0 L314.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M319.0 110.0 L319.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="316.5" cy="168.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M314.0 162.0 L314.0 137.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M319.0 162.0 L319.0 137.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="342.5" cy="104.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M340.0 110.0 L340.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M345.0 110.0 l0 9 l-2 4 l2 4 l0 7.5" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2"/><circle cx="342.5" cy="168.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M340.0 162.0 L340.0 137.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M345.0 162.0 l0 -9 l-2 -4 l2 -4 l0 -7.5" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2"/><circle cx="355.5" cy="104.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M353.0 110.0 L353.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M358.0 110.0 L358.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="355.5" cy="168.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M353.0 162.0 L353.0 137.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M358.0 162.0 L358.0 137.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/></g><g data-part="channel protein"><title>channel protein: An integral protein with a water-filled pore through the bilayer: a specific ion or water passes through it by facilitated diffusion.</title><rect x="73.4" y="94.0" width="13.0" height="84.0" rx="6" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.4" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><rect x="94.4" y="94.0" width="13.0" height="84.0" rx="6" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.4" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><rect x="86.4" y="96.0" width="8" height="80" fill="var(--vx-a1, #4f46e5)" fill-opacity=".18"/></g><g data-part="carrier protein"><title>carrier protein: An integral protein that binds a specific molecule such as glucose, changes shape and releases it on the other side.</title><rect x="167.4" y="94.0" width="32.0" height="84.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.4" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><path d="M177.4 100.0 q6 36 0 72" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2" stroke-dasharray="3 3"/></g><g data-part="receptor protein"><title>receptor protein: An integral protein that binds a signal on the outer surface and passes the message in. Most carry a short carbohydrate chain.</title><rect x="272.0" y="78.0" width="22.0" height="100.0" rx="8" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.4" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><path d="M277.0 78.0 l6 -8 l6 8" fill="none" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/></g><g data-part="carbohydrate chain"><title>carbohydrate chain: A short chain on a protein (glycoprotein) or lipid (glycolipid) on the outer surface only. Together they make the glycocalyx, used in cell recognition (such as ABO blood groups) and adhesion.</title><circle cx="279.0" cy="66.0" r="3.6" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width=".6"/><circle cx="287.0" cy="58.0" r="3.6" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width=".6"/><circle cx="279.0" cy="50.0" r="3.6" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width=".6"/><circle cx="287.0" cy="42.0" r="3.6" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width=".6"/></g><g data-part="cholesterol"><title>cholesterol: Sits between the phospholipids of animal membranes: it restrains their movement at body temperature, so the membrane is less fluid and less leaky, and stops tight packing when cold.</title><rect x="53.2" y="108.0" width="8" height="26" rx="3" fill="var(--vx-a2, #db2777)" fill-opacity=".55" stroke="var(--vx-a2, #db2777)"/><circle cx="57.2" cy="105.0" r="3" fill="var(--vx-a2, #db2777)"/></g><g data-part="cholesterol"><title>cholesterol: Sits between the phospholipids of animal membranes: it restrains their movement at body temperature, so the membrane is less fluid and less leaky, and stops tight packing when cold.</title><rect x="136.2" y="108.0" width="8" height="26" rx="3" fill="var(--vx-a2, #db2777)" fill-opacity=".55" stroke="var(--vx-a2, #db2777)"/><circle cx="140.2" cy="105.0" r="3" fill="var(--vx-a2, #db2777)"/></g><g data-part="cholesterol"><title>cholesterol: Sits between the phospholipids of animal membranes: it restrains their movement at body temperature, so the membrane is less fluid and less leaky, and stops tight packing when cold.</title><rect x="232.5" y="108.0" width="8" height="26" rx="3" fill="var(--vx-a2, #db2777)" fill-opacity=".55" stroke="var(--vx-a2, #db2777)"/><circle cx="236.5" cy="105.0" r="3" fill="var(--vx-a2, #db2777)"/></g><g data-part="cholesterol"><title>cholesterol: Sits between the phospholipids of animal membranes: it restrains their movement at body temperature, so the membrane is less fluid and less leaky, and stops tight packing when cold.</title><rect x="325.4" y="108.0" width="8" height="26" rx="3" fill="var(--vx-a2, #db2777)" fill-opacity=".55" stroke="var(--vx-a2, #db2777)"/><circle cx="329.4" cy="105.0" r="3" fill="var(--vx-a2, #db2777)"/></g><g data-part="carbohydrate chain"><title>carbohydrate chain: A short chain on a protein (glycoprotein) or lipid (glycolipid) on the outer surface only. Together they make the glycocalyx, used in cell recognition (such as ABO blood groups) and adhesion.</title><circle cx="116.3" cy="94.0" r="3.6" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width=".6"/><circle cx="124.3" cy="86.0" r="3.6" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width=".6"/><circle cx="116.3" cy="78.0" r="3.6" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width=".6"/></g><g data-part="carbohydrate chain"><title>carbohydrate chain: A short chain on a protein (glycoprotein) or lipid (glycolipid) on the outer surface only. Together they make the glycocalyx, used in cell recognition (such as ABO blood groups) and adhesion.</title><circle cx="225.8" cy="94.0" r="3.6" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width=".6"/><circle cx="233.8" cy="86.0" r="3.6" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width=".6"/><circle cx="225.8" cy="78.0" r="3.6" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width=".6"/></g><g data-part="peripheral protein"><title>peripheral protein: Sits on one surface of the bilayer, often attached to an integral protein; it does not cross the membrane.</title><ellipse cx="140.2" cy="183.0" rx="17" ry="9" fill="var(--vx-a2, #db2777)" fill-opacity=".3" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/></g><path d="M24.0 212.0 L52.0 212.0" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="butt" fill="none"/><text x="60.0" y="212.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">2 nm</text><circle cx="346.9" cy="104.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="346.9" y="104.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1</text><circle cx="90.4" cy="124.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="90.4" y="124.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2</text><circle cx="183.4" cy="124.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="183.4" y="124.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3</text><circle cx="283.0" cy="124.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="283.0" y="124.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4</text><circle cx="283.0" cy="48.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="283.0" y="48.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5</text><circle cx="57.2" cy="122.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="57.2" y="122.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6</text><circle cx="140.2" cy="183.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="140.2" y="183.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7</text><text x="14.0" y="270.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1  phospholipid</text><text x="14.0" y="289.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2  channel protein</text><text x="14.0" y="308.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3  carrier protein</text><text x="14.0" y="327.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4  receptor protein</text><text x="14.0" y="346.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5  carbohydrate chain</text><text x="14.0" y="365.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6  cholesterol</text><text x="14.0" y="384.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7  peripheral protein</text><text x="14.0" y="409.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">membrane ≈ 5.2 nm; hydrophobic core ≈ 3.5 nm</text></svg>