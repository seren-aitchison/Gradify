<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 423.0" width="380.0" height="423.0" role="img" aria-label="A cross-section of a membrane: two layers of phospholipids with heads outwards and tails inwards, a channel protein, a carrier protein and a receptor protein spanning it, cholesterol between the lipids, a peripheral protein on the cytosol side and carbohydrate chains on the outer surface only." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="0.0" y="0.0" width="380.0" height="96.0" rx="0" fill="var(--vx-a4, #0d9488)" fill-opacity="0.07" stroke="none" stroke-width="1.6"/><rect x="0.0" y="176.0" width="380.0" height="80.0" rx="0" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.07" stroke="none" stroke-width="1.6"/><rect x="0.0" y="110.0" width="380.0" height="52.0" rx="0" fill="var(--vx-a3, #ea580c)" fill-opacity="0.08" stroke="none" stroke-width="1.6"/><text x="24.0" y="16.0" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">extracellular fluid (water)</text><text x="24.0" y="240.0" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">cytosol (water)</text><g data-part="phospholipid"><title>phospholipid: Two fatty-acid tails and a phosphate head. In water the hydrophilic heads face the water on both sides and the hydrophobic tails face inwards, which makes the bilayer a barrier to ions and polar molecules.</title><circle cx="30.5" cy="104.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M28.0 110.0 L28.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M33.0 110.0 l0 9 l-2 4 l2 4 l0 7.5" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2"/><circle cx="30.5" cy="168.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M28.0 162.0 L28.0 137.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M33.0 162.0 l0 -9 l-2 -4 l2 -4 l0 -7.5" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2"/><circle cx="43.5" cy="104.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M41.0 110.0 L41.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M46.0 110.0 L46.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="43.5" cy="168.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M41.0 162.0 L41.0 137.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M46.0 162.0 L46.0 137.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="121.5" cy="104.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M119.0 110.0 L119.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M124.0 110.0 L124.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="121.5" cy="168.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M119.0 162.0 L119.0 137.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M124.0 162.0 L124.0 137.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="212.5" cy="104.0" r="6" fill="var(--vx-a3, #ea580c)" fill-opacity=".55" stroke="var(--vx-a3, #ea580c)" stroke-width="1"/><path d="M210.0 110.0 L210.0 134.5" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" fil