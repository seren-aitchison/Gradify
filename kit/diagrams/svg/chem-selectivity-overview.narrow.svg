<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 325.0" width="380.0" height="325.0" role="img" aria-label="A tree: do the possible products differ in which functional group reacted? Chemoselective. If not, in where on the molecule? Regioselective. Otherwise in 3D arrangement: stereoselective." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="12.0" y="28.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Do the products differ in which</text><text x="12.0" y="45.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">functional group reacted?</text><text x="28.0" y="68.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="28.0" y="78.0" width="340.0" height="46.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="38.0" y="92.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Chemoselective</text><text x="38.0" y="109.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. NaBH<tspan baseline-shift="sub" font-size="8.3">4</tspan>: ketone, not ester</text><text x="28.0" y="140.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><text x="28.0" y="160.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Do they differ in where on the molecule?</text><text x="44.0" y="183.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="44.0" y="193.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="54.0" y="207.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Regioselective</text><text x="54.0" y="224.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. Markovnikov addition</text><text x="44.0" y="255.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="44.0" y="265.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a5, #7c3aed)" fill-opacity=".1" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="54.0" y="279.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Stereoselective</text><text x="54.0" y="296.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. anti addition of Br<tspan baseline-shift="sub" font-size="8.3">2</tspan></text></svg>