<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 438.9" width="760.0" height="438.9" role="img" aria-label="A flow chart from the kind of data and question to chi-squared, correlation, ANOVA, the Mann-Whitney U test or the t-test." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="30.0" y="20.0" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 48.9)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are the data measurements, not counts in</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">categories?</text></g><path d="M430.0 48.9 L479.9 48.9" stroke="var(--vx-a4, #0d9488)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 48.9 L479.0 53.1 L479.0 44.8 Z" fill="var(--vx-a4, #0d9488)"/><text x="460.0" y="37.9" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><rect x="490.0" y="23.3" width="250.0" height="51.3" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8"/><g transform="translate(615.0 48.9)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Chi-squared test: observed</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">against expected frequencies</text></g><path d="M230.0 79.8 L230.0 103.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 111.8 L225.9 102.8 L234.1 102.8 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="95.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="129.8" width="400.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 149.8)"><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are you comparing groups?</text></g><path d="M430.0 149.8 L479.9 149.8" stroke="var(--vx-a4, #0d9488)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 149.8 L479.0 153.9 L479.0 145.7 Z" fill="var(--vx-a4, #0d9488)"/><text x="460.0" y="138.8" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><rect x="490.0" y="115.8" width="250.0" height="67.9" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8"/><g transform="translate(615.0 149.8)"><text x="0.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Correlation (Pearson or</text><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Spearman): association of two</text><text x="0.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">variables</text></g><path d="M230.0 175.8 L230.0 199.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 207.8 L225.9 198.8 L234.1 198.8 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="191.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="217.4" width="400.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 237.4)"><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are there exactly two groups?</text></g><path d="M430.0 237.4 L479.9 237.4" stroke="var(--vx-a4, #0d9488)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 237.4 L479.0 241.5 L479.0 233.3 Z" fill="var(--vx-a4, #0d9488)"/><text x="460.0" y="226.4" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><rect x="490.0" y="211.8" width="250.0" height="51.3" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8"/><g transform="translate(615.0 237.4)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">ANOVA: means of three or more</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">groups</text></g><path d="M230.0 259.4 L230.0 283.3" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 291.4 L225.9 282.4 L234.1 282.4 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="275.4" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="301.0" width="400.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 321.0)"><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are the data normally distributed?</text></g><path d="M430.0 321.0 L479.9 321.0" stroke="var(--vx-a4, #0d9488)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 321.0 L479.0 325.1 L479.0 316.9 Z" fill="var(--vx-a4, #0d9488)"/><text x="460.0" y="310.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><rect x="490.0" y="295.4" width="250.0" height="51.3" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8"/><g transform="translate(615.0 321.0)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Mann–Whitney U: two groups, no</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">normality assumed</text></g><path d="M230.0 343.0 L230.0 366.9" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 375.0 L225.9 366.0 L234.1 366.0 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="359.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="379.0" width="400.0" height="39.9" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 398.9)"><text x="230.0" y="0.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">t-test: means of two groups</text></g></svg>