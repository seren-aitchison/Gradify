<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 228.9" width="380.0" height="228.9" role="img" aria-label="A two by two grid. High power and high interest: manage closely. High power, low interest: keep satisfied. Low power, high interest: keep informed. Low power, low interest: monitor. The supermarket example's stakeholders are placed." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="153.5" y="28.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Low interest</text><text x="300.5" y="28.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">High interest</text><text x="72.0" y="75.6" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">High</text><text x="72.0" y="90.0" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">power</text><rect x="80.0" y="42.0" width="141.0" height="75.7" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".5" stroke-width="1.3"/><text x="89.0" y="59.2" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Keep satisfied</text><text x="89.0" y="78.0" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• a regulator not</text><text x="89.0" y="92.1" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">yet engaged</text><rect x="227.0" y="42.0" width="141.0" height="75.7" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-opacity=".5" stroke-width="1.3"/><text x="236.0" y="59.2" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Manage closely</text><text x="236.0" y="73.0" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">key players</text><text x="236.0" y="90.5" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• local planning</text><text x="236.0" y="104.6" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">authority</text><text x="72.0" y="163.3" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Low power</text><rect x="80.0" y="123.7" width="141.0" height="73.2" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".5" stroke-width="1.3"/><text x="89.0" y="140.9" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Monitor</text><text x="89.0" y="154.7" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">minimal effort</text><rect x="227.0" y="123.7" width="141.0" height="73.2" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".5" stroke-width="1.3"/><text x="236.0" y="140.9" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Keep informed</text><text x="236.0" y="159.7" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• local residents</text><text x="236.0" y="173.7" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• small shops in the</text><text x="236.0" y="187.8" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">town centre</text><text x="227.0" y="214.9" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">interest in the decision →</text><g transform="translate(14 122.5) rotate(-90)"><text x="0.0" y="0.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">power over the business →</text></g></svg>