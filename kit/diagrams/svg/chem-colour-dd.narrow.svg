<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 280.0" width="380.0" height="280.0" role="img" aria-label="Energy diagram: t₂g and eg levels with an upward arrow labelled absorbs about 800 nm, and a note that the complementary blue is transmitted." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M12.0 250.0 L12.0 33.2" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M12.0 26.0 L15.7 34.0 L8.3 34.0 Z" fill="var(--vx-ink, #151826)"/><text x="6.0" y="12.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">energy</text><path d="M88.0 240.0 L190.0 240.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M88.0 50.0 L190.0 50.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M142.4 240.0 L142.4 57.2" stroke="var(--vx-a2, #db2777)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M142.4 50.0 L146.1 58.0 L138.7 58.0 Z" fill="var(--vx-a2, #db2777)"/><text x="82.0" y="240.0" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">t<tspan baseline-shift="sub" font-size="7.9">2g</tspan></text><text x="82.0" y="50.0" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">e<tspan baseline-shift="sub" font-size="7.9">g</tspan></text><text x="148.4" y="145.0" font-size="10.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">absorbs ≈ 800 nm (red), 150 kJ mol<tspan baseline-shift="super" font-size="7.6">−1</tspan></text><text x="88.0" y="270.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">the light left over looks blue</text></svg>