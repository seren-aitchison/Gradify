<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 579.0" width="380.0" height="579.0" role="img" aria-label="Five boxes in order: zygote (totipotent), inner cell mass (pluripotent), haematopoietic stem cell (multipotent), erythroid progenitor (unipotent) and red blood cell (specialised)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 92.0 L190.0 117.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 126.0 L185.9 117.0 L194.1 117.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 214.0 L190.0 239.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 248.0 L185.9 239.0 L194.1 239.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 338.0 L190.0 363.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 372.0 L185.9 363.0 L194.1 363.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 445.0 L190.0 470.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 479.0 L185.9 470.0 L194.1 470.0 Z" fill="var(--vx-ink, #151826)"/><rect x="104.2" y="24.0" width="171.6" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">zygote</text><text x="190.0" y="57.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">totipotent: every cell</text><text x="190.0" y="72.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">type, and the placenta</text><rect x="100.9" y="131.0" width="178.3" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="147.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">inner cell mass</text><text x="190.0" y="164.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pluripotent: every body</text><text x="190.0" y="179.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cell type, not the</text><text x="190.0" y="194.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">placenta</text><rect x="100.0" y="253.0" width="180.0" height="80.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="269.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">haematopoietic stem</text><text x="190.0" y="286.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">cell</text><text x="190.0" y="303.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">multipotent: all the blood</text><text x="190.0" y="318.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cells</text><rect x="100.0" y="377.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="393.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">erythroid progenitor</text><text x="190.0" y="410.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">unipotent: red blood cells</text><text x="190.0" y="425.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">only</text><rect x="100.0" y="484.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="500.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">red blood cell</text><text x="190.0" y="517.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">specialised: no nucleus:</text><text x="190.0" y="532.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cannot divide</text></svg>