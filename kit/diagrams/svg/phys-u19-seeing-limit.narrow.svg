<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 448.0" width="380.0" height="448.0" role="img" aria-label="A logarithmic scale of angle in arcseconds from 0.01 to 100 with the 8 metre telescope's diffraction limit at 0.07, typical seeing at 0.6 and the eye's diffraction limit at 46." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Angular resolution: diffraction limit against seeing</text><path d="M62.0 418.0 L62.0 55.2" stroke="var(--vx-ink, #151826)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M62.0 48.0 L65.7 56.0 L58.3 56.0 Z" fill="var(--vx-ink, #151826)"/><text x="70.0" y="44.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">angular resolution / arcsec</text><path d="M57.0 418.0 L67.0 418.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="418.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-2</tspan></text><path d="M57.0 328.0 L67.0 328.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="328.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-1</tspan></text><path d="M57.0 238.0 L67.0 238.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="238.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">0</tspan></text><path d="M57.0 148.0 L67.0 148.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="148.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">1</tspan></text><path d="M57.0 58.0 L67.0 58.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="58.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">2</tspan></text><circle cx="62.0" cy="342.4" r="3.5" fill="var(--vx-a2, #db2777)"/><path d="M62.0 342.4 L78.0 342.4" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="82.0" y="342.4" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8 m telescope, diffraction limit 0.07″</text><circle cx="62.0" cy="258.0" r="3.5" fill="var(--vx-a2, #db2777)"/><path d="M62.0 258.0 L78.0 258.0" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="82.0" y="258.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">typical seeing 0.6″</text><circle cx="62.0" cy="88.2" r="3.5" fill="var(--vx-a2, #db2777)"/><path d="M62.0 88.2 L78.0 88.2" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="82.0" y="88.2" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">eye, 3 mm pupil: 46″</text></svg>