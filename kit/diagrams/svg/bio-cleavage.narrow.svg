<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 370.2" width="380.0" height="370.2" role="img" aria-label="Six stages in a row inside the same size of zona pellucida: the zygote, then two, four, eight and about sixteen cells that get smaller at each division, then a blastocyst with an outer ring of trophoblast, a fluid-filled cavity and a small cluster of inner cell mass cells against one side." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g data-stage="zygote"><g data-part="zona pellucida"><title>zona pellucida: The glycoprotein coat round the egg and the early embryo.</title><circle cx="70.0" cy="54.0" r="41" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="3" stroke-opacity=".7"/></g><g data-part="blastomeres"><title>blastomeres: Cells made by cleavage: each division halves their volume because there is no growth between divisions.</title><circle cx="70.0" cy="54.0" r="36" fill="var(--vx-a4, #0d9488)" fill-opacity="0.2" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/></g></g><text x="70.0" y="112.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">zygote</text><text x="70.0" y="128.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">1 cell</text><path d="M116.0 54.0 L137.7 54.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M144.0 54.0 L137.0 57.2 L137.0 50.8 Z" fill="var(--vx-soft, #5b6275)"/><g data-stage="2 cells"><g data-part="zona pellucida"><title>zona pellucida: The glycoprotein coat round the egg and the early embryo.</title><circle cx="190.0" cy="54.0" r="41" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="3" stroke-opacity=".7"/></g><g data-part="blastomeres"><title>blastomeres: Cells made by cleavage: each division halves their volume because there is no growth between divisions.</title><path d="M190.0 54.