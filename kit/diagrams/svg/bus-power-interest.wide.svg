<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 248.0" width="700.0" height="248.0" role="img" aria-label="A two by two grid. High power and high interest: manage closely. High power, low interest: keep satisfied. Low power, high interest: keep informed. Low power, low interest: monitor. The supermarket example's stakeholders are placed." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="265.0" y="24.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Low interest</text><text x="551.0" y="24.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">High interest</text><text x="114.0" y="84.0" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">High power</text><rect x="122.0" y="38.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".5" stroke-width="1.3"/><text x="131.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Keep satisfied</text><text x="131.0" y="75.3" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• a regulator not yet engaged</text><rect x="408.0" y="38.0" width="280.0" height="86.0" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-opacity=".5" stroke-width="1.3"/><text x="417.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Manage closely</text><text x="417.0" y="70.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">key players</text><text x="417.0" y="89.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• local planning authority</text><text x="114.0" y="176.0" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Low power</text><rect x="122.0" y="130.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".5" stroke-width="1.3"/><text x="131.0" y="147.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Monitor</text><text x="131.0" y="162.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">minimal effort</text><rect x="408.0" y="130.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".5" stroke-width="1.3"/><text x="417.0" y="147.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Keep informed</text><text x="417.0" y="167.3" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• local residents</text><text x="417.0" y="182.6" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• small shops in the town centre</text><text x="408.0" y="234.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">interest in the decision →</text><g transform="translate(14 130.0) rotate(-90)"><text x="0.0" y="0.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">power over the business →</text></g></svg>