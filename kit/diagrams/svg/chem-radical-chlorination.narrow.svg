<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 424.0" width="380.0" height="424.0" role="img" aria-label="A cycle: Cl• reacts with CH₄ to give CH₃• and HCl; CH₃• reacts with Cl₂ to give CH₃Cl and Cl•, which returns to the start. Initiation and termination are shown beside it." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 89.0 Q190.0 185.0 190.0 281.0" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/><path d="M190.0 271.0 L190.0 272.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 281.0 L185.9 272.0 L194.1 272.0 Z" fill="var(--vx-ink, #151826)"/><text x="190.0" y="185.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">+ CH<tspan baseline-shift="sub" font-size="8.3">4</tspan> →</text><text x="190.0" y="202.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">CH<tspan baseline-shift="sub" font-size="8.3">3</tspan>• + HCl</text><path d="M190.0 281.0 Q190.0 185.0 190.0 89.0" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/><path d="M190.0 99.0 L190.0 97.1" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 89.0 L194.1 98.0 L185.9 98.0 Z" fill="var(--vx-ink, #151826)"/><text x="190.0" y="185.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">+ Cl<tspan baseline-shift="sub" font-size="8.3">2</tspan> →</text><text x="190.0" y="202.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">CH<tspan baseline-shift="sub" font-size="8.3">3</tspan>Cl + Cl•</text><rect x="110.9" y="36.0" width="158.2" height="48.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="52.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">Cl•</text><text x="190.0" y="69.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">from Cl<tspan baseline-shift="sub" font-size="8.3">2</tspan> → 2Cl• (UV)</text><rect x="161.2" y="286.0" width="57.5" height="48.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="302.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">CH<tspan baseline-shift="sub" font-size="9.4">3</tspan>•</text><text x="190.0" y="319.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">+ HCl</text><text x="190.0" y="177.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">propagation</text><text x="190.0" y="380.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Termination: Cl• + CH<tspan baseline-shift="sub" font-size="8.6">3</tspan>• → CH<tspan baseline-shift="sub" font-size="8.6">3</tspan>Cl; 2Cl• →</text><text x="190.0" y="397.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Cl<tspan baseline-shift="sub" font-size="8.6">2</tspan>; 2CH<tspan baseline-shift="sub" font-size="8.6">3</tspan>• → C<tspan baseline-shift="sub" font-size="8.6">2</tspan>H<tspan baseline-shift="sub" font-size="8.6">6</tspan></text></svg>