<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 250.0" width="380.0" height="250.0" role="img" aria-label="Vibrational levels of CO₂'s bending mode, v = 0 and v = 1, with an upward arrow for absorption of 15 μm infrared." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M12.0 220.0 L12.0 25.2" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M12.0 18.0 L15.7 26.0 L8.3 26.0 Z" fill="var(--vx-ink, #151826)"/><text x="18.0" y="14.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">energy</text><path d="M105.0 210.0 L224.0 210.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="99.0" y="210.0" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">v = 0</text><path d="M105.0 34.0 L224.0 34.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="99.0" y="34.0" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">v = 1 (bend)</text><path d="M162.8 210.0 L162.8 41.2" stroke="var(--vx-a3, #ea580c)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M162.8 34.0 L166.5 42.0 L159.1 42.0 Z" fill="var(--vx-a3, #ea580c)"/><text x="168.8" y="122.0" font-size="10.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">absorbs 15 μm infrared</text></svg>