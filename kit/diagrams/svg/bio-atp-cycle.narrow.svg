<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 388.0" width="380.0" height="388.0" role="img" aria-label="A cycle between ATP, with three phosphate groups, and ADP plus inorganic phosphate: hydrolysis releases energy, and ATP synthase uses energy from respiration or photosynthesis to rebuild ATP." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 96.5 Q121.3 185.0 190.0 266.0" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/><path d="M183.1 256.0 L185.4 259.3" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 266.0 L181.5 260.9 L188.3 256.2 Z" fill="var(--vx-ink, #151826)"/><text x="143.6" y="166.1" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hydrolysis (ATPase):</text><text x="143.6" y="183.1" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">releases about 30.5</text><text x="143.6" y="200.1" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">kJ per mole</text><path d="M190.0 266.0 Q258.8 185.0 190.0 96.5" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/><path d="M196.9 106.5 L194.6 103.2" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 96.5 L198.5 101.6 L191.7 106.3 Z" fill="var(--vx-ink, #151826)"/><text x="236.4" y="157.6" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">condensation (ATP</text><text x="236.4" y="174.6" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">synthase): energy</text><text x="236.4" y="191.6" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">from respiration or</text><text x="236.4" y="208.6" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">photosynthesis</text><rect x="104.2" y="28.5" width="171.6" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="44.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">ATP</text><text x="190.0" y="61.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">adenine, ribose, three</text><text x="190.0" y="76.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">phosphates</text><rect x="104.2" y="271.0" width="171.6" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="287.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">ADP + Pi</text><text x="190.0" y="304.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">adenine, ribose, two</text><text x="190.0" y="319.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">phosphates, and a free</text><text x="190.0" y="334.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">phosphate</text></svg>