<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 178.0" width="700.0" height="178.0" role="img" aria-label="Five boxes in order: zygote (totipotent), inner cell mass (pluripotent), haematopoietic stem cell (multipotent), erythroid progenitor (unipotent) and red blood cell (specialised)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M142.0 70.0 L141.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M150.0 70.0 L141.0 74.1 L141.0 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M278.0 70.0 L277.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M286.0 70.0 L277.0 74.1 L277.0 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M414.0 70.0 L413.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M422.0 70.0 L413.0 74.1 L413.0 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M550.0 70.0 L549.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M558.0 70.0 L549.0 74.1 L549.0 65.9 Z" fill="var(--vx-ink, #151826)"/><rect x="19.0" y="31.0" width="118.0" height="78.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="78.0" y="47.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">zygote</text><text x="78.0" y="64.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">totipotent: every</text><text x="78.0" y="79.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cell type, and the</text><text x="78.0" y="94.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">placenta</text><rect x="155.0" y="31.0" width="118.0" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="214.0" y="47.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">inner cell mass</text><text x="214.0" y="64.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pluripotent: every</text><text x="214.0" y="79.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">body cell type, not</text><text x="214.0" y="94.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the placenta</text><rect x="291.0" y="30.0" width="118.0" height="80.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="350.0" y="46.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">haematopoietic</text><text x="350.0" y="63.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">stem cell</text><text x="350.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">multipotent: all</text><text x="350.0" y="95.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the blood cells</text><rect x="427.0" y="30.0" width="118.0" height="80.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="486.0" y="46.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">erythroid</text><text x="486.0" y="63.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">progenitor</text><text x="486.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">unipotent: red</text><text x="486.0" y="95.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">blood cells only</text><rect x="563.0" y="31.0" width="118.0" height="78.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="622.0" y="47.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">red blood cell</text><text x="622.0" y="64.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">specialised: no</text><text x="622.0" y="79.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">nucleus: cannot</text><text x="622.0" y="94.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">divide</text></svg>