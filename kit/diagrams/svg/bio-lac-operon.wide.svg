<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 307.6" width="760.0" height="307.6" role="img" aria-label="A flow chart: no lactose means the operon is off; lactose with glucose gives low expression; lactose without glucose gives high expression." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="30.0" y="34.0" width="400.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 54.0)"><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is lactose present?</text></g><path d="M430.0 54.0 L479.9 54.0" stroke="var(--vx-bad, #dc2626)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 54.0 L479.0 58.1 L479.0 49.8 Z" fill="var(--vx-bad, #dc2626)"/><text x="460.0" y="43.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><rect x="490.0" y="20.0" width="250.0" height="67.9" rx="12" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8"/><g transform="translate(615.0 54.0)"><text x="0.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Off: the repressor binds the</text><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">operator and blocks RNA</text><text x="0.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">polymerase</text></g><path d="M230.0 79.9 L230.0 103.8" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 111.9 L225.9 102.9 L234.1 102.9 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="95.9" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="129.9" width="400.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 149.9)"><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is glucose also present?</text></g><path d="M430.0 149.9 L479.9 149.9" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 149.9 L479.0 154.0 L479.0 145.7 Z" fill="var(--vx-good, #16a34a)"/><text x="460.0" y="138.9" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no</text><rect x="490.0" y="115.9" width="250.0" height="67.9" rx="12" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8"/><g transform="translate(615.0 149.9)"><text x="0.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">High: the repressor is off the</text><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">operator and cAMP–CAP helps RNA</text><text x="0.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">polymerase bind</text></g><path d="M230.0 175.8 L230.0 199.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 207.8 L225.9 198.8 L234.1 198.8 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="191.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="211.8" width="400.0" height="75.8" rx="14" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><g transform="translate(0 249.7)"><text x="230.0" y="-17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Low: allolactose frees the repressor, but with</text><text x="230.0" y="0.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">glucose present cAMP is low and CAP is</text><text x="230.0" y="17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">inactive</text></g></svg>