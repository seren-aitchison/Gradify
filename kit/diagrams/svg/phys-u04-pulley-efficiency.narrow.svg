<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 300.0" width="380.0" height="300.0" role="img" aria-label="Energy flow diagram: 1000 joules of work in, 800 joules raising the load and 200 joules wasted." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Energy through a pulley system</text><rect x="14.0" y="64.0" width="115.2" height="92.0" fill="var(--vx-a1, #4f46e5)" fill-opacity=".85"/><text x="14.0" y="54.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">work done by effort: 1000 J</text><path d="M129.2 64.0 H346.0 l20 36.8 l-20 36.8 H129.2 Z" fill="var(--vx-good, #16a34a)" fill-opacity=".8"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="366.0" y="54.0" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">raising the load: 800 J</text><path d="M129.2 137.6 H135.2 A28.4 28.4 0 0 1 163.6 166.0 V226.0 l-9.2 14 l-9.2 -14 V166.0 A10.0 10.0 0 0 0 135.2 156.0 H129.2 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".78"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="154.4" y="252.0" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">friction, pulley block: 200 J</text><text x="14.0" y="286.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">efficiency = useful ÷ input = 800 ÷ 1000 = 80%</text></svg>