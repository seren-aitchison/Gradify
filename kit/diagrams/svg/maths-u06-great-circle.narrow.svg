<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 300.0" width="380.0" height="300.0" role="img" aria-label="The equator as a circle with two points on it, at longitude 0° and longitude 90°, joined to the centre with a right angle between the radii." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><circle cx="180.5" cy="150.0" r="95.4" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2.2"/><path d="M180.5 150.0 L275.8 150.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M180.5 150.0 L180.5 54.6" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M193.5 150.0 L193.5 137.0 L180.5 137.0" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="1.8"/><text x="142.3" y="197.7" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">R = 6,371 km</text><text x="232.9" y="90.9" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">90° = π/2</text><circle cx="275.8" cy="150.0" r="3.6" fill="var(--vx-ink, #151826)"/><text x="295.8" y="156.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">A</text><circle cx="180.5" cy="54.6" r="3.6" fill="var(--vx-ink, #151826)"/><text x="180.5" y="38.6" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">B</text></svg>