<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 624.8" width="760.0" height="624.8" role="img" aria-label="A flow chart of questions from meeting and mating to hybrid fertility, each 'no' leading to a barrier: habitat or temporal, behavioural or mechanical, gametic, hybrid inviability, hybrid sterility or hybrid breakdown." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="30.0" y="20.0" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 48.9)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Do the groups meet in the same habitat and</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">breed at the same time?</text></g><path d="M430.0 48.9 L479.9 48.9" stroke="var(--vx-a3, #ea580c)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 48.9 L479.0 53.1 L479.0 44.8 Z" fill="var(--vx-a3, #ea580c)"/><text x="460.0" y="37.9" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="490.0" y="23.3" width="250.0" height="51.3" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8"/><g transform="translate(615.0 48.9)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Habitat or temporal isolation</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">(prezygotic)</text></g><path d="M230.0 79.8 L230.0 103.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 111.8 L225.9 102.8 L234.1 102.8 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="95.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="115.8" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 144.8)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Do they accept each other as mates, with</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">structures that fit?</text></g><path d="M430.0 144.8 L479.9 144.8" stroke="var(--vx-a3, #ea580c)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 144.8 L479.0 148.9 L479.0 140.6 Z" fill="var(--vx-a3, #ea580c)"/><text x="460.0" y="133.8" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="490.0" y="119.1" width="250.0" height="51.3" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8"/><g transform="translate(615.0 144.8)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Behavioural or mechanical</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">isolation (prezygotic)</text></g><path d="M230.0 175.7 L230.0 199.6" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 207.7 L225.9 198.7 L234.1 198.7 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="191.7" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="211.7" width="400.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 231.6)"><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Can their sperm and eggs fuse?</text></g><path d="M430.0 231.6 L479.9 231.6" stroke="var(--vx-a3, #ea580c)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 231.6 L479.0 235.8 L479.0 227.5 Z" fill="var(--vx-a3, #ea580c)"/><text x="460.0" y="220.6" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="490.0" y="214.3" width="250.0" height="34.6" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8"/><g transform="translate(615.0 231.6)"><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Gametic isolation (prezygotic)</text></g><path d="M230.0 253.6 L230.0 277.5" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 285.6 L225.9 276.6 L234.1 276.6 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="269.6" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="289.6" width="400.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 309.6)"><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Does the hybrid zygote develop and survive?</text></g><path d="M430.0 309.6 L479.9 309.6" stroke="var(--vx-bad, #dc2626)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 309.6 L479.0 313.7 L479.0 305.4 Z" fill="var(--vx-bad, #dc2626)"/><text x="460.0" y="298.6" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><rect x="490.0" y="292.2" width="250.0" height="34.6" rx="12" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8"/><g transform="translate(615.0 309.6)"><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Hybrid inviability (postzygotic)</text></g><path d="M230.0 331.5 L230.0 355.4" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 363.5 L225.9 354.5 L234.1 354.5 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="347.5" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="373.2" width="400.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 393.2)"><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is the hybrid fertile?</text></g><path d="M430.0 393.2 L479.9 393.2" stroke="var(--vx-bad, #dc2626)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 393.2 L479.0 397.3 L479.0 389.0 Z" fill="var(--vx-bad, #dc2626)"/><text x="460.0" y="382.2" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><rect x="490.0" y="367.5" width="250.0" height="51.3" rx="12" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8"/><g transform="translate(615.0 393.2)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Hybrid sterility (postzygotic),</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">as with mules</text></g><path d="M230.0 415.1 L230.0 439.0" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 447.1 L225.9 438.1 L234.1 438.1 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="431.1" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="451.1" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 480.0)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are later generations of hybrids fertile and</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">fit?</text></g><path d="M430.0 480.0 L479.9 480.0" stroke="var(--vx-bad, #dc2626)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 480.0 L479.0 484.2 L479.0 475.9 Z" fill="var(--vx-bad, #dc2626)"/><text x="460.0" y="469.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><rect x="490.0" y="462.7" width="250.0" height="34.6" rx="12" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8"/><g transform="translate(615.0 480.0)"><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Hybrid breakdown (postzygotic)</text></g><path d="M230.0 511.0 L230.0 534.9" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 543.0 L225.9 534.0 L234.1 534.0 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="527.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="547.0" width="400.0" height="57.8" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 575.9)"><text x="230.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">No barrier: the groups are not reproductively</text><text x="230.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">isolated</text></g></svg>