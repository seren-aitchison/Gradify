<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 407.1" width="380.0" height="407.1" role="img" aria-label="Two sieve tube elements stacked end to end with a perforated sieve plate between them, each with a companion cell beside it containing a nucleus and mitochondria, joined to it by narrow channels." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><g data-part="sieve tube element"><title>sieve tube element: A living cell joined end to end with others; few organelles and no nucleus.</title><rect x="120" y="28" width="86" height="124" rx="6" fill="var(--vx-a2, #db2777)" fill-opacity=".1" stroke="var(--vx-a2, #db2777)" stroke-width="2.4"/></g><g data-part="companion cell"><title>companion cell: Has a nucleus and many mitochondria; it supports the sieve tube element and loads sucrose using ATP.</title><rect x="228" y="34" width="52" height="112" rx="14" fill="var(--vx-a4, #0d9488)" fill-opacity=".16" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/></g><g data-part="nucleus"><title>nucleus: Present in the companion cell, which runs the sieve tube element too; the sieve tube element has none.</title><circle cx="254" cy="68" r="13" fill="var(--vx-a5, #7c3aed)" fill-opacity=".5" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/></g><g data-part="mitochondria"><title>mitochondria: Many in the companion cell: they make the ATP that loads sucrose into the sieve tube.</title><ellipse cx="242" cy="110" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><ellipse cx="254" cy="118" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><ellipse cx="266" cy="110" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/></g><g data-part="plasmodesma"><title>plasmodesma: A channel through the wall linking a companion cell to its sieve tube element.</title><rect x="204" y="56" width="26" height="6" fill="var(--vx-a1, #4f46e5)" fill-opacity=".7"/><rect x="204" y="98" width="26" height="6" fill="var(--vx-a1, #4f46e5)" fill-opacity=".7"/></g><g data-part="sieve tube element"><title>sieve tube element: A living cell joined end to end with others; few organelles and no nucleus.</title><rect x="120" y="152" width="86" height="124" rx="6" fill="var(--vx-a2, #db2777)" fill-opacity=".1" stroke="var(--vx-a2, #db2777)" stroke-width="2.4"/></g><g data-part="companion cell"><title>companion cell: Has a nucleus and many mitochondria; it supports the sieve tube element and loads sucrose using ATP.</title><rect x="228" y="158" width="52" height="112" rx="14" fill="var(--vx-a4, #0d9488)" fill-opacity=".16" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/></g><g data-part="nucleus"><title>nucleus: Present in the companion cell, which runs the sieve tube element too; the sieve tube element has none.</title><circle cx="254" cy="192" r="13" fill="var(--vx-a5, #7c3aed)" fill-opacity=".5" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/></g><g data-part="mitochondria"><title>mitochondria: Many in the companion cell: they make the ATP that loads sucrose into the sieve tube.</title><ellipse cx="242" cy="234" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><ellipse cx="254" cy="242" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><ellipse cx="266" cy="234" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/></g><g data-part="plasmodesma"><title>plasmodesma: A channel through the wall linking a companion cell to its sieve tube element.</title><rect x="204" y="180" width="26" height="6" fill="var(--vx-a1, #4f46e5)" fill-opacity=".7"/><rect x="204" y="222" width="26" height="6" fill="var(--vx-a1, #4f46e5)" fill-opacity=".7"/></g><g data-part="sieve plate"><title>sieve plate: A perforated cross-wall between sieve tube elements that lets sap pass.</title><rect x="118" y="148" width="90" height="8" rx="2" fill="var(--vx-a3, #ea580c)" fill-opacity=".7"/><circle cx="130" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/><circle cx="144" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/><circle cx="158" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/><circle cx="172" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/><circle cx="186" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/><circle cx="200" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/></g></g><circle cx="147.1" cy="68.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="147.1" y="68.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1</text><circle cx="116.3" cy="138.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="116.3" y="138.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2</text><circle cx="241.4" cy="93.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="241.4" y="94.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3</text><circle cx="196.0" cy="60.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="196.0" y="60.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4</text><circle cx="227.7" cy="66.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="227.7" y="66.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5</text><circle cx="227.7" cy="104.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="227.7" y="104.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6</text><text x="14.0" y="287.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1  sieve tube element</text><text x="14.0" y="306.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2  sieve plate</text><text x="14.0" y="325.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3  companion cell</text><text x="14.0" y="344.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4  plasmodesma</text><text x="14.0" y="363.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5  nucleus</text><text x="14.0" y="382.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6  mitochondria</text></svg>