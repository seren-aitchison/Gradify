<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 248.0" width="700.0" height="248.0" role="img" aria-label="A two by two grid. Existing products in existing markets: market penetration. New products in existing markets: product development. Existing products in new markets: market development. New products in new markets: diversification." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="265.0" y="24.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Existing products</text><text x="551.0" y="24.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">New products</text><text x="114.0" y="76.2" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Existing</text><text x="114.0" y="91.8" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">markets</text><rect x="122.0" y="38.0" width="280.0" height="86.0" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-opacity=".5" stroke-width="1.3"/><text x="131.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Market penetration</text><text x="131.0" y="70.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">lowest risk</text><text x="131.0" y="89.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• referral scheme and off-peak pricing</text><rect x="408.0" y="38.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".5" stroke-width="1.3"/><text x="417.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Product development</text><text x="417.0" y="75.3" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• online classes for members</text><text x="114.0" y="176.0" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">New markets</text><rect x="122.0" y="130.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".5" stroke-width="1.3"/><text x="131.0" y="147.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Market development</text><text x="131.0" y="167.3" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• gyms in Ireland</text><rect x="408.0" y="130.0" width="280.0" height="86.0" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-opacity=".5" stroke-width="1.3"/><text x="417.0" y="147.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Diversification</text><text x="417.0" y="162.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">highest risk</text><text x="417.0" y="181.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• protein snacks for supermarkets</text><text x="408.0" y="234.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">products →</text><g transform="translate(14 130.0) rotate(-90)"><text x="0.0" y="0.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">markets →</text></g></svg>