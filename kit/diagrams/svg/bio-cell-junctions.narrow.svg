<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 445.1" width="380.0" height="445.1" role="img" aria-label="Four panels, each with two neighbouring cells. Tight junction: the membranes meet at the top and a dashed arrow trying to pass between the cells is blocked. Desmosome: dense plates inside each cell joined across the gap by cadherin lines, with filaments running into each cell. Gap junction: a channel through both membranes joining the cytoplasm of the two cells. Plasmodesma: two plant cells with walls and a middle lamella joined by a membrane-lined channel." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><g transform="translate(10 8)"><text x="6.0" y="12.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">tight junction</text><rect x="6" y="26" width="82" height="108" fill="var(--vx-a4, #0d9488)" fill-opacity=".1"/><rect x="112" y="26" width="82" height="108" fill="var(--vx-a4, #0d9488)" fill-opacity=".1"/><path d="M6 26 H88 M6 134 H88 M6 26 V134 M112 26 H194 M112 134 H194 M194 26 V134" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><path d="M88 26 V134" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><path d="M112 26 V134" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><g data-part="claudin and occludin"><title>claudin and occludin: Rows of claudin and occludin proteins stitch the membranes of neighbouring cells together and seal the gap: nothing leaks between the cells, so it must pass through them and their transporters (gut lining, blood–brain barrier).</title><rect x="88" y="26" width="24" height="16" fill="var(--vx-a2, #db2777)" fill-opacity=".75" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><circle cx="94" cy="34" r="3" fill="var(--vx-ink, #151826)"/><circle cx="106" cy="34" r="3" fill="var(--vx-ink, #151826)"/></g><path d="M100 8 V24" stroke="var(--vx-bad, #dc2626)" stroke-width="2" stroke-dasharray="3 3"/><path d="M93 20 l14 -10 M93 10 l14 10" stroke="var(--vx-bad, #dc2626)" stroke-width="2"/></g><g transform="translate(215 8)"><text x="6.0" y="12.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">desmosome</text><rect x="6" y="26" width="82" height="108" fill="var(--vx-a4, #0d9488)" fill-opacity=".1"/><rect x="112" y="26" width="82" height="108" fill="var(--vx-a4, #0d9488)" fill-opacity=".1"/><path d="M6 26 H88 M6 134 H88 M6 26 V134 M112 26 H194 M112 134 H194 M194 26 V134" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><path d="M88 26 V134" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><path d="M112 26 V134" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><g data-part="cadherin"><title>cadherin: Cadherin proteins reach across the gap and join the two cells.</title><path d="M88 68 H112" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.2"/><circle cx="100" cy="68" r="2.2" fill="var(--vx-a5, #7c3aed)"/><path d="M88 80 H112" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.2"/><circle cx="100" cy="80" r="2.2" fill="var(--vx-a5, #7c3aed)"/><path d="M88 92 H112" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.2"/><circle cx="100" cy="92" r="2.2" fill="var(--vx-a5, #7c3aed)"/></g><g data-part="plaque"><title>plaque: A dense plate inside each cell that anchors the cadherins to the filaments.</title><rect x="76" y="58" width="12" height="44" rx="3" fill="var(--vx-a3, #ea580c)" fill-opacity=".8" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><rect x="112" y="58" width="12" height="44" rx="3" fill="var(--vx-a3, #ea580c)" fill-opacity=".8" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/></g><g data-part="intermediate filament"><title>intermediate filament: A cytoskeleton filament that spreads the pulling force through the cell.</title><path d="M76 68 Q40 52 16 76" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><path d="M76 80 Q44 80 20 100" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><path d="M76 92 Q40 108 16 120" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><path d="M124 68 Q160 52 184 76" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><path d="M124 80 Q156 80 180 100" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><path d="M124 92 Q160 108 184 120" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="2"/></g></g><g transform="translate(10 153)"><text x="6.0" y="12.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">gap junction</text><rect x="6" y="26" width="82" height="108" fill="var(--vx-a4, #0d9488)" fill-opacity=".1"/><rect x="112" y="26" width="82" height="108" fill="var(--vx-a4, #0d9488)" fill-opacity=".1"/><path d="M6 26 H88 M6 134 H88 M6 26 V134 M112 26 H194 M112 134 H194 M194 26 V134" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><path d="M88 26 V62 M88 84 V134" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><path d="M112 26 V62 M112 84 V134" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><rect x="88" y="62" width="24" height="22" fill="var(--vx-a4, #0d9488)" fill-opacity=".1"/><g data-part="connexin channel"><title>connexin channel: A channel of connexin proteins through both membranes, joining the cytoplasm of the two cells: ions and small molecules (up to about 1 kDa) pass.</title><rect x="82" y="54" width="36" height="9" rx="2" fill="var(--vx-a1, #4f46e5)" fill-opacity=".8" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.4"/><rect x="82" y="83" width="36" height="9" rx="2" fill="var(--vx-a1, #4f46e5)" fill-opacity=".8" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.4"/><circle cx="76" cy="73" r="2.6" fill="var(--vx-a2, #db2777)"/><circle cx="100" cy="73" r="2.6" fill="var(--vx-a2, #db2777)"/><circle cx="124" cy="73" r="2.6" fill="var(--vx-a2, #db2777)"/></g></g><g transform="translate(215 153)"><text x="6.0" y="12.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">plasmodesma</text><rect x="6" y="26" width="74" height="108" fill="var(--vx-good, #16a34a)" fill-opacity=".12"/><rect x="114" y="26" width="80" height="108" fill="var(--vx-good, #16a34a)" fill-opacity=".12"/><g data-part="cell wall"><title>cell wall: The cellulose wall of each plant cell.</title><rect x="80" y="26" width="14" height="36" fill="var(--vx-a3, #ea580c)" fill-opacity=".4" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><rect x="100" y="26" width="14" height="36" fill="var(--vx-a3, #ea580c)" fill-opacity=".4" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><rect x="80" y="84" width="14" height="50" fill="var(--vx-a3, #ea580c)" fill-opacity=".4" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><rect x="100" y="84" width="14" height="50" fill="var(--vx-a3, #ea580c)" fill-opacity=".4" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/></g><g data-part="middle lamella"><title>middle lamella: The layer that holds neighbouring plant cells together.</title><rect x="94" y="26" width="6" height="36" fill="var(--vx-a2, #db2777)" fill-opacity=".6"/><rect x="94" y="84" width="6" height="50" fill="var(--vx-a2, #db2777)" fill-opacity=".6"/></g><rect x="80" y="62" width="34" height="22" fill="var(--vx-good, #16a34a)" fill-opacity=".12"/><g data-part="plasmodesma"><title>plasmodesma: A channel through the walls of neighbouring plant cells, lined with plasma membrane, so the cytoplasm is continuous.</title><path d="M80 62 H114 M80 84 H114" stroke="var(--vx-good, #16a34a)" stroke-width="2.6"/></g><path d="M80 62 V26 H6 V134 H80 V84 M114 62 V26 H194 V134 H114 V84" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="2.4"/></g></g><circle cx="104.3" cy="44.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="104.3" y="44.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1</text><circle cx="280.0" cy="83.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="280.0" y="83.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2</text><circle cx="295.4" cy="66.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="295.4" y="66.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3</text><circle cx="331.4" cy="62.9" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="331.4" y="63.4" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4</text><circle cx="104.3" cy="188.9" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="104.3" y="189.4" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5</text><circle cx="277.4" cy="201.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="277.4" y="202.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6</text><circle cx="268.9" cy="173.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="268.9" y="173.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7</text><circle cx="277.4" cy="233.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="277.4" y="233.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8</text><text x="14.0" y="287.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1  claudin and occludin</text><text x="14.0" y="306.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2  cadherin</text><text x="14.0" y="325.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3  plaque</text><text x="14.0" y="344.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4  intermediate filament</text><text x="14.0" y="363.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5  connexin channel</text><text x="14.0" y="382.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6  plasmodesma</text><text x="14.0" y="401.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7  cell wall</text><text x="14.0" y="420.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8  middle lamella</text></svg>