<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 287.9" width="380.0" height="287.9" role="img" aria-label="Four boxes: power culture (a spider's web), role culture (a Greek temple), task culture (a net), person culture (barristers' chambers)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="12.0" width="364.0" height="63.3" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="27.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Power culture</text><text x="17.0" y="47.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Spider's web: a central figure controls. Fast, but depends</text><text x="17.0" y="60.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">on one person.</text><rect x="8.0" y="83.3" width="364.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="98.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Role culture</text><text x="17.0" y="118.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Greek temple: rules and procedures. Stable but slow.</text><rect x="8.0" y="141.4" width="364.0" height="63.3" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="156.9" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Task culture</text><text x="17.0" y="176.9" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Net: teams form around projects. Flexible and expert-led;</text><text x="17.0" y="190.1" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">costly.</text><rect x="8.0" y="212.6" width="364.0" height="63.3" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="228.1" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Person culture</text><text x="17.0" y="248.2" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">The organisation serves individuals, as in barristers'</text><text x="17.0" y="261.3" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">chambers.</text></svg>