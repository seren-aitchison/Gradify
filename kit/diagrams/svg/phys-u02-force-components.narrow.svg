<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 376.0" width="380.0" height="376.0" role="img" aria-label="A 50 newton force arrow at 30 degrees above the horizontal with its horizontal component of 43.3 newtons and vertical component of 25 newtons dashed." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Resolving the 50 N force</text><circle cx="50.6" cy="246.5" r="4" fill="var(--vx-ink, #151826)"/><path d="M50.6 246.5 L320.8 90.5" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M329.4 85.5 L322.4 95.4 L317.3 86.6 Z" fill="var(--vx-a1, #4f46e5)"/><path d="M50.6 246.5 L322.2 246.5" stroke="var(--vx-soft, #5b6275)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" fill="none"/><path d="M329.4 246.5 L321.4 250.2 L321.4 242.8 Z" fill="var(--vx-soft, #5b6275)"/><path d="M329.4 246.5 L329.4 92.7" stroke="var(--vx-soft, #5b6275)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" fill="none"/><path d="M329.4 85.5 L333.1 93.5 L325.7 93.5 Z" fill="var(--vx-soft, #5b6275)"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="182.0" y="152.1" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">F</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="190.0" y="230.5" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">43.3 N</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="282.1" y="166.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">25 N</text><text x="16.0" y="322.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">F = 50 N at 30° above horizontal</text><text x="16.0" y="344.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">W = F cos θ × d = 43.3 × 4.0 = 173 J</text></svg>