<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 407.1" width="380.0" height="407.1" role="img" aria-label="Two rows of nucleosomes on DNA. The upper row is spread out, the histone tails carry acetyl groups and RNA polymerase sits on the promoter. The lower row is packed tightly, the DNA near the promoter carries methyl groups, and RNA polymerase is crossed out." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><text x="210.0" y="18.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">active gene: acetylated histone tails</text><text x="210.0" y="168.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">silenced gene: methylated DNA, tight chromatin</text><path d="M24 104 H324" stroke="var(--vx-ink, #151826)" stroke-width="3" stroke-opacity=".7"/><g data-part="nucleosome"><title>nucleosome: DNA wound round a core of eight histone proteins.</title><circle cx="57" cy="80" r="17" fill="var(--vx-a4, #0d9488)" fill-opacity=".28" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><circle cx="57" cy="80" r="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".4"/></g><g data-part="nucleosome"><title>nucleosome: DNA wound round a core of eight histone proteins.</title><circle cx="109" cy="80" r="17" fill="var(--vx-a4, #0d9488)" fill-opacity=".28" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><circle cx="109" cy="80" r="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".4"/></g><g data-part="nucleosome"><title>nucleosome: DNA wound round a core of eight histone proteins.</title><circle cx="161" cy="80" r="17" fill="var(--vx-a4, #0d9488)" fill-opacity=".28" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><circle cx="161" cy="80" r="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".4"/></g><g data-part="nucleosome"><title>nucleosome: DNA wound round a core of eight histone proteins.</title><circle cx="213" cy="80" r="17" fill="var(--vx-a4, #0d9488)" fill-opacity=".28" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><circle cx="213" cy="80" r="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".4"/></g><g data-part="nucleosome"><title>nucleosome: DNA wound round a core of eight histone proteins.</title><circle cx="265" cy="80" r="17" fill="var(--vx-a4, #0d9488)" fill-opacity=".28" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><circle cx="265" cy="80" r="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".4"/></g><g data-part="histone tail"><title>histone tail: A protein tail sticking out of the nucleosome, where chemical groups can be added.</title><path d="M49 65 q-8 -14 -2 -24 M65 65 q8 -14 2 -24" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><path d="M101 65 q-8 -14 -2 -24 M117 65 q8 -14 2 -24" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><path d="M153 65 q-8 -14 -2 -24 M169 65 q8 -14 2 -24" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><path d="M205 65 q-8 -14 -2 -24 M221 65 q8 -14 2 -24" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><path d="M257 65 q-8 -14 -2 -24 M273 65 q8 -14 2 -24" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/></g><g data-part="acetyl group"><title>acetyl group: Histone acetylation loosens the chromatin, which usually activates genes.</title><circle cx="45" cy="39" r="5.2" fill="var(--vx-a2, #db2777)" stroke="var(--vx-a2, #db2777)"/><circle cx="69" cy="39" r="5.2" fill="var(--vx-a2, #db2777)" stroke="var(--vx-a2, #db2777)"/><circle cx="97" cy="39" r="5.2" fill="var(--vx-a2, #db2777)" stroke="var(--vx-a2, #db2777)"/><circle cx="121" cy="39" r="5.2" fill="var(--vx-a2, #db2777)" stroke="var(--vx-a2, #db2777)"/><circle cx="149" cy="39" r="5.2" fill="var(--vx-a2, #db2777)" stroke="var(--vx-a2, #db2777)"/><circle cx="173" cy="39" r="5.2" fill="var(--vx-a2, #db2777)" stroke="var(--vx-a2, #db2777)"/><circle cx="201" cy="39" r="5.2" fill="var(--vx-a2, #db2777)" stroke="var(--vx-a2, #db2777)"/><circle cx="225" cy="39" r="5.2" fill="var(--vx-a2, #db2777)" stroke="var(--vx-a2, #db2777)"/><circle cx="253" cy="39" r="5.2" fill="var(--vx-a2, #db2777)" stroke="var(--vx-a2, #db2777)"/><circle cx="277" cy="39" r="5.2" fill="var(--vx-a2, #db2777)" stroke="var(--vx-a2, #db2777)"/></g><g data-part="promoter"><title>promoter: The DNA sequence where transcription starts.</title><rect x="306" y="100" width="34" height="9" fill="var(--vx-good, #16a34a)" fill-opacity=".7" stroke="var(--vx-good, #16a34a)" stroke-width="1.4"/></g><g data-part="RNA polymerase"><title>RNA polymerase: The enzyme that transcribes the gene: it can reach the promoter only if the chromatin is open.</title><ellipse cx="323" cy="86" rx="18" ry="12" fill="var(--vx-a1, #4f46e5)" fill-opacity=".6" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/></g><path d="M24 254 H244" stroke="var(--vx-ink, #151826)" stroke-width="3" stroke-opacity=".7"/><g data-part="nucleosome"><title>nucleosome: DNA wound round a core of eight histone proteins.</title><circle cx="57" cy="230" r="17" fill="var(--vx-a4, #0d9488)" fill-opacity=".28" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><circle cx="57" cy="230" r="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".4"/></g><g data-part="nucleosome"><title>nucleosome: DNA wound round a core of eight histone proteins.</title><circle cx="93" cy="230" r="17" fill="var(--vx-a4, #0d9488)" fill-opacity=".28" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><circle cx="93" cy="230" r="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".4"/></g><g data-part="nucleosome"><title>nucleosome: DNA wound round a core of eight histone proteins.</title><circle cx="129" cy="230" r="17" fill="var(--vx-a4, #0d9488)" fill-opacity=".28" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><circle cx="129" cy="230" r="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".4"/></g><g data-part="nucleosome"><title>nucleosome: DNA wound round a core of eight histone proteins.</title><circle cx="165" cy="230" r="17" fill="var(--vx-a4, #0d9488)" fill-opacity=".28" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><circle cx="165" cy="230" r="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".4"/></g><g data-part="nucleosome"><title>nucleosome: DNA wound round a core of eight histone proteins.</title><circle cx="201" cy="230" r="17" fill="var(--vx-a4, #0d9488)" fill-opacity=".28" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><circle cx="201" cy="230" r="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".4"/></g><g data-part="histone tail"><title>histone tail: A protein tail sticking out of the nucleosome, where chemical groups can be added.</title><path d="M49 215 q-8 -14 -2 -24 M65 215 q8 -14 2 -24" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><path d="M85 215 q-8 -14 -2 -24 M101 215 q8 -14 2 -24" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><path d="M121 215 q-8 -14 -2 -24 M137 215 q8 -14 2 -24" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><path d="M157 215 q-8 -14 -2 -24 M173 215 q8 -14 2 -24" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><path d="M193 215 q-8 -14 -2 -24 M209 215 q8 -14 2 -24" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/></g><g data-part="methyl group"><title>methyl group: Methyl groups on cytosine, often near a promoter, usually silence the gene.</title><circle cx="150" cy="263" r="4.4" fill="var(--vx-a5, #7c3aed)"/><path d="M150 258.6 V254" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><circle cx="164" cy="263" r="4.4" fill="var(--vx-a5, #7c3aed)"/><path d="M164 258.6 V254" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><circle cx="178" cy="263" r="4.4" fill="var(--vx-a5, #7c3aed)"/><path d="M178 258.6 V254" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><circle cx="192" cy="263" r="4.4" fill="var(--vx-a5, #7c3aed)"/><path d="M192 258.6 V254" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/></g><g data-part="promote