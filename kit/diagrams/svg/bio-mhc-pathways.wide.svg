<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 228.3" width="760.0" height="228.3" role="img" aria-label="A flow chart: a protein made inside the cell goes by the proteasome to MHC class I and cytotoxic CD8 T cells; a protein taken in from outside goes by endosomes to MHC class II and helper CD4 T cells." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="30.0" y="33.4" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 62.3)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Was the protein made inside the cell, as a</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">viral protein is?</text></g><path d="M430.0 62.3 L479.9 62.3" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 62.3 L479.0 66.4 L479.0 58.1 Z" fill="var(--vx-good, #16a34a)"/><text x="460.0" y="51.3" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no</text><rect x="490.0" y="20.0" width="250.0" height="84.6" rx="12" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8"/><g transform="translate(615.0 62.3)"><text x="0.0" y="-25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">MHC class II: endosomes break</text><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">down the protein, and the</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">peptides are shown to helper</text><text x="0.0" y="25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">CD4⁺ T cells</text></g><path d="M230.0 96.6 L230.0 120.5" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 128.6 L225.9 119.6 L234.1 119.6 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="112.6" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="132.6" width="400.0" height="75.8" rx="14" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="2"/><g transform="translate(0 170.4)"><text x="230.0" y="-17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">MHC class I: the proteasome makes peptides,</text><text x="230.0" y="0.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">which are shown to cytotoxic CD8⁺ T cells that</text><text x="230.0" y="17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">kill the infected cell</text></g></svg>