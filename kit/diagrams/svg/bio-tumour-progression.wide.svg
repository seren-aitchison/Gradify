<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 222.0" width="700.0" height="222.0" role="img" aria-label="Five boxes in order: a mutated cell, a benign tumour, a malignant tumour, blood supply by angiogenesis, and metastasis." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M200.7 56.0 L264.5 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M272.6 56.0 L263.6 60.1 L263.6 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M427.4 56.0 L489.6 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M497.7 56.0 L488.7 60.1 L488.7 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M498.2 96.8 L422.1 136.5" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M414.9 140.2 L421.0 132.4 L424.8 139.7 Z" fill="var(--vx-ink, #151826)"/><path d="M271.0 174.0 L205.5 174.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M197.4 174.0 L206.4 169.9 L206.4 178.1 Z" fill="var(--vx-ink, #151826)"/><rect x="51.0" y="17.0" width="144.7" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="123.3" y="33.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">a mutated cell</text><text x="123.3" y="50.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">mutations</text><text x="123.3" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">accumulate in one</text><text x="123.3" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">lineage over years</text><rect x="277.6" y="17.0" width="144.7" height="78.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="350.0" y="33.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">benign tumour</text><text x="350.0" y="50.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">grows slowly,</text><text x="350.0" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">enclosed, does not</text><text x="350.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">invade</text><rect x="502.7" y="8.5" width="148.0" height="95.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="576.7" y="24.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">malignant</text><text x="576.7" y="41.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">tumour</text><text x="576.7" y="58.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">grows faster and</text><text x="576.7" y="73.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">invades surrounding</text><text x="576.7" y="88.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">tissue</text><rect x="276.0" y="142.5" width="148.0" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="350.0" y="158.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">blood supply</text><text x="350.0" y="175.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">angiogenesis beyond</text><text x="350.0" y="190.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">about 1–2 mm</text><rect x="54.3" y="135.0" width="138.0" height="78.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="123.3" y="151.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">metastasis</text><text x="123.3" y="168.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cells enter blood</text><text x="123.3" y="183.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">or lymph and form</text><text x="123.3" y="198.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">secondary tumours</text></svg>