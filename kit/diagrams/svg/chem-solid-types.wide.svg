<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 390.0" width="700.0" height="390.0" role="img" aria-label="A tree: contains a metal and a non-metal? Ionic. Only metal? Metallic. Otherwise: one giant network of covalent bonds? Giant covalent; if not, simple molecular." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M243.8 63.0 C243.8 87.0 95.0 96.0 95.0 120.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M95.0 118.0 L95.0 121.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M95.0 129.0 L91.3 121.0 L98.7 121.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="161.4" y="92.5" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M243.8 63.0 C243.8 87.0 392.5 96.0 392.5 120.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M392.5 118.0 L392.5 121.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M392.5 129.0 L388.8 121.0 L396.2 121.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="326.1" y="92.5" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><path d="M392.5 163.0 C392.5 187.0 265.0 196.0 265.0 220.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M265.0 218.0 L265.0 221.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M265.0 229.0 L261.3 221.0 L268.7 221.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="320.8" y="192.5" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M392.5 163.0 C392.5 187.0 520.0 196.0 520.0 220.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M520.0 218.0 L520.0 221.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M520.0 229.0 L516.3 221.0 L523.7 221.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="464.3" y="192.5" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><path d="M520.0 280.0 C520.0 304.0 435.0 296.0 435.0 320.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M435.0 318.0 L435.0 321.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M435.0 329.0 L431.3 321.0 L438.7 321.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="469.5" y="301.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M520.0 280.0 C520.0 304.0 605.0 296.0 605.0 320.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M605.0 318.0 L605.0 321.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M605.0 329.0 L601.3 321.0 L608.7 321.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="570.5" y="301.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><rect x="113.8" y="30.0" width="260.0" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="243.8" y="46.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Metal and non-metal together?</text><rect x="16.0" y="130.0" width="158.0" height="48.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="95.0" y="146.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Ionic lattice</text><text x="95.0" y="163.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. NaCl, MgO</text><rect x="262.5" y="130.0" width="260.0" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="392.5" y="146.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Metal atoms only?</text><rect x="186.0" y="230.0" width="158.0" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="265.0" y="246.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Metallic lattice</text><text x="265.0" y="263.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. Cu, Fe</text><rect x="390.0" y="230.0" width="260.0" height="50.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="520.0" y="246.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">One continuous network of covalent</text><text x="520.0" y="263.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">bonds?</text><rect x="356.0" y="330.0" width="158.0" height="48.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.1" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="435.0" y="346.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Giant covalent</text><text x="435.0" y="363.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. C, SiO<tspan baseline-shift="sub" font-size="8.3">2</tspan></text><rect x="526.0" y="330.0" width="158.0" height="48.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="605.0" y="346.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Simple molecular</text><text x="605.0" y="363.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. H<tspan baseline-shift="sub" font-size="8.3">2</tspan>O, I<tspan baseline-shift="sub" font-size="8.3">2</tspan>, CO<tspan baseline-shift="sub" font-size="8.3">2</tspan></text></svg>