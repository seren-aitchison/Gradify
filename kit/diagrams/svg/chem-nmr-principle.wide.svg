ound" paint-order="stroke">α (aligned)</text><text x="512.4" y="50.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">β (opposed)</text><text x="429.2" y="135.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">radio waves, ΔE ∝ B<tspan baseline-shift="sub" font-size="8.3">0</tspan></text><text x="423.2" y="24.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">in field B<tspan baseline-shift="sub" font-size="8.3">0</tspan></text></svg>