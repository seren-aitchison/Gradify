<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 341.0" width="380.0" height="341.0" role="img" aria-label="A column of silica with air pressure applied at the top; bands of three compounds separating, the least polar lowest." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(3.2 0) scale(0.812)"><path d="M200 40 v250 l20 30 v30 h20 v-30 l20 -30 v-250" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/><rect x="202" y="90" width="56" height="198" fill="#f1efe6"/><rect x="202" y="60" width="56" height="30" fill="#dbeafe" fill-opacity=".8"/><rect x="202" y="114.0" width="56" height="14" fill="var(--vx-a2, #db2777)" fill-opacity=".85"/><path d="M258.0 121.0 L300.0 121.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="304.0" y="121.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">most polar</text><rect x="202" y="177.0" width="56" height="14" fill="var(--vx-a4, #0d9488)" fill-opacity=".85"/><path d="M258.0 184.0 L300.0 184.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="304.0" y="184.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">medium</text><rect x="202" y="240.0" width="56" height="14" fill="var(--vx-a1, #4f46e5)" fill-opacity=".85"/><path d="M258.0 247.0 L300.0 247.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="304.0" y="247.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">least polar</text><text x="30.0" y="75.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">eluent added at the top</text><text x="30.0" y="190.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">silica (polar)</text><path d="M230.0 4.0 L230.0 26.8" stroke="var(--vx-a1, #4f46e5)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M230.0 34.0 L226.3 26.0 L233.7 26.0 Z" fill="var(--vx-a1, #4f46e5)"/><text x="240.0" y="16.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">air pressure</text><path d="M206 368 h48 v40 h-48 Z" fill="var(--vx-a1, #4f46e5)" fill-opacity=".35" stroke="var(--vx-ink, #151826)" stroke-width="1.8"/><text x="262.0" y="392.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">first to elute: least polar</text></g></svg>