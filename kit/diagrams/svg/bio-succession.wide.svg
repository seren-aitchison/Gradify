<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 228.0" width="700.0" height="228.0" role="img" aria-label="Five boxes in order: bare rock or sand, pioneer species, grasses and small plants, shrubs, and the climax community." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M187.1 56.0 L264.5 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M272.6 56.0 L263.6 60.1 L263.6 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M427.4 56.0 L487.6 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M495.7 56.0 L486.7 60.1 L486.7 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M496.3 100.0 L419.1 142.2" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M412.0 146.1 L417.9 138.1 L421.8 145.4 Z" fill="var(--vx-ink, #151826)"/><path d="M269.0 180.0 L210.8 180.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M202.7 180.0 L211.7 175.9 L211.7 184.1 Z" fill="var(--vx-ink, #151826)"/><rect x="64.5" y="23.5" width="117.6" height="65.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="123.3" y="39.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">bare rock or</text><text x="123.3" y="56.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">sand</text><text x="123.3" y="73.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">no soil</text><rect x="277.6" y="17.0" width="144.7" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="350.0" y="33.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">pioneer species</text><text x="350.0" y="50.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">lichens and mosses</text><text x="350.0" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">colonise and begin</text><text x="350.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">to form soil</text><rect x="500.7" y="8.5" width="152.0" height="95.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="576.7" y="24.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">grasses and</text><text x="576.7" y="41.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">small plants</text><text x="576.7" y="58.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">soil deepens and</text><text x="576.7" y="73.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">holds more water and</text><text x="576.7" y="88.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">nutrients</text><rect x="274.0" y="148.5" width="152.0" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="350.0" y="164.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">shrubs</text><text x="350.0" y="181.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">more shade and soil:</text><text x="350.0" y="196.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">more species arrive</text><rect x="48.9" y="148.5" width="148.8" height="63.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="123.3" y="164.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">climax community</text><text x="123.3" y="181.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">stable woodland in</text><text x="123.3" y="196.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the UK</text></svg>