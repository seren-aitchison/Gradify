<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 270.0" width="380.0" height="270.0" role="img" aria-label="Energy flow: 1.0 kW of electricity plus 7.8 kW of heat from outdoors give 8.8 kW of heat to the radiators; COP 8.8." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">A heat pump at its Carnot limit</text><rect x="14.0" y="64.0" width="115.2" height="92.0" fill="var(--vx-a1, #4f46e5)" fill-opacity=".85"/><text x="14.0" y="36.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">electrical work W: 1 kW</text><text x="14.0" y="54.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">heat from outdoors Q<tspan baseline-shift="sub" font-size="9.0">c</tspan>: 7.8 kW</text><path d="M129.2 64.0 H346.0 l20 46.0 l-20 46.0 H129.2 Z" fill="var(--vx-good, #16a34a)" fill-opacity=".8"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="366.0" y="54.0" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">heat to radiators Q<tspan baseline-shift="sub" font-size="9.0">h</tspan>: 8.8 kW</text></svg>