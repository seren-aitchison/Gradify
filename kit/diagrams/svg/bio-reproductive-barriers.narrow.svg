.2 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 284.6)" x="332.0" y="284.6" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="346.2" width="340.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 366.2)"><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Can their sperm and eggs fuse?</text></g><path d="M30.0 386.2 L30.0 414.2" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 414.2 L34.7 414.2" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 414.2 L34.0 417.4 L34.0 410.9 Z" fill="var(--vx-a3, #ea580c)"/><rect x="42.0" y="398.2" width="270.0" height="46.6" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="177.0" y="412.2" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><g transform="translate(0 437.5)"><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Gametic isolation (prezygotic)</text></g><path d="M338.0 388.2 L338.0 462.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 470.8 L333.9 461.8 L342.1 461.8 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 421.5)" x="332.0" y="421.5" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="474.8" width="340.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 503.7)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Does the hybrid zygote develop and</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">survive?</text></g><path d="M30.0 532.6 L30.0 560.6" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 560.6 L34.7 560.6" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 560.6 L34.0 563.9 L34.0 557.4 Z" fill="var(--vx-bad, #dc2626)"/><rect x="42.0" y="544.6" width="270.0" height="46.6" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.6"/><text x="177.0" y="558.6" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><g transform="translate(0 584.0)"><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Hybrid inviability (postzygotic)</text></g><path d="M338.0 534.6 L338.0 609.2" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 617.3 L333.9 608.3 L342.1 608.3 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 568.0)" x="332.0" y="568.0" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="621.3" width="340.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 641.2)"><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is the hybrid fertile?</text></g><path d="M30.0 661.2 L30.0 689.2" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d=