<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 990.8" width="380.0" height="990.8" role="img" aria-label="A flow chart of questions from meeting and mating to hybrid fertility, each 'no' leading to a barrier: habitat or temporal, behavioural or mechanical, gametic, hybrid inviability, hybrid sterility or hybrid breakdown." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 48.9)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Do the groups meet in the same</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">habitat and breed at the same time?</text></g><path d="M30.0 77.8 L30.0 105.8" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 105.8 L34.7 105.8" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 105.8 L34.0 109.1 L34.0 102.6 Z" fill="var(--vx-a3, #ea580c)"/><rect x="42.0" y="89.8" width="270.0" height="63.3" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="177.0" y="103.8" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><g transform="translate(0 137.5)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Habitat or temporal isolation</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">(prezygotic)</text></g><path d="M338.0 79.8 L338.0 171.0" stroke="var(--vx-good, #16a34a)" s