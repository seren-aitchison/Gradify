<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620.0 272.0" width="620.0" height="272.0" role="img" aria-label="Four nested rounded boxes: ℕ inside ℤ inside ℚ inside ℝ. √9 is in ℕ; −3 in ℤ only; 0.75 in ℚ only; √10 and π in ℝ only." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="10.0" y="12.0" width="600.0" height="248.0" rx="18" fill="var(--vx-a2, #db2777)" fill-opacity="0.06" stroke="var(--vx-a2, #db2777)" stroke-width="2"/><text x="24.0" y="32.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">ℝ real</text><text x="97.6" y="32.0" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">√10</text><text x="145.6" y="32.0" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">π</text><rect x="36.0" y="62.0" width="548.0" height="186.0" rx="18" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.06" stroke="var(--vx-a5, #7c3aed)" stroke-width="2"/><text x="50.0" y="82.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">ℚ rational</text><text x="158.0" y="82.0" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">0.75</text><rect x="62.0" y="112.0" width="496.0" height="124.0" rx="18" fill="var(--vx-a4, #0d9488)" fill-opacity="0.06" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/><text x="76.0" y="132.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">ℤ integers</text><text x="184.0" y="132.0" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">−3</text><rect x="88.0" y="162.0" width="444.0" height="62.0" rx="18" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.06" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><text x="102.0" y="182.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">ℕ natural</text><text x="310.0" y="212.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">√9 = 3</text></svg>