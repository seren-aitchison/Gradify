<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 141.3" width="700.0" height="141.3" role="img" aria-label="Four boxes in order: valuable, rare, inimitable, organised, each with what failing it means, ending in sustained competitive advantage." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="14.0" width="156.0" height="67.0" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="86.0" y="30.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Valuable?</text><text x="86.0" y="51.4" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">if not: competitive</text><text x="86.0" y="65.8" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">disadvantage</text><rect x="184.0" y="14.0" width="156.0" height="67.0" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="262.0" y="30.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Rare?</text><text x="262.0" y="51.4" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">if not: competitive</text><text x="262.0" y="65.8" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">parity</text><rect x="360.0" y="14.0" width="156.0" height="67.0" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="438.0" y="30.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Inimitable?</text><text x="438.0" y="51.4" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">if not: temporary</text><text x="438.0" y="65.8" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">advantage</text><rect x="536.0" y="14.0" width="156.0" height="67.0" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="614.0" y="37.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Organised?</text><text x="614.0" y="58.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">if yes: exploited</text><path d="M166.0 47.5 L174.8 47.5" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M182.0 47.5 L174.0 51.2 L174.0 43.8 Z" fill="var(--vx-line, #8a92a8)"/><path d="M342.0 47.5 L350.8 47.5" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M358.0 47.5 L350.0 51.2 L350.0 43.8 Z" fill="var(--vx-line, #8a92a8)"/><path d="M518.0 47.5 L526.8 47.5" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M534.0 47.5 L526.0 51.2 L526.0 43.8 Z" fill="var(--vx-line, #8a92a8)"/><rect x="8.0" y="97.0" width="684.0" height="32.3" rx="9" fill="var(--vx-good, #16a34a)" fill-opacity="0.14" stroke="var(--vx-good, #16a34a)" stroke-opacity=".55" stroke-width="1.3"/><text x="350.0" y="113.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Yes to all four: sustained competitive advantage</text></svg>