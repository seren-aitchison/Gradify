<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 344.0" width="380.0" height="344.0" role="img" aria-label="A four-level pyramid on a log scale: producers 10,000, primary consumers 1,000, secondary consumers 100 and tertiary consumers 10 kilojoules per square metre per year, each level a tenth of the one below." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="20.0" y="22.0" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">tertiary consumers</text><text x="20.0" y="40.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10 kJ m⁻² year⁻¹</text><rect x="147.5" y="50.0" width="85.0" height="26.0" rx="6" fill="var(--vx-a2, #db2777)" fill-opacity="0.22" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="88.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">↑ 10.0% passed on</text><text x="20.0" y="108.0" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">secondary consumers</text><text x="20.0" y="126.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">100 kJ m⁻² year⁻¹</text><rect x="105.0" y="136.0" width="170.0" height="26.0" rx="6" fill="var(--vx-a3, #ea580c)" fill-opacity="0.22" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="174.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">↑ 10.0% passed on</text><text x="20.0" y="194.0" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">primary consumers</text><text x="20.0" y="212.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">1000 kJ m⁻² year⁻¹</text><rect x="62.5" y="222.0" width="255.0" height="26.0" rx="6" fill="var(--vx-a4, #0d9488)" fill-opacity="0.22" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="260.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">↑ 10.0% passed on</text><text x="20.0" y="280.0" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">producers</text><text x="20.0" y="298.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10 000 kJ m⁻² year⁻¹</text><rect x="20.0" y="308.0" width="340.0" height="26.0" rx="6" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.22" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/></svg>