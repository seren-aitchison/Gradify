<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 298.0" width="700.0" height="298.0" role="img" aria-label="A tree: is there a metal and a non-metal? Yes, ionic. No: only metals? Yes, metallic; no, covalent." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M293.3 80.0 C293.3 104.0 123.3 100.0 123.3 124.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M123.3 122.0 L123.3 125.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M123.3 133.0 L119.7 125.0 L127.0 125.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="200.3" y="103.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M293.3 80.0 C293.3 104.0 463.3 100.0 463.3 124.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M463.3 122.0 L463.3 125.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M463.3 133.0 L459.7 125.0 L467.0 125.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="386.3" y="103.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><path d="M463.3 167.0 C463.3 191.0 350.0 204.0 350.0 228.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M350.0 226.0 L350.0 229.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M350.0 237.0 L346.3 229.0 L353.7 229.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="398.7" y="198.5" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M463.3 167.0 C463.3 191.0 576.7 204.0 576.7 228.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M576.7 226.0 L576.7 229.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M576.7 237.0 L573.0 229.0 L580.3 229.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="528.0" y="198.5" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><rect x="163.3" y="30.0" width="260.0" height="50.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="293.3" y="46.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Does it contain a metal and a</text><text x="293.3" y="63.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">non-metal?</text><rect x="28.3" y="134.0" width="190.0" height="48.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="123.3" y="150.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Ionic</text><text x="123.3" y="167.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. NaCl, MgO, CaF<tspan baseline-shift="sub" font-size="8.3">2</tspan></text><rect x="333.3" y="134.0" width="260.0" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="463.3" y="150.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it only metal atoms?</text><rect x="255.0" y="238.0" width="190.0" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="350.0" y="254.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Metallic</text><text x="350.0" y="271.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. Cu, Fe, Na</text><rect x="481.7" y="238.0" width="190.0" height="48.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="576.7" y="254.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Covalent</text><text x="576.7" y="271.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. H<tspan baseline-shift="sub" font-size="8.3">2</tspan>O, CO<tspan baseline-shift="sub" font-size="8.3">2</tspan>, CH<tspan baseline-shift="sub" font-size="8.3">4</tspan></text></svg>