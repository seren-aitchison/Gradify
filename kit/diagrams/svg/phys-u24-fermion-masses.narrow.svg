<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 448.0" width="380.0" height="448.0" role="img" aria-label="A logarithmic mass scale in eV from 10 to the 0 up to 10 to the 12, with neutrinos below 1 eV, the electron at 0.511 MeV and the top quark at 173 GeV." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">The mass hierarchy</text><path d="M62.0 418.0 L62.0 55.2" stroke="var(--vx-ink, #151826)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M62.0 48.0 L65.7 56.0 L58.3 56.0 Z" fill="var(--vx-ink, #151826)"/><text x="70.0" y="44.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">mass / eV</text><path d="M57.0 390.3 L67.0 390.3" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="390.3" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">0</tspan></text><path d="M57.0 334.9 L67.0 334.9" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="334.9" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">2</tspan></text><path d="M57.0 279.5 L67.0 279.5" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="279.5" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">4</tspan></text><path d="M57.0 224.2 L67.0 224.2" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="224.2" font-size="11.5" font-weight="5