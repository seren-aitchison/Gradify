="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">precipitation</text><text x="461.5" y="345.8" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">runoff</text><text x="574.3" y="215.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">river flow</text><text x="255.0" y="296.9" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">infiltration</text><text x="162.1" y="215.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">root uptake</text><text x="255.0" y="133.1" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">transpiration</text></svg>