<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 393.0" width="700.0" height="393.0" role="img" aria-label="A decision tree: does the number of molecules fall? If yes, addition. If no, is one group replaced by another? If yes, substitution; if no, is a small molecule removed to leave a multiple bond? If yes, elimination; otherwise a rearrangement." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M243.8 80.0 C243.8 104.0 95.0 92.0 95.0 116.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M95.0 114.0 L95.0 117.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M95.0 125.0 L91.3 117.0 L98.7 117.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="161.4" y="99.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M243.8 80.0 C243.8 104.0 392.5 92.0 392.5 116.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M392.5 114.0 L392.5 117.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M392.5 125.0 L388.8 117.0 L396.2 117.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="326.1" y="99.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><path d="M392.5 176.0 C392.5 200.0 265.0 188.0 265.0 212.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M265.0 210.0 L265.0 213.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M265.0 221.0 L261.3 213.0 L268.7 213.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="320.8" y="195.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M392.5 176.0 C392.5 200.0 520.0 188.0 520.0 212.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M520.0 210.0 L520.0 213.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M520.0 221.0 L516.3 213.0 L523.7 213.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="464.3" y="195.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><path d="M520.0 272.0 C520.0 296.0 435.0 284.0 435.0 308.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M435.0 306.0 L435.0 309.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M435.0 317.0 L431.3 309.0 L438.7 309.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="469.5" y="291.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M520.0 272.0 C520.0 296.0 605.0 284.0 605.0 308.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M605.0 306.0 L605.0 309.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M605.0 317.0 L601.3 309.0 L608.7 309.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="570.5" y="291.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><rect x="113.8" y="30.0" width="260.0" height="50.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="243.8" y="46.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Do two molecules join to make one</text><text x="243.8" y="63.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">product?</text><rect x="16.0" y="126.0" width="158.0" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="95.0" y="142.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Addition</text><text x="95.0" y="159.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. ethene + HBr</text><rect x="262.5" y="126.0" width="260.0" height="50.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="392.5" y="142.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is one atom or group replaced by</text><text x="392.5" y="159.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">another?</text><rect x="186.0" y="222.0" width="158.0" height="48.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="265.0" y="238.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Substitution</text><text x="265.0" y="255.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. CH<tspan baseline-shift="sub" font-size="8.3">3</tspan>CH<tspan baseline-shift="sub" font-size="8.3">2</tspan>Br + OH<tspan baseline-shift="super" font-size="8.3">−</tspan></text><rect x="390.0" y="222.0" width="260.0" height="50.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="520.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is a small molecule lost, leaving a</text><text x="520.0" y="255.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">C=C?</text><rect x="356.0" y="318.0" width="158.0" height="63.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="435.0" y="334.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Elimination</text><text x="435.0" y="351.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. 2-bromopropane →</text><text x="435.0" y="366.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">propene</text><rect x="526.0" y="318.0" width="158.0" height="48.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.1" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="605.0" y="334.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Rearrangement</text><text x="605.0" y="351.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. carbocation shift</text></svg>