<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 260.0" width="380.0" height="260.0" role="img" aria-label="A Venn diagram with evens in A, multiples of 3 in B, 6 in the overlap and 1, 5 and 7 outside both circles." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="12.0" y="12.0" width="356.0" height="236.0" rx="6" fill="var(--vx-panel, #f4f5fb)" fill-opacity="1" stroke="var(--vx-ink, #151826)" stroke-width="1.8"/><text x="24.0" y="234.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">U = {1, …, 10}</text><circle cx="138.5" cy="136.0" r="83.0" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-width="2.4"/><circle cx="241.5" cy="136.0" r="83.0" fill="var(--vx-a2, #db2777)" fill-opacity=".1" stroke="var(--vx-a2, #db2777)" stroke-width="2.4"/><text x="87.1" y="41.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">evens</text><text x="292.9" y="41.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">mult. of 3</text><text x="101.2" y="136.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4</text><text x="190.0" y="136.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1</text><text x="278.8" y="136.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2</text><text x="342.0" y="34.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3</text></svg>