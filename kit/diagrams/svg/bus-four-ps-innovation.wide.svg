<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 244.0" width="700.0" height="244.0" role="img" aria-label="Four boxes: product innovation (a new phone), process (automated warehouses), position (repositioning a drink as a sports product), paradigm (low-cost airlines)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="12.0" width="338.0" height="108.0" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Product</text><text x="17.0" y="77.1" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">what is offered: a new phone</text><rect x="354.0" y="12.0" width="338.0" height="108.0" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="363.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Process</text><text x="363.0" y="77.1" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">how it is made or delivered: automated warehouses</text><rect x="8.0" y="128.0" width="338.0" height="108.0" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="164.6" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Position</text><text x="17.0" y="185.9" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">context or market: a drink repositioned as a</text><text x="17.0" y="200.3" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">sports product</text><rect x="354.0" y="128.0" width="338.0" height="108.0" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="363.0" y="171.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Paradigm</text><text x="363.0" y="193.1" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the business model: low-cost airlines</text></svg>