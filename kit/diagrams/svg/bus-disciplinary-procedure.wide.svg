<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 74.5" width="700.0" height="74.5" role="img" aria-label="Six boxes in order: establish the facts, inform in writing, hold a meeting, the right to be accompanied, decide and inform, the right of appeal." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="14.0" width="97.3" height="48.5" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="56.7" y="30.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Establish</text><text x="56.7" y="46.4" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">the facts</text><rect x="125.3" y="14.0" width="97.3" height="48.5" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="174.0" y="30.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Inform in</text><text x="174.0" y="46.4" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">writing</text><rect x="242.7" y="14.0" width="97.3" height="48.5" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="291.3" y="30.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Hold a</text><text x="291.3" y="46.4" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">meeting</text><rect x="360.0" y="14.0" width="97.3" height="48.5" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="408.7" y="30.1" font-siz