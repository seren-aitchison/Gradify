<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 270.0" width="380.0" height="270.0" role="img" aria-label="Energy flow: 500 J of heat in splits into 200 J of work done by the gas and 300 J of increased internal energy." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">The first law: where 500 J of heat goes</text><rect x="14.0" y="64.0" width="115.2" height="92.0" fill="var(--vx-a1, #4f46e5)" fill-opacity=".85"/><text x="14.0" y="54.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">heat absorbed Q: 500 J</text><path d="M129.2 64.0 H346.0 l20 18.4 l-20 18.4 H129.2 Z" fill="var(--vx-good, #16a34a)" fill-opacity=".8"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="366.0" y="54.0" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">work done by gas W: 200 J</text><path d="M129.2 100.8 H135.2 A65.2 65.2 0 0 1 200.4 166.0 V226.0 l-27.6 14 l-27.6 -14 V166.0 A10.0 10.0 0 0 0 135.2 156.0 H129.2 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".78"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="172.8" y="252.0" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">rise in internal energy ΔU: 300 J</text></svg>