<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 656.3" width="380.0" height="656.3" role="img" aria-label="A flow chart of questions leading to a bar chart, a histogram, a scatter graph or a line graph." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="75.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 57.9)"><text x="190.0" y="-17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is the independent variable</text><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">continuous, measured on a number</text><text x="190.0" y="17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">scale?</text></g><path d="M30.0 95.8 L30.0 123.8" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 123.8 L34.7 123.8" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 123.8 L34.0 127.0 L34.0 120.5 Z" fill="var(--vx-a4, #0d9488)"/><rect x="42.0" y="107.8" width="270.0" height="63.3" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="177.0" y="121.8" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><g transform="translate(0 155.4)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Bar chart: the independent variable</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">is categoric (blood group, species)</text></g><path d="M338.0 97.8 L338.0 188.9" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 197.0 L333.9 188.0 L342.1 188.0 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 139.4)" x="332.0" y="139.4" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="201.0" width="340.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 230.0)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are you plotting two different</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">variables against each other?</text></g><path d="M30.0 258.9 L30.0 286.9" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 286.9 L34.7 286.9" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 286.9 L34.0 290.1 L34.0 283.7 Z" fill="var(--vx-a4, #0d9488)"/><rect x="42.0" y="270.9" width="270.0" height="79.9" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="177.0" y="284.9" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><g transform="translate(0 326.8)"><text x="177.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Histogram: the frequency of one</text><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">continuous variable in classes, bars</text><text x="177.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">touching</text></g><path d="M338.0 260.9 L338.0 368.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 376.8 L333.9 367.8 L342.1 367.8 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 310.8)" x="332.0" y="310.8" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="380.8" width="340.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 409.7)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Did you set the independent variable</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">yourself, in an experiment?</text></g><path d="M30.0 438.6 L30.0 466.6" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 466.6 L34.7 466.6" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 466.6 L34.0 469.9 L34.0 463.4 Z" fill="var(--vx-a4, #0d9488)"/><rect x="42.0" y="450.6" width="270.0" height="79.9" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="177.0" y="464.6" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><g transform="translate(0 506.6)"><text x="177.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Scatter graph: look for a</text><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">correlation between two measured</text><text x="177.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">variables</text></g><path d="M338.0 440.6 L338.0 548.5" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 556.6 L333.9 547.6 L342.1 547.6 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 490.6)" x="332.0" y="490.6" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="560.6" width="340.0" height="75.8" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 598.4)"><text x="190.0" y="-17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Line graph: independent variable</text><text x="190.0" y="0.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">on the x-axis, dependent on the</text><text x="190.0" y="17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">y-axis</text></g></svg>