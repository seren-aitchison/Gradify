<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 107.4" width="700.0" height="107.4" role="img" aria-label="Three boxes in order: segmentation, targeting, positioning, each with its options." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="14.0" width="214.7" height="81.4" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="115.3" y="37.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Segmentation</text><text x="115.3" y="58.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">geographic, demographic,</text><text x="115.3" y="73.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">psychographic, behavioural</text><rect x="242.7" y="14.0" width="214.7" height="81.4" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="350.0" y="30.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Targeting</text><text x="350.0" y="51.4" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">undifferentiated,</text><text x="350.0" y="65.8" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">differentiated, concentrated</text><text x="350.0" y="80.2" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">(niche)</text><rect x="477.3" y="14.0" width="214.7" height="81.4" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="584.7" y="37.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Positioning</text><text x="584.7" y="58.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the place a brand holds in</text><text x="584.7" y="73.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">customers' minds</text><path d="M224.7 54.7 L233.5 54.7" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M240.7 54.7 L232.7 58.4 L232.7 51.0 Z" fill="var(--vx-line, #8a92a8)"/><path d="M459.3 54.7 L468.1 54.7" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M475.3 54.7 L467.3 58.4 L467.3 51.0 Z" fill="var(--vx-line, #8a92a8)"/></svg>