<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 420.0" width="380.0" height="420.0" role="img" aria-label="Free-body diagram of the 2 kilogram mass: weight 19.6 newtons down, tension 9.8 newtons up and left at 30 degrees, tension 17.0 newtons up and right at 60 degrees, net zero." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">A mass hanging from two strings</text><rect x="170.0" y="132.6" width="40" height="40" rx="5" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-ink, #151826)" stroke-width="2"/><circle cx="190.0" cy="152.6" r="3.5" fill="var(--vx-ink, #151826)"/><path d="M190.0 172.6 L190.0 269.7" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M190.0 279.6 L184.9 268.6 L195.1 268.6 Z" fill="var(--vx-a1, #4f46e5)"/><path d="M170.0 141.1 L132.3 119.3" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M123.7 114.3 L135.7 115.5 L130.7 124.2 Z" fill="var(--vx-a1, #4f46e5)"/><path d="M201.5 132.6 L242.9 61.0" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M247.9 52.4 L246.7 64.5 L238.0 59.4 Z" fill="var(--vx-a1, #4f46e5)"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="206.0" y="258.2" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">W</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="124.9" y="133.5" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">T<tspan baseline-shift="sub" font-size="10.4">1</tspan></text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="224.7" y="60.4" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">T<tspan baseline-shift="sub" font-size="10.4">2</tspan></text><text x="16.0" y="322.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">W = 19.6 N at 270°</text><text x="16.0" y="344.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">T<tspan baseline-shift="sub" font-size="9.4">1</tspan> = 9.8 N at 150°</text><text x="16.0" y="366.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">T<tspan baseline-shift="sub" font-size="9.4">2</tspan> = 17 N at 60°</text><text x="16.0" y="388.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">net force = 0 (in equilibrium)</text></svg>