<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 508.0" width="380.0" height="508.0" role="img" aria-label="Five boxes in order: a mutated cell, a benign tumour, a malignant tumour, blood supply by angiogenesis, and metastasis." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 76.5 L190.0 87.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 95.5 L185.9 86.5 L194.1 86.5 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 168.5 L190.0 179.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 187.5 L185.9 178.5 L194.1 178.5 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 260.5 L190.0 271.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 279.5 L185.9 270.5 L194.1 270.5 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 352.5 L190.0 363.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 371.5 L185.9 362.5 L194.1 362.5 Z" fill="var(--vx-ink, #151826)"/><rect x="100.9" y="8.5" width="178.3" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="24.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">a mutated cell</text><text x="190.0" y="41.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">mutations accumulate in</text><text x="190.0" y="56.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">one lineage over years</text><rect x="100.9" y="100.5" width="178.3" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="116.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">benign tumour</text><text x="190.0" y="133.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">grows slowly, enclosed,</text><text x="190.0" y="148.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">does not invade</text><rect x="100.0" y="192.5" width="180.0" height="63.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="208.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">malignant tumour</text><text x="190.0" y="225.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">grows faster and invades</text><text x="190.0" y="240.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">surrounding tissue</text><rect x="100.0" y="284.5" width="180.0" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="300.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">blood supply</text><text x="190.0" y="317.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">angiogenesis beyond about</text><text x="190.0" y="332.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">1–2 mm</text><rect x="100.0" y="376.5" width="180.0" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="392.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">metastasis</text><text x="190.0" y="409.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cells enter blood or lymph</text><text x="190.0" y="424.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and form secondary tumours</text></svg>