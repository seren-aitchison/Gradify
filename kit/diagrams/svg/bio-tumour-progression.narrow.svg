<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 547.0" width="380.0" height="547.0" role="img" aria-label="Five boxes in order: a mutated cell, a benign tumour, a malignant tumour, blood supply by angiogenesis, and metastasis." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 92.0 L190.0 117.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 126.0 L185.9 117.0 L194.1 117.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 199.0 L190.0 224.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 233.0 L185.9 224.0 L194.1 224.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 306.0 L190.0 331.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 340.0 L185.9 331.0 L194.1 331.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 413.0 L190.0 438.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 447.0 L185.9 438.0 L194.1 438.0 Z" fill="var(--vx-ink, #151826)"/><rect x="100.9" y="24.0" width="178.3" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">a mutated cell</text><text x="190.0" y="57.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">mutations accumulate in</text><text x="190.0" y="72.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">one lineage over years</text><rect x="100.9" y="131.0" width="178.3" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="147.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">benign tumour</text><text x="190.0" y="164.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">grows slowly, enclosed,</text><text x="190.0" y="179.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">does not invade</text><rect x="100.0" y="238.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="254.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">malignant tumour</text><text x="190.0" y="271.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">grows faster and invades</text><text x="190.0" y="286.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">surrounding tissue</text><rect x="100.0" y="345.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="361.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">blood supply</text><text x="190.0" y="378.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">angiogenesis beyond about</text><text x="190.0" y="393.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">1–2 mm</text><rect x="100.0" y="452.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="468.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">metastasis</text><text x="190.0" y="485.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cells enter blood or lymph</text><text x="190.0" y="500.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and form secondary tumours</text></svg>