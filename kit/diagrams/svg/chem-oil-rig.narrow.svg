<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 350.0" width="380.0" height="350.0" role="img" aria-label="Two half-equations: Mg → Mg²⁺ + 2e⁻ (oxidation) and Cu²⁺ + 2e⁻ → Cu (reduction), adding to Mg + Cu²⁺ → Mg²⁺ + Cu." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 62.0 L190.0 87.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 96.0 L185.9 87.0 L194.1 87.0 Z" fill="var(--vx-ink, #151826)"/><text x="198.0" y="79.0" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width="4" paint-order="stroke">Mg → Mg<tspan baseline-shift="super" font-size="70%">2+</tspan> + 2e<tspan baseline-shift="super" font-size="70%">−</tspan></text><path d="M190.0 231.0 L190.0 256.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 265.0 L185.9 256.0 L194.1 256.0 Z" fill="var(--vx-ink, #151826)"/><text x="198.0" y="248.0" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width="4" paint-order="stroke">Cu<tspan baseline-shift="super" font-size="70%">2+</tspan> + 2e<tspan baseline-shift="super" font-size="70%">−</tspan> → Cu</text><rect x="170.2" y="24.0" width="39.6" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="190.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Mg</text><rect x="117.6" y="101.0" width="144.7" height="48.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="117.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Mg<tspan baseline-shift="super" font-size="9.4">2+</tspan></text><text x="190.0" y="134.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">oxidised: lost 2e<tspan baseline-shift="super" font-size="8.3">−</tspan></text><rect x="162.4" y="193.0" width="55.2" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="190.0" y="209.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Cu<tspan baseline-shift="super" font-size="9.4">2+</tspan></text><rect x="114.3" y="270.0" width="151.5" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="286.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Cu</text><text x="190.0" y="303.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">reduced: gained 2e<tspan baseline-shift="super" font-size="8.3">−</tspan></text></svg>