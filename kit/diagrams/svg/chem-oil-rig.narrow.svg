<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 214.0" width="380.0" height="214.0" role="img" aria-label="Two half-equations: Mg → Mg²⁺ + 2e⁻ (oxidation) and Cu²⁺ + 2e⁻ → Cu (reduction), adding to Mg + Cu²⁺ → Mg²⁺ + Cu." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M124.8 56.0 L194.5 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M202.6 56.0 L193.6 60.1 L193.6 51.9 Z" fill="var(--vx-ink, #151826)"/><text x="163.7" y="46.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width="4" paint-order="stroke">Mg → Mg<tspan baseline-shift="super" font-size="70%">2+</tspan> + 2e<tspan baseline-shift="super" font-size="70%">−</tspan></text><path d="M132.6 166.0 L191.2 166.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M199.3 166.0 L190.3 170.1 L190.3 161.9 Z" fill="var(--vx-ink, #151826)"/><text x="165.9" y="156.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="#fff" stroke-width="4" paint-order="stroke">Cu<tspan baseline-shift="super" font-size="70%">2+</tspan> + 2e<tspan baseline-shift="super" font-size="70%">−</tspan> → Cu</text><rect x="80.2" y="39.5" width="39.6" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="100.0" y="55.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Mg</text><rect x="207.6" y="32.0" width="144.7" height="48.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="280.0" y="48.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Mg<tspan baseline-shift="super" font-size="9.4">2+</tspan></text><text x="280.0" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">oxidised: lost 2e<tspan baseline-shift="super" font-size="8.3">−</tspan></text><rect x="72.4" y="149.5" width="55.2" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="100.0" y="165.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Cu<tspan baseline-shift="super" font-size="9.4">2+</tspan></text><rect x="204.3" y="142.0" width="151.5" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="280.0" y="158.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Cu</text><text x="280.0" y="175.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">reduced: gained 2e<tspan baseline-shift="super" font-size="8.3">−</tspan></text></svg>