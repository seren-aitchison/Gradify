<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 170.0" width="700.0" height="170.0" role="img" aria-label="Two boxes: hygiene factors (pay, working conditions, company policy, supervision, job security) and motivators (achievement, recognition, the work itself, responsibility, advancement)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="12.0" width="338.0" height="150.0" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="62.4" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Hygiene factors</text><text x="17.0" y="83.8" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Pay, working conditions, company policy,</text><text x="17.0" y="98.1" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">supervision, job security. Poor: dissatisfaction.</text><text x="17.0" y="112.5" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Good: only prevents it.</text><rect x="354.0" y="12.0" width="338.0" height="150.0" rx="9" fill="var(--vx-good, #16a34a)" fill-opacity="0.12" stroke="var(--vx-good, #16a34a)" stroke-opacity=".55" stroke-width="1.3"/><text x="363.0" y="62.4" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Motivators</text><text x="363.0" y="83.8" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Achievement, recognition, the work itself,</text><text x="363.0" y="98.1" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">responsibility, advancement. These create</text><text x="363.0" y="112.5" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">satisfaction and motivation.</text></svg>