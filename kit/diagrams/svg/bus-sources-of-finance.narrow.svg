<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 306.6" width="380.0" height="306.6" role="img" aria-label="Five boxes: internal sources; external short-term; external medium and long-term; equity; other (government grants, crowdfunding, peer-to-peer lending)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="12.0" width="364.0" height="50.1" rx="9" fill="var(--vx-good, #16a34a)" fill-opacity="0.12" stroke="var(--vx-good, #16a34a)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="27.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Internal sources</text><text x="17.0" y="47.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">retained profit, working capital, sale of assets</text><rect x="8.0" y="70.1" width="364.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="85.6" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">External: short-term</text><text x="17.0" y="105.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">overdrafts, trade credit, factoring</text><rect x="8.0" y="128.3" width="364.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="143.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">External: medium and long-term</text><text x="17.0" y="163.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">bank loans, leasing, bonds</text><rect x="8.0" y="186.4" width="364.0" height="50.1" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="201.9" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">External: equity</text><text x="17.0" y="221.9" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">new shares, business angels, venture capital, listing</text><rect x="8.0" y="244.5" width="364.0" height="50.1" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="260.0" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Other</text><text x="17.0" y="280.1" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">government grants, crowdfunding and peer-to-peer lending</text></svg>