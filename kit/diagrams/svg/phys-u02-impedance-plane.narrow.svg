<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 442.0" width="380.0" height="442.0" role="img" aria-label="Phasor triangle: a 30 ohm arrow along the real axis, a 40 ohm arrow up from its tip, and the 50 ohm impedance at 53 degrees." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Impedance in the complex plane</text><circle cx="110.0" cy="272.6" r="4" fill="var(--vx-ink, #151826)"/><path d="M110.0 272.6 L260.1 272.6" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M269.9 272.6 L258.9 277.7 L258.9 267.5 Z" fill="var(--vx-a1, #4f46e5)"/><path d="M269.9 272.6 L270.0 69.3" stroke="var(--vx-a4, #0d9488)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M270.0 59.4 L275.0 70.4 L264.9 70.4 Z" fill="var(--vx-a4, #0d9488)"/><path d="M110.0 272.6 L264.0 67.3" stroke="var(--vx-a2, #db2777)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M270.0 59.4 L267.4 71.2 L259.3 65.2 Z" fill="var(--vx-a2, #db2777)"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="190.0" y="256.6" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">R</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="254.0" y="166.0" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" font-style="italic">X<tspan baseline-shift="sub" font-size="10.4">L</tspan></text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="202.8" y="175.6" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" font-style="italic">Z</text><text x="16.0" y="322.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">R = 30 Ω (real axis)</text><text x="16.0" y="344.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">X<tspan baseline-shift="sub" font-size="9.4">L</tspan> = 40 Ω (imaginary axis)</text><text x="16.0" y="366.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Z = 50 Ω at 53°</text><text x="16.0" y="388.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">|Z| = √(30<tspan baseline-shift="super" font-size="9.4">2</tspan> + 40<tspan baseline-shift="super" font-size="9.4">2</tspan>) = 50 Ω</text><text x="16.0" y="410.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">φ = arctan(40/30) = 53°</text></svg>