<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660.0 386.0" width="660.0" height="386.0" role="img" aria-label="Phasor triangle: a 30 ohm arrow along the real axis, a 40 ohm arrow up from its tip, and the 50 ohm impedance at 53 degrees." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Impedance in the complex plane</text><circle cx="103.3" cy="336.3" r="4" fill="var(--vx-ink, #151826)"/><path d="M103.3 336.3 L296.4 336.3" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M306.3 336.3 L295.3 341.4 L295.3 331.2 Z" fill="var(--vx-a1, #4f46e5)"/><path d="M306.3 336.3 L306.3 75.6" stroke="var(--vx-a4, #0d9488)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M306.3 65.7 L311.3 76.7 L301.2 76.7 Z" fill="var(--vx-a4, #0d9488)"/><path d="M103.3 336.3 L300.3 73.6" stroke="var(--vx-a2, #db2777)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M306.3 65.7 L303.7 77.5 L295.6 71.5 Z" fill="var(--vx-a2, #db2777)"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="204.8" y="320.3" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">R</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="290.3" y="201.0" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" font-style="italic">X<tspan baseline-shift="sub" font-size="10.4">L</tspan></text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="217.6" y="210.6" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" font-style="italic">Z</text><text x="402.0" y="60.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">R = 30 Ω (real axis)</text><text x="402.0" y="82.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">X<tspan baseline-shift="sub" font-size="9.4">L</tspan> = 40 Ω (imaginary axis)</text><text x="402.0" y="104.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Z = 50 Ω at 53°</text><text x="402.0" y="126.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">|Z| = √(30<tspan baseline-shift="super" font-size="9.4">2</tspan> + 40<tspan baseline-shift="super" font-size="9.4">2</tspan>) = 50 Ω</text><text x="402.0" y="148.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">φ = arctan(40/30) = 53°</text></svg>