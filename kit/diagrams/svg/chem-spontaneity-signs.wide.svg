<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 307.0" width="700.0" height="307.0" role="img" aria-label="A tree: is ΔH negative? Then: is ΔS positive? Feasible at all temperatures; otherwise only at low temperatures. If ΔH is positive: is ΔS positive? Feasible at high temperatures; otherwise never." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M350.0 63.0 C350.0 87.0 180.0 96.0 180.0 120.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M180.0 118.0 L180.0 121.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M180.0 129.0 L176.3 121.0 L183.7 121.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="257.0" y="92.5" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M350.0 63.0 C350.0 87.0 520.0 96.0 520.0 120.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M520.0 118.0 L520.0 121.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M520.0 129.0 L516.3 121.0 L523.7 121.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="443.0" y="92.5" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><path d="M180.0 163.0 C180.0 187.0 95.0 196.0 95.0 220.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M95.0 218.0 L95.0 221.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M95.0 229.0 L91.3 221.0 L98.7 221.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="129.5" y="192.5" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M180.0 163.0 C180.0 187.0 265.0 196.0 265.0 220.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M265.0 218.0 L265.0 221.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M265.0 229.0 L261.3 221.0 L268.7 221.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="230.5" y="192.5" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><path d="M520.0 163.0 C520.0 187.0 435.0 196.0 435.0 220.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M435.0 218.0 L435.0 221.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M435.0 229.0 L431.3 221.0 L438.7 221.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="469.5" y="192.5" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M520.0 163.0 C520.0 187.0 605.0 196.0 605.0 220.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M605.0 218.0 L605.0 221.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M605.0 229.0 L601.3 221.0 L608.7 221.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="570.5" y="192.5" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><rect x="220.0" y="30.0" width="260.0" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="350.0" y="46.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is ΔH negative (exothermic)?</text><rect x="50.0" y="130.0" width="260.0" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="180.0" y="146.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is ΔS positive?</text><rect x="16.0" y="230.0" width="158.0" height="65.0" rx="12" fill="var(--vx-good, #16a34a)" fill-opacity="0.1" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/><text x="95.0" y="246.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Feasible at every</text><text x="95.0" y="263.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">temperature</text><text x="95.0" y="280.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. burning methane</text><rect x="186.0" y="230.0" width="158.0" height="65.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="265.0" y="246.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Feasible at low T</text><text x="265.0" y="263.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">only</text><text x="265.0" y="280.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. N<tspan baseline-shift="sub" font-size="8.3">2</tspan> + 3H<tspan baseline-shift="sub" font-size="8.3">2</tspan> → 2NH<tspan baseline-shift="sub" font-size="8.3">3</tspan></text><rect x="390.0" y="130.0" width="260.0" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="520.0" y="146.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is ΔS positive?</text><rect x="356.0" y="230.0" width="158.0" height="65.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="435.0" y="246.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Feasible at high T</text><text x="435.0" y="263.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">only</text><text x="435.0" y="280.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. CaCO<tspan baseline-shift="sub" font-size="8.3">3</tspan> → CaO + CO<tspan baseline-shift="sub" font-size="8.3">2</tspan></text><rect x="526.0" y="230.0" width="158.0" height="48.0" rx="12" fill="var(--vx-bad, #dc2626)" fill-opacity="0.1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.6"/><text x="605.0" y="246.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Never feasible</text><text x="605.0" y="263.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. 3O<tspan baseline-shift="sub" font-size="8.3">2</tspan> → 2O<tspan baseline-shift="sub" font-size="8.3">3</tspan></text></svg>