<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 121.8" width="700.0" height="121.8" role="img" aria-label="Three boxes: inputs (transformed resources and transforming resources), the transformation process, and outputs (products and services)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="14.0" width="214.7" height="95.8" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="115.3" y="30.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Inputs</text><text x="115.3" y="51.4" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">transformed resources</text><text x="115.3" y="65.8" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">(materials, information,</text><text x="115.3" y="80.2" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">customers) and transforming</text><text x="115.3" y="94.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">resources (facilities, staff)</text><rect x="242.7" y="14.0" width="214.7" height="95.8" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="350.0" y="37.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Transformation process</text><text x="350.0" y="58.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">changing properties, location,</text><text x="350.0" y="73.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">ownership, information or the</text><text x="350.0" y="87.4" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">state of customers</text><rect x="477.3" y="14.0" width="214.7" height="95.8" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="584.7" y="44.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Outputs</text><text x="584.7" y="65.8" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">products and services, usually</text><text x="584.7" y="80.2" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a mix</text><path d="M224.7 61.9 L233.5 61.9" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M240.7 61.9 L232.7 65.6 L232.7 58.2 Z" fill="var(--vx-line, #8a92a8)"/><path d="M459.3 61.9 L468.1 61.9" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M475.3 61.9 L467.3 65.6 L467.3 58.2 Z" fill="var(--vx-line, #8a92a8)"/></svg>