rt" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Entrepreneur. Disturbance</text><text x="478.3" y="118.1" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">handler. Resource allocator.</text><text x="478.3" y="132.5" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Negotiator.</text></svg>