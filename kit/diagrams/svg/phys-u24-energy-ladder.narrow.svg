<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 448.0" width="380.0" height="448.0" role="img" aria-label="A logarithmic energy scale in GeV from 10 to the 2 up to 10 to the 20, with the LHC at 10 to the 4, grand unification at 10 to the 16 and the Planck energy at 1.2 times 10 to the 19." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">How far above the LHC is the Planck energy?</text><path d="M62.0 418.0 L62.0 55.2" stroke="var(--vx-ink, #151826)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M62.0 48.0 L65.7 56.0 L58.3 56.0 Z" fill="var(--vx-ink, #151826)"/><text x="70.0" y="44.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">energy / GeV</text><path d="M57.0 418.0 L67.0 418.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="418.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">2</tspan></text><path d="M57.0 378.0 L67.0 378.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="378.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">4</tspan></text><path d="M57.0 338.0 L67.0 338.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="338.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">6</tspan></text><path d="M57.0 298.0 L67.0 298.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="non