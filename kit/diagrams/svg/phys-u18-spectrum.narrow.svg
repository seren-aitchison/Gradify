.0 269.8" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="269.8" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-6</tspan></text><path d="M57.0 227.4 L67.0 227.4" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="227.4" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-4</tspan></text><path d="M57.0 185.1 L67.0 185.1" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="185.1" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-2</tspan></text><path d="M57.0 142.7 L67.0 142.7" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="142.7" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">0</tspan></text><path d="M57.0 100.4 L67.0 100.4" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="100.4" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">2</tspan></text><path d="M57.0 58.0 L67.0 58.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="58.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">4</tspan></text><rect x="230.0" y="58.0" width="14" height="84.7" fill="var(--vx-a1, #4f46e5)" fill-opacity=".75"/