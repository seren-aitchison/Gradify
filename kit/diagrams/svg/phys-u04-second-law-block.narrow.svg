<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 442.0" width="380.0" height="442.0" role="img" aria-label="Free-body diagram of a block: weight down and normal force up, equal; a 10 newton pull to the right and 4 newtons of friction to the left; net 6 newtons to the right." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Forces on a pulled block</text><rect x="155.7" y="146.0" width="40" height="40" rx="5" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-ink, #151826)" stroke-width="2"/><circle cx="175.7" cy="166.0" r="3.5" fill="var(--vx-ink, #151826)"/><path d="M175.7 186.0 L175.7 269.7" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M175.7 279.6 L170.6 268.6 L180.7 268.6 Z" fill="var(--vx-a1, #4f46e5)"/><path d="M175.7 146.0 L175.7 62.3" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M175.7 52.4 L180.7 63.4 L170.6 63.4 Z" fill="var(--vx-a1, #4f46e5)"/><path d="M195.7 166.0 L233.5 166.0" stroke="var(--vx-a3, #ea580c)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M243.4 166.0 L232.4 171.1 L232.4 160.9 Z" fill="var(--vx-a3, #ea580c)"/><path d="M155.7 166.0 L146.5 166.0" stroke="var(--vx-a2, #db2777)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M136.6 166.0 L147.6 160.9 L147.6 171.1 Z" fill="var(--vx-a2, #db2777)"/><path d="M175.7 212.0 L194.4 212.0" stroke="var(--vx-a2, #db2777)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" fill="none"/><path d="M204.3 212.0 L193.3 217.1 L193.3 206.9 Z" fill="var(--vx-a2, #db2777)"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="191.7" y="260.9" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">W</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="159.7" y="71.1" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">N</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="233.9" y="150.0" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" font-style="italic">P</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="140.4" y="182.0" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" font-style="italic">f</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="234.8" y="228.0" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" font-style="italic">net force</text><text x="16.0" y="322.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">W = 19.6 N at 270°</text><text x="16.0" y="344.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">N = 19.6 N at 90°</text><text x="16.0" y="366.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">P = 10 N at 0°</text><text x="16.0" y="388.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">f = 4 N at 180°</text><text x="16.0" y="410.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">net force = 6 N at 0°</text></svg>