<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 215.0" width="700.0" height="215.0" role="img" aria-label="Three stacked layers from the visible top to the hidden base: artefacts, espoused values, basic underlying assumptions." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="16.0" width="360.0" height="52" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="42.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Artefacts</text><path d="M372.0 42.0 L384.0 42.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="34.3" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">visible: dress, office layout, stories,</text><text x="390.0" y="49.8" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">rituals</text><rect x="8.0" y="73.0" width="360.0" height="52" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity=".14" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="99.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Espoused values</text><path d="M372.0 99.0 L384.0 99.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="99.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">stated values, strategies and goals</text><rect x="8.0" y="130.0" width="360.0" height="52" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity=".14" stroke="var(--vx-a2, #db2777)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="156.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Basic underlying assumptions</text><path d="M372.0 156.0 L384.0 156.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="148.3" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">invisible, taken for granted, and</text><text x="390.0" y="163.8" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">decisive</text><text x="350.0" y="199.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">from visible to invisible</text></svg>