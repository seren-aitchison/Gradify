<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 442.9" width="380.0" height="442.9" role="img" aria-label="A circle labelled 3,000 base pairs with four coloured arcs: an origin of replication, an ampicillin resistance gene, a promoter and a short multiple cloning site with three unique cutting sites, EcoRI, BamHI and HindIII." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><circle cx="190" cy="176" r="84" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="2"/><g data-part="ori"><title>ori: Origin of replication: where copying of the plasmid starts, so it replicates independently in the host.</title><path d="M207.5 93.8 A84 84 0 0 1 273.5 167.2" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="15" stroke-linecap="butt"/></g><g data-part="AmpR"><title>AmpR: Selectable marker (an antibiotic resistance gene): only cells that took up the plasmid survive on antibiotic agar.</title><path d="M252.4 232.2 A84 84 0 0 1 120.9 223.8" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="15" stroke-linecap="butt"/></g><g data-part="promoter"><title>promoter: Drives expression of the inserted gene.</title><path d="M106.0 176.0 A84 84 0 0 1 107.8 158.5" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="15" stroke-linecap="butt"/></g><g data-part="MCS"><title>MCS: Multiple cloning site (polylinker): many unique restriction sites where a gene can be inserted.</title><path d="M110.1 150.0 A84 84 0 0 1 114.0 140.2" fill="none" stroke="var(--vx-a1, #4f46e5)" stroke-width="20" stroke-linecap="butt"/></g><path d="M123.9 153.0 L97.5 143.8" stroke="var(--vx-ink, #151826)" stroke-width="1.8"/><path d="M124.9 150.2 L98.9 139.9" stroke="var(--vx-ink, #151826)" stroke-width="1.8"/><path d="M126.1 147.5 L100.5 136.1" stroke="var(--vx-ink, #151826)" stroke-width="1.8"/><text x="278.7" y="99.7" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">ori</text><text x="278.7" y="114.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">100–700</text><text x="178.7" y="289.8" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">AmpR</text><text x="178.7" y="304.8" font-size="10.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">1100–1961</text><text x="72.6" y="164.1" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">promoter</text><text x="72.6" y="179.1" font-size="10.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">2250–2350</text><text x="80.0" y="134.0" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">MCS</text><text x="80.0" y="149.0" font-size="10.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">2400–2460</text><text x="190.0" y="154.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">illustrative vector</text><text x="190.0" y="172.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3,000 bp</text><text x="190.0" y="190.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">illustrative: not a named plasmid</text><text x="190.0" y="352.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Unique cutters in the MCS: EcoRI 2410  · </text><text x="190.0" y="367.4" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">BamHI 2430  ·  HindIII 2450</text><text x="190.0" y="396.1" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">EcoRI + HindIII gives fragments of 40 bp and</text><text x="190.0" y="410.8" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2,960 bp</text></svg>