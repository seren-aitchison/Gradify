<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 214.0" width="700.0" height="214.0" role="img" aria-label="A cycle of RuBP, GP and triose phosphate: RuBisCO fixes CO2 onto RuBP to give GP, GP is reduced to triose phosphate, and triose phosphate regenerates RuBP, with one triose phosphate in six leaving." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M142.2 70.0 L175.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M184.0 70.0 L175.0 74.1 L175.0 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M346.0 70.0 L345.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M354.0 70.0 L345.0 74.1 L345.0 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M516.0 70.0 L515.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M524.0 70.0 L515.0 74.1 L515.0 65.9 Z" fill="var(--vx-ink, #151826)"/><rect x="52.8" y="46.0" width="84.4" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="95.0" y="62.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">RuBP</text><text x="95.0" y="79.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">5 carbons</text><rect x="189.0" y="38.5" width="152.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="265.0" y="54.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">GP</text><text x="265.0" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">3 carbons, made by</text><text x="265.0" y="86.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">fixing CO<tspan baseline-shift="sub" font-size="8.3">2</tspan> (RuBisCO)</text><rect x="359.0" y="31.0" width="152.0" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="435.0" y="47.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">triose phosphate</text><text x="435.0" y="64.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">3 carbons, made by</text><text x="435.0" y="79.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">reduction with ATP and</text><text x="435.0" y="94.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">NADPH</text><rect x="529.0" y="38.5" width="152.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="605.0" y="54.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">RuBP again</text><text x="605.0" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">5 carbons, regenerated</text><text x="605.0" y="86.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">using ATP</text><text x="350.0" y="170.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">One triose phosphate in six leaves the cycle to make sugars; six turns fix six CO<tspan baseline-shift="sub" font-size="8.6">2</tspan> into</text><text x="350.0" y="187.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">one glucose.</text></svg>