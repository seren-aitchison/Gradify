<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.0 230.0" width="680.0" height="230.0" role="img" aria-label="Vibrational levels of CO₂'s bending mode, v = 0 and v = 1, with an upward arrow for absorption of 15 μm infrared." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M12.0 200.0 L12.0 25.2" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M12.0 18.0 L15.7 26.0 L8.3 26.0 Z" fill="var(--vx-ink, #151826)"/><text x="18.0" y="14.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">energy</text><path d="M180.0 190.0 L404.0 190.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="174.0" y="190.0" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">v = 0</text><path d="M180.0 34.0 L404.0 34.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="174.0" y="34.0" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">v = 1 (bend)</text><path d="M288.8 190.0 L288.8 41.2" stroke="var(--vx-a3, #ea580c)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M288.8 34.0 L292.5 42.0 L285.1 42.0 Z" fill="var(--vx-a3, #ea580c)"/><text x="294.8" y="112.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">absorbs 15 μm infrared</text></svg>