<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.0 230.0" width="680.0" height="230.0" role="img" aria-label="Vibrational levels of CO₂'s bending mode, v = 0 and v = 1, with an upward arrow for absorption of 15 μm infrared." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M12.0 200.0 L12.0 33.2" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M12.0 26.0 L15.7 34.0 L8.3 34.0 Z" fill="var(--vx-ink, #151826)"/><text x="6.0" y="12.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">energy</text><path d="M180.0 190.0 L404.0 190.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M180.0 50.0 L404.0 50.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M288.8 190.0 L288.8 57.2" stroke="var(--vx-a3, #ea580c)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M288.8 50.0 L292.5 58.0 L285.1 58.0 Z" fill="var(--vx-a3, #ea580c)"/><text x="174.0" y="190.0" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">v = 0</text><text x="174.0" y="50.0" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">v = 1 (bend)</text><text x="294.8" y="120.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">absorbs 15 μm infrared</text></svg>