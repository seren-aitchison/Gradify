<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400.0 330.0" width="400.0" height="330.0" role="img" aria-label="Two stacked columns: driving forces (fewer errors 4, regulatory pressure 4, faster access to records 3) total 11; restraining forces (staff fear of technology 4, time to learn 3, cost 3) total 10." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M14.0 274.0 L385.7 274.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M392.0 274.0 L385.0 277.2 L385.0 270.8 Z" fill="var(--vx-ink, #151826)"/><rect x="47.5" y="199.4" width="120.0" height="72.6" fill="var(--vx-good, #16a34a)" fill-opacity=".2" stroke="var(--vx-good, #16a34a)" stroke-width="1.3"/><text x="107.5" y="228.7" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Fewer errors</text><text x="107.5" y="244.7" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">4</text><rect x="47.5" y="126.8" width="120.0" height="72.6" fill="var(--vx-a4, #0d9488)" fill-opacity=".2" stroke="var(--vx-a4, #0d9488)" stroke-width="1.3"/><text x="107.5" y="156.1" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Regulation</text><text x="107.5" y="172.1" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">4</text><rect x="47.5" y="72.3" width="120.0" height="54.5" fill="var(--vx-a1, #4f46e5)" fill-opacity=".2" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.3"/><text x="107.5" y="92.5" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Faster access</text><text x="107.5" y="108.5" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">3</text><text x="107.5" y="62.3" font-