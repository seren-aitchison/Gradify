<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 303.4" width="700.0" height="303.4" role="img" aria-label="A side view of the head, the front on the left. A large cerebrum divided into frontal, parietal, occipital and temporal lobes; a cerebellum at the back below it; the midbrain, pons and medulla stacked in the brainstem, with the spinal cord continuing down inside the vertebrae; a hypothalamus and pituitary gland above the brainstem; the meninges and the skull round the brain; and a small cross-section of the spinal cord with grey matter inside white matter." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(164 8) scale(0.7143)"><g data-part="skull"><title>skull: The skull, with the vertebrae, protects the CNS.</title><ellipse cx="200" cy="122" rx="178" ry="112" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="9" stroke-opacity=".75"/></g><g data-part="meninges"><title>meninges: Membranes between the bone and the brain; cerebrospinal fluid fills the space under them.</title><ellipse cx="200" cy="122" rx="166" ry="100" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="3"/></g><clipPath id="brain-cerebrum"><ellipse cx="190" cy="112" rx="146" ry="84"/></clipPath><g data-part="frontal lobe"><title>frontal lobe: Voluntary movement, decision-making and personality (as the case of Phineas Gage showed).</title><g clip-path="url(#brain-cerebrum)"><path d="M0 0 L195 0 L165 108 L100 170 L0 170 Z" fill="var(--vx-a1, #4f46e5)" fill-opacity=".3" stroke="var(--vx-ink, #151826)" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/></g></g><g data-part="parietal lobe"><title>parietal lobe: A lobe of the cerebral cortex.</title><g clip-path="url(#brain-cerebrum)"><path d="M195 0 L268 0 L292 100 L165 108 Z" fill="var(--vx-a4, #0d9488)" fill-opacity=".3" stroke="var(--vx-ink, #151826)" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/></g></g><g data-part="occipital lobe"><title>occipital lobe: Vision.</title><g clip-path="url(#brain-cerebrum)"><path d="M268 0 L400 0 L400 110 L292 100 Z" fill="var(--vx-a5, #7c3aed)" fill-opacity=".3" stroke="var(--vx-ink, #151826)" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/></g></g><g data-part="temporal lobe"><title>temporal lobe: A lobe of the cerebral cortex.</title><g clip-path="url(#brain-cerebrum)"><path d="M100 170 L165 108 L292 100 L400 110 L400 230 L100 230 Z" fill="var(--vx-a2, #db2777)" fill-opacity=".3" stroke="var(--vx-ink, #151826)" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/></g></g><g data-part="cerebral cortex"><title>cerebral cortex: The outer layer of the cerebrum, involved in higher functions.</title><ellipse cx="190" cy="112" rx="146" ry="84" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="6" stroke-opacity=".7"/></g><g data-part="vertebra"><title>vertebra: A bone of the vertebral column round the spinal cord.</title><rect x="220.0" y="231.0" width="32" height="10" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity=".45" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4" transform="rotate(14 236.0 236.0)"/><rect x="226.5" y="244.5" width="32" height="10" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity=".45" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4" transform="rotate(14 242.5 249.5)"/><rect x="233.0" y="258.0" width="32" height="10" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity=".45" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4" transform="rotate(14 249.0 263.0)"/><rect x="239.5" y="271.5" width="32" height="10" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity=".45" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4" transform="rotate(14 255.5 276.5)"/><rect x="246.0" y="285.0" width="32" height="10" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity=".45" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4" transform="rotate(14 262.0 290.0)"/></g><g data-part="spinal cord"><title>spinal cord: Carries signals between the brain and the body and processes reflexes.</title><path d="M234 224 L236 230 L262 294" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="12" stroke-linecap="round" stroke-opacity=".8"/></g><g data-part="cerebellum"><title>cerebellum: Coordinates balance and fine movement.</title><ellipse cx="285" cy="190" rx="50" ry="28" fill="var(--vx-good, #16a34a)" fill-opacity=".35" stroke="var(--vx-good, #16a34a)" stroke-width="2.4"/><path d="M250.6 176 Q285 172 319.4 176" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="1.2"/><path d="M247.4 184 Q285 180 322.6 184" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="1.2"/><path d="M245.8 192 Q285 188 324.2 192" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="1.2"/><path d="M249 200 Q285 196 321 200" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="1.2"/></g><g data-part="midbrain"><title>midbrain: Part of the brainstem, which controls breathing, heart rate and reflexes.</title><rect x="210" y="153" width="28" height="24" rx="8" fill="var(--vx-a3, #ea580c)" fill-opacity=".5" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8"/></g><g data-part="pons"><title>pons: Part of the brainstem.</title><rect x="214" y="178" width="28" height="24" rx="8" fill="var(--vx-a2, #db2777)" fill-opacity=".5" stroke="var(--vx-a2, #db2777)" stroke-width="1.8"/></g><g data-part="medulla"><title>medulla: Part of the brainstem, continuous with the spinal cord.</title><rect x="220" y="204" width="28" height="24" rx="8" fill="var(--vx-a5, #7c3aed)" fill-opacity=".5" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.8"/></g><g data-part="hypothalamus"><title>hypothalamus: Homeostasis, and the link to the pituitary gland.</title><ellipse cx="200" cy="158" rx="11" ry="8" fill="var(--vx-a2, #db2777)" fill-opacity=".7" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/></g><g data-part="pituitary gland"><title>pituitary gland: The gland controlled by the hypothalamus.</title><circle cx="196" cy="181" r="5" fill="var(--vx-a3, #ea580c)" stroke="var(--vx-a3, #ea580c)"/><path d="M200 166 L196 176" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/></g><g><g data-part="white matter"><title>white matter: Contains myelinated axons.</title><circle cx="352" cy="250" r="30" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-opacity=".7"/></g><g data-part="grey matter"><title>grey matter: Contains the nerve cell bodies.</title><path d="M352 247 C330 230 326 248 338 254 C330 264 342 272 352 258 C362 272 374 264 366 254 C378 248 374 230 352 247 Z" fill="var(--vx-a1, #4f46e5)" fill-opacity=".45" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/></g><text x="352.0" y="292.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">spinal cord, cross-section</text></g></g><path d="M231.9 70.9 L152.0 70.9" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="231.9" cy="70.9" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="70.9" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">frontal lobe</text><path d="M179.7 80.9 L152.0 96.9" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="179.7" cy="80.9" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="96.9" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">skull</text><path d="M188.3 116.6 L152.0 122.9" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="188.3" cy="116.6" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="122.9" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">meninges</text><path d="M301.1 120.9 L152.0 148.9" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="301.1" cy="120.9" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="148.9" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">hypothalamus</text><path d="M300.4 139.4 L152.0 174.9" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="300.4" cy="139.4" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="174.9" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">pituitary gland</text><path d="M321.1 28.0 L484.0 28.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="321.1" cy="28.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="28.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">cerebral cortex</text><path d="M326.9 49.4 L484.0 54.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="326.9" cy="49.4" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="54.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">parietal lobe</text><path d="M385.4 58.0 L484.0 80.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="385.4" cy="58.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="80.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">occipital lobe</text><path d="M310.4 109.4 L484.0 109.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="310.4" cy="109.4" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="109.4" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">temporal lobe</text><path d="M324.0 125.9 L484.0 135.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="324.0" cy="125.9" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="135.4" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">midbrain</text><path d="M326.9 143.7 L484.0 161.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="326.9" cy="143.7" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="161.4" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">pons</text><path d="M381.9 150.9 L484.0 187.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="381.9" cy="150.9" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="187.4" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">cerebellum</text><path d="M331.1 162.3 L484.0 213.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="331.1" cy="162.3" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="213.4" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">medulla</text><path d="M434.0 180.9 L484.0 239.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="434.0" cy="180.9" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="239.4" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">white matter</text><path d="M421.1 190.9 L484.0 265.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="421.1" cy="190.9" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="265.4" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">grey matter</text><path d="M341.9 195.1 L484.0 291.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="341.9" cy="195.1" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="291.4" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">spinal cord</text></svg>