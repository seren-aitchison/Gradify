<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 248.0" width="700.0" height="248.0" role="img" aria-label="A two by two grid. Internal helpful: strengths. Internal harmful: weaknesses. External helpful: opportunities. External harmful: threats. Each holds the bus company's example." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="265.0" y="24.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Helpful</text><text x="551.0" y="24.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Harmful</text><text x="114.0" y="84.0" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Internal</text><rect x="122.0" y="38.0" width="280.0" height="86.0" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-opacity=".5" stroke-width="1.3"/><text x="131.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Strengths</text><text x="131.0" y="75.3" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• a reliable network and loyal local</text><text x="131.0" y="90.6" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">customers</text><rect x="408.0" y="38.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".5" stroke-width="1.3"/><text x="417.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Weaknesses</text><text x="417.0" y="75.3" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• an ageing diesel fleet</text><text x="114.0" y="176.0" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">External</text><rect x="122.0" y="130.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".5" stroke-width="1.3"/><text x="131.0" y="147.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Opportunities</text><text x="131.0" y="167.3" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• funding for zero-emission buses</text><rect x="408.0" y="130.0" width="280.0" height="86.0" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-opacity=".5" stroke-width="1.3"/><text x="417.0" y="147.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Threats</text><text x="417.0" y="167.3" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• rising fuel costs and car use</text><text x="408.0" y="234.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">effect on the objective →</text><g transform="translate(14 130.0) rotate(-90)"><text x="0.0" y="0.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">origin →</text></g></svg>