<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 178.0" width="700.0" height="178.0" role="img" aria-label="Three boxes in order: denaturation at about 95 degrees, annealing at 50 to 65 degrees, and extension at about 72 degrees, then the cycle repeats." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M232.7 70.0 L232.6 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M240.7 70.0 L231.7 74.1 L231.7 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M459.3 70.0 L459.2 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M467.3 70.0 L458.3 74.1 L458.3 65.9 Z" fill="var(--vx-ink, #151826)"/><rect x="19.0" y="46.0" width="208.7" height="48.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="123.3" y="62.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">denaturation, about 95 °C</text><text x="123.3" y="79.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">heat separates the two strands</text><rect x="245.7" y="38.5" width="208.7" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="350.0" y="54.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">annealing, about 50–65 °C</text><text x="350.0" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">primers bind to each end of the</text><text x="350.0" y="86.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">target</text><rect x="472.3" y="38.5" width="208.7" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="576.7" y="54.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">extension, about 72 °C</text><text x="576.7" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Taq polymerase adds nucleotides</text><text x="576.7" y="86.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">from the primers</text></svg>