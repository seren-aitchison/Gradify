<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 369.1" width="380.0" height="369.1" role="img" aria-label="Two vessel elements side by side, each a tall tube with horizontal bands of lignin along its wall and small oval pits, with the cross-wall between the upper and lower element open." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><g data-part="vessel element"><title>vessel element: A dead cell joined end to end with others into a continuous tube with no end walls, so water flows without obstruction.</title><rect x="100" y="30" width="76" height="240" rx="8" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-width="2.4"/></g><g data-part="lignin"><title>lignin: Thickens the wall, often in rings or spirals: waterproof and strong, so the vessel does not collapse under tension.</title><rect x="100" y="38" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="54" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="70" width="64" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="86" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="102" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="118" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="134" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="150" width="64" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="166" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="182" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="198" width="76" height="5" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><rect x="100" y="214" width="76" height="5" fill="var(--vx