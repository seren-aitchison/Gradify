<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 327.9" width="380.0" height="327.9" role="img" aria-label="Rivalry among existing competitors in the centre with arrows from threat of new entrants (above), threat of substitutes (below), bargaining power of suppliers (left) and bargaining power of buyers (right)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 77.0 L190.0 90.9" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M190.0 99.0 L185.9 90.0 L194.1 90.0 Z" fill="var(--vx-a2, #db2777)"/><path d="M190.0 250.9 L190.0 237.0" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M190.0 228.9 L194.1 237.9 L185.9 237.9 Z" fill="var(--vx-a2, #db2777)"/><path d="M125.7 163.9 L133.8 163.9" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M125.7 163.9 L134.7 159.8 L134.7 168.1 Z" fill="var(--vx-a2, #db2777)"/><path d="M254.3 163.9 L254.3 163.9" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M254.3 163.9 L254.3 163.9 L254.3 163.9 Z" fill="var(--vx-a2, #db2777)"/><rect x="40.0" y="14.0" width="300.0" height="60.0" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="190.0" y="34.4" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Threat of new entrants</text><text x="190.0" y="54.5" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">strong when barriers to entry are low</text><rect x="40.0" y="253.9" width="300.0" height="60.0" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="190.0" y="274.3" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Threat of substitutes</text><text x="190.0" y="294.4" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">strong when other products meet the same need</text><rect x="8.0" y="102.0" width="114.7" height="119.5" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="65.3" y="117.5" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Bargaining</text><text x="65.3" y="132.5" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">power of</text><text x="65.3" y="147.5" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">suppliers</text><text x="65.3" y="167.6" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">strong when</text><text x="65.3" y="180.7" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">suppliers are few</text><text x="65.3" y="193.8" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">or switching</text><text x="65.3" y="206.9" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">costs high</text><rect x="257.3" y="102.0" width="114.7" height="119.5" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="314.7" y="117.5" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Bargaining</text><text x="314.7" y="132.5" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">power of</text><text x="314.7" y="147.5" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">buyers</text><text x="314.7" y="167.6" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">strong when</text><text x="314.7" y="180.7" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">buyers are few,</text><text x="314.7" y="193.8" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">large and can</text><text x="314.7" y="206.9" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">switch cheaply</text><rect x="128.7" y="102.0" width="122.7" height="123.9" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity="0.16" stroke="var(--vx-a2, #db2777)" stroke-opacity=".55" stroke-width="1.3"/><text x="190.0" y="117.8" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Rivalry among</text><text x="190.0" y="133.4" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">existing</text><text x="190.0" y="149.1" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">competitors</text><text x="190.0" y="169.8" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">many similar</text><text x="190.0" y="183.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">rivals, slow</text><text x="190.0" y="197.3" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">growth, high</text><text x="190.0" y="211.0" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">fixed costs</text></svg>