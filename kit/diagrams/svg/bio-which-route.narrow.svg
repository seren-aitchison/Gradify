<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 804.1" width="380.0" height="804.1" role="img" aria-label="A flow chart of questions leading to bulk transport, active transport, simple diffusion, osmosis or facilitated diffusion." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="75.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 57.9)"><text x="190.0" y="-17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it a single small molecule or</text><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">ion, not a macromolecule or a</text><text x="190.0" y="17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">particle such as a bacterium?</text></g><path d="M30.0 95.8 L30.0 123.8" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 123.8 L34.7 123.8" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 123.8 L34.0 127.0 L34.0 120.5 Z" fill="var(--vx-a3, #ea580c)"/><rect x="42.0" y="107.8" width="270.0" height="63.3" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="177.0" y="121.8" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><g transform="translate(0 155.4)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Endocytosis or exocytosis: carried</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">in a vesicle, using ATP</text></g><path d="M338.0 97.8 L338.0 188.9" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 197.0 L333.9 188.0 L342.1 188.0 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 139.4)" x="332.0" y="139.4" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="201.0" width="340.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 230.0)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it moving down its concentration</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">gradient?</text></g><path d="M30.0 258.9 L30.0 286.9" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 286.9 L34.7 286.9" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 286.9 L34.0 290.1 L34.0 283.7 Z" fill="var(--vx-a3, #ea580c)"/><rect x="42.0" y="270.9" width="270.0" height="63.3" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="177.0" y="284.9" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><g transform="translate(0 318.5)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Active transport: a pump moves it,</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">using ATP</text></g><path d="M338.0 260.9 L338.0 352.1" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 360.2 L333.9 351.2 L342.1 351.2 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 302.5)" x="332.0" y="302.5" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="364.2" width="340.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 384.1)"><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it charged or polar?</text></g><path d="M30.0 404.1 L30.0 432.1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 432.1 L34.7 432.1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 432.1 L34.0 435.3 L34.0 428.9 Z" fill="var(--vx-good, #16a34a)"/><rect x="42.0" y="416.1" width="270.0" height="63.3" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/><text x="177.0" y="430.1" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no</text><g transform="translate(0 463.7)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Simple diffusion through the lipid:</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">O₂, CO₂, steroids</text></g><path d="M338.0 406.1 L338.0 497.3" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 505.4 L333.9 496.4 L342.1 496.4 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 447.7)" x="332.0" y="447.7" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="509.4" width="340.0" height="75.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 547.2)"><text x="190.0" y="-17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it a solute (an ion, glucose, an</text><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">amino acid) rather than water</text><text x="190.0" y="17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">itself?</text></g><path d="M30.0 585.1 L30.0 613.1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 613.1 L34.7 613.1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 613.1 L34.0 616.3 L34.0 609.9 Z" fill="var(--vx-good, #16a34a)"/><rect x="42.0" y="597.1" width="270.0" height="63.3" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/><text x="177.0" y="611.1" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no</text><g transform="translate(0 644.8)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Osmosis, much of it through</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">aquaporins</text></g><path d="M338.0 587.1 L338.0 678.3" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 686.4 L333.9 677.4 L342.1 677.4 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 628.8)" x="332.0" y="628.8" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="690.4" width="340.0" height="93.7" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 737.2)"><text x="190.0" y="-26.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Facilitated diffusion: a channel</text><text x="190.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">protein for ions, a carrier</text><text x="190.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">protein for glucose and amino</text><text x="190.0" y="26.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">acids</text></g></svg>