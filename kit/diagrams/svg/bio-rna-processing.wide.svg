<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 222.0" width="700.0" height="222.0" role="img" aria-label="Five boxes in order: pre-mRNA, 5′ cap, poly-A tail, splicing and mature mRNA." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M202.3 56.0 L262.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M271.0 56.0 L262.0 60.1 L262.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M429.0 56.0 L489.6 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M497.7 56.0 L488.7 60.1 L488.7 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M511.7 89.8 L435.6 129.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M428.4 133.2 L434.5 125.3 L438.3 132.7 Z" fill="var(--vx-ink, #151826)"/><path d="M271.0 174.0 L208.8 174.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M200.7 174.0 L209.7 169.9 L209.7 178.1 Z" fill="var(--vx-ink, #151826)"/><rect x="49.3" y="24.5" width="148.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="123.3" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">pre-mRNA</text><text x="123.3" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">exons and introns,</text><text x="123.3" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">made in the nucleus</text><rect x="276.0" y="24.5" width="148.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="350.0" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">5′ cap</text><text x="350.0" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a modified guanine</text><text x="350.0" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">added to the 5′ end</text><rect x="502.7" y="24.5" width="148.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="576.7" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">poly-A tail</text><text x="576.7" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">many adenines added</text><text x="576.7" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">to the 3′ end</text><rect x="276.0" y="135.0" width="148.0" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="350.0" y="151.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">splicing</text><text x="350.0" y="168.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the spliceosome</text><text x="350.0" y="183.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">removes the introns</text><text x="350.0" y="198.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and joins the exons</text><rect x="51.0" y="135.0" width="144.7" height="78.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="123.3" y="151.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">mature mRNA</text><text x="123.3" y="168.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">leaves through the</text><text x="123.3" y="183.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">nuclear pores for</text><text x="123.3" y="198.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">translation</text></svg>