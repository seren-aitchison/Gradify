<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 539.1" width="380.0" height="539.1" role="img" aria-label="The nine blocks: key partnerships, key activities, key resources, value propositions, customer relationships, channels, customer segments, with cost structure and revenue streams along the bottom." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="12.0" width="364.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="27.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Customer segments</text><text x="17.0" y="47.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">students, young professionals</text><rect x="8.0" y="70.1" width="364.0" height="50.1" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="85.6" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Value propositions</text><text x="17.0" y="105.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a working bike for a monthly fee, free repairs</text><rect x="8.0" y="128.3" width="364.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="143.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Channels</text><text x="17.0" y="163.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">app sign-up</text><rect x="8.0" y="186.4" width="364.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="201.9" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Customer relationships</text><text x="17.0" y="221.9" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">home repair visits</text><rect x="8.0" y="244.5" width="364.0" height="50.1" rx="9" fill="var(--vx-good, #16a34a)" fill-opacity="0.12" stroke="var(--vx-good, #16a34a)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="260.0" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Revenue streams</text><text x="17.0" y="280.1" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">monthly subscription</text><rect x="8.0" y="302.6" width="364.0" height="50.1" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="318.1" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Key resources</text><text x="17.0" y="338.2" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">bikes, mechanics</text><rect x="8.0" y="360.8" width="364.0" height="50.1" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="376.3" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Key activities</text><text x="17.0" y="396.3" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">repairs, app</text><rect x="8.0" y="418.9" width="364.0" height="50.1" rx="9" fill="var(--vx