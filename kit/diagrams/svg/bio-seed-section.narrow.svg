<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 426.1" width="380.0" height="426.1" role="img" aria-label="Two seeds side by side. A bean has a thick testa round two large cotyledons, with a plumule at the top and a radicle at the bottom. A maize grain has a testa round a large food store, the endosperm, with a single small cotyledon, plumule and radicle at one side." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><text x="105.0" y="18.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">eudicot (bean)</text><text x="315.0" y="18.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">monocot (maize)</text><g data-part="testa"><title>testa: The seed coat: protects the embryo.</title><path d="M105 34 C160 40 168 200 105 270 C42 200 50 40 105 34 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".08" stroke="var(--vx-a3, #ea580c)" stroke-width="5"/></g><g data-part="cotyledon"><title>cotyledon: A seed leaf. A eudicot has two, and they often store the food.</title><path d="M104 52 C148 56 154 190 104 242 Z" fill="var(--vx-a4, #0d9488)" fill-opacity=".4" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/><path d="M106 52 C62 56 56 190 106 242 Z" fill="var(--vx-a4, #0d9488)" fill-opacity=".4" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/></g><g data-part="plumule"><title>plumule: The young shoot of the embryo.</title><path d="M105 70 q-9 -22 -2 -34 q10 12 2 34" fill="var(--vx-good, #16a34a)" fill-opacity=".7" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/></g><g data-part="radicle"><title>radicle: The young root of the embryo.</title><path d="M99 240 q6 20 6 26 q0 -6 6 -26 Z" fill="var(--vx-a2, #db2777)" fill-opacity=".6" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/></g><g data-part="micropyle"><title>micropyle: A small pore in the testa where the pollen tube entered; water enters here at germination.</title><circle cx="121.7" cy="246.5" r="4.2" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/></g><g data-part="endosperm"><title>endosperm: The food store of a monocot seed such as maize.</title><path d="M315 34 C372 40 380 200 315 270 C250 200 258 40 315 34 Z" fill="var(--vx-a1, #4f46e5)" fill-opacity=".18" stroke="var(--vx-a3, #ea580c)" stroke-width="5"/></g><g data-part="single cotyledon"><title>single cotyledon: A monocot has one cotyledon; the food is stored in the endosperm instead.</title><path d="M290 120 C270 130 270 200 300 238 C312 200 312 150 290 120 Z" fill="var(--vx-a4, #0d9488)" fill-opacity=".5" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/></g><g data-part="plumule"><title>plumule: The young shoot of the embryo.</title><path d="M297 128 q-3 -26 6 -40 q10 16 0 40" fill="var(--vx-good, #16a34a)" fill-opacity=".7" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/></g><g data-part="radicle"><title>radicle: The young root of the embryo.</title><path d="M294 236 q8 26 8 32 q0 -6 8 -32 Z" fill="var(--vx-a2, #db2777)" fill-opacity=".6" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/></g></g><circle cx="137.7" cy="117.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="137.7" y="118.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1</text><circle cx="124.9" cy="136.6" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="124.9" y="137.1" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2</text><circle cx="100.0" cy="54.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="100.0" y="54.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3</text><circle cx="99.1" cy="227.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="99.1" y="227.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4</text><circle cx="114.3" cy="219.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="114.3" y="219.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5</text><circle cx="305.7" cy="93.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="305.7" y="94.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6</text><circle cx="252.6" cy="170.9" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="252.6" y="171.4" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7</text><text x="14.0" y="287.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1  testa</text><text x="14.0" y="306.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2  cotyledon</text><text x="14.0" y="325.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3  plumule</text><text x="14.0" y="344.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4  radicle</text><text x="14.0" y="363.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5  micropyle</text><text x="14.0" y="382.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6  endosperm</text><text x="14.0" y="401.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7  single cotyledon</text></svg>