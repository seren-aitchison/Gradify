<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 233.9" width="760.0" height="233.9" role="img" aria-label="A flow chart: a controlled, energy-requiring death triggered by signals leads to apoptosis, with shrinking and no inflammation; death from severe injury leads to necrosis, with swelling, bursting and inflammation." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="30.0" y="24.4" width="400.0" height="75.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 62.3)"><text x="230.0" y="-17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is the death controlled and energy-requiring,</text><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">triggered by a signal such as DNA damage or a</text><text x="230.0" y="17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">death receptor?</text></g><path d="M430.0 62.3 L479.9 62.3" stroke="var(--vx-bad, #dc2626)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 62.3 L479.0 66.4 L479.0 58.1 Z" fill="var(--vx-bad, #dc2626)"/><text x="460.0" y="51.3" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><rect x="490.0" y="20.0" width="250.0" height="84.6" rx="12" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8"/><g transform="translate(615.0 62.3)"><text x="0.0" y="-25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Necrosis: severe injury; the</text><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">cell swells and bursts, and the</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">leaked contents cause</text><text x="0.0" y="25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">inflammation</text></g><path d="M230.0 102.2 L230.0 126.1" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 134.2 L225.9 125.2 L234.1 125.2 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="118.2" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="138.2" width="400.0" height="75.8" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 176.0)"><text x="230.0" y="-17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Apoptosis: the cell shrinks and breaks into</text><text x="230.0" y="0.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">apoptotic bodies; phagocytes remove them with</text><text x="230.0" y="17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no inflammation</text></g></svg>