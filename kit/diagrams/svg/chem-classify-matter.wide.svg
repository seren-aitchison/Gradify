<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 325.0" width="700.0" height="325.0" role="img" aria-label="A tree: is the sample one substance? Yes leads to: can it be broken down chemically? Yes, compound; no, element. No leads to: is it uniform throughout? Yes, homogeneous mixture; no, heterogeneous mixture." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M350.0 80.0 C350.0 104.0 180.0 106.0 180.0 130.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M180.0 128.0 L180.0 131.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M180.0 139.0 L176.3 131.0 L183.7 131.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="257.0" y="106.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M350.0 80.0 C350.0 104.0 520.0 106.0 520.0 130.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M520.0 128.0 L520.0 131.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M520.0 139.0 L516.3 131.0 L523.7 131.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="443.0" y="106.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><path d="M180.0 190.0 C180.0 214.0 95.0 216.0 95.0 240.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M95.0 238.0 L95.0 241.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M95.0 249.0 L91.3 241.0 L98.7 241.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="129.5" y="216.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M180.0 190.0 C180.0 214.0 265.0 216.0 265.0 240.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M265.0 238.0 L265.0 241.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M265.0 249.0 L261.3 241.0 L268.7 241.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="230.5" y="216.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><path d="M520.0 173.0 C520.0 197.0 435.0 216.0 435.0 240.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M435.0 238.0 L435.0 241.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M435.0 249.0 L431.3 241.0 L438.7 241.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="469.5" y="207.5" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="#fff" stroke-width="4" paint-order="stroke">yes</text><path d="M520.0 173.0 C520.0 197.0 605.0 216.0 605.0 240.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8"/><path d="M605.0 238.0 L605.0 241.8" stroke="var(--vx-line, #8a92a8)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M605.0 249.0 L601.3 241.0 L608.7 241.0 Z" fill="var(--vx-line, #8a92a8)"/><text x="570.5" y="207.5" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)" stroke="#fff" stroke-width="4" paint-order="stroke">no</text><rect x="220.0" y="30.0" width="260.0" height="50.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="350.0" y="46.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it one substance with a fixed</text><text x="350.0" y="63.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">composition?</text><rect x="50.0" y="140.0" width="260.0" height="50.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="180.0" y="156.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Can a chemical reaction break it</text><text x="180.0" y="173.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">down?</text><rect x="16.0" y="250.0" width="158.0" height="48.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="95.0" y="266.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Compound</text><text x="95.0" y="283.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. H<tspan baseline-shift="sub" font-size="8.3">2</tspan>O, NaCl, CO<tspan baseline-shift="sub" font-size="8.3">2</tspan></text><rect x="186.0" y="250.0" width="158.0" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="265.0" y="266.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Element</text><text x="265.0" y="283.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. O<tspan baseline-shift="sub" font-size="8.3">2</tspan>, Fe, He</text><rect x="390.0" y="140.0" width="260.0" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="520.0" y="156.0" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it the same throughout?</text><rect x="356.0" y="250.0" width="158.0" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.1" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="435.0" y="266.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Homogeneous mixture</text><text x="435.0" y="283.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. salt + water, air</text><text x="435.0" y="298.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">(N<tspan baseline-shift="sub" font-size="8.3">2</tspan>, O<tspan baseline-shift="sub" font-size="8.3">2</tspan>, Ar)</text><rect x="526.0" y="250.0" width="158.0" height="48.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="605.0" y="266.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Heterogeneous mixture</text><text x="605.0" y="283.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. sand + water</text></svg>