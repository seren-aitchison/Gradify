ize="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">T<tspan baseline-shift="sub" font-size="10.4">2</tspan></text><text x="402.0" y="60.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">W = 19.6 N at 270°</text><text x="402.0" y="82.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">T<tspan baseline-shift="sub" font-size="9.4">1</tspan> = 9.8 N at 150°</text><text x="402.0" y="104.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">T<tspan baseline-shift="sub" font-size="9.4">2</tspan> = 17 N at 60°</text><text x="402.0" y="126.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">net force = 0 (in equilibrium)</text></svg>