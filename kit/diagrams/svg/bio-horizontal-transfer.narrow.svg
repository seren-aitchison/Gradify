<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 388.1" width="380.0" height="388.1" role="img" aria-label="Three panels. Transformation: free DNA fragments above a bacterium and an arrow into it. Transduction: a bacteriophage between two bacteria with an arrow to the lower one. Conjugation: two bacteria joined by a pilus, a plasmid shown between them." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><text x="70.0" y="18.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">transformation</text><rect x="35" y="194" width="70" height="40" rx="20" fill="var(--vx-a4, #0d9488)" fill-opacity=".18" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/><circle cx="70" cy="214" r="9" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><g data-part="free DNA"><title>free DNA: DNA released into the environment by a dead cell, taken up by another bacterium: transformation.</title><path d="M30 70 q8 -12 16 0 t16 0 t16 0" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="3"/><path d="M60 118 q8 -12 16 0 t16 0" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="3"/><path d="M70.0 138.0 L70.0 177.9" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M70.0 186.0 L65.9 177.0 L74.1 177.0 Z" fill="var(--vx-a2, #db2777)"/></g><text x="210.0" y="18.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">transduction</text><rect x="175" y="42" width="70" height="40" rx="20" fill="var(--vx-a4, #0d9488)" fill-opacity=".18" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/><circle cx="210" cy="62" r="9" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><rect x="175" y="194" width="70" height="40" rx="20" fill="var(--vx-a4, #0d9488)" fill-opacity=".18" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/><circle cx="210" cy="214" r="9" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><g data-part="bacteriophage"><title>bacteriophage: A virus that carries a piece of bacterial DNA from one cell to the next: transduction.</title><g transform="translate(210 108)"><path d="M0 -14 l10 6 v11 l-10 6 l-10 -6 v-11 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".4" stroke="var(--vx-a3, #ea580c)" stroke-width="2.2"/><path d="M0 9 V30 M-8 35 L0 30 L8 35" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" fill="none"/><path d="M-5 -5 q2.5 -5 5 0 t5 0" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2"/></g><path d="M210.0 150.0 L210.0 181.9" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M210.0 190.0 L205.9 181.0 L214.1 181.0 Z" fill="var(--vx-a3, #ea580c)"/></g><text x="350.0" y="18.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">conjugation</text><rect x="315" y="42" width="70" height="40" rx="20" fill="var(--vx-a4, #0d9488)" fill-opacity=".18" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/><circle cx="350" cy="62" r="9" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><rect x="315" y="194" width="70" height="40" rx="20" fill="var(--vx-a4, #0d9488)" fill-opacity=".18" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/><circle cx="350" cy="214" r="9" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><g data-part="pilus"><title>pilus: A thin tube joining two bacteria through which a plasmid is passed from one to the other: conjugation.</title><path d="M350 82 V194" stroke="var(--vx-a1, #4f46e5)" stroke-width="7" stroke-linecap="round" opacity=".8"/><path d="M350 82 V194" stroke="var(--vx-panel, #f4f5fb)" stroke-width="2.4"/></g><g data-part="plasmid"><title>plasmid: A small circular DNA molecule, usually the DNA transferred in conjugation.</title><circle cx="372" cy="62" r="5.5" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.2"/><circle cx="350" cy="138" r="5.5" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.2"/><circle cx="372" cy="214" r="5.5" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.2"/></g></g><circle cx="44.3" cy="68.0" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="44.3" y="68.5" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1</text><circle cx="44.3" cy="191.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="44.3" y="191.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2</text><circle cx="200.3" cy="100.6" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="200.3" y="101.1" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3</text><circle cx="313.4" cy="100.6" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="313.4" y="101.1" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4</text><circle cx="310.0" cy="126.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="310.0" y="126.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5</text><text x="14.0" y="287.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1  free DNA</text><text x="14.0" y="306.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2  recipient cell</text><text x="14.0" y="325.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3  bacteriophage</text><text x="14.0" y="344.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4  pilus</text><text x="14.0" y="363.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5  plasmid</text></svg>