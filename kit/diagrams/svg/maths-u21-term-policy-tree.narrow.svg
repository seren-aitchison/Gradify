<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 100.0" width="380.0" height="100.0" role="img" aria-label="A tree with a death branch of probability 1/100 and a survival branch of 99/100." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><circle cx="24.0" cy="48.0" r="4" fill="var(--vx-ink, #151826)"/><path d="M28.0 48.0 L236.0 28.0" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><text x="130.0" y="27.0" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">1/100</text><text x="242.0" y="28.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Dies</text><path d="M28.0 48.0 L236.0 68.0" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><text x="130.0" y="71.0" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">99/100</text><text x="242.0" y="68.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Survives</text><text x="364.0" y="28.0" font-size="13" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">1/100</text><text x="364.0" y="68.0" font-size="13" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">99/100</text></svg>