<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 763.0" width="380.0" height="763.0" role="img" aria-label="A loop of eight boxes: right heart, pulmonary artery, lungs, pulmonary vein, left heart, aorta, body tissues and vena cava, with the oxygen-poor boxes in blue, the oxygen-rich ones in red and the lungs and body tissues, where gases are exchanged, in green." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 92.0 L190.0 117.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 126.0 L185.9 117.0 L194.1 117.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 184.0 L190.0 209.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 218.0 L185.9 209.0 L194.1 209.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 276.0 L190.0 301.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 310.0 L185.9 301.0 L194.1 301.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 368.0 L190.0 393.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 402.0 L185.9 393.0 L194.1 393.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 460.0 L190.0 485.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 494.0 L185.9 485.0 L194.1 485.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 552.0 L190.0 577.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 586.0 L185.9 577.0 L194.1 577.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 644.0 L190.0 669.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 678.0 L185.9 669.0 L194.1 669.0 Z" fill="var(--vx-ink, #151826)"/><path d="M100.9 707.0 H12.0 V55.5 H92.9" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linejoin="round"/><path d="M88.9 55.5 L90.8 55.5" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M98.9 55.5 L89.9 59.6 L89.9 51.4 Z" fill="var(--vx-ink, #151826)"/><rect x="100.9" y="24.0" width="178.3" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">right heart</text><text x="190.0" y="57.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">receives blood from the</text><text x="190.0" y="72.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">body</text><rect x="100.9" y="131.0" width="178.3" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="147.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">pulmonary artery</text><text x="190.0" y="164.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carries it to the lungs</text><rect x="117.6" y="223.0" width="144.7" height="48.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="239.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">lungs</text><text x="190.0" y="256.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">blood gains oxygen</text><rect x="123.4" y="315.0" width="133.2" height="48.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="331.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">pulmonary vein</text><text x="190.0" y="348.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carries it back</text><rect x="100.0" y="407.0" width="180.0" height="48.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="423.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">left heart</text><text x="190.0" y="440.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pumps it at high pressure</text><rect x="104.2" y="499.0" width="171.6" height="48.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="515.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">aorta</text><text x="190.0" y="532.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carries it to the body</text><rect x="107.6" y="591.0" width="164.9" height="48.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="607.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">body tissues</text><text x="190.0" y="624.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">blood gives up oxygen</text><rect x="100.9" y="683.0" width="178.3" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="699.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">vena cava</text><text x="190.0" y="716.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">returns it to the heart</text></svg>