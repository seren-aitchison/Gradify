ic">net force</text><text x="402.0" y="60.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">mg = 0.59 N, down</text><text x="402.0" y="82.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">drag = 0.025 N, up</text><text x="402.0" y="104.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">net force = 0.56 N, down</text><text x="402.0" y="126.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">drag ÷ weight ≈ 4%: neglect it for</text><text x="402.0" y="148.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">   a rough model</text></svg>