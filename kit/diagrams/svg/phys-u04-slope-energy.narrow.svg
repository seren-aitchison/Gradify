<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 300.0" width="380.0" height="300.0" role="img" aria-label="Energy flow diagram: 49 joules of potential energy in, 29 joules out as kinetic energy and 20 joules as heat from friction." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Where the energy goes on a rough slope</text><rect x="14.0" y="64.0" width="115.2" height="92.0" fill="var(--vx-a1, #4f46e5)" fill-opacity=".85"/><text x="14.0" y="54.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">potential energy lost: 49 J</text><path d="M129.2 64.0 H200.0 l20 27.2 l-20 27.2 H129.2 Z" fill="var(--vx-good, #16a34a)" fill-opacity=".8"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="226.0" y="91.2" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">kinetic energy: 29 J</text><path d="M129.2 118.4 H135.2 A47.6 47.6 0 0 1 182.8 166.0 V226.0 l-18.8 14 l-18.8 -14 V166.0 A10.0 10.0 0 0 0 135.2 156.0 H129.2 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".78"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="164.0" y="252.0" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">heat (friction): 20 J</text><text x="14.0" y="286.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">efficiency = useful ÷ input = 29 ÷ 49 = 59.2%</text></svg>