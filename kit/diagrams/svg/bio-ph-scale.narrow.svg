dle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6</text><text x="166.3" y="182.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="7.6">-6</tspan></text><path d="M190.0 146 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="190.0" y="163.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7</text><path d="M213.7 146 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="213.7" y="163.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8</text><text x="213.7" y="182.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="7.6">-8</tspan></text><path d="M237.4 146 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="237.4" y="163.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">9</text><path d="M261.1 146 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="261.1" y="163.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">10</text><text x="261.1" y="182.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="7.6">-10</tspan></text><path d="M284.9 146 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="284.9" y="163.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">11</text><path d="M308.6 146 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="308.6" y="163.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">12</text><text x="308.6" y="182.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="7.6">-12</tspan></text><path d="M332.3 146 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="332.3" y="163.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">13</text><path d="M356.0 146 v6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.2"/><text x="356.0" y="163.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">14</text><text x="356.0" y="182.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="7.6">-14</tspan></text><text x="190.0" y="202.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pH, and [H<tspan baseline-shift="super" font-size="8.3">+</tspan>] in mol dm<tspan baseline-shift="super" font-size="8.3">-3</tspan></text><text x="24.0" y="202.0" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">← acidic</text><text x="356.0" y="202.0" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">alkaline →</text><g data-part="stomach"><title>stomach: The stomach is at about pH 2.</title><path d="M71.4 118 V84 M71.4 118 V84" stroke="var(--vx-ink, #151826)" stroke-width="2"/></g><text x="71.4" y="80.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">stomach: about pH 2</text><g data-part="neutral (25 °C)"><title>neutral (25 °C): pH 7 is neutral at 25 °C.</title><path d="M190.0 118 V102 M190.0 118 V102" stroke="var(--vx-ink, #151826)" stroke-width="2"/></g><text x="184.0" y="98.0" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">neutral: pH 7</text><g data-part="human blood"><title>human blood: Human blood is kept at about pH 7.35–7.45.</title><path d="M198.3 118 V102 M200.7 118 V102" stroke="var(--vx-ink, #151826)" stroke-width="2"/><rect x="198.3" y="112" width="2.4" height="34" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/></g><text x="206.7" y="98.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">blood: 7.35–7.45</text><path d="M118.9 204 q-11.9 26 -23.7 0" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="2.2"/><text x="107.0" y="242.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">× 10</text><text x="16.0" y="270.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">[H<tspan baseline-shift="super" font-size="8.3">+</tspan>] = 1 × 10<tspan baseline-shift="super" font-size="8.3">-4</tspan> mol dm<tspan baseline-shift="super" font-size="8.3">-3</tspan></text><text x="16.0" y="289.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">→ pH = −log<tspan baseline-shift="sub" font-size="8.3">10</tspan>(10<tspan baseline-shift="super" font-size="8.3">-4</tspan>) = 4</text><text x="16.0" y="312.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">[H<tspan baseline-shift="super" font-size="8.3">+</tspan>] rises tenfold to 1 × 10<tspan baseline-shift="super" font-size="8.3">-3</tspan></text><text x="16.0" y="331.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">→ the pH falls to 3</text><text x="16.0" y="354.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">pH 3 has ten times the hydrogen ion</text><text x="16.0" y="373.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">concentration of pH 4, not twice</text></svg>