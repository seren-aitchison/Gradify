<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 402.0" width="380.0" height="402.0" role="img" aria-label="A coloured bar from pH 0 on the left to pH 14 on the right, labelled acidic and alkaline, with the hydrogen ion concentration under each unit falling from 1 to 10 to the minus 14, markers for the stomach at about pH 2, neutral at pH 7 and blood at 7.35 to 7.45, and a worked example: a tenfold rise in [H⁺] from 10 to the minus 4 to 10 to the minus 3 lowers the pH from 4 to 3." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g data-part="pH scale"><title>pH scale: pH = −log₁₀[H⁺]: low pH is acidic, high pH is alkaline.</title><rect x="24.0" y="120" width="24.2" height="26" fill="hsl(17 72% 62%)" fill-opacity=".8"/><rect x="47.7" y="120" width="24.2" height="26" fill="hsl(35 72% 62%)" fill-opacity=".8"/><rect x="71.4" y="120" width="24.2" height="26" fill="hsl(53 72% 62%)" fill-opacity=".8"/><rect x="95.1" y="120" width="24.2" height="26" fill="hsl(71 72% 62%)" fill-opacity=".8"/><rect x="118.9" y="120" width="24.2" height="26" fill="hsl(88 72% 62%)" fill-opacity=".8"/><rect x="142.6" y="120" width="24.2" height="26" fill="hsl(106 72% 62%)" fill-opacity=".8"/><rect x="166.3" y="120" width="24.2" height="26" fill="hsl(124 72% 62%)" fill-opacity=".8"/><rect x="190.0" y="120" width="24.2" height="26" fill="hsl(142 72% 62%)" fill-opacity=".8"/><rect x="213.7" y="120" width="24.2" height="26" fill="hsl(160 72% 62%)" fill-opacity=".8"/><rect x="237.4" y="120" width="24.2" height="26" fill="hsl(178 72% 62%)" fill-opacity=".8"/><rect x="261.1" y="120" width="24.2" height="26" fill="hsl(196 72% 62%)" fill-opacity=".8"/><rect x="284.9" y="120" width="24.2" height="26" fill="hsl(213 72% 62%)" fill-opacity=".8"/><rect x="308.6" y="120" width="24.2" height="26" fill="hsl(231 72% 62%)" fill-opacity=".8"/><rect x="332.3" y="120" width="24.2" height="26" fill="hsl(249 72% 62%)" fill-opacity=".8"/></g><path d="M24.0 146 v6" stroke="v