<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 456.0" width="380.0" height="456.0" role="img" aria-label="A cycle of RuBP, GP and triose phosphate: RuBisCO fixes CO2 onto RuBP to give GP, GP is reduced to triose phosphate, and triose phosphate regenerates RuBP, with one triose phosphate in six leaving." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 69.0 L190.0 91.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 99.5 L185.9 90.5 L194.1 90.5 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 172.5 L190.0 179.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 188.0 L185.9 179.0 L194.1 179.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 276.0 L190.0 283.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 291.5 L185.9 282.5 L194.1 282.5 Z" fill="var(--vx-ink, #151826)"/><rect x="147.8" y="16.0" width="84.4" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="32.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">RuBP</text><text x="190.0" y="49.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">5 carbons</text><rect x="100.0" y="104.5" width="180.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="120.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">GP</text><text x="190.0" y="137.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">3 carbons, made by fixing</text><text x="190.0" y="152.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">CO<tspan baseline-shift="sub" font-size="8.3">2</tspan> (RuBisCO)</text><rect x="104.2" y="193.0" width="171.6" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="209.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">triose phosphate</text><text x="190.0" y="226.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">3 carbons, made by</text><text x="190.0" y="241.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">reduction with ATP and</text><text x="190.0" y="256.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">NADPH</text><rect x="104.2" y="296.5" width="171.6" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="312.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">RuBP again</text><text x="190.0" y="329.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">5 carbons, regenerated</text><text x="190.0" y="344.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">using ATP</text><text x="190.0" y="394.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">One triose phosphate in six leaves the cycle</text><text x="190.0" y="411.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">to make sugars; six turns fix six CO<tspan baseline-shift="sub" font-size="8.6">2</tspan> into</text><text x="190.0" y="428.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">one glucose.</text></svg>