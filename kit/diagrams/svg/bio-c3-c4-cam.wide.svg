<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 294.6" width="760.0" height="294.6" role="img" aria-label="A flow chart: no four-carbon acid means C3; a four-carbon acid with steps in different cells means C4; with steps at different times means CAM." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="30.0" y="20.0" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 48.9)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Does the plant first fix CO₂ into a</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">four-carbon acid (with PEP carboxylase)?</text></g><path d="M430.0 48.9 L479.9 48.9" stroke="var(--vx-a4, #0d9488)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 48.9 L479.0 53.1 L479.0 44.8 Z" fill="var(--vx-a4, #0d9488)"/><text x="460.0" y="37.9" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><rect x="490.0" y="23.3" width="250.0" height="51.3" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8"/><g transform="translate(615.0 48.9)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">C3: RuBisCO fixes CO₂ directly</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">in the Calvin cycle</text></g><path d="M230.0 79.8 L230.0 103.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 111.8 L225.9 102.8 L234.1 102.8 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="95.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="120.9" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 149.8)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are the steps in different cells: mesophyll,</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">then bundle sheath?</text></g><path d="M430.0 149.8 L479.9 149.8" stroke="var(--vx-a3, #ea580c)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 149.8 L479.0 153.9 L479.0 145.7 Z" fill="var(--vx-a3, #ea580c)"/><text x="460.0" y="138.8" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="490.0" y="115.8" width="250.0" height="67.9" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8"/><g transform="translate(615.0 149.8)"><text x="0.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">CAM: steps separated in time.</text><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Stomata open at night: cacti,</text><text x="0.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">pineapples</text></g><path d="M230.0 180.7 L230.0 204.6" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 212.7 L225.9 203.7 L234.1 203.7 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="196.7" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="216.7" width="400.0" height="57.8" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 245.6)"><text x="230.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">C4: steps separated in space. Maize,</text><text x="230.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">sugarcane; good in hot, sunny, dry conditions</text></g></svg>