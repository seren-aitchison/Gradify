" stroke-width="4" paint-order="stroke">condensation</text><text x="154.0" y="235.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">and</text><text x="154.0" y="248.5" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">precipitation</text><text x="256.3" y="369.3" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">runoff</text><text x="321.9" y="235.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">river flow</text><text x="144.4" y="340.4" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">infiltration</text><text x="98.1" y="235.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">root uptake</text><text x="144.4" y="129.6" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)" stroke="var(--vx-bg, #ffffff)" stroke-width="4" paint-order="stroke">transpiration</text></svg>