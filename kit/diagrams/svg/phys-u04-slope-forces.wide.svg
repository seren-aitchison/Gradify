1, #4f46e5)" font-style="italic">N</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="141.3" y="176.9" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" font-style="italic">f</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="185.3" y="255.5" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" font-style="italic">net force</text><text x="402.0" y="60.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">W = 9.8 N at 270°</text><text x="402.0" y="82.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">N = 8.49 N at 60°</text><text x="402.0" y="104.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">f = 1.7 N at 150°</text><text x="402.0" y="126.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">net force = 3.2 N at 330°</text></svg>