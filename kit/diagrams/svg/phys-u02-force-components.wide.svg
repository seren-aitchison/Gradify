<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660.0 386.0" width="660.0" height="386.0" role="img" aria-label="A 50 newton force arrow at 30 degrees above the horizontal with its horizontal component of 43.3 newtons and vertical component of 25 newtons dashed." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Resolving the 50 N force</text><circle cx="53.3" cy="288.5" r="4" fill="var(--vx-ink, #151826)"/><path d="M53.3 288.5 L347.8 118.5" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M356.3 113.5 L349.3 123.4 L344.3 114.6 Z" fill="var(--vx-a1, #4f46e5)"/><path d="M53.3 288.5 L349.1 288.5" stroke="var(--vx-soft, #5b6275)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" fill="none"/><path d="M356.3 288.5 L348.3 292.2 L348.3 284.8 Z" fill="var(--vx-soft, #5b6275)"/><path d="M356.3 288.5 L356.3 120.7" stroke="var(--vx-soft, #5b6275)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" fill="none"/><path d="M356.3 113.5 L360.0 121.5 L352.7 121.5 Z" fill="var(--vx-soft, #5b6275)"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="196.8" y="187.1" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">F</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="204.8" y="272.5" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">43.3 N</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="309.1" y="201.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">25 N</text><text x="402.0" y="60.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">F = 50 N at 30° above horizontal</text><text x="402.0" y="82.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">W = F cos θ × d = 43.3 × 4.0 = 173</text><text x="402.0" y="104.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">   J</text></svg>