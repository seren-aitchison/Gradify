<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 508.0" width="380.0" height="508.0" role="img" aria-label="Five boxes in order: a change in the variable, the receptor, the coordinator, the effector and the restored set point." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 84.0 L190.0 94.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 103.0 L185.9 94.0 L194.1 94.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 161.0 L190.0 179.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 187.5 L185.9 178.5 L194.1 178.5 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 260.5 L190.0 271.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 279.5 L185.9 270.5 L194.1 270.5 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 352.5 L190.0 363.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 371.5 L185.9 362.5 L194.1 362.5 Z" fill="var(--vx-ink, #151826)"/><rect x="100.9" y="1.0" width="178.3" height="78.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="17.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">change</text><text x="190.0" y="34.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a controlled variable</text><text x="190.0" y="49.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">moves away from its set</text><text x="190.0" y="64.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">point</text><rect x="117.6" y="108.0" width="144.7" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="124.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">receptor</text><text x="190.0" y="141.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">detects the change</text><rect x="100.0" y="192.5" width="180.0" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="208.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">coordinator</text><text x="190.0" y="225.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">such as the brain,</text><text x="190.0" y="240.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">processes the information</text><rect x="100.0" y="284.5" width="180.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="300.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">effector</text><text x="190.0" y="317.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carries out a response,</text><text x="190.0" y="332.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">such as a gland or muscle</text><rect x="100.0" y="376.5" width="180.0" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="392.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">set point restored</text><text x="190.0" y="409.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the response reverses the</text><text x="190.0" y="424.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">change</text></svg>