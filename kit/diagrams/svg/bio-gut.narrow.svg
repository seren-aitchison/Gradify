<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 731.0" width="380.0" height="731.0" role="img" aria-label="Six boxes in order: mouth, oesophagus, stomach, small intestine, large intestine and rectum; a separate box for the accessory organs (liver, gall bladder and pancreas) with a dashed arrow into the small intestine." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 92.0 L190.0 117.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 126.0 L185.9 117.0 L194.1 117.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 184.0 L190.0 209.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 218.0 L185.9 209.0 L194.1 209.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 291.0 L190.0 316.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 325.0 L185.9 316.0 L194.1 316.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 398.0 L190.0 423.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 432.0 L185.9 423.0 L194.1 423.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 505.0 L190.0 530.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 539.0 L185.9 530.0 L194.1 530.0 Z" fill="var(--vx-ink, #151826)"/><path d="M100.9 667.5 H12.0 V361.5 H92.0" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M88.0 361.5 L89.9 361.5" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M98.0 361.5 L89.0 365.6 L89.0 357.4 Z" fill="var(--vx-ink, #151826)"/><text x="180.0" y="318.0" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">secrete into</text><rect x="104.2" y="24.0" width="171.6" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">mouth</text><text x="190.0" y="57.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">teeth chew; saliva has</text><text x="190.0" y="72.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">amylase</text><rect x="100.0" y="131.0" width="180.0" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="147.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">oesophagus</text><text x="190.0" y="164.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">peristalsis moves the food</text><rect x="100.0" y="223.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="239.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">stomach</text><text x="190.0" y="256.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">churns; hydrochloric acid</text><text x="190.0" y="271.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and pepsin</text><rect x="100.0" y="330.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="346.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">small intestine</text><text x="190.0" y="363.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the main site of digestion</text><text x="190.0" y="378.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and absorption</text><rect x="110.9" y="437.0" width="158.2" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="453.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">large intestine</text><text x="190.0" y="470.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">absorbs water; makes</text><text x="190.0" y="485.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">faeces</text><rect x="121.0" y="544.0" width="138.0" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="560.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">rectum</text><text x="190.0" y="577.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">stores the faeces</text><rect x="100.9" y="636.0" width="178.3" height="63.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="652.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">accessory organs</text><text x="190.0" y="669.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">liver, gall bladder and</text><text x="190.0" y="684.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pancreas</text></svg>