<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 230.0" width="700.0" height="230.0" role="img" aria-label="Seven boxes in order: adrenaline, a G-protein-coupled receptor, adenylyl cyclase, cyclic AMP, protein kinase A, a chain of enzymes, and glucose released from glycogen." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M169.0 56.0 L177.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M186.0 56.0 L177.0 60.1 L177.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M344.0 56.0 L349.5 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M357.6 56.0 L348.6 60.1 L348.6 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M512.4 56.0 L522.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M531.0 56.0 L522.0 60.1 L522.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M605.0 100.0 L605.0 136.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M605.0 144.5 L600.9 135.5 L609.1 135.5 Z" fill="var(--vx-ink, #151826)"/><path d="M531.0 182.0 L522.1 182.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M514.0 182.0 L523.0 177.9 L523.0 186.1 Z" fill="var(--vx-ink, #151826)"/><path d="M356.0 182.0 L340.4 182.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M332.3 182.0 L341.3 177.9 L341.3 186.1 Z" fill="var(--vx-ink, #151826)"/><rect x="26.0" y="17.0" width="138.0" height="78.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="95.0" y="33.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">adrenaline</text><text x="95.0" y="50.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">first messenger:</text><text x="95.0" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">stays outside the</text><text x="95.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cell</text><rect x="191.0" y="16.0" width="148.0" height="80.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="265.0" y="32.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">G-protein-coupled</text><text x="265.0" y="49.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">receptor</text><text x="265.0" y="66.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">in the membrane:</text><text x="265.0" y="81.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the hormone binds</text><rect x="362.6" y="16.0" width="144.7" height="80.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="435.0" y="32.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">adenylyl</text><text x="435.0" y="49.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">cyclase</text><text x="435.0" y="66.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">switched on inside</text><text x="435.0" y="81.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the membrane</text><rect x="536.0" y="17.0" width="138.0" height="78.0" rx="12" fill=