<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 272.0" width="700.0" height="272.0" role="img" aria-label="A pyramid of four layers. From the base: economic, legal, ethical, philanthropic." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="94.4" y="16.0" width="187.2" height="52" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity=".14" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="42.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Philanthropic</text><path d="M285.6 42.0 L384.0 42.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="34.3" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">be a good corporate citizen: donations,</text><text x="390.0" y="49.8" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">community work</text><rect x="65.6" y="73.0" width="244.8" height="52" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="99.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Ethical</text><path d="M314.4 99.0 L384.0 99.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="91.3" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">do what is right and fair, even where not</text><text x="390.0" y="106.8" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">required</text><rect x="36.8" y="130.0" width="302.4" height="52" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity=".14" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="156.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Legal</text><path d="M343.2 156.0 L384.0 156.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="156.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">obey the law</text><rect x="8.0" y="187.0" width="360.0" height="52" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity=".14" stroke="var(--vx-a2, #db2777)" stroke-opacity=".6" stroke-width="1.3"/><text x="188.0" y="213.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Economic</text><path d="M372.0 213.0 L384.0 213.0" stroke="var(--vx-grid, #e6e8f0)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/><text x="390.0" y="205.3" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">be profitable: the base on which</text><text x="390.0" y="220.8" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">everything else rests</text><text x="350.0" y="256.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">all four are met at the same time</text></svg>