<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 278.9" width="380.0" height="278.9" role="img" aria-label="A flow chart: if the viral DNA does not integrate into the host chromosome, the cycle is lytic and the cell bursts; if it integrates as a prophage, the cycle is lysogenic, and may later become lytic." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 48.9)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Does the viral genome integrate into</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">the host chromosome?</text></g><path d="M30.0 77.8 L30.0 105.8" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 105.8 L34.7 105.8" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 105.8 L34.0 109.1 L34.0 102.6 Z" fill="var(--vx-bad, #dc2626)"/><rect x="42.0" y="89.8" width="270.0" height="63.3" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.6"/><text x="177.0" y="103.8" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><g transform="translate(0 137.5)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Lytic: the virus replicates</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">immediately and the cell bursts</text></g><path d="M338.0 79.8 L338.0 171.0" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 179.1 L333.9 170.1 L342.1 170.1 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 121.5)" x="332.0" y="121.5" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="183.1" width="340.0" height="75.8" rx="14" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><g transform="translate(0 221.0)"><text x="190.0" y="-17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Lysogenic: the genome is a</text><text x="190.0" y="0.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">prophage, copied with the host</text><text x="190.0" y="17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">DNA, and later may become lytic</text></g></svg>