<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 230.0" width="700.0" height="230.0" role="img" aria-label="Seven boxes in order: nucleus, ribosome on the rough endoplasmic reticulum, rough ER, transport vesicle, Golgi apparatus, secretory vesicle and plasma membrane." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M172.4 56.0 L177.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M186.0 56.0 L177.0 60.1 L177.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M344.0 56.0 L347.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M356.0 56.0 L347.0 60.1 L347.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M514.0 56.0 L522.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M531.0 56.0 L522.0 60.1 L522.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M605.0 108.5 L605.0 129.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M605.0 138.0 L600.9 129.0 L609.1 129.0 Z" fill="var(--vx-ink, #151826)"/><path d="M526.0 182.0 L517.1 182.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M509.0 182.0 L518.0 177.9 L518.0 186.1 Z" fill="var(--vx-ink, #151826)"/><path d="M361.0 182.0 L352.1 182.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M344.0 182.0 L353.0 177.9 L353.0 186.1 Z" fill="var(--vx-ink, #151826)"/><rect x="22.6" y="24.5" width="144.7" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="95.0" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">nucleus</text><text x="95.0" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the gene is copied</text><text x="95.0" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">into mRNA</text><rect x="191.0" y="16.0" width="148.0" height="80.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="265.0" y="32.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">ribosome on the</text><text x="265.0" y="49.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">rough ER</text><text x="265.0" y="66.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">translates the mRNA</text><text x="265.0" y="81.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">into a polypeptide</text><rect x="361.0" y="17.0" width="148.0" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="435.0" y="33.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">rough ER</text><text x="435.0" y="50.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the chain is</text><text x="435.0" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">threaded in, folded</text><text x="435.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and given sugars</text><rect x="536.0" y="8.5" width="138.0" height="95.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="605.0" y="24.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">transport</text><text x="605.0" y="41.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">vesicle</text><text x="605.0" y="58.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">buds off and</text><text x="605.0" y="73.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carries it to the</text><text x="605.0" y="88.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Golgi</text><rect x="531.0" y="143.0" width="148.0" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="605.0" y="159.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Golgi apparatus</text><text x="605.0" y="176.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">modifies it from</text><text x="605.0" y="191.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the cis face to the</text><text x="605.0" y="206.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">trans face</text><rect x="366.0" y="142.0" width="138.0" height="80.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="435.0" y="158.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">secretory</text><text x="435.0" y="175.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">vesicle</text><text x="435.0" y="192.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carries it to the</text><text x="435.0" y="207.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cell surface</text><rect x="191.0" y="143.0" width="148.0" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="265.0" y="159.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">plasma membrane</text><text x="265.0" y="176.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the vesicle fuses:</text><text x="265.0" y="191.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">exocytosis releases</text><text x="265.0" y="206.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">it</text></svg>