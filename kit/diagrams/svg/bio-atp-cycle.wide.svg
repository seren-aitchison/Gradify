<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 338.0" width="700.0" height="338.0" role="img" aria-label="A cycle between ATP, with three phosphate groups, and ADP plus inorganic phosphate: hydrolysis releases energy, and ATP synthase uses energy from respiration or photosynthesis to rebuild ATP." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M350.0 96.5 Q295.0 160.0 350.0 216.0" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/><path d="M344.5 206.0 L346.1 208.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M350.0 216.0 L342.0 210.1 L349.3 206.1 Z" fill="var(--vx-ink, #151826)"/><text x="310.5" y="141.1" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hydrolysis (ATPase):</text><text x="310.5" y="158.1" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">releases about 30.5 kJ per</text><text x="310.5" y="175.1" font-size="11.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">mole</text><path d="M350.0 216.0 Q405.0 160.0 350.0 96.5" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2"/><path d="M355.5 106.5 L353.9 103.6" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M350.0 96.5 L358.0 102.4 L350.7 106.4 Z" fill="var(--vx-ink, #151826)"/><text x="389.5" y="132.6" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">condensation (ATP</text><text x="389.5" y="149.6" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">synthase): energy from</text><text x="389.5" y="166.6" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">respiration or</text><text x="389.5" y="183.6" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">photosynthesis</text><rect x="264.2" y="28.5" width="171.6" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="350.0" y="44.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">ATP</text><text x="350.0" y="61.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">adenine, ribose, three</text><text x="350.0" y="76.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">phosphates</text><rect x="264.2" y="221.0" width="171.6" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="350.0" y="237.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">ADP + Pi</text><text x="350.0" y="254.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">adenine, ribose, two</text><text x="350.0" y="269.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">phosphates, and a free</text><text x="350.0" y="284.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">phosphate</text></svg>