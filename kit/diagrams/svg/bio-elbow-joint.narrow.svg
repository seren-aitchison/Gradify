<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 483.1" width="380.0" height="483.1" role="img" aria-label="A side view of an arm bent at the elbow. The humerus is horizontal and the forearm points up to the right. A capsule round the joint holds synovial fluid, with cartilage on the bone ends and ligaments joining the bones. A thick, contracted biceps above is joined to the forearm by a tendon, and a thin, relaxed triceps below is joined by a tendon behind the elbow." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><g transform="translate(-36 -50) scale(1.4)"><g data-part="synovial fluid"><title>synovial fluid: Lubricates the joint.</title><ellipse cx="200" cy="160" rx="38" ry="30" fill="var(--vx-a1, #4f46e5)" fill-opacity=".22"/></g><g data-part="humerus"><title>humerus: The upper arm bone: fixed while the forearm moves.</title><path d="M40.0 160.0 L200.0 160.0" stroke="var(--vx-a3, #ea580c)" stroke-width="22" stroke-linecap="round" stroke-opacity="0.4" fill="none"/><path d="M40.0 160.0 L200.0 160.0" stroke="var(--vx-a3, #ea580c)" stroke-width="22" stroke-linecap="round" stroke-opacity="0" fill="none"/></g><g data-part="radius and ulna"><title>radius and ulna: The forearm bones, which the muscles move as a lever about the elbow.</title><path d="M200.0 160.0 L296.4 45.1" stroke="var(--vx-a3, #ea580c)" stroke-width="18" stroke-linecap="round" stroke-opacity="0.4" fill="none"/></g><g data-part="cartilage"><title>cartilage: Smooth tissue covering the bone ends, so they glide.</title><circle cx="196" cy="160" r="13" fill="var(--vx-a4, #0d9488)" fill-opacity=".7" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><circle cx="203.9" cy="155.4" r="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".7" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/></g><g data-part="joint capsule"><title>joint capsule: The capsule round a synovial joint.</title><ellipse cx="200" cy="160" rx="38" ry="30" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="2.6" stroke-dasharray="5 3"/></g><g data-part="ligament"><title>ligament: Joins bone to bone and holds the joint together.</title><path d="M180.0 146.0 L203.9 139.8" stroke="var(--vx-good, #16a34a)" stroke-width="4" stroke-linecap="round" stroke-opacity="1" fill="none"/><path d="M182.0 175.0 L217.4 156.3" stroke="var(--vx-good, #16a34a)" stroke-width="4" stroke-linecap="round" stroke-opacity="1" fill="none"/></g><g data-part="biceps"><title>biceps: Contracts and shortens to bend the elbow.</title><path d="M88.0 148.0 Q136.6 153.9 172.0 120.0 Q123.4 114.1 88.0 148.0 Z" fill="var(--vx-a2, #db2777)" fill-opacity="0.6" stroke="var(--vx-a2, #db2777)" stroke-width="2"/></g><g data-part="triceps"><title>triceps: Relaxes and lengthens as the elbow bends; it contracts to straighten it.</title><path d="M88.0 172.0 Q130.4 188.9 176.0 186.0 Q133.6 169.1 88.0 172.0 Z" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.25" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/></g><g data-part="tendon"><title>tendon: Joins muscle to bone.</title><path d="M172.0 120.0 L218.8 123.6" stroke="var(--vx-ink, #151826)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" fill="none"/><path d="M176.0 186.0 L203.5 176.0" stroke="var(--vx-ink, #151826)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" fill="none"/></g><g data-part="pull"><title>pull: A muscle can only pull: it never pushes.</title><path d="M220.8 125.6 L196.5 117.2" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M188.8 114.6 L198.7 113.6 L196.0 121.4 Z" fill="var(--vx-a2, #db2777)"/></g><g data-part="pivot"><title>pivot: The hinge joint is the pivot of the lever.</title><circle cx="200" cy="160" r="4.2" fill="var(--vx-ink, #151826)"/></g><text x="300.0" y="244.0" font-size="10" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">biceps contracts, triceps relaxes: the forearm is pulled up</text></g></g><circle cx="63.1" cy="161.9" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="63.1" y="162.4" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1</text><circle cx="311.7" cy="46.8" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="311.7" y="47.3" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2</text><circle cx="135.1" cy="106.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="135.1" y="107.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3</text><circle cx="135.1" cy="190.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="135.1" y="191.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4</text><circle cx="213.6" cy="111.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="213.6" y="111.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5</text><circle cx="211.6" cy="168.8" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="211.6" y="169.3" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6</text><circle cx="192.7" cy="148.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="192.7" y="149.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7</text><circle cx="251.5" cy="175.1" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="251.5" y="175.6" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8</text><circle cx="262.3" cy="140.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="262.3" y="140.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">9</text><circle cx="219.1" cy="157.1" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="219.1" y="157.6" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">10</text><text x="14.0" y="287.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1  humerus</text><text x="14.0" y="306.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2  radius and ulna</text><text x="14.0" y="325.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3  biceps</text><text x="14.0" y="344.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4  triceps</text><text x="14.0" y="363.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5  tendon</text><text x="14.0" y="382.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6  ligament</text><text x="14.0" y="401.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7  cartilage</text><text x="14.0" y="420.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8  synovial fluid</text><text x="14.0" y="439.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">9  joint capsule</text><text x="14.0" y="458.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">10  pivot</text></svg>