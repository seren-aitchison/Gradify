<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 252.0" width="700.0" height="252.0" role="img" aria-label="Four boxes: power culture (a spider's web), role culture (a Greek temple), task culture (a net), person culture (barristers' chambers)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="12.0" width="338.0" height="112.0" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="50.6" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Power culture</text><text x="17.0" y="71.9" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Spider's web: a central figure controls. Fast, but</text><text x="17.0" y="86.3" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">depends on one person.</text><rect x="354.0" y="12.0" width="338.0" height="112.0" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="363.0" y="50.6" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Role culture</text><text x="363.0" y="71.9" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Greek temple: rules and procedures. Stable but</text><text x="363.0" y="86.3" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">slow.</text><rect x="8.0" y="132.0" width="338.0" height="112.0" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="170.6" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Task culture</text><text x="17.0" y="191.9" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Net: teams form around projects. Flexible and</text><text x="17.0" y="206.3" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">expert-led; costly.</text><rect x="354.0" y="132.0" width="338.0" height="112.0" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="363.0" y="170.6" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Person culture</text><text x="363.0" y="191.9" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">The organisation serves individuals, as in</text><text x="363.0" y="206.3" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">barristers' chambers.</text></svg>