<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 459.5" width="380.0" height="459.5" role="img" aria-label="A chain of five primary activities (inbound logistics, operations, outbound logistics, marketing and sales, service) with four support activities above, ending in margin." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="10.0" y="14.0" width="360.0" height="43.5" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.1" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="190.0" y="28.9" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Support: Firm infrastructure · Human resource management</text><text x="190.0" y="42.6" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">· Technology development · Procurement</text><rect x="10.0" y="66.0" width="360.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="81.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Inbound logistics</text><text x="19.0" y="101.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">receiving and storing inputs</text><rect x="10.0" y="138.1" width="360.0" height="50.1" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="153.6" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Operations</text><text x="19.0" y="173.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">turning inputs into products</text><rect x="10.0" y="210.3" width="360.0" height="50.