<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 448.0" width="380.0" height="448.0" role="img" aria-label="A logarithmic scale of coherence length in metres from 10^-7 to 10^4 with white light at about 1 micrometre, an LED at 20 micrometres, a sodium lamp at 1 millimetre, a HeNe laser at tenths of a metre and stabilised lasers at kilometres." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Coherence lengths of light sources</text><path d="M62.0 418.0 L62.0 55.2" stroke="var(--vx-ink, #151826)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M62.0 48.0 L65.7 56.0 L58.3 56.0 Z" fill="var(--vx-ink, #151826)"/><text x="70.0" y="44.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">coherence length / m</text><path d="M57.0 418.0 L67.0 418.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="418.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-7</tspan></text><path d="M57.0 385.3 L67.0 385.3" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="385.3" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-6</tspan></text><path d="M57.0 352.5 L67.0 352.5" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="352.5" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-5</tspan></text><path d="M57.0 319.8 L67.0 319.8" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="319.8" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-4</tspan></text><path d="M57.0 287.1 L67.0 287.1" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="287.1" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-3</tspan></text><path d="M57.0 254.4 L67.0 254.4" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="254.4" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-2</tspan></text><path d="M57.0 221.6 L67.0 221.6" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="221.6" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-1</tspan></text><path d="M57.0 188.9 L67.0 188.9" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="188.9" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">0</tspan></text><path d="M57.0 156.2 L67.0 156.2" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="156.2" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">1</tspan></text><path d="M57.0 123.5 L67.0 123.5" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="5