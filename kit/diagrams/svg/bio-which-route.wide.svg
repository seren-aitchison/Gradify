<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 492.6" width="760.0" height="492.6" role="img" aria-label="A flow chart of questions leading to bulk transport, active transport, simple diffusion, osmosis or facilitated diffusion." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="30.0" y="20.0" width="400.0" height="75.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 57.9)"><text x="230.0" y="-17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it a single small molecule or ion, not a</text><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">macromolecule or a particle such as a</text><text x="230.0" y="17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">bacterium?</text></g><path d="M430.0 57.9 L479.9 57.9" stroke="var(--vx-a3, #ea580c)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 57.9 L479.0 62.0 L479.0 53.7 Z" fill="var(--vx-a3, #ea580c)"/><text x="460.0" y="46.9" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="490.0" y="32.2" width="250.0" height="51.3" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8"/><g transform="translate(615.0 57.9)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Endocytosis or exocytosis:</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">carried in a vesicle, using ATP</text></g><path d="M230.0 97.8 L230.0 121.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 129.8 L225.9 120.8 L234.1 120.8 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="113.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="139.4" width="400.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 159.4)"><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it moving down its concentration gradient?</text></g><path d="M430.0 159.4 L479.9 159.4" stroke="var(--vx-a3, #ea580c)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 159.4 L479.0 163.5 L479.0 155.3 Z" fill="var(--vx-a3, #ea580c)"/><text x="460.0" y="148.4" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="490.0" y="133.8" width="250.0" height="51.3" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8"/><g transform="translate(615.0 159.4)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Active transport: a pump moves</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">it, using ATP</text></g><path d="M230.0 181.4 L230.0 205.3" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 213.4 L225.9 204.4 L234.1 204.4 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="197.4" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="223.0" width="400.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 243.0)"><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it charged or polar?</text></g><path d="M430.0 243.0 L479.9 243.0" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 243.0 L479.0 247.1 L479.0 238.9 Z" fill="var(--vx-good, #16a34a)"/><text x="460.0" y="232.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no</text><rect x="490.0" y="217.4" width="250.0" height="51.3" rx="12" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8"/><g transform="translate(615.0 243.0)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Simple diffusion through the</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">lipid: O₂, CO₂, steroids</text></g><path d="M230.0 265.0 L230.0 288.9" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 297.0 L225.9 288.0 L234.1 288.0 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="281.0" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="301.0" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 329.9)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it a solute (an ion, glucose, an amino</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">acid) rather than water itself?</text></g><path d="M430.0 329.9 L479.9 329.9" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 329.9 L479.0 334.0 L479.0 325.7 Z" fill="var(--vx-good, #16a34a)"/><text x="460.0" y="318.9" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no</text><rect x="490.0" y="304.2" width="250.0" height="51.3" rx="12" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8"/><g transform="translate(615.0 329.9)"><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Osmosis, much of it through</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">aquaporins</text></g><path d="M230.0 360.8 L230.0 384.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 392.8 L225.9 383.8 L234.1 383.8 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="376.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="396.8" width="400.0" height="75.8" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 434.7)"><text x="230.0" y="-17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Facilitated diffusion: a channel protein for</text><text x="230.0" y="0.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">ions, a carrier protein for glucose and amino</text><text x="230.0" y="17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">acids</text></g></svg>