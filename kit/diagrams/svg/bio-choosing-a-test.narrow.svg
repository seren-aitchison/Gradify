<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 662.0" width="380.0" height="662.0" role="img" aria-label="A flow chart from the kind of data and question to chi-squared, correlation, ANOVA, the Mann-Whitney U test or the t-test." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 48.9)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are the data measurements, not</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">counts in categories?</text></g><path d="M30.0 77.8 L30.0 105.8" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 105.8 L34.7 105.8" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 105.8 L34.0 109.1 L34.0 102.6 Z" fill="var(--vx-a4, #0d9488)"/><rect x="42.0" y="89.8" width="270.0" height="63.3" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="177.0" y="103.8" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><g transform="translate(0 137.5)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Chi-squared test: observed against</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">expected frequencies</text></g><path d="M338.0 79.8 L338.0 171.0" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 179.1 L333.9 170.1 L342.1 170.1 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 121.5)" x="332.0" y="121.5" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="183.1" width="340.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 203.1)"><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are you comparing groups?</text></g><path d="M30.0 223.0 L30.0 251.0" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 251.0 L34.7 251.0" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 251.0 L34.0 254.3 L34.0 247.8 Z" fill="var(--vx-a4, #0d9488)"/><rect x="42.0" y="235.0" width="270.0" height="63.3" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="177.0" y="249.0" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><g transform="translate(0 282.7)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Correlation (Pearson or Spearman):</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">association of two variables</text></g><path d="M338.0 225.0 L338.0 316.2" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 324.3 L333.9 315.3 L342.1 315.3 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 266.7)" x="332.0" y="266.7" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="328.3" width="340.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 348.3)"><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are there exactly two groups?</text></g><path d="M30.0 368.2 L30.0 396.2" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 396.2 L34.7 396.2" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 396.2 L34.0 399.5 L34.0 393.0 Z" fill="var(--vx-a4, #0d9488)"/><rect x="42.0" y="380.2" width="270.0" height="46.6" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="177.0" y="394.2" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><g transform="translate(0 419.6)"><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">ANOVA: means of three or more groups</text></g><path d="M338.0 370.2 L338.0 444.8" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 452.9 L333.9 443.9 L342.1 443.9 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 403.6)" x="332.0" y="403.6" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="456.9" width="340.0" height="39.9" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 476.8)"><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are the data normally distributed?</text></g><path d="M30.0 496.8 L30.0 524.8" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 524.8 L34.7 524.8" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 524.8 L34.0 528.0 L34.0 521.6 Z" fill="var(--vx-a4, #0d9488)"/><rect x="42.0" y="508.8" width="270.0" height="63.3" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="177.0" y="522.8" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><g transform="translate(0 556.4)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Mann–Whitney U: two groups, no</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">normality assumed</text></g><path d="M338.0 498.8 L338.0 590.0" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 598.1 L333.9 589.1 L342.1 589.1 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 540.4)" x="332.0" y="540.4" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="602.1" width="340.0" height="39.9" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 622.0)"><text x="190.0" y="0.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">t-test: means of two groups</text></g></svg>