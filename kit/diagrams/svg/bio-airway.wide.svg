<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 222.0" width="700.0" height="222.0" role="img" aria-label="A line of seven boxes in order: nose, pharynx, larynx, trachea, bronchi, bronchioles and alveoli, each with a short note on what it does." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M174.0 56.0 L179.5 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M187.6 56.0 L178.6 60.1 L178.6 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M342.4 56.0 L366.3 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M374.4 56.0 L365.4 60.1 L365.4 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M495.6 56.0 L522.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M531.0 56.0 L522.0 60.1 L522.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M605.0 100.0 L605.0 129.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M605.0 137.5 L600.9 128.5 L609.1 128.5 Z" fill="var(--vx-ink, #151826)"/><path d="M534.3 174.0 L522.1 174.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M514.0 174.0 L523.0 169.9 L523.0 178.1 Z" fill="var(--vx-ink, #151826)"/><path d="M356.0 174.0 L350.5 174.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M342.4 174.0 L351.4 169.9 L351.4 178.1 Z" fill="var(--vx-ink, #151826)"/><rect x="21.0" y="24.5" width="148.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="95.0" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">nose</text><text x="95.0" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">warms, moistens and</text><text x="95.0" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">filters the air</text><rect x="192.6" y="24.5" width="144.7" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="265.0" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">pharynx</text><text x="265.0" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the throat, shared</text><text x="265.0" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">with the gut</text><rect x="379.4" y="32.0" width="111.2" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="435.0" y="48.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">larynx</text><text x="435.0" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the voice box</text><rect x="536.0" y="17.0" width="138.0" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="605.0" y="33.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">trachea</text><text x="605.0" y="50.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">held open by</text><text x="605.0" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">C-shaped rings of</text><text x="605.0" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cartilage</text><rect x="539.3" y="142.5" width="131.3" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="605.0" y="158.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">bronchi</text><text x="605.0" y="175.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">two, one to each</text><text x="605.0" y="190.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">lung</text><rect x="361.0" y="135.0" width="148.0" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="435.0" y="151.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">bronchioles</text><text x="435.0" y="168.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">many; smooth muscle</text><text x="435.0" y="183.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">in their walls can</text><text x="435.0" y="198.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">constrict</text><rect x="192.6" y="142.5" width="144.7" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="265.0" y="158.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">alveoli</text><text x="265.0" y="175.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">air sacs where gas</text><text x="265.0" y="190.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">exchange happens</text></svg>