<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.0 522.0" width="680.0" height="522.0" role="img" aria-label="A ladder of levels from atom to biosphere, each with an example, with an arrow from simplest to most inclusive." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">simplest</text><rect x="46.0" y="37.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="151.0" y="53.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Atom</text><text x="270.0" y="53.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">carbon, hydrogen, oxygen, nitrogen</text><rect x="46.0" y="75.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="151.0" y="91.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Molecule</text><text x="270.0" y="91.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">proteins such as haemoglobin; DNA</text><rect x="46.0" y="113.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="151.0" y="129.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Organelle</text><text x="270.0" y="129.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">a mitochondrion</text><rect x="46.0" y="151.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="151.0" y="167.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Cell</text><text x="270.0" y="167.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">a heart muscle cell</text><rect x="46.0" y="189.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="151.0" y="205.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Tissue</text><text x="270.0" y="205.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">muscle tissue</text><rect x="46.0" y="227.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="151.0" y="243.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">Organ</text><text x="270.0" y="243.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">the heart</text><rect x="46.0" y="265.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="151.0" y="281.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">Organ system</text><text x="270.0" y="281.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">the circulatory system</text><rect x="46.0" y="303.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="151.0" y="319.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">Organism</text><text x="270.0" y="319.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">an individual living thing</text><rect x="46.0" y="341.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="151.0" y="357.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Population</text><text x="270.0" y="357.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">individuals of one species in an area</text><rect x="46.0" y="379.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="151.0" y="395.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Community</text><text x="270.0" y="395.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">all the populations in an area</text><rect x="46.0" y="417.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="151.0" y="433.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Ecosystem</text><text x="270.0" y="433.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">a community plus its non-living environment</text><rect x="46.0" y="455.0" width="210.0" height="32.0" rx="8" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="151.0" y="471.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Biosphere</text><text x="270.0" y="471.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">all ecosystems on Earth</text><path d="M24.0 38.0 L24.0 477.0" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M24.0 486.0 L19.4 476.0 L28.6 476.0 Z" fill="var(--vx-soft, #5b6275)"/><text x="16.0" y="506.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">most inclusive</text></svg>