ff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">recycle</text><rect x="127.3" y="24.0" width="125.4" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="190.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">N<tspan baseline-shift="sub" font-size="9.4">2</tspan> + 3H<tspan baseline-shift="sub" font-size="9.4">2</tspan> feed</text><rect x="142.9" y="101.0" width="94.2" height="48.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="117.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">converter</text><text x="190.0" y="134.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Fe, 450 °C</text><rect x="107.8" y="193.0" width="164.4" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="190.0" y="209.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">cooler / separator</text><rect x="139.0" y="270.0" width="102.0" height="33.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="286.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">liquid NH<tspan baseline-shift="sub" font-size="9.4">3</tspan></text><rect x="111.7" y="347.0" width="156.6" height="33.0" rx="12" fill="#f7f8fd" fill-opacity="1" stroke="var(--vx-line, #8a92a8)" stroke-width="1.6"/><text x="190.0" y="363.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">unreacted N<tspan baseline-shift="sub" font-size="9.4">2</tspan> + H<tspan baseline