<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640.0 320.0" width="640.0" height="320.0" role="img" aria-label="The equator as a circle with two points on it, at longitude 0° and longitude 90°, joined to the centre with a right angle between the radii." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><circle cx="310.2" cy="160.0" r="98.5" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2.2"/><path d="M310.2 160.0 L408.6 160.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M310.2 160.0 L310.2 61.5" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M323.2 160.0 L323.2 147.0 L310.2 147.0" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="1.8"/><text x="270.8" y="209.2" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">R = 6,371 km</text><text x="364.3" y="99.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">90° = π/2</text><circle cx="408.6" cy="160.0" r="3.6" fill="var(--vx-ink, #151826)"/><text x="428.6" y="166.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">A</text><circle cx="310.2" cy="61.5" r="3.6" fill="var(--vx-ink, #151826)"/><text x="310.2" y="45.5" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">B</text></svg>