<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 402.0" width="380.0" height="402.0" role="img" aria-label="Four boxes in order: light from one side, auxin moving to the shaded side, shaded cells elongating more, and the shoot bending towards the light." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 69.0 L190.0 82.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 91.0 L185.9 82.0 L194.1 82.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 181.0 L190.0 178.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 187.0 L185.9 178.0 L194.1 178.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 277.0 L190.0 282.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 290.5 L185.9 281.5 L194.1 281.5 Z" fill="var(--vx-ink, #151826)"/><rect x="100.9" y="16.0" width="178.3" height="48.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="32.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">light from one side</text><text x="190.0" y="49.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a shoot is lit unevenly</text><rect x="107.8" y="96.0" width="164.4" height="80.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="112.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">auxin moves to the</text><text x="190.0" y="129.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">shaded side</text><text x="190.0" y="146.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">made in the tip,</text><text x="190.0" y="161.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">transported sideways</text><rect x="100.0" y="192.0" width="180.0" height="80.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="208.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">shaded cells elongate</text><text x="190.0" y="225.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">more</text><text x="190.0" y="242.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">auxin loosens their walls</text><text x="190.0" y="257.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">(acid growth)</text><rect x="107.6" y="295.5" width="164.9" height="65.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="311.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">the shoot bends</text><text x="190.0" y="328.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">towards the light</text><text x="190.0" y="345.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">positive phototropism</text></svg>