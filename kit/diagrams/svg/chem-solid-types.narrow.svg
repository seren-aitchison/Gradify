<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 440.0" width="380.0" height="440.0" role="img" aria-label="A tree: contains a metal and a non-metal? Ionic. Only metal? Metallic. Otherwise: one giant network of covalent bonds? Giant covalent; if not, simple molecular." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="12.0" y="28.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Metal and non-metal together?</text><text x="28.0" y="51.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="28.0" y="61.0" width="340.0" height="46.0" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="38.0" y="75.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Ionic lattice</text><text x="38.0" y="92.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. NaCl, MgO</text><text x="28.0" y="123.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><text x="28.0" y="143.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Metal atoms only?</text><text x="44.0" y="166.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="44.0" y="176.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="54.0" y="190.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Metallic lattice</text><text x="54.0" y="207.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. Cu, Fe</text><text x="44.0" y="238.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><text x="44.0" y="258.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">One continuous network of covalent</text><text x="44.0" y="275.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">bonds?</text><text x="60.0" y="298.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="60.0" y="308.0" width="308.0" height="46.0" rx="10" fill="var(--vx-a5, #7c3aed)" fill-opacity=".1" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="70.0" y="322.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Giant covalent</text><text x="70.0" y="339.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. C, SiO<tspan baseline-shift="sub" font-size="8.3">2</tspan></text><text x="60.0" y="370.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="60.0" y="380.0" width="308.0" height="46.0" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="70.0" y="394.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Simple molecular</text><text x="70.0" y="411.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. H<tspan baseline-shift="sub" font-size="8.3">2</tspan>O, I<tspan baseline-shift="sub" font-size="8.3">2</tspan>, CO<tspan baseline-shift="sub" font-size="8.3">2</tspan></text></svg>