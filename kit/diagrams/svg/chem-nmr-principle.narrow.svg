<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 280.0" width="380.0" height="280.0" role="img" aria-label="Energy diagram: one level with no field, splitting into a lower α level and a higher β level in a field, with a radio-frequency arrow between them." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M12.0 250.0 L12.0 25.2" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M12.0 18.0 L15.7 26.0 L8.3 26.0 Z" fill="var(--vx-ink, #151826)"/><text x="18.0" y="14.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">energy</text><path d="M54.0 137.0 L139.0 137.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="48.0" y="137.0" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">no field</text><path d="M207.0 240.0 L309.0 240.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="315.0" y="240.0" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">α</text><path d="M207.0 34.0 L309.0 34.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="315.0" y="34.0" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">β</text><path d="M258.0 240.0 L258.0 41.2" stroke="var(--vx-a2, #db2777)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M258.0 34.0 L261.7 42.0 L254.3 42.0 Z" fill="var(--vx-a2, #db2777)"/><text x="264.0" y="137.0" font-size="10.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">radio waves, ΔE ∝ B</text><text x="173.0" y="137.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">field