<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 280.0" width="380.0" height="280.0" role="img" aria-label="Energy diagram: one level with no field, splitting into a lower α level and a higher β level in a field, with a radio-frequency arrow between them." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M12.0 250.0 L12.0 33.2" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M12.0 26.0 L15.7 34.0 L8.3 34.0 Z" fill="var(--vx-ink, #151826)"/><text x="6.0" y="12.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">energy</text><path d="M122.0 145.0 L190.0 240.0" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" fill="none"/><path d="M122.0 145.0 L190.0 50.0" stroke="var(--vx-line, #8a92a8)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" fill="none"/><path d="M47.2 145.0 L122.0 145.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M190.0 240.0 L278.4 240.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M190.0 50.0 L278.4 50.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M234.2 240.0 L234.2 57.2" stroke="var(--vx-a2, #db2777)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M234.2 50.0 L237.9 58.0 L230.5 58.0 Z" fill="var(--vx-a2, #db2777)"/><text x="84.6" y="134.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no field</text><text x="284.4" y="240.0" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">α (aligned)</text><text x="284.4" y="50.0" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">β (opposed)</text><text x="240.2" y="145.0" font-size="10.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">radio waves, ΔE ∝ B<tspan baseline-shift="sub" font-size="7.6">0</tspan></text><text x="234.2" y="24.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">in field B<tspan baseline-shift="sub" font-size="8.3">0</tspan></text></svg>