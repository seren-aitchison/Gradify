<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600.0 324.0" width="600.0" height="324.0" role="img" aria-label="A Punnett square of a heterozygous tall plant crossed with a short plant: two Tt and two tt offspring." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="300.0" y="22.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Tt (tall) × tt (short (tester))</text><text x="208.0" y="94.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">gametes</text><rect x="257.0" y="51.0" width="86.0" height="86.0" rx="8" fill="var(--vx-panel, #f4f5fb)" fill-opacity="1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="300.0" y="94.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">T</text><rect x="349.0" y="51.0" width="86.0" height="86.0" rx="8" fill="var(--vx-panel, #f4f5fb)" fill-opacity="1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="392.0" y="94.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">t</text><rect x="165.0" y="143.0" width="86.0" height="86.0" rx="8" fill="var(--vx-panel, #f4f5fb)" fill-opacity="1" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="208.0" y="186.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">t</text><rect x="257.0" y="143.0" width="86.0" height="86.0" rx="8" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.14" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.4"/><text x="300.0" y="186.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Tt</text><rect x="349.0" y="143.0" width="86.0" height="86.0" rx="8" fill="var(--vx-a4, #0d9488)" fill-opacity="0.14" stroke="var(--vx-a4, #0d9488)" stroke-width=