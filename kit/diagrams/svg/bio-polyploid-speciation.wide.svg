<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 178.0" width="700.0" height="178.0" role="img" aria-label="Four boxes in order: a diploid species, failed meiosis giving diploid gametes, fusion into a tetraploid offspring, and a new species." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M176.0 70.0 L175.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M184.0 70.0 L175.0 74.1 L175.0 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M346.0 70.0 L345.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M354.0 70.0 L345.0 74.1 L345.0 65.9 Z" fill="var(--vx-ink, #151826)"/><path d="M516.0 70.0 L515.9 70.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M524.0 70.0 L515.0 74.1 L515.0 65.9 Z" fill="var(--vx-ink, #151826)"/><rect x="19.0" y="38.5" width="152.0" height="63.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="95.0" y="54.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">diploid species</text><text x="95.0" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">parents with two sets of</text><text x="95.0" y="86.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">chromosomes (2n)</text><rect x="189.0" y="31.0" width="152.0" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="265.0" y="47.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">failed meiosis</text><text x="265.0" y="64.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">gametes with a double</text><text x="265.0" y="79.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">set (2n) instead of a</text><text x="265.0" y="94.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">single set</text><rect x="359.0" y="38.5" width="152.0" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="435.0" y="54.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">fusion of 2n gametes</text><text x="435.0" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a tetraploid (4n)</text><text x="435.0" y="86.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">offspring</text><rect x="529.0" y="23.5" width="152.0" height="93.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="605.0" y="39.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">a new species</text><text x="605.0" y="56.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the 4n plant cannot</text><text x="605.0" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">breed with its 2n</text><text x="605.0" y="86.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">parents: speciation in</text><text x="605.0" y="101.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">one generation</text></svg>