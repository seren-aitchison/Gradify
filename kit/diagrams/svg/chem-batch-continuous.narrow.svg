<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 210.0" width="380.0" height="210.0" role="img" aria-label="A tree: is a large volume of one product needed continuously? Continuous. Otherwise: batch." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="12.0" y="28.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is a very large volume of one product</text><text x="12.0" y="45.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">needed all the time?</text><text x="28.0" y="68.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="28.0" y="78.0" width="340.0" height="46.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="38.0" y="92.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Continuous process</text><text x="38.0" y="109.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. NH<tspan baseline-shift="sub" font-size="8.3">3</tspan>, H<tspan baseline-shift="sub" font-size="8.3">2</tspan>SO<tspan baseline-shift="sub" font-size="8.3">4</tspan></text><text x="28.0" y="140.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="28.0" y="150.0" width="340.0" height="46.0" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="38.0" y="164.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Batch process</text><text x="38.0" y="181.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. medicines, dyes</text></svg>