<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720.0 230.0" width="720.0" height="230.0" role="img" aria-label="A four-level pyramid on a log scale: producers 10,000, primary consumers 1,000, secondary consumers 100 and tertiary consumers 10 kilojoules per square metre per year, each level a tenth of the one below." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="130.0" y="158.0" width="360.0" height="40.0" rx="6" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.22" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="512.0" y="170.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">producers</text><text x="512.0" y="188.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10 000 kJ m⁻² year⁻¹</text><rect x="175.3" y="112.0" width="269.4" height="40.0" rx="6" fill="var(--vx-a4, #0d9488)" fill-opacity="0.22" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="512.0" y="124.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">primary consumers</text><text x="512.0" y="142.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">1000 kJ m⁻² year⁻¹</text><text x="118.0" y="155.0" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">10.0%</text><path d="M124.0 166.0 L124.0 148.3" stroke="var(--vx-a2, #db2777)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M124.0 142.0 L127.2 149.0 L120.8 149.0 Z" fill="var(--vx-a2, #db2777)"/><rect x="220.6" y="66.0" width="178.9" height="40.0" rx="6" fill="var(--vx-a3, #ea580c)" fill-opacity="0.22" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="512.0" y="78.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">secondary consumers</text><text x="512.0" y="96.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">100 kJ m⁻² year⁻¹</text><text x="118.0" y="109.0" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">10.0%</text><path d="M124.0 120.0 L124.0 102.3" stroke="var(--vx-a2, #db2777)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M124.0 96.0 L127.2 103.0 L120.8 103.0 Z" fill="var(--vx-a2, #db2777)"/><rect x="265.8" y="20.0" width="88.3" height="40.0" rx="6" fill="var(--vx-a2, #db2777)" fill-opacity="0.22" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="512.0" y="32.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">tertiary consumers</text><text x="512.0" y="50.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10 kJ m⁻² year⁻¹</text><text x="118.0" y="63.0" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">10.0%</text><path d="M124.0 74.0 L124.0 56.3" stroke="var(--vx-a2, #db2777)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M124.0 50.0 L127.2 57.0 L120.8 57.0 Z" fill="var(--vx-a2, #db2777)"/><text x="118.0" y="216.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">passed on</text></svg>