<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 158.5" width="380.0" height="158.5" role="img" aria-label="Two boxes: hygiene factors (pay, working conditions, company policy, supervision, job security) and motivators (achievement, recognition, the work itself, responsibility, advancement)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="12.0" width="364.0" height="63.3" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="27.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Hygiene factors</text><text x="17.0" y="47.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Pay, working conditions, company policy, supervision, job</text><text x="17.0" y="60.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">security. Poor: dissatisfaction. Good: only prevents it.</text><rect x="8.0" y="83.3" width="364.0" height="63.3" rx="9" fill="var(--vx-good, #16a34a)" fill-opacity="0.12" stroke="var(--vx-good, #16a34a)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="98.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Motivators</text><text x="17.0" y="118.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Achievement, recognition, the work itself, responsibility,</text><text x="17.0" y="131.9" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">advancement. These create satisfaction and motivation.</text></svg>