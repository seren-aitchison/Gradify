<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 457.0" width="380.0" height="457.0" role="img" aria-label="A logarithmic scale of relative strength from 10 to the minus 40 up to 1, with gravity near 10 to the minus 38, the weak interaction at 10 to the minus 6, electromagnetism at 1 over 137 and the strong interaction at 1." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Four interactions, 38 orders of magnitude</text><path d="M62.0 427.0 L62.0 55.2" stroke="var(--vx-ink, #151826)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M62.0 48.0 L65.7 56.0 L58.3 56.0 Z" fill="var(--vx-ink, #151826)"/><text x="70.0" y="44.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">relative strength</text><path d="M57.0 427.0 L67.0 427.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="427.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-40</tspan></text><path d="M57.0 382.0 L67.0 382.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="382.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-35</tspan></text><path d="M57.0 337.0 L67.0 337.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="337.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-30</tspan></text><path d="M57.0 292.0 L67.0 292.0" stroke="var(--vx-ink, #151826)" stroke