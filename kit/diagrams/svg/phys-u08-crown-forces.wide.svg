" font-style="italic">F<tspan baseline-shift="sub" font-size="10.4">B</tspan></text><text x="402.0" y="60.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">W = 7.84 N, down</text><text x="402.0" y="82.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">T = 6.86 N, up</text><text x="402.0" y="104.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">F<tspan baseline-shift="sub" font-size="9.4">B</tspan> = 0.98 N, up</text><text x="402.0" y="126.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">net force = 0 (in equilibrium)</text><text x="402.0" y="148.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">F<tspan baseline-shift="sub" font-size="9.4">B</tspan> = 0.98 N, V = 1 × 10<tspan baseline-shift="super" font-size="9.4">-4</tspan> m<tspan baseline-shift="super" font-size="9.4">3</tspan></text><text x="402.0" y="170.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">ρ = 8000 kg m<tspan baseline-shift="super" font-size="9.4">-3</tspan></text></svg>