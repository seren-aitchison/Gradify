<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.0 360.0" width="680.0" height="360.0" role="img" aria-label="Two stacked columns: driving forces (fewer errors 4, regulatory pressure 4, faster access to records 3) total 11; restraining forces (staff fear of technology 4, time to learn 3, cost 3) total 10." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M22.0 316.0 L665.7 316.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M672.0 316.0 L665.0 319.2 L665.0 312.8 Z" fill="var(--vx-ink, #151826)"/><rect x="98.5" y="228.5" width="170.0" height="85.5" fill="var(--vx-good, #16a34a)" fill-opacity=".2" stroke="var(--vx-good, #16a34a)" stroke-width="1.3"/><text x="183.5" y="264.2" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Fewer errors</text><text x="183.5" y="280.2" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">4</text><rect x="98.5" y="142.9" width="170.0" height="85.5" fill="var(--vx-a4, #0d9488)" fill-opacity=".2" stroke="var(--vx-a4, #0d9488)" stroke-width="1.3"/><text x="183.5" y="178.7" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Regulation</text><text x="183.5" y="194.7" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">4</text><rect x="98.5" y="78.8" width="170.0" height="64.2" fill="var(--vx-a1, #4f46e5)" fill-opacity=".2" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.3"/><text x="183.5" y="103.8" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Faster access</text><text x="183.5" y="119.8" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">3</text><text x="183.5" y="68.8" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Driving: 11</text><rect x="421.5" y="228.5" width="170.0" height="85.5" fill="var(--vx-bad, #dc2626)" fill-opacity=".2" stroke="var(--vx-bad, #dc2626)" stroke-width="1.3"/><text x="506.5" y="264.2" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Fear of tech</text><text x="506.5" y="280.2" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">4</text><rect x="421.5" y="164.3" width="170.0" height="64.2" fill="var(--vx-a3, #ea580c)" fill-opacity=".2" stroke="var(--vx-a3, #ea580c)" stroke-width="1.3"/><text x="506.5" y="189.4" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Time to learn</text><text x="506.5" y="205.4" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">3</text><rect x="421.5" y="100.2" width="170.0" height="64.2" fill="var(--vx-a2, #db2777)" fill-opacity=".2" stroke="var(--vx-a2, #db2777)" stroke-width="1.3"/><text x="506.5" y="125.2" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Cost</text><text x="506.5" y="141.2" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">3</text><text x="506.5" y="90.2" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Restraining: 10</text></svg>