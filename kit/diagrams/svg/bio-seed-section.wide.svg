<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 236.3" width="700.0" height="236.3" role="img" aria-label="Two seeds side by side. A bean has a thick testa round two large cotyledons, with a plumule at the top and a radicle at the bottom. A maize grain has a testa round a large food store, the endosperm, with a single small cotyledon, plumule and radicle at one side." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(164 8) scale(0.7143)"><text x="105.0" y="18.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">eudicot (bean)</text><text x="315.0" y="18.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">monocot (maize)</text><g data-part="testa"><title>testa: The seed coat: protects the embryo.</title><path d="M105 34 C160 40 168 200 105 270 C42 200 50 40 105 34 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".08" stroke="var(--vx-a3, #ea580c)" stroke-width="5"/></g><g data-part="cotyledon"><title>cotyledon: A seed leaf. A eudicot has two, and they often store the food.</title><path d="M104 52 C148 56 154 190 104 242 Z" fill="var(--vx-a4, #0d9488)" fill-opacity=".4" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/><path d="M106 52 C62 56 56 190 106 242 Z" fill="var(--vx-a4, #0d9488)" fill-opacity=".4" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/></g><g data-part="plumule"><title>plumule: The young shoot of the embryo.</title><path d="M105 70 q-9 -22 -2 -34 q10 12 2 34" fill="var(--vx-good, #16a34a)" fill-opacity=".7" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/></g><g data-part="radicle"><title>radicle: The young root of the embryo.</title><path d="M99 240 q6 20 6 26 q0 -6 6 -26 Z" fill="var(--vx-a2, #db2777)" fill-opacity=".6" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/></g><g data-part="micropyle"><title>micropyle: A small pore in the testa where the pollen tube entered; water enters here at germination.</title><circle cx="121.7" cy="246.5" r="4.2" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/></g><g data-part="endosperm"><title>endosperm: The food store of a monocot seed such as maize.</title><path d="M315 34 C372 40 380 200 315 270 C250 200 258 40 315 34 Z" fill="var(--vx-a1, #4f46e5)" fill-opacity=".18" stroke="var(--vx-a3, #ea580c)" stroke-width="5"/></g><g data-part="single cotyledon"><title>single cotyledon: A monocot has one cotyledon; the food is stored in the endosperm instead.</title><path d="M290 120 C270 130 270 200 300 238 C312 200 312 150 290 120 Z" fill="var(--vx-a4, #0d9488)" fill-opacity=".5" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/></g><g data-part="plumule"><title>plumule: The young shoot of the embryo.</title><path d="M297 128 q-3 -26 6 -40 q10 16 0 40" fill="var(--vx-good, #16a34a)" fill-opacity=".7" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/></g><g data-part="radicle"><title>radicle: The young root of the embryo.</title><path d="M294 236 q8 26 8 32 q0 -6 8 -32 Z" fill="var(--vx-a2, #db2777)" fill-opacity=".6" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/></g></g><path d="M239.0 46.6 L152.0 46.6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="239.0" cy="46.6" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="46.6" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">plumule</text><path d="M270.4 99.4 L152.0 99.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="270.4" cy="99.4" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="99.4" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">testa</text><path d="M259.7 115.1 L152.0 125.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="259.7" cy="115.1" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="125.4" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">cotyledon</text><path d="M250.9 184.1 L152.0 184.1" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="250.9" cy="184.1" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="184.1" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">micropyle</text><path d="M238.3 190.9 L152.0 210.1" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="238.3" cy="190.9" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="210.1" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">radicle</text><path d="M410.4 79.4 L484.0 79.4" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="410.4" cy="79.4" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="79.4" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">endosperm</text><path d="M366.1 143.7 L484.0 143.7" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="366.1" cy="143.7" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="143.7" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">single cotyledon</text></svg>