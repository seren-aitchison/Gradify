<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 700.2" width="380.0" height="700.2" role="img" aria-label="Three pathway boxes on the left, classical, lectin and alternative, each with its trigger, all with arrows to C3. C3 splits into C3a and C3b. C3a leads to inflammation. C3b leads to opsonisation and to C5. C5 leads to inflammation as C5a and to lysis as C5b joined with C6 to C9." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M115.4 108.0 L136.9 130.2" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M142.6 136.0 L133.3 132.4 L139.3 126.7 Z" fill="var(--vx-soft, #5b6275)"/><path d="M190.0 108.0 L190.0 127.9" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 136.0 L185.9 127.0 L194.1 127.0 Z" fill="var(--vx-soft, #5b6275)"/><path d="M264.6 108.0 L243.1 130.2" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M237.4 136.0 L240.7 126.7 L246.7 132.4 Z" fill="var(--vx-soft, #5b6275)"/><path d="M142.6 234.0 L121.1 256.2" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M115.4 262.0 L118.7 252.7 L124.7 258.4 Z" fill="var(--vx-soft, #5b6275)"/><path d="M237.4 234.0 L258.9 256.2" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M264.6 262.0 L255.3 258.4 L261.3 252.7 Z" fill="var(--vx-soft, #5b6275)"/><path d="M68.0 360.0 L68.0 505.9" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M68.0 514.0 L63.9 505.0 L72.1 505.0 Z" fill="var(--vx-soft, #5b6275)"/><path d="M115.4 360.0 L136.9 382.2" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M142.6 388.0 L133.3 384.4 L139.3 378.7 Z" fill="var(--vx-soft, #5b6275)"/><path d="M312.0 360.0 L312.0 505.9" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M312.0 514.0 L307.9 505.0 L316.1 505.0 Z" fill="var(--vx-soft, #5b6275)"/><path d="M190.0 486.0 L190.0 505.9" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 514.0 L185.9 505.0 L194.1 505.0 Z" fill="var(--vx-soft, #5b6275)"/><path d="M237.4 486.0 L258.9 508.2" stroke="var(--vx-soft, #5b6275)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M264.6 514.0 L255.3 510.4 L261.3 504.7 Z" fill="var(--vx-soft, #5b6275)"/><g data-part="classical pathway"><title>classical pathway: antibody bound to antigen</title><rect x="12.0" y="14.0" width="112" height="90" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".14" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/></g><text x="68.0" y="30.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">classical pathway</text><text x="68.0" y="50.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">antibody bound to</text><text x="68.0" y="62.5" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">antigen</text><g data-part="lectin pathway"><title>lectin pathway: lectins binding sugars on microbes</title><rect x="134.0" y="14.0" width="112" height="90" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".14" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/></g><text x="190.0" y="30.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">lectin pathway</text><text x="190.0" y="50.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">lectins binding</text><text x="190.0" y="62.5" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">sugars on microbes</text><g data-part="alternative pathway"><title>alternative pathway: directly on microbial surfaces</title><rect x="256.0" y="14.0" width="112" height="90" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".14" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/></g><text x="312.0" y="30.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">alternative pathway</text><text x="312.0" y="50.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">directly on</text><text x="312.0" y="62.5" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">microbial surfaces</text><g data-part="C3 cleaved"><title>C3 cleaved: all pathways converge</title><rect x="134.0" y="140.0" width="112" height="90" rx="10" fill="var(--vx-a5, #7c3aed)" fill-opacity=".14" stroke="var(--vx-a5, #7c3aed)" stroke-width="2"/></g><text x="190.0" y="156.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">C3 cleaved</text><text x="190.0" y="176.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">all pathways</text><text x="190.0" y="188.5" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">converge</text><g data-part="C3b"><title>C3b: coats the pathogen</title><rect x="12.0" y="266.0" width="112" height="90" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".14" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/></g><text x="68.0" y="282.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">C3b</text><text x="68.0" y="302.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">coats the pathogen</text><g data-part="C3a"><title>C3a: signals to immune cells</title><rect x="256.0" y="266.0" width="112" height="90" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".14" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/></g><text x="312.0" y="282.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">C3a</text><text x="312.0" y="302.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">signals to immune</text><text x="312.0" y="314.5" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cells</text><g data-part="C5"><title>C5: cleaved after C3b</title><rect x="134.0" y="392.0" width="112" height="90" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".14" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/></g><text x="190.0" y="408.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">C5</text><text x="190.0" y="428.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cleaved after C3b</text><g data-part="opsonisation"><title>opsonisation: phagocytes ingest the coated pathogen</title><rect x="12.0" y="518.0" width="112" height="90" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".14" stroke="var(--vx-good, #16a34a)" stroke-width="2"/></g><text x="68.0" y="534.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">opsonisation</text><text x="68.0" y="554.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">phagocytes ingest</text><text x="68.0" y="566.5" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the coated</text><text x="68.0" y="579.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pathogen</text><g data-part="lysis"><title>lysis: C5b–C9: the membrane attack complex forms pores</title><rect x="134.0" y="518.0" width="112" height="90" rx="10" fill="var(--vx-a2, #db2777)" fill-opacity=".14" stroke="var(--vx-a2, #db2777)" stroke-width="2"/></g><text x="190.0" y="534.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">lysis</text><text x="190.0" y="554.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">C5b–C9: the</text><text x="190.0" y="566.5" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">membrane attack</text><text x="190.0" y="579.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">complex forms</text><text x="190.0" y="591.5" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pores</text><g data-part="inflammation"><title>inflammation: C3a and C5a attract and activate immune cells</title><rect x="256.0" y="518.0" width="112" height="90" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/></g><text x="312.0" y="534.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">inflammation</text><text x="312.0" y="554.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">C3a and C5a</text><text x="312.0" y="566.5" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">attract and</text><text x="312.0" y="579.0" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">activate immune</text><text x="312.0" y="591.5" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cells</text><text x="190.0" y="635.9" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Host cells carry regulatory proteins that block</text><text x="190.0" y="650.0" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">complement on their own surfaces. Simplified: only</text><text x="190.0" y="664.1" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the steps named in the lesson are drawn.</text></svg>