<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 354.5" width="380.0" height="354.5" role="img" aria-label="Four boxes in order: valuable, rare, inimitable, organised, each with what failing it means, ending in sustained competitive advantage." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="10.0" y="14.0" width="360.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="29.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Valuable?</text><text x="19.0" y="49.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">if not: competitive disadvantage</text><rect x="10.0" y="86.1" width="360.0" height="50.1" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="101.6" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Rare?</text><text x="19.0" y="121.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">if not: competitive parity</text><rect x="10.0" y="158.3" width="360.0" height="50.1" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="173.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Inimitable?</text><text x="19.0" y="193.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">if not: temporary advantage</text><rect x="10.0" y="230.4" width="360.0" height="50.1" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="245.9" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Organised?</text><text x="19.0" y="265.9" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">if yes: exploited</text><path d="M190.0 66.1 L190.0 76.9" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 84.1 L186.3 76.1 L193.7 76.1 Z" fill="var(--vx-line, #8a92a8)"/><path d="M190.0 138.3 L190.0 149.1" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 156.3 L186.3 148.3 L193.7 148.3 Z" fill="var(--vx-line, #8a92a8)"/><path d="M190.0 210.4 L190.0 221.2" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 228.4 L186.3 220.4 L193.7 220.4 Z" fill="var(--vx-line, #8a92a8)"/><path d="M190.0 282.5 L190.0 293.3" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 300.5 L186.3 292.5 L193.7 292.5 Z" fill="var(--vx-line, #8a92a8)"/><rect x="10.0" y="304.5" width="360.0" height="31.0" rx="9" fill="var(--vx-good, #16a34a)" fill-opacity="0.14" stroke="var(--vx-good, #16a34a)" stroke-opacity=".55" stroke-width="1.3"/><text x="190.0" y="320.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Yes to all four: sustained competitive advantage</text></svg>