<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 228.0" width="700.0" height="228.0" role="img" aria-label="Five boxes in order: tissue damage, vasodilation, more permeable capillaries, neutrophils then macrophages arriving, and resolution and repair." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M204.1 56.0 L271.2 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M279.3 56.0 L270.3 60.1 L270.3 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M420.7 56.0 L491.2 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M499.3 56.0 L490.3 60.1 L490.3 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M499.9 98.0 L437.5 132.1" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M430.4 136.0 L436.3 128.1 L440.3 135.3 Z" fill="var(--vx-ink, #151826)"/><path d="M269.0 180.0 L208.8 180.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M200.7 180.0 L209.7 175.9 L209.7 184.1 Z" fill="var(--vx-ink, #151826)"/><rect x="47.6" y="1.0" width="151.5" height="110.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="123.3" y="17.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">tissue damage or</text><text x="123.3" y="34.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">infection</text><text x="123.3" y="51.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">damaged cells and</text><text x="123.3" y="66.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">mast cells release</text><text x="123.3" y="81.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">histamine and other</text><text x="123.3" y="96.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">mediators</text><rect x="284.3" y="24.5" width="131.3" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="350.0" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">vasodilation</text><text x="350.0" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">more blood flow:</text><text x="350.0" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">redness and heat</text><rect x="504.3" y="16.0" width="144.7" height="80.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="576.7" y="32.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">more permeable</text><text x="576.7" y="49.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">capillaries</text><text x="576.7" y="66.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">fluid and proteins</text><text x="576.7" y="81.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">leak out: swelling</text><rect x="274.0" y="132.5" width="152.0" height="95.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="350.0" y="148.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">neutrophils,</text><text x="350.0" y="165.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">then macrophages</text><text x="350.0" y="182.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">move into the tissue</text><text x="350.0" y="197.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and remove the</text><text x="350.0" y="212.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pathogen</text><rect x="51.0" y="132.5" width="144.7" height="95.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="123.3" y="148.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">resolution and</text><text x="123.3" y="165.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">repair</text><text x="123.3" y="182.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">acute inflammation</text><text x="123.3" y="197.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">normally ends once</text><text x="123.3" y="212.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the cause is gone</text></svg>