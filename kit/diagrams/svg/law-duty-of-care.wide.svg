<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 527.1" width="760.0" height="527.1" role="img" aria-label="Decision tree for whether a duty of care exists in negligence, following Robinson v Chief Constable of West Yorkshire Police and Caparo v Dickman." style="color:var(--vx-ink, #151826);font-family:inherit"><rect x="30.0" y="20.0" width="400.0" height="71.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 47.9)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Did the defendant's own positive act cause the</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">harm?</text></g><text x="230.0" y="78.8" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)" font-style="italic">Robinson v Chief Constable of West Yorkshire [2018] UKSC 4</text><path d="M430.0 55.9 L479.9 55.9" stroke="var(--vx-a3, #ea580c)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 55.9 L479.0 60.1 L479.0 51.8 Z" fill="var(--vx-a3, #ea580c)"/><text x="460.0" y="44.9" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="490.0" y="-3.0" width="250.0" height="117.8" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8"/><g transform="translate(0 55.9)"><text x="615.0" y="-41.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Omission or third party:</text><text x="615.0" y="-25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">generally no duty, unless the</text><text x="615.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">defendant created the danger,</text><text x="615.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">assumed responsibility or had</text><text x="615.0" y="25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">control (Smith v Littlewoods; N</text><text x="615.0" y="41.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">v Poole BC)</text></g><path d="M230.0 93.8 L230.0 117.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 125.8 L225.9 116.8 L234.1 116.8 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="109.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="129.8" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 158.8)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is the situation genuinely novel, with no</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">established category or precedent?</text></g><path d="M430.0 158.8 L479.9 158.8" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 158.8 L479.0 162.9 L479.0 154.6 Z" fill="var(--vx-good, #16a34a)"/><text x="460.0" y="147.8" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no</text><rect x="490.0" y="124.8" width="250.0" height="67.9" rx="12" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.8"/><g transform="translate(0 158.8)"><text x="615.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Duty exists: apply the</text><text x="615.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">established category (e.g. road</text><text x="615.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">users, doctor and patient)</text></g><path d="M230.0 189.7 L230.0 213.6" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 221.7 L225.9 212.7 L234.1 212.7 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="205.7" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="225.7" width="400.0" height="75.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 263.6)"><text x="230.0" y="-17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">By analogy: was the damage reasonably</text><text x="230.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">foreseeable, and was there sufficient</text><text x="230.0" y="17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">proximity?</text></g><path d="M430.0 263.6 L479.9 263.6" stroke="var(--vx-bad, #dc2626)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 263.6 L479.0 267.7 L479.0 259.4 Z" fill="var(--vx-bad, #dc2626)"/><text x="460.0" y="252.6" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><rect x="490.0" y="246.2" width="250.0" height="34.6" rx="12" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8"/><g transform="translate(0 263.6)"><text x="615.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">No duty</text></g><path d="M230.0 303.4 L230.0 327.3" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 335.4 L225.9 326.4 L234.1 326.4 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="319.4" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="339.4" width="400.0" height="71.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 367.4)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is it fair, just and reasonable to impose a</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">duty?</text></g><text x="230.0" y="398.3" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)" font-style="italic">Caparo Industries v Dickman [1990] 2 AC 605</text><path d="M430.0 375.4 L479.9 375.4" stroke="var(--vx-bad, #dc2626)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 375.4 L479.0 379.5 L479.0 371.2 Z" fill="var(--vx-bad, #dc2626)"/><text x="460.0" y="364.4" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><rect x="490.0" y="358.0" width="250.0" height="34.6" rx="12" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8"/><g transform="translate(0 375.4)"><text x="615.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">No duty</text></g><path d="M230.0 413.3 L230.0 437.2" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 445.3 L225.9 436.3 L234.1 436.3 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="429.3" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="449.3" width="400.0" height="57.8" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 478.2)"><text x="230.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">A new duty is recognised, developed</text><text x="230.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">incrementally</text></g></svg>