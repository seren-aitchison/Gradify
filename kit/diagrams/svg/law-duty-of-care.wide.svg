<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 394.6" width="760.0" height="394.6" role="img" aria-label="Decision tree for whether a duty of care exists in negligence, following Robinson v Chief Constable of West Yorkshire Police, Caparo v Dickman and the omissions rule." style="color:var(--vx-ink, #151826);font-family:inherit"><rect x="30.0" y="20.0" width="400.0" height="93.7" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 66.8)"><text x="230.0" y="-26.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Did the defendant's own act cause the harm,</text><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">or, if the claim is a failure to protect, does</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">an exception apply (created the danger,</text><text x="230.0" y="26.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">assumed responsibility, or control)?</text></g><path d="M430.0 66.8 L479.9 66.8" stroke="var(--vx-a3, #ea580c)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 66.8 L479.0 71.0 L479.0 62.7 Z" fill="var(--vx-a3, #ea580c)"/><text x="460.0" y="55.8" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="490.0" y="24.6" width="250.0" height="84.6" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8"/><g transform="translate(615.0 66.8)"><text x="0.0" y="-25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Generally no duty to prevent</text><text x="0.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">harm by third parties or to</text><text x="0.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">rescue (Smith v Littlewoods; N v</text><text x="0.0" y="25.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Poole BC)</text></g><path d="M230.0 115.7 L230.0 139.6" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 147.7 L225.9 138.7 L234.1 138.7 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="131.7" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="166.4" width="400.0" height="71.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 194.3)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is the situation genuinely novel, with no</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">precedent deciding it?</text></g><text x="230.0" y="225.2" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)" font-style="italic">Robinson v CC West Yorkshire [2018] UKSC 4</text><path d="M430.0 202.3 L479.9 202.3" stroke="var(--vx-a4, #0d9488)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 202.3 L479.0 206.4 L479.0 198.1 Z" fill="var(--vx-a4, #0d9488)"/><text x="460.0" y="191.3" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><rect x="490.0" y="151.7" width="250.0" height="101.2" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8"/><g transform="translate(615.0 202.3)"><text x="0.0" y="-33.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Follow the precedent: a duty</text><text x="0.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">where it recognises one (if the</text><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">harm was reasonably</text><text x="0.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">foreseeable); no duty where it</text><text x="0.0" y="33.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">excludes one</text></g><path d="M230.0 244.9 L230.0 268.8" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 276.9 L225.9 267.9 L234.1 267.9 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="260.9" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="280.9" width="400.0" height="93.8" rx="14" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/><g transform="translate(0 318.8)"><text x="230.0" y="-17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Develop incrementally by analogy, weighing</text><text x="230.0" y="0.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">foreseeability, proximity and whether a duty</text><text x="230.0" y="17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">is fair, just and reasonable, together</text></g><text x="230.0" y="360.6" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)" font-style="italic">Caparo Industries v Dickman [1990] 2 AC 605</text></svg>