<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 234.0" width="700.0" height="234.0" role="img" aria-label="Six boxes in order: root hair, root cortex, endodermis, xylem, leaf and air." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M204.3 56.0 L260.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M269.0 56.0 L260.0 60.1 L260.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M431.0 56.0 L487.6 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M495.7 56.0 L486.7 60.1 L486.7 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M576.7 107.5 L576.7 133.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M576.7 142.0 L572.5 133.0 L580.8 133.0 Z" fill="var(--vx-ink, #151826)"/><path d="M495.7 186.0 L435.5 186.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M427.4 186.0 L436.4 181.9 L436.4 190.1 Z" fill="var(--vx-ink, #151826)"/><path d="M272.6 186.0 L212.4 186.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M204.3 186.0 L213.3 181.9 L213.3 190.1 Z" fill="var(--vx-ink, #151826)"/><rect x="47.3" y="17.0" width="152.0" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="123.3" y="33.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">root hair</text><text x="123.3" y="50.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">water enters by</text><text x="123.3" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">osmosis down a water</text><text x="123.3" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">potential gradient</text><rect x="274.0" y="24.5" width="152.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="350.0" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">root cortex</text><text x="350.0" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">apoplast (walls) and</text><text x="350.0" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">symplast (cytoplasm)</text><rect x="500.7" y="9.5" width="152.0" height="93.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="576.7" y="25.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">endodermis</text><text x="576.7" y="42.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the Casparian strip</text><text x="576.7" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">blocks the apoplast:</text><text x="576.7" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">water enters the</text><text x="576.7" y="87.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">symplast</text><rect x="500.7" y="147.0" width="152.0" height="78.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="576.7" y="163.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">xylem</text><text x="576.7" y="180.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">water rises in a</text><text x="576.7" y="195.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">continuous column by</text><text x="576.7" y="210.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cohesion and tension</text><rect x="277.6" y="147.0" width="144.7" height="78.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="350.0" y="163.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">leaf</text><text x="350.0" y="180.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">water evaporates</text><text x="350.0" y="195.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">from the mesophyll</text><text x="350.0" y="210.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">walls</text><rect x="47.3" y="147.0" width="152.0" height="78.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="123.3" y="163.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">air</text><text x="123.3" y="180.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">water vapour leaves</text><text x="123.3" y="195.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">through the stomata:</text><text x="123.3" y="210.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">transpiration</text></svg>