<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 402.0" width="380.0" height="402.0" role="img" aria-label="A cycle of four boxes, G1, S, G2 and M, with arrows between them labelled with the G1 and G2 checkpoints and the daughter cells that start the next G1." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 91.5 L190.0 98.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 107.0 L185.9 98.0 L194.1 98.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 165.0 L190.0 179.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 188.0 L185.9 179.0 L194.1 179.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 276.0 L190.0 277.1" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 269.0 L194.1 278.0 L185.9 278.0 Z" fill="var(--vx-ink, #151826)"/><rect x="100.0" y="-6.5" width="180.0" height="93.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="9.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">G<tspan baseline-shift="sub" font-size="9.4">1</tspan></text><text x="190.0" y="26.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">growth and normal</text><text x="190.0" y="41.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">function. G<tspan baseline-shift="sub" font-size="8.3">1</tspan> checkpoint:</text><text x="190.0" y="56.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">size, nutrients, growth</text><text x="190.0" y="71.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">signals, DNA damage</text><rect x="100.0" y="112.0" width="180.0" height="48.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="128.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">S</text><text x="190.0" y="145.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">DNA replicated: 2C to 4C</text><rect x="100.0" y="193.0" width="180.0" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="209.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">G<tspan baseline-shift="sub" font-size="9.4">2</tspan></text><text x="190.0" y="226.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">prepares for division. G<tspan baseline-shift="sub" font-size="8.3">2</tspan></text><text x="190.0" y="241.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">checkpoint: DNA fully and</text><text x="190.0" y="256.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">correctly copied</text><rect x="100.0" y="274.0" width="180.0" height="108.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="290.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">M</text><text x="190.0" y="307.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">mitosis (spindle</text><text x="190.0" y="322.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">checkpoint at metaphase),</text><text x="190.0" y="337.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">then cytokinesis. Two</text><text x="190.0" y="352.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">identical 2C cells start</text><text x="190.0" y="367.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">G<tspan baseline-shift="sub" font-size="8.3">1</tspan> again, or leave for G<tspan baseline-shift="sub" font-size="8.3">0</tspan></text></svg>