<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 426.0" width="380.0" height="426.0" role="img" aria-label="Concentric rings for the ectoderm, mesoderm and endoderm of a gastrula, with the tissues each becomes: skin epidermis and nervous system; muscle, bone, blood, heart, kidneys and gonads; gut lining, respiratory lining, liver and pancreas." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><circle cx="190.0" cy="92.0" r="84.0" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.22" stroke="var(--vx-a1, #4f46e5)" stroke-width="2.4"/><circle cx="190.0" cy="92.0" r="57.1" fill="var(--vx-a3, #ea580c)" fill-opacity="0.22" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4"/><circle cx="190.0" cy="92.0" r="31.9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.22" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><text x="190.0" y="92.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">gut cavity</text><rect x="10.0" y="200.0" width="14.0" height="14.0" rx="4" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.3" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><text x="32.0" y="207.0" font-size="14" font-weight="800" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">ectoderm (outer)</text><g transform="translate(0 236.0)"><text x="32.0" y="-8.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">epidermis of the skin, nervous system, brain,</text><text x="32.0" y="8.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">spinal cord</text></g><rect x="10.0" y="280.0" width="14.0" height="14.0" rx="4" fill="var(--vx-a3, #ea580c)" fill-opacity="0.3" stroke="var(--vx-a3, #ea580c)" stroke-width="2"/><text x="32.0" y="287.0" font-size="14" font-weight="800" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">mesoderm (middle)</text><g transform="translate(0 308.0)"><text x="32.0" y="0.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">muscle, bone, blood, heart, kidneys, gonads</text></g><rect x="10.0" y="344.0" width="14.0" height="14.0" rx="4" fill="var(--vx-a4, #0d9488)" fill-opacity="0.3" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/><text x="32.0" y="351.0" font-size="14" font-weight="800" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">endoderm (inner)</text><g transform="translate(0 380.0)"><text x="32.0" y="-8.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">lining of the gut, lining of the respiratory</text><text x="32.0" y="8.0" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">tract, liver, pancreas</text></g></svg>