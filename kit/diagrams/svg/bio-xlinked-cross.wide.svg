<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600.0 464.0" width="600.0" height="464.0" role="img" aria-label="A Punnett square of a carrier mother and an unaffected father: one unaffected daughter, one carrier daughter, one unaffected son and one son with haemophilia." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="300.0" y="22.0" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">XᴴXʰ (carrier mother) × XᴴY (unaffected father)</text><text x="208.0" y="94.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">gametes</text><rect x="257.0" y="51.0" width="86.0" height="86.0" rx="8" fill="var(--vx-panel, #f4f5fb)" fill-opacity="1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="300.0" y="94.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Xᴴ</text><rect x="349.0" y="51.0" width="86.0" height="86.0" rx="8" fill="var(--vx-panel, #f4f5fb)" fill-opacity="1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="392.0" y="94.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Xʰ</text><rect x="165.0" y="143.0" width="86.0" height="86.0" rx="8" fill="var(--vx-panel, #f4f5fb)" fill-opacity="1" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="208.0" y="186.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">Xᴴ</text><rect x="165.0" y="235.0" width="86.0" height="86.0" rx="8" fill="var(--vx-panel, #f4f5fb)" fill-opacity="1" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="208.0" y="278.0" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">Y</text><rect x="257.0" y="143.0" width="86.0" height="86.0" rx="8" fill="var(--vx-a1, #