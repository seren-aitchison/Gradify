<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 457.0" width="380.0" height="457.0" role="img" aria-label="A decision tree: does the number of molecules fall? If yes, addition. If no, is one group replaced by another? If yes, substitution; if no, is a small molecule removed to leave a multiple bond? If yes, elimination; otherwise a rearrangement." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="12.0" y="28.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Do two molecules join to make one</text><text x="12.0" y="45.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">product?</text><text x="28.0" y="68.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="28.0" y="78.0" width="340.0" height="46.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="38.0" y="92.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Addition</text><text x="38.0" y="109.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. ethene + HBr</text><text x="28.0" y="140.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><text x="28.0" y="160.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is one atom or group replaced by</text><text x="28.0" y="177.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">another?</text><text x="44.0" y="200.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="44.0" y="210.0" width="324.0" height="46.0" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="54.0" y="224.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Substitution</text><text x="54.0" y="241.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. CH<tspan baseline-shift="sub" font-size="8.3">3</tspan>CH<tspan baseline-shift="sub" font-size="8.3">2</tspan>Br + OH-</text><text x="44.0" y="272.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><text x="44.0" y="292.0" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is a small molecule lost, leaving a C=C?</text><text x="60.0" y="315.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="60.0" y="325.0" width="308.0" height="46.0" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="70.0" y="339.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Elimination</text><text x="70.0" y="356.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. 2-bromopropane → propene</text><text x="60.0" y="387.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><rect x="60.0" y="397.0" width="308.0" height="46.0" rx="10" fill="var(--vx-a5, #7c3aed)" fill-opacity=".1" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="70.0" y="411.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">Rearrangement</text><text x="70.0" y="428.0" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">e.g. carbocation shift</text></svg>