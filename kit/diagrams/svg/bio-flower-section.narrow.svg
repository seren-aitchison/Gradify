<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 464.1" width="380.0" height="464.1" role="img" aria-label="A flower cut lengthways: two petals and two sepals round a central carpel with a stigma on top, a style below it, and an ovary at the base holding an ovule, with two anthers on filaments either side." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(10 8) scale(0.8571)"><g data-part="receptacle"><title>receptacle: The base of the flower, to which the other parts attach.</title><path d="M170 262 q40 24 80 0 l-8 -24 h-64 Z" fill="var(--vx-a4, #0d9488)" fill-opacity=".4" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/></g><g data-part="sepal"><title>sepal: Protects the flower in bud.</title><path d="M180 244 q-70 6 -90 -34 q50 8 90 34" fill="var(--vx-good, #16a34a)" fill-opacity=".5" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><path d="M240 244 q70 6 90 -34 q-50 8 -90 34" fill="var(--vx-good, #16a34a)" fill-opacity=".5" stroke="var(--vx-good, #16a34a)" stroke-width="2"/></g><g data-part="petal"><title>petal: Large and coloured in an insect-pollinated flower, to attract pollinators.</title><path d="M176 236 C90 220 60 120 98 50 C140 110 160 170 176 236 Z" fill="var(--vx-a2, #db2777)" fill-opacity=".28" stroke="var(--vx-a2, #db2777)" stroke-width="2"/><path d="M244 236 C330 220 360 120 322 50 C280 110 260 170 244 236 Z" fill="var(--vx-a2, #db2777)" fill-opacity=".28" stroke="var(--vx-a2, #db2777)" stroke-width="2"/></g><g data-part="filament"><title>filament: The stalk that holds the anther.</title><path d="M186 240 q-16 -60 -28 -120" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="3"/><path d="M234 240 q16 -60 28 -120" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="3"/></g><g data-part="anther"><title>anther: Makes pollen. In an insect-pollinated flower it sits inside the flower.</title><ellipse cx="156" cy="116" rx="11" ry="18" fill="var(--vx-a3, #ea580c)" fill-opacity=".7" stroke="var(--vx-a3, #ea580c)" stroke-width="2" transform="rotate(-12 156 116)"/><ellipse cx="264" cy="116" rx="11" ry="18" fill="var(--vx-a3, #ea580c)" fill-opacity=".7" stroke="var(--vx-a3, #ea580c)" stroke-width="2" transform="rotate(12 264 116)"/></g><g data-part="ovary"><title>ovary: Contains the ovules; becomes the fruit.</title><ellipse cx="210" cy="168" rx="40" ry="48" fill="var(--vx-a5, #7c3aed)" fill-opacity=".15" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.4"/></g><g data-part="ovule"><title>ovule: Contains the egg cell; becomes the seed after fertilisation.</title><ellipse cx="210" cy="172" rx="13" ry="20" fill="var(--vx-a1, #4f46e5)" fill-opacity=".5" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.8"/><circle cx="210" cy="176" r="4.5" fill="var(--vx-ink, #151826)" fill-opacity=".7"/></g><g data-part="style"><title>style: The pollen tube grows down it towards the ovary.</title><rect x="205" y="72" width="10" height="52" rx="4" fill="var(--vx-a5, #7c3aed)" fill-opacity=".5" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/></g><g data-part="stigma"><title>stigma: Receives pollen; sticky or feathery.</title><circle cx="210" cy="62" r="13" fill="var(--vx-a2, #db2777)" fill-opacity=".6" stroke="var(--vx-a2, #db2777)" stroke-width="2"/></g></g><circle cx="292.9" cy="97.1" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="292.9" y="97.6" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1</text><circle cx="112.9" cy="206.9" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="112.9" y="207.4" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2</text><circle cx="236.3" cy="107.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="236.3" y="107.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3</text><circle cx="169.4" cy="179.4" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="169.4" y="179.9" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4</text><circle cx="200.3" cy="57.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="200.3" y="58.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5</text><circle cx="194.3" cy="93.7" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="194.3" y="94.2" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6</text><circle cx="220.9" cy="134.9" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="220.9" y="135.4" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7</text><circle cx="190.0" cy="158.9" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="190.0" y="159.4" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8</text><circle cx="190.0" cy="234.3" r="9" fill="var(--vx-bg, #ffffff)" stroke="var(--vx-ink, #151826)" stroke-width="1.4"/><text x="190.0" y="234.8" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">9</text><text x="14.0" y="287.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1  petal</text><text x="14.0" y="306.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2  sepal</text><text x="14.0" y="325.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3  anther</text><text x="14.0" y="344.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4  filament</text><text x="14.0" y="363.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5  stigma</text><text x="14.0" y="382.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">6  style</text><text x="14.0" y="401.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">7  ovary</text><text x="14.0" y="420.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">8  ovule</text><text x="14.0" y="439.1" font-size="12.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">9  receptacle</text></svg>