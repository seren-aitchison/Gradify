<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 262.0" width="700.0" height="262.0" role="img" aria-label="Five small pictures of an egg inside its zona pellucida: a sperm at the zona; the acrosome reaction opening a gap in the zona; the sperm fused with the egg and its nucleus inside; the cortical granules releasing enzymes while a second sperm is blocked outside; and the two nuclei, 23 chromosomes each, combining." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(78.0 106.0)"><g data-part="egg"><title>egg: The egg cell, with its plasma membrane.</title><circle r="34" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/></g><g data-part="zona pellucida"><title>zona pellucida: The glycoprotein layer round the egg.</title><circle r="41" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="6" stroke-opacity="0.7"/></g><g data-part="sperm"><title>sperm: A capacitated sperm; the acrosome on its head holds digestive enzymes.</title><g transform="translate(0 -57) rotate(0)"><path d="M0 -8 Q-3 -40 0 -64" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><ellipse cx="0" cy="0" rx="6" ry="8" fill="var(--vx-a1, #4f46e5)" fill-opacity=".8" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><ellipse cx="0" cy="3" rx="4.6" ry="3.4" fill="var(--vx-a2, #db2777)" fill-opacity=".9"/></g></g></g><text x="78.0" y="168.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">1  Sperm at the zona</text><text x="78.0" y="187.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">a capacitated sperm</text><text x="78.0" y="202.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">binds the zona</text><text x="78.0" y="217.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">pellucida</text><g transform="translate(214.0 106.0)"><g data-part="egg"><title>egg: The egg cell, with its plasma membrane.</title><circle r="34" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/></g><g data-part="zona pellucida"><title>zona pellucida: The glycoprotein layer round the egg.</title><path d="M8.5 -40.1 A41 41 0 1 1 -8.5 -40.1" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="6" stroke-opacity=".7"/></g><g data-part="acrosomal enzymes"><title>acrosomal enzymes: Enzymes released from the acrosome digest the zona pellucida.</title><circle cx="-9" cy="-44" r="2.4" fill="var(--vx-a2, #db2777)"/><circle cx="9" cy="-44" r="2.4" fill="var(--vx-a2, #db2777)"/><circle cx="-5" cy="-37" r="2.4" fill="var(--vx-a2, #db2777)"/><circle cx="5" cy="-37" r="2.4" fill="var(--vx-a2, #db2777)"/></g><g data-part="sperm"><title>sperm: The sperm head, its acrosome emptied.</title><g transform="translate(0 -50) rotate(0)"><path d="M0 -8 Q-3 -40 0 -64" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><ellipse cx="0" cy="0" rx="6" ry="8" fill="var(--vx-a1, #4f46e5)" fill-opacity=".8" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/></g></g></g><text x="214.0" y="168.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2  Acrosome reaction</text><text x="214.0" y="187.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">enzymes digest a</text><text x="214.0" y="202.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">path through the</text><text x="214.0" y="217.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">zona</text><g transform="translate(350.0 106.0)"><g data-part="egg"><title>egg: The egg cell, with its plasma membrane.</title><circle r="34" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/></g><g data-part="zona pellucida"><title>zona pellucida: The glycoprotein layer round the egg.</title><path d="M10.6 -39.6 A41 41 0 1 1 -10.6 -39.6" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="6" stroke-opacity=".7"/></g><g data-part="sperm"><title>sperm: The sperm membrane fuses with the egg membrane.</title><g transform="translate(0 -41) rotate(0)"><path d="M0 -8 Q-3 -40 0 -64" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><ellipse cx="0" cy="0" rx="6" ry="8" fill="var(--vx-a1, #4f46e5)" fill-opacity=".8" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/></g></g><g data-part="sperm nucleus"><title>sperm nucleus: The sperm nucleus enters the egg, carrying 23 chromosomes.</title><circle cx="0" cy="-22" r="6" fill="var(--vx-a5, #7c3aed)" fill-opacity=".6" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/></g></g><text x="350.0" y="168.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3  Fusion</text><text x="350.0" y="187.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the membranes fuse</text><text x="350.0" y="202.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and the sperm</text><text x="350.0" y="217.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">nucleus enters</text><g transform="translate(486.0 106.0)"><g data-part="egg"><title>egg: The egg cell, with its plasma membrane.</title><circle r="34" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/></g><g data-part="zona pellucida"><title>zona pellucida: The zona pellucida, now hardened by the cortical reaction so that no more sperm can bind.</title><circle r="41" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="9" stroke-opacity="0.95"/></g><g data-part="cortical granules"><title>cortical granules: Granules under the egg membrane release enzymes that harden the zona pellucida.</title><circle cx="28.6" cy="5.0" r="2.3" fill="var(--vx-a2, #db2777)" fill-opacity=".8"/><circle cx="36.9" cy="6.5" r="1.6" fill="var(--vx-a2, #db2777)"/><circle cx="20.1" cy="20.9" r="2.3" fill="var(--vx-a2, #db2777)" fill-opacity=".8"/><circle cx="26.0" cy="27.0" r="1.6" fill="var(--vx-a2, #db2777)"/><circle cx="4.0" cy="28.7" r="2.3" fill="var(--vx-a2, #db2777)" fill-opacity=".8"/><circle cx="5.2" cy="37.1" r="1.6" fill="var(--vx-a2, #db2777)"/><circle cx="-13.6" cy="25.6" r="2.3" fill="var(--vx-a2, #db2777)" fill-opacity=".8"/><circle cx="-17.6" cy="33.1" r="1.6" fill="var(--vx-a2, #db2777)"/><circle cx="-26.1" cy="12.7" r="2.3" fill="var(--vx-a2, #db2777)" fill-opacity=".8"/><circle cx="-33.7" cy="16.4" r="1.6" fill="var(--vx-a2, #db2777)"/><circle cx="-28.6" cy="-5.0" r="2.3" fill="var(--vx-a2, #db2777)" fill-opacity=".8"/><circle cx="-36.9" cy="-6.5" r="1.6" fill="var(--vx-a2, #db2777)"/><circle cx="-20.1" cy="-20.9" r="2.3" fill="var(--vx-a2, #db2777)" fill-opacity=".8"/><circle cx="-26.0" cy="-27.0" r="1.6" fill="var(--vx-a2, #db2777)"/><circle cx="-4.0" cy="-28.7" r="2.3" fill="var(--vx-a2, #db2777)" fill-opacity=".8"/><circle cx="-5.2" cy="-37.1" r="1.6" fill="var(--vx-a2, #db2777)"/><circle cx="13.6" cy="-25.6" r="2.3" fill="var(--vx-a2, #db2777)" fill-opacity=".8"/><circle cx="17.6" cy="-33.1" r="1.6" fill="var(--vx-a2, #db2777)"/><circle cx="26.1" cy="-12.7" r="2.3" fill="var(--vx-a2, #db2777)" fill-opacity=".8"/><circle cx="33.7" cy="-16.4" r="1.6" fill="var(--vx-a2, #db2777)"/></g><g data-part="sperm nucleus"><title>sperm nucleus: The nucleus of the one sperm that entered.</title><circle cx="0" cy="-14" r="6" fill="var(--vx-a5, #7c3aed)" fill-opacity=".6" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/></g><g data-part="blocked sperm"><title>blocked sperm: A second sperm cannot bind the hardened zona, so polyspermy is prevented.</title><g transform="translate(40 -50) rotate(25)"><path d="M0 -8 Q-3 -12 0 -36" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><ellipse cx="0" cy="0" rx="6" ry="8" fill="var(--vx-a1, #4f46e5)" fill-opacity=".8" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><ellipse cx="0" cy="3" rx="4.6" ry="3.4" fill="var(--vx-a2, #db2777)" fill-opacity=".9"/></g><path d="M28 -66 l12 12 M40 -66 l-12 12" stroke="var(--vx-bad, #dc2626)" stroke-width="2"/></g></g><text x="486.0" y="168.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">4  Cortical reaction</text><text x="486.0" y="187.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the zona hardens:</text><text x="486.0" y="202.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">other sperm are</text><text x="486.0" y="217.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">blocked</text><g transform="translate(622.0 106.0)"><g data-part="egg"><title>egg: The egg cell, with its plasma membrane.</title><circle r="34" fill="var(--vx-a4, #0d9488)" fill-opacity=".14" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/></g><g data-part="zona pellucida"><title>zona pellucida: The zona pellucida, now hardened by the cortical reaction so that no more sperm can bind.</title><circle r="41" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="9" stroke-opacity="0.95"/></g><g data-part="pronuclei"><title>pronuclei: The two haploid nuclei (23 chromosomes each) combine.</title><circle cx="-8" cy="0" r="12" fill="var(--vx-a5, #7c3aed)" fill-opacity=".4" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><circle cx="8" cy="0" r="12" fill="var(--vx-a4, #0d9488)" fill-opacity=".4" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="-12.0" y="0.0" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">23</text><text x="12.0" y="0.0" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">23</text></g></g><text x="622.0" y="168.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">5  Nuclei combine</text><text x="622.0" y="187.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">two haploid nuclei</text><text x="622.0" y="202.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">form a diploid</text><text x="622.0" y="217.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">zygote</text><text x="350.0" y="242.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">23 + 23 = 46: two haploid gametes make a diploid zygote</text></svg>