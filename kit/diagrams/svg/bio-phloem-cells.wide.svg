<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 236.3" width="700.0" height="236.3" role="img" aria-label="Two sieve tube elements stacked end to end with a perforated sieve plate between them, each with a companion cell beside it containing a nucleus and mitochondria, joined to it by narrow channels." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(164 8) scale(0.7143)"><g data-part="sieve tube element"><title>sieve tube element: A living cell joined end to end with others; few organelles and no nucleus.</title><rect x="120" y="28" width="86" height="124" rx="6" fill="var(--vx-a2, #db2777)" fill-opacity=".1" stroke="var(--vx-a2, #db2777)" stroke-width="2.4"/></g><g data-part="companion cell"><title>companion cell: Has a nucleus and many mitochondria; it supports the sieve tube element and loads sucrose using ATP.</title><rect x="228" y="34" width="52" height="112" rx="14" fill="var(--vx-a4, #0d9488)" fill-opacity=".16" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/></g><g data-part="nucleus"><title>nucleus: Present in the companion cell, which runs the sieve tube element too; the sieve tube element has none.</title><circle cx="254" cy="68" r="13" fill="var(--vx-a5, #7c3aed)" fill-opacity=".5" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/></g><g data-part="mitochondria"><title>mitochondria: Many in the companion cell: they make the ATP that loads sucrose into the sieve tube.</title><ellipse cx="242" cy="110" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><ellipse cx="254" cy="118" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><ellipse cx="266" cy="110" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/></g><g data-part="plasmodesma"><title>plasmodesma: A channel through the wall linking a companion cell to its sieve tube element.</title><rect x="204" y="56" width="26" height="6" fill="var(--vx-a1, #4f46e5)" fill-opacity=".7"/><rect x="204" y="98" width="26" height="6" fill="var(--vx-a1, #4f46e5)" fill-opacity=".7"/></g><g data-part="sieve tube element"><title>sieve tube element: A living cell joined end to end with others; few organelles and no nucleus.</title><rect x="120" y="152" width="86" height="124" rx="6" fill="var(--vx-a2, #db2777)" fill-opacity=".1" stroke="var(--vx-a2, #db2777)" stroke-width="2.4"/></g><g data-part="companion cell"><title>companion cell: Has a nucleus and many mitochondria; it supports the sieve tube element and loads sucrose using ATP.</title><rect x="228" y="158" width="52" height="112" rx="14" fill="var(--vx-a4, #0d9488)" fill-opacity=".16" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/></g><g data-part="nucleus"><title>nucleus: Present in the companion cell, which runs the sieve tube element too; the sieve tube element has none.</title><circle cx="254" cy="192" r="13" fill="var(--vx-a5, #7c3aed)" fill-opacity=".5" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/></g><g data-part="mitochondria"><title>mitochondria: Many in the companion cell: they make the ATP that loads sucrose into the sieve tube.</title><ellipse cx="242" cy="234" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><ellipse cx="254" cy="242" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/><ellipse cx="266" cy="234" rx="6" ry="3.4" fill="var(--vx-a3, #ea580c)" fill-opacity=".75"/></g><g data-part="plasmodesma"><title>plasmodesma: A channel through the wall linking a companion cell to its sieve tube element.</title><rect x="204" y="180" width="26" height="6" fill="var(--vx-a1, #4f46e5)" fill-opacity=".7"/><rect x="204" y="222" width="26" height="6" fill="var(--vx-a1, #4f46e5)" fill-opacity=".7"/></g><g data-part="sieve plate"><title>sieve plate: A perforated cross-wall between sieve tube elements that lets sap pass.</title><rect x="118" y="148" width="90" height="8" rx="2" fill="var(--vx-a3, #ea580c)" fill-opacity=".7"/><circle cx="130" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/><circle cx="144" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/><circle cx="158" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/><circle cx="172" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/><circle cx="186" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/><circle cx="200" cy="152" r="2.2" fill="var(--vx-panel, #f4f5fb)"/></g></g><path d="M278.3 58.0 L152.0 58.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="278.3" cy="58.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="58.0" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">sieve tube element</text><path d="M252.6 116.6 L152.0 116.6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="252.6" cy="116.6" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="116.6" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">sieve plate</text><path d="M319.0 51.6 L484.0 51.6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="319.0" cy="51.6" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="51.6" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">plasmodesma</text><path d="M345.4 56.6 L484.0 77.6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="345.4" cy="56.6" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="77.6" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">nucleus</text><path d="M356.9 79.4 L484.0 103.6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="356.9" cy="79.4" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="103.6" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">companion cell</text><path d="M345.4 88.0 L484.0 129.6" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="345.4" cy="88.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="129.6" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">mitochondria</text></svg>