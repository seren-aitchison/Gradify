<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 349.3" width="380.0" height="349.3" role="img" aria-label="A flow chart: a controlled, energy-requiring death triggered by signals leads to apoptosis, with shrinking and no inflammation; death from severe injury leads to necrosis, with swelling, bursting and inflammation." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="93.7" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 66.8)"><text x="190.0" y="-26.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is the death controlled and</text><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">energy-requiring, triggered by a</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">signal such as DNA damage or a death</text><text x="190.0" y="26.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">receptor?</text></g><path d="M30.0 113.7 L30.0 141.7" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 141.7 L34.7 141.7" stroke="var(--vx-bad, #dc2626)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 141.7 L34.0 144.9 L34.0 138.5 Z" fill="var(--vx-bad, #dc2626)"/><rect x="42.0" y="125.7" width="270.0" height="79.9" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="1.6"/><text x="177.0" y="139.7" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">no</text><g transform="translate(0 181.6)"><text x="177.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Necrosis: severe injury; the cell</text><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">swells and bursts, and the leaked</text><text x="177.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">contents cause inflammation</text></g><path d="M338.0 115.7 L338.0 223.5" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 231.6 L333.9 222.6 L342.1 222.6 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 165.6)" x="332.0" y="165.6" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="235.6" width="340.0" height="93.7" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 282.4)"><text x="190.0" y="-26.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Apoptosis: the cell shrinks and</text><text x="190.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">breaks into apoptotic bodies;</text><text x="190.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">phagocytes remove them with no</text><text x="190.0" y="26.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">inflammation</text></g></svg>