<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 442.0" width="380.0" height="442.0" role="img" aria-label="Vector triangle: a north arrow of 4.0 m/s, an east arrow of 3.0 m/s from its tip, and the resultant of 5.0 m/s from the start to the end, 37 degrees east of north." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Adding perpendicular velocities</text><circle cx="110.0" cy="272.6" r="4" fill="var(--vx-ink, #151826)"/><path d="M356.0 74.0 L356.0 47.2" stroke="var(--vx-soft, #5b6275)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M356.0 40.0 L359.7 48.0 L352.3 48.0 Z" fill="var(--vx-soft, #5b6275)"/><text x="356.0" y="32.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">N</text><path d="M110.0 272.6 L110.1 69.3" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M110.1 59.4 L115.1 70.4 L105.0 70.4 Z" fill="var(--vx-a1, #4f46e5)"/><path d="M110.1 59.4 L260.1 59.4" stroke="var(--vx-a4, #0d9488)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M269.9 59.4 L258.9 64.5 L258.9 54.3 Z" fill="var(--vx-a4, #0d9488)"/><path d="M110.0 272.6 L264.0 67.3" stroke="var(--vx-a2, #db2777)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M269.9 59.4 L267.4 71.2 L259.3 65.2 Z" fill="var(--vx-a2, #db2777)"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="57.8" y="166.0" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">v<tspan baseline-shift="sub" font-size="10.4">boat</tspan></text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="190.0" y="43.4" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" font-style="italic">v<tspan baseline-shift="sub" font-size="10.4">river</tspan></text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="202.8" y="175.6" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" font-style="italic">v</text><text x="16.0" y="322.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">v<tspan baseline-shift="sub" font-size="9.4">boat</tspan> = 4.0 m s<tspan baseline-shift="super" font-size="9.4">-1</tspan>, north</text><text x="16.0" y="344.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">v<tspan baseline-shift="sub" font-size="9.4">river</tspan> = 3.0 m s<tspan baseline-shift="super" font-size="9.4">-1</tspan>, east</text><text x="16.0" y="366.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">v = 5.0 m s<tspan baseline-shift="super" font-size="9.4">-1</tspan>, 37° east of north</text><text x="16.0" y="388.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">|v| = √(4.0<tspan baseline-shift="super" font-size="9.4">2</tspan> + 3.0<tspan baseline-shift="super" font-size="9.4">2</tspan>) = 5.0 m s<tspan baseline-shift="super" font-size="9.4">-1</tspan></text><text x="16.0" y="410.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">tan φ = 3.0/4.0, φ = 37° east of north</text></svg>