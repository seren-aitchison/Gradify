1, #4f46e5)" font-style="italic">N</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="134.0" y="147.5" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" font-style="italic">f</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="131.8" y="220.3" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" font-style="italic">net force</text><text x="16.0" y="322.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">W = 9.8 N at 270°</text><text x="16.0" y="344.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">N = 8.49 N at 60°</text><text x="16.0" y="366.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">f = 1.7 N at 150°</text><text x="16.0" y="388.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">net force = 3.2 N at 330°</text></svg>