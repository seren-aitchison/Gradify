<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 313.4" width="380.0" height="313.4" role="img" aria-label="A flow chart: a protein made inside the cell goes by the proteasome to MHC class I and cytotoxic CD8 T cells; a protein taken in from outside goes by endosomes to MHC class II and helper CD4 T cells." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 48.9)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Was the protein made inside the</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">cell, as a viral protein is?</text></g><path d="M30.0 77.8 L30.0 105.8" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 105.8 L34.7 105.8" stroke="var(--vx-good, #16a34a)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 105.8 L34.0 109.1 L34.0 102.6 Z" fill="var(--vx-good, #16a34a)"/><rect x="42.0" y="89.8" width="270.0" height="79.9" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="1.6"/><text x="177.0" y="103.8" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">no</text><g transform="translate(0 145.8)"><text x="177.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">MHC class II: endosomes break down</text><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">the protein, and the peptides are</text><text x="177.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">shown to helper CD4⁺ T cells</text></g><path d="M338.0 79.8 L338.0 187.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 195.8 L333.9 186.8 L342.1 186.8 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 129.8)" x="332.0" y="129.8" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="199.8" width="340.0" height="93.7" rx="14" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-width="2"/><g transform="translate(0 246.6)"><text x="190.0" y="-26.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">MHC class I: the proteasome makes</text><text x="190.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">peptides, which are shown to</text><text x="190.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">cytotoxic CD8⁺ T cells that kill</text><text x="190.0" y="26.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">the infected cell</text></g></svg>