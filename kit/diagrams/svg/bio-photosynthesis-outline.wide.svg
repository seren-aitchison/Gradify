<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 234.0" width="700.0" height="234.0" role="img" aria-label="Five boxes in order: light and water, the light-dependent reactions, ATP and NADPH, the Calvin cycle, and glucose and other products." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M198.8 56.0 L260.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M269.0 56.0 L260.0 60.1 L260.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M431.0 56.0 L497.9 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M506.0 56.0 L497.0 60.1 L497.0 51.9 Z" fill="var(--vx-ink, #151826)"/><path d="M506.7 96.1 L429.4 140.5" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M422.3 144.5 L428.1 136.4 L432.2 143.6 Z" fill="var(--vx-ink, #151826)"/><path d="M276.0 186.0 L203.0 186.0" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M194.9 186.0 L203.9 181.9 L203.9 190.1 Z" fill="var(--vx-ink, #151826)"/><rect x="52.8" y="24.5" width="141.0" height="63.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="123.3" y="40.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">light and water</text><text x="123.3" y="57.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">light energy; H<tspan baseline-shift="sub" font-size="8.3">2</tspan>O</text><text x="123.3" y="72.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">from the roots</text><rect x="274.0" y="1.0" width="152.0" height="110.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="350.0" y="17.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">light-dependent</text><text x="350.0" y="34.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">reactions</text><text x="350.0" y="51.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">thylakoid membranes:</text><text x="350.0" y="66.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">water split, O<tspan baseline-shift="sub" font-size="8.3">2</tspan></text><text x="350.0" y="81.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">released, ATP and</text><text x="350.0" y="96.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">NADPH made</text><rect x="511.0" y="17.0" width="131.3" height="78.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="576.7" y="33.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">ATP and NADPH</text><text x="576.7" y="50.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carry energy and</text><text x="576.7" y="65.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">hydrogen to the</text><text x="576.7" y="80.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">stroma</text><rect x="281.0" y="147.0" width="138.0" height="78.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="350.0" y="163.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Calvin cycle</text><text x="350.0" y="180.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">stroma: CO<tspan baseline-shift="sub" font-size="8.3">2</tspan> fixed</text><text x="350.0" y="195.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and reduced to</text><text x="350.0" y="210.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">triose phosphate</text><rect x="56.7" y="138.5" width="133.2" height="95.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="123.3" y="154.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">glucose and</text><text x="123.3" y="171.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">other products</text><text x="123.3" y="188.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">sugars, starch,</text><text x="123.3" y="203.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cellulose, amino</text><text x="123.3" y="218.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">acids, lipids</text></svg>