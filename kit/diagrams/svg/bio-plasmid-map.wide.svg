<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 473.4" width="700.0" height="473.4" role="img" aria-label="A circle labelled 3,000 base pairs with four coloured arcs: an origin of replication, an ampicillin resistance gene, a promoter and a short multiple cloning site with three unique cutting sites, EcoRI, BamHI and HindIII." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><circle cx="274" cy="206" r="122" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="2"/><g data-part="ori"><title>ori: Origin of replication: where copying of the plasmid starts, so it replicates independently in the host.</title><path d="M299.4 86.7 A122 122 0 0 1 395.3 193.2" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="15" stroke-linecap="butt"/></g><g data-part="AmpR"><title>AmpR: Selectable marker (an antibiotic resistance gene): only cells that took up the plasmid survive on antibiotic agar.</title><path d="M364.7 287.6 A122 122 0 0 1 173.7 275.4" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="15" stroke-linecap="butt"/></g><g data-part="promoter"><title>promoter: Drives expression of the inserted gene.</title><path d="M152.0 206.0 A122 122 0 0 1 154.7 180.6" fill="none" stroke="var(--vx-good, #16a34a)" stroke-width="15" stroke-linecap="butt"/></g><g data-part="MCS"><title>MCS: Multiple cloning site (polylinker): many unique restriction sites where a gene can be inserted.</title><path d="M158.0 168.3 A122 122 0 0 1 163.6 154.1" fill="none" stroke="var(--vx-a1, #4f46e5)" stroke-width="20" stroke-linecap="butt"/></g><path d="M172.0 170.5 L145.6 161.3" stroke="var(--vx-ink, #151826)" stroke-width="1.8"/><path d="M173.6 166.2 L147.6 155.9" stroke="var(--vx-ink, #151826)" stroke-width="1.8"/><path d="M175.3 162.1 L149.8 150.7" stroke="var(--vx-ink, #151826)" stroke-width="1.8"/><text x="398.4" y="97.6" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">ori</text><text x="398.4" y="112.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">100–700</text><text x="259.7" y="367.7" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">AmpR</text><text x="259.7" y="382.7" font-size="10.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">1100–1961</text><text x="108.9" y="189.1" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">promoter</text><text x="108.9" y="204.1" font-size="10.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">2250–2350</text><text x="119.4" y="146.4" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">MCS</text><text x="119.4" y="161.4" font-size="10.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">2400–2460</text><text x="274.0" y="184.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">illustrative vector</text><text x="274.0" y="202.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">3,000 bp</text><text x="274.0" y="220.0" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">illustrative: not a named plasmid</text><text x="274.0" y="420.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Unique cutters in the MCS: EcoRI 2410  ·  BamHI 2430  ·  HindIII 2450</text><text x="274.0" y="448.7" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">EcoRI + HindIII gives fragments of 40 bp and 2,960 bp</text></svg>