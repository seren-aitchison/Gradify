<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 476.6" width="380.0" height="476.6" role="img" aria-label="A flow chart: no four-carbon acid means C3; a four-carbon acid with steps in different cells means C4; with steps at different times means CAM." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="20.0" y="20.0" width="340.0" height="75.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 57.9)"><text x="190.0" y="-17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Does the plant first fix CO₂ into a</text><text x="190.0" y="0.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">four-carbon acid (with PEP</text><text x="190.0" y="17.9" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">carboxylase)?</text></g><path d="M30.0 95.8 L30.0 123.8" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 123.8 L34.7 123.8" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 123.8 L34.0 127.0 L34.0 120.5 Z" fill="var(--vx-a4, #0d9488)"/><rect x="42.0" y="107.8" width="270.0" height="63.3" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="177.0" y="121.8" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><g transform="translate(0 155.4)"><text x="177.0" y="-8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">C3: RuBisCO fixes CO₂ directly in</text><text x="177.0" y="8.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">the Calvin cycle</text></g><path d="M338.0 97.8 L338.0 188.9" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 197.0 L333.9 188.0 L342.1 188.0 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 139.4)" x="332.0" y="139.4" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="201.0" width="340.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 230.0)"><text x="190.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are the steps in different cells:</text><text x="190.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">mesophyll, then bundle sheath?</text></g><path d="M30.0 258.9 L30.0 286.9" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M30.0 286.9 L34.7 286.9" stroke="var(--vx-a3, #ea580c)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M41.0 286.9 L34.0 290.1 L34.0 283.7 Z" fill="var(--vx-a3, #ea580c)"/><rect x="42.0" y="270.9" width="270.0" height="79.9" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="177.0" y="284.9" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">no</text><g transform="translate(0 326.8)"><text x="177.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">CAM: steps separated in time.</text><text x="177.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Stomata open at night: cacti,</text><text x="177.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">pineapples</text></g><path d="M338.0 260.9 L338.0 368.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M338.0 376.8 L333.9 367.8 L342.1 367.8 Z" fill="var(--vx-good, #16a34a)"/><text transform="rotate(-90 332.0 310.8)" x="332.0" y="310.8" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="20.0" y="380.8" width="340.0" height="75.8" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 418.7)"><text x="190.0" y="-17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">C4: steps separated in space.</text><text x="190.0" y="0.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Maize, sugarcane; good in hot,</text><text x="190.0" y="17.9" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">sunny, dry conditions</text></g></svg>