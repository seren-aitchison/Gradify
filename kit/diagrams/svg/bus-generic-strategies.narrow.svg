<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 226.2" width="380.0" height="226.2" role="img" aria-label="A two by two grid: broad scope with lower cost is cost leadership, broad with differentiation is differentiation, narrow with lower cost is cost focus, narrow with differentiation is differentiation focus." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="153.5" y="28.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Lower cost</text><text x="300.5" y="28.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Differentiation</text><text x="72.0" y="73.8" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Broad</text><text x="72.0" y="88.2" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">scope</text><rect x="80.0" y="42.0" width="141.0" height="72.0" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".5" stroke-width="1.3"/><text x="89.0" y="59.2" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">Cost leadership</text><text x="89.0" y="78.0" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• Aldi</text><rect x="227.0" y="42.0" width="141.0" height="72.0" rx="10" fill="var(--vx-a2, #db2777)" fill-opacity=".1" stroke="var(--vx-a2, #db2777)" stroke-opacity=".5" stroke-width="1.3"/><text x="236.0" y="59.2" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">Differentiation</text><text x="236.0" y="78.0" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• Waitrose</text><text x="72.0" y="152