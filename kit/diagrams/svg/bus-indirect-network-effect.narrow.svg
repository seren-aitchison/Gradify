<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 218.4" width="380.0" height="218.4" role="img" aria-label="A cycle of three boxes: more drivers, shorter waits, more riders, with more riders leading back to more drivers." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="40.0" y="14.0" width="322.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="49.0" y="29.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">More drivers</text><text x="49.0" y="49.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">helped by bonuses at launch</text><rect x="40.0" y="86.1" width="322.0" height="50.1" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="49.0" y="101.6" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Shorter waits</text><text x="49.0" y="121.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">riders get a car sooner</text><rect x="40.0" y="158.3" width="322.0" height="50.1" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="49.0" y="173.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">More riders</text><text x="49.0" y="193.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">attract still more drivers</text><path d="M201.0 66.1 L201.0 76.9" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M201.0 84.1 L197.3 76.1 L204.7 76.1 Z" fill="var(--vx-line, #8a92a8)"/><path d="M201.0 138.3 L201.0 149.1" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M201.0 156.3 L197.3 148.3 L204.7 148.3 Z" fill="var(--vx-line, #8a92a8)"/><path d="M40.0 183.3 L18 183.3 L18 39.1 L37.0 39.1" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="2.4"/><path d="M38.0 39.1 l-9 -4.5 l0 9 z" fill="var(--vx-a2, #db2777)"/></svg>