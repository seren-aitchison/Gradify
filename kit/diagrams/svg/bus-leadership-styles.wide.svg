<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 268.0" width="700.0" height="268.0" role="img" aria-label="Four boxes: autocratic, democratic, laissez-faire and paternalistic, each with its strength and weakness." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="12.0" width="338.0" height="120.0" rx="9" fill="var(--vx-bad, #dc2626)" fill-opacity="0.12" stroke="var(--vx-bad, #dc2626)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="54.6" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Autocratic</text><text x="17.0" y="75.9" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Decides and tells. Fast and clear; can demotivate</text><text x="17.0" y="90.3" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">skilled staff.</text><rect x="354.0" y="12.0" width="338.0" height="120.0" rx="9" fill="var(--vx-good, #16a34a)" fill-opacity="0.12" stroke="var(--vx-good, #16a34a)" stroke-opacity=".55" stroke-width="1.3"/><text x="363.0" y="61.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Democratic</text><text x="363.0" y="83.1" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Involves staff. Builds commitment; slower.</text><rect x="8.0" y="140.0" width="338.0" height="120.0" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="17.0" y="182.6" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Laissez-faire</text><text x="17.0" y="203.9" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Leaves decisions to the group. Suits skilled</text><text x="17.0" y="218.3" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">experts; can drift.</text><rect x="354.0" y="140.0" width="338.0" height="120.0" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="363.0" y="182.6" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Paternalistic</text><text x="363.0" y="203.9" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Decides in staff's best interests. Builds loyalty;</text><text x="363.0" y="218.3" font-size="11.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">can feel patronising.</text></svg>