<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 322.0" width="700.0" height="322.0" role="img" aria-label="A flower cut lengthways: two petals and two sepals round a central carpel with a stigma on top, a style below it, and an ovary at the base holding an ovule, with two anthers on filaments either side." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(14 8) scale(1.0000)"><g data-part="receptacle"><title>receptacle: The base of the flower, to which the other parts attach.</title><path d="M170 262 q40 24 80 0 l-8 -24 h-64 Z" fill="var(--vx-a4, #0d9488)" fill-opacity=".4" stroke="var(--vx-a4, #0d9488)" stroke-width="2"/></g><g data-part="sepal"><title>sepal: Protects the flower in bud.</title><path d="M180 244 q-70 6 -90 -34 q50 8 90 34" fill="var(--vx-good, #16a34a)" fill-opacity=".5" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><path d="M240 244 q70 6 90 -34 q-50 8 -90 34" fill="var(--vx-good, #16a34a)" fill-opacity=".5" stroke="var(--vx-good, #16a34a)" stroke-width="2"/></g><g data-part="petal"><title>petal: Large and coloured in an insect-pollinated flower, to attract pollinators.</title><path d="M176 236 C90 220 60 120 98 50 C140 110 160 170 176 236 Z" fill="var(--vx-a2, #db2777)" fill-opacity=".28" stroke="var(--vx-a2, #db2777)" stroke-width="2"/><path d="M244 236 C330 220 360 120 322 50 C280 110 260 170 244 236 Z" fill="var(--vx-a2, #db2777)" fill-opacity=".28" stroke="var(--vx-a2, #db2777)" stroke-width="2"/></g><g data-part="filament"><title>filament: The stalk that holds the anther.</title><path d="M186 240 q-16 -60 -28 -120" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="3"/><path d="M234 240 q16 -60 28 -120" fill="none" stroke="var(--vx-a3, #ea580c)" stroke-width="3"/></g><g data-part="anther"><title>anther: Makes pollen. In an insect-pollinated flower it sits inside the flower.</title><ellipse cx="156" cy="116" rx="11" ry="18" fill="var(--vx-a3, #ea580c)" fill-opacity=".7" stroke="var(--vx-a3, #ea580c)" stroke-width="2" transform="rotate(-12 156 116)"/><ellipse cx="264" cy="116" rx="11" ry="18" fill="var(--vx-a3, #ea580c)" fill-opacity=".7" stroke="var(--vx-a3, #ea580c)" stroke-width="2" transform="rotate(12 264 116)"/></g><g data-part="ovary"><title>ovary: Contains the ovules; becomes the fruit.</title><ellipse cx="210" cy="168" rx="40" ry="48" fill="var(--vx-a5, #7c3aed)" fill-opacity=".15" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.4"/></g><g data-part="ovule"><title>ovule: Contains the egg cell; becomes the seed after fertilisation.</title><ellipse cx="210" cy="172" rx="13" ry="20" fill="var(--vx-a1, #4f46e5)" fill-opacity=".5" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.8"/><circle cx="210" cy="176" r="4.5" fill="var(--vx-ink, #151826)" fill-opacity=".7"/></g><g data-part="style"><title>style: The pollen tube grows down it towards the ovary.</title><rect x="205" y="72" width="10" height="52" rx="4" fill="var(--vx-a5, #7c3aed)" fill-opacity=".5" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/></g><g data-part="stigma"><title>stigma: Receives pollen; sticky or feathery.</title><circle cx="210" cy="62" r="13" fill="var(--vx-a2, #db2777)" fill-opacity=".6" stroke="var(--vx-a2, #db2777)" stroke-width="2"/></g></g><path d="M236.0 66.0 L454.0 66.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="236.0" cy="66.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="66.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">stigma</text><path d="M229.0 108.0 L454.0 108.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="229.0" cy="108.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="108.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">style</text><path d="M344.0 112.0 L454.0 134.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="344.0" cy="112.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="134.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">petal</text><path d="M278.0 124.0 L454.0 160.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="278.0" cy="124.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="160.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">anther</text><path d="M260.0 156.0 L454.0 186.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="260.0" cy="156.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="186.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">ovary</text><path d="M224.0 184.0 L454.0 212.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="224.0" cy="184.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="212.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">ovule</text><path d="M200.0 208.0 L454.0 238.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="200.0" cy="208.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="238.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">filament</text><path d="M134.0 240.0 L454.0 264.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="134.0" cy="240.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="264.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">sepal</text><path d="M224.0 272.0 L454.0 290.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="224.0" cy="272.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="458.0" y="290.0" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">receptacle</text></svg>