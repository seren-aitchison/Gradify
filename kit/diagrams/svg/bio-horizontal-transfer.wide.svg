<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 236.3" width="700.0" height="236.3" role="img" aria-label="Three panels. Transformation: free DNA fragments above a bacterium and an arrow into it. Transduction: a bacteriophage between two bacteria with an arrow to the lower one. Conjugation: two bacteria joined by a pilus, a plasmid shown between them." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(164 8) scale(0.7143)"><text x="70.0" y="18.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">transformation</text><rect x="35" y="194" width="70" height="40" rx="20" fill="var(--vx-a4, #0d9488)" fill-opacity=".18" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/><circle cx="70" cy="214" r="9" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><g data-part="free DNA"><title>free DNA: DNA released into the environment by a dead cell, taken up by another bacterium: transformation.</title><path d="M30 70 q8 -12 16 0 t16 0 t16 0" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="3"/><path d="M60 118 q8 -12 16 0 t16 0" fill="none" stroke="var(--vx-a2, #db2777)" stroke-width="3"/><path d="M70.0 138.0 L70.0 177.9" stroke="var(--vx-a2, #db2777)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M70.0 186.0 L65.9 177.0 L74.1 177.0 Z" fill="var(--vx-a2, #db2777)"/></g><text x="210.0" y="18.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">transduction</text><rect x="175" y="42" width="70" height="40" rx="20" fill="var(--vx-a4, #0d9488)" fill-opacity=".18" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/><circle cx="210" cy="62" r="9" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><rect x="175" y="194" width="70" height="40" rx="20" fill="var(--vx-a4, #0d9488)" fill-opacity=".18" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/><circle cx="210" cy="214" r="9" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><g data-part="bacteriophage"><title>bacteriophage: A virus that carries a piece of bacterial DNA from one cell to the next: transduction.</title><g transform="translate(210 108)"><path d="M0 -14 l10 6 v11 l-10 6 l-10 -6 v-11 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".4" stroke="var(--vx-a3, #ea580c)" stroke-width="2.2"/><path d="M0 9 V30 M-8 35 L0 30 L8 35" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" fill="none"/><path d="M-5 -5 q2.5 -5 5 0 t5 0" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2"/></g><path d="M210.0 150.0 L210.0 181.9" stroke="var(--vx-a3, #ea580c)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M210.0 190.0 L205.9 181.0 L214.1 181.0 Z" fill="var(--vx-a3, #ea580c)"/></g><text x="350.0" y="18.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">conjugation</text><rect x="315" y="42" width="70" height="40" rx="20" fill="var(--vx-a4, #0d9488)" fill-opacity=".18" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/><circle cx="350" cy="62" r="9" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><rect x="315" y="194" width="70" height="40" rx="20" fill="var(--vx-a4, #0d9488)" fill-opacity=".18" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2"/><circle cx="350" cy="214" r="9" fill="none" stroke="var(--vx-a4, #0d9488)" stroke-width="2.4"/><g data-part="pilus"><title>pilus: A thin tube joining two bacteria through which a plasmid is passed from one to the other: conjugation.</title><path d="M350 82 V194" stroke="var(--vx-a1, #4f46e5)" stroke-width="7" stroke-linecap="round" opacity=".8"/><path d="M350 82 V194" stroke="var(--vx-panel, #f4f5fb)" stroke-width="2.4"/></g><g data-part="plasmid"><title>plasmid: A small circular DNA molecule, usually the DNA transferred in conjugation.</title><circle cx="372" cy="62" r="5.5" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.2"/><circle cx="350" cy="138" r="5.5" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.2"/><circle cx="372" cy="214" r="5.5" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.2"/></g></g><path d="M192.6 58.0 L152.0 58.0" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="192.6" cy="58.0" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="58.0" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">free DNA</text><path d="M192.6 160.9 L152.0 160.9" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="192.6" cy="160.9" r="2.6" fill="var(--vx-ink, #151826)"/><text x="146.0" y="160.9" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">recipient cell</text><path d="M416.9 85.1 L484.0 85.1" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="416.9" cy="85.1" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="85.1" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">pilus</text><path d="M322.6 85.1 L484.0 111.1" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="322.6" cy="85.1" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="111.1" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">bacteriophage</text><path d="M414.0 106.6 L484.0 137.1" stroke="var(--vx-soft, #5b6275)" stroke-width="1.1" stroke-linecap="round" fill="none"/><circle cx="414.0" cy="106.6" r="2.6" fill="var(--vx-ink, #151826)"/><text x="488.0" y="137.1" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">plasmid</text></svg>