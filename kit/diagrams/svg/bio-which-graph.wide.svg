<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 400.5" width="760.0" height="400.5" role="img" aria-label="A flow chart of questions leading to a bar chart, a histogram, a scatter graph or a line graph." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="30.0" y="25.0" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 54.0)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Is the independent variable continuous,</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">measured on a number scale?</text></g><path d="M430.0 54.0 L479.9 54.0" stroke="var(--vx-a4, #0d9488)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 54.0 L479.0 58.1 L479.0 49.8 Z" fill="var(--vx-a4, #0d9488)"/><text x="460.0" y="43.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><rect x="490.0" y="20.0" width="250.0" height="67.9" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8"/><g transform="translate(615.0 54.0)"><text x="0.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Bar chart: the independent</text><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">variable is categoric (blood</text><text x="0.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">group, species)</text></g><path d="M230.0 84.9 L230.0 108.8" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 116.9 L225.9 107.9 L234.1 107.9 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="100.9" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="125.9" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 154.8)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Are you plotting two different variables</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">against each other?</text></g><path d="M430.0 154.8 L479.9 154.8" stroke="var(--vx-a4, #0d9488)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 154.8 L479.0 159.0 L479.0 150.7 Z" fill="var(--vx-a4, #0d9488)"/><text x="460.0" y="143.8" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><rect x="490.0" y="120.9" width="250.0" height="67.9" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8"/><g transform="translate(615.0 154.8)"><text x="0.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Histogram: the frequency of one</text><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">continuous variable in classes,</text><text x="0.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">bars touching</text></g><path d="M230.0 185.8 L230.0 209.7" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 217.8 L225.9 208.8 L234.1 208.8 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="201.8" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="226.8" width="400.0" height="57.8" rx="14" fill="var(--vx-panel, #f4f5fb)" stroke="var(--vx-a1, #4f46e5)" stroke-width="2"/><g transform="translate(0 255.7)"><text x="230.0" y="-9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Did you set the independent variable yourself,</text><text x="230.0" y="9.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">in an experiment?</text></g><path d="M430.0 255.7 L479.9 255.7" stroke="var(--vx-a4, #0d9488)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M488.0 255.7 L479.0 259.9 L479.0 251.6 Z" fill="var(--vx-a4, #0d9488)"/><text x="460.0" y="244.7" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">no</text><rect x="490.0" y="221.8" width="250.0" height="67.9" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-width="1.8"/><g transform="translate(615.0 255.7)"><text x="0.0" y="-16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Scatter graph: look for a</text><text x="0.0" y="0.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">correlation between two measured</text><text x="0.0" y="16.6" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">variables</text></g><path d="M230.0 286.6 L230.0 310.5" stroke="var(--vx-good, #16a34a)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M230.0 318.6 L225.9 309.6 L234.1 309.6 Z" fill="var(--vx-good, #16a34a)"/><text x="240.0" y="302.6" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">yes</text><rect x="30.0" y="322.6" width="400.0" height="57.8" rx="14" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-width="2"/><g transform="translate(0 351.6)"><text x="230.0" y="-9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Line graph: independent variable on the</text><text x="230.0" y="9.0" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">x-axis, dependent on the y-axis</text></g></svg>