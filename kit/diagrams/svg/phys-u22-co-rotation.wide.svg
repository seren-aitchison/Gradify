<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640.0 386.0" width="640.0" height="386.0" role="img" aria-label="Rotational energy levels of carbon monoxide for J = 0 to 3, with gaps growing upward and transitions at 115, 230 and 345 gigahertz." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">The rotational ladder of CO</text><path d="M30.0 362.0 L30.0 52.3" stroke="var(--vx-ink, #151826)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M30.0 46.0 L33.2 53.0 L26.8 53.0 Z" fill="var(--vx-ink, #151826)"/><text x="24.0" y="38.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">E / eV</text><path d="M60.0 356.0 L470.0 356.0" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M470.0 356.0 L482.0 356.0" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="486.0" y="356.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">J = 0</text><path d="M60.0 306.0 L470.0 306.0" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M470.0 306.0 L482.0 306.0" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="486.0" y="306.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">J = 1</text><path d="M60.0 206.0 L470.0 206.0" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M470.0 206.0 L482.0 206.0" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="486.0" y="206.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">J = 2</text><path d="M60.0 56.0 L470.0 56.0" stroke="var(--vx-ink, #151826)" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M470.0 56.0 L482.0 56.0" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="486.0" y="56.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">J = 3</text><path d="M145.7 306.0 L145.7 347.9" stroke="var(--vx-soft, #5b6275)" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M145.7 356.0 L141.5 347.0 L149.8 347.0 Z" fill="var(--vx-soft, #5b6275)"/><path d="M265.0 206.0 L265.0 297.9" stroke="var(--vx-soft, #5b6275)" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M265.0 306.0 L260.9 297.0 L269.1 297.0 Z" fill="var(--vx-soft, #5b6275)"/><path d="M384.3 56.0 L384.3 197.9" stroke="var(--vx-soft, #5b6275)" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M384.3 206.0 L380.2 197.0 L388.5 197.0 Z" fill="var(--vx-soft, #5b6275)"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="150.7" y="331.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">115 GHz</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="270.0" y="256.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">230 GHz</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="389.3" y="131.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">345 GHz</text></svg>