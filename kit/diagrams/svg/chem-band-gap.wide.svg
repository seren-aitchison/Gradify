<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.0 300.0" width="680.0" height="300.0" role="img" aria-label="Three band diagrams: a metal with overlapping bands, silicon with a 1.1 eV gap and diamond with a 5.5 eV gap." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M12.0 270.0 L12.0 25.2" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M12.0 18.0 L15.7 26.0 L8.3 26.0 Z" fill="var(--vx-ink, #151826)"/><text x="18.0" y="14.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">electron energy / eV</text><path d="M96.8 218.9 L212.0 218.9" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="90.8" y="218.9" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">metal</text><path d="M96.8 235.3 L212.0 235.3" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4" fill="none"/><path d="M288.8 260.0 L404.0 260.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="282.8" y="260.0" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Si</text><path d="M288.8 214.8 L404.0 214.8" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4" fill="none"/><path d="M493.6 260.0 L608.8 260.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="487.6" y="260.0" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">diamond</text><path d="M493.6 34.0 L608.8 34.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4" fill="none"/><path d="M346.4 260.0 L346.4 222.0" stroke="var(--vx-a4, #0d9488)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M346.4 214.8 L350.1 222.8 L342.7 222.8 Z" fill="var(--vx-a4, #0d9488)"/><text x="352.4" y="237.4" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">1.1 eV</text><path d="M551.2 260.0 L551.2 41.2" stroke="var(--vx-a2, #db2777)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M551.2 34.0 L554.9 42.0 L547.5 42.0 Z" fill="var(--vx-a2, #db2777)"/><text x="557.2" y="147.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">5.5 eV</text><text x="154.4" y="202.9" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">bands overlap</text><text x="340.0" y="34.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">dashed: bottom of the empty band</text></svg>