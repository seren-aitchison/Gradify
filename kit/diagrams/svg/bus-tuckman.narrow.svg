<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 362.6" width="380.0" height="362.6" role="img" aria-label="Five boxes in order: forming, storming, norming, performing, adjourning." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="10.0" y="14.0" width="360.0" height="50.1" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="29.5" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Forming</text><text x="19.0" y="49.6" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">polite, uncertain, leader-dependent</text><rect x="10.0" y="86.1" width="360.0" height="50.1" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="101.6" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Storming</text><text x="19.0" y="121.7" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">conflict over roles and goals</text><rect x="10.0" y="158.3" width="360.0" height="50.1" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="173.8" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Norming</text><text x="19.0" y="193.8" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">agreed ways of working</text><rect x="10.0" y="230.4" width="360.0" height="50.1" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="245.9" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Performing</text><text x="19.0" y="265.9" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">task focus, high trust</text><rect x="10.0" y="302.5" width="360.0" height="50.1" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-opacity=".55" stroke-width="1.3"/><text x="19.0" y="318.0" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Adjourning</text><text x="19.0" y="338.1" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the group disbands</text><path d="M190.0 66.1 L190.0 76.9" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 84.1 L186.3 76.1 L193.7 76.1 Z" fill="var(--vx-line, #8a92a8)"/><path d="M190.0 138.3 L190.0 149.1" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 156.3 L186.3 148.3 L193.7 148.3 Z" fill="var(--vx-line, #8a92a8)"/><path d="M190.0 210.4 L190.0 221.2" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 228.4 L186.3 220.4 L193.7 220.4 Z" fill="var(--vx-line, #8a92a8)"/><path d="M190.0 282.5 L190.0 293.3" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 300.5 L186.3 292.5 L193.7 292.5 Z" fill="var(--vx-line, #8a92a8)"/></svg>