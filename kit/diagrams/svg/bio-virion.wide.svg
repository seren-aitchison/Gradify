<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 236.3" width="700.0" height="236.3" role="img" aria-label="Two virions. A non-enveloped one: a hexagonal capsid enclosing a coiled genome. An enveloped one: a round lipid envelope with spikes of glycoprotein, enclosing a capsid and a coiled genome." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><g transform="translate(164 8) scale(0.7143)"><text x="105.0" y="18.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">non-enveloped</text><text x="315.0" y="18.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">enveloped</text><g data-part="capsid"><title>capsid: The protein coat, made of repeating units called capsomeres.</title><path d="M170.8 188.0 L105.0 226.0 L39.2 188.0 L39.2 112.0 L105.0 74.0 L170.8 112.0 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".25" stroke="var(--vx-a3, #ea580c)" stroke-width="3"/><path d="M105 150 L170.8 188.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M105 150 L105.0 226.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M105 150 L39.2 188.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M105 150 L39.2 112.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M105 150 L105.0 74.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/><path d="M105 150 L170.8 112.0" stroke="var(--vx-a3, #ea580c)" stroke-width="1.4"/></g><g data-part="genome"><title>genome: DNA or RNA, single- or double-stranded.</title><path d="M71 150 q11.333333333333334 -34 22.666666666666668 0 t22.666666666666668 0 t22.666666666666668 0" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.6" stroke-linecap="round"/><path d="M84.6 167 q11.333333333333334 -27.200000000000003 28.333333333333336 0 t28.333333333333336 0" fill="none" stroke="var(--vx-a5, #7c3aed)" stroke-width="2.6" stroke-linecap="round