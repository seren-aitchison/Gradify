<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900.0 150.0" width="900.0" height="150.0" role="img" aria-label="A logarithmic scale of Hilbert-space dimension from 1 to 10^16 with 3 qubits at 8, 10 qubits at 1024, 20 qubits at about a million and 50 qubits at about 10^15." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">The Hilbert space of n qubits</text><path d="M34.0 100.0 L870.8 100.0" stroke="var(--vx-ink, #151826)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M878.0 100.0 L870.0 103.7 L870.0 96.3 Z" fill="var(--vx-ink, #151826)"/><path d="M34.0 95.0 L34.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="34.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">0</tspan></text><path d="M138.0 95.0 L138.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="138.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">2</tspan></text><path d="M242.0 95.0 L242.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="242.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">4</tspan></text><path d="M346.0 95.0 L346.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="346.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">6</tspan></text><path d="M450.0 95.0 L450.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="450.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">8</tspan></text><path d="M554.0 95.0 L554.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="554.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">10</tspan></text><path d="M658.0 95.0 L658.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="658.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">12</tspan></text><path d="M762.0 95.0 L762.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="762.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">14</tspan></text><path d="M866.0 95.0 L866.0 105.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="866.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">16</tspan></text><text x="884.0" y="16.0" font-size="12" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">dimension (logarithmic scale)</text><path d="M81.0 100.0 L81.0 88.0 L81.0 82.0" fill="none" stroke="var(--vx-line, #8a92a8)" stroke-width="1"/><circle cx="81.0" cy="100.0" r="3.5" fill="var(--vx