<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 508.0" width="380.0" height="508.0" role="img" aria-label="Five boxes in order: light and water, the light-dependent reactions, ATP and NADPH, the Calvin cycle, and glucose and other products." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 76.5 L190.0 71.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 79.5 L185.9 70.5 L194.1 70.5 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 184.5 L190.0 179.4" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 187.5 L185.9 178.5 L194.1 178.5 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 260.5 L190.0 263.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 272.0 L185.9 263.0 L194.1 263.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 360.0 L190.0 354.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 363.0 L185.9 354.0 L194.1 354.0 Z" fill="var(--vx-ink, #151826)"/><rect x="100.0" y="8.5" width="180.0" height="63.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="24.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">light and water</text><text x="190.0" y="41.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">light energy; H<tspan baseline-shift="sub" font-size="8.3">2</tspan>O from the</text><text x="190.0" y="56.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">roots</text><rect x="100.0" y="84.5" width="180.0" height="95.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="100.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">light-dependent</text><text x="190.0" y="117.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">reactions</text><text x="190.0" y="134.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">thylakoid membranes: water</text><text x="190.0" y="149.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">split, O<tspan baseline-shift="sub" font-size="8.3">2</tspan> released, ATP</text><text x="190.0" y="164.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and NADPH made</text><rect x="100.0" y="192.5" width="180.0" height="63.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="208.5" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">ATP and NADPH</text><text x="190.0" y="225.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">carry energy and hydrogen</text><text x="190.0" y="240.5" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">to the stroma</text><rect x="107.6" y="277.0" width="164.9" height="78.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="293.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Calvin cycle</text><text x="190.0" y="310.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">stroma: CO<tspan baseline-shift="sub" font-size="8.3">2</tspan> fixed and</text><text x="190.0" y="325.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">reduced to triose</text><text x="190.0" y="340.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">phosphate</text><rect x="100.0" y="368.0" width="180.0" height="80.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="384.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">glucose and other</text><text x="190.0" y="401.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">products</text><text x="190.0" y="418.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">sugars, starch, cellulose,</text><text x="190.0" y="433.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">amino acids, lipids</text></svg>