<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.0 260.0" width="680.0" height="260.0" role="img" aria-label="Energy diagram: t₂g and eg levels with an upward arrow labelled absorbs about 800 nm, and a note that the complementary blue is transmitted." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M12.0 230.0 L12.0 25.2" stroke="var(--vx-ink, #151826)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M12.0 18.0 L15.7 26.0 L8.3 26.0 Z" fill="var(--vx-ink, #151826)"/><text x="18.0" y="14.0" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">energy</text><path d="M148.0 220.0 L340.0 220.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="142.0" y="220.0" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">t<tspan baseline-shift="sub" font-size="9.0">2</tspan>g</text><path d="M148.0 34.0 L340.0 34.0" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="142.0" y="34.0" font-size="12.5" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="var(--vx-ink, #151826)">eg</text><path d="M250.4 220.0 L250.4 41.2" stroke="var(--vx-a2, #db2777)" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M250.4 34.0 L254.1 42.0 L246.7 42.0 Z" fill="var(--vx-a2, #db2777)"/><text x="256.4" y="127.0" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">absorbs ≈ 800 nm (red), 150 kJ mol<tspan baseline-shift="super" font-size="8.3">−1</tspan></text><text x="532.0" y="127.0" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">transmits blue</text></svg>