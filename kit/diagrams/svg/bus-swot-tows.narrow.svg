<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 225.2" width="380.0" height="225.2" role="img" aria-label="A two by two grid. Internal helpful: strengths. Internal harmful: weaknesses. External helpful: opportunities. External harmful: threats. Each holds the bus company's example." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="153.5" y="28.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Helpful</text><text x="300.5" y="28.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Harmful</text><text x="72.0" y="81.6" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Internal</text><rect x="80.0" y="42.0" width="141.0" height="73.2" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-opacity=".5" stroke-width="1.3"/><text x="89.0" y="59.2" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Strengths</text><text x="89.0" y="78.0" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• a reliable network</text><text x="89.0" y="92.1" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">and loyal local</text><text x="89.0" y="106.2" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">customers</text><rect x="227.0" y="42.0" width="141.0" height="73.2" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".5" stroke-width="1.3"/><text x="236.0" y="59.2" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Weaknesses</text><text x="236.0" y="78.0" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• an ageing diesel</text><text x="236.0" y="92.1" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">fleet</text><text x="72.0" y="160.2" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">External</text><rect x="80.0" y="121.2" width="141.0" height="72.0" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".5" stroke-width="1.3"/><text x="89.0" y="138.4" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Opportunities</text><text x="89.0" y="157.2" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• funding for</text><text x="89.0" y="171.3" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">zero-emission buses</text><rect x="227.0" y="121.2" width="141.0" height="72.0" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-opacity=".5" stroke-width="1.3"/><text x="236.0" y="138.4" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Threats</text><text x="236.0" y="157.2" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• rising fuel costs</text><text x="236.0" y="171.3" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">and car use</text><text x="227.0" y="211.2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">effect on the objective →</text><g transform="translate(14 120.6) rotate(-90)"><text x="0.0" y="0.0" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">origin →</text></g></svg>