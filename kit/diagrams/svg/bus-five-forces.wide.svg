<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 327.8" width="700.0" height="327.8" role="img" aria-label="Rivalry among existing competitors in the centre with arrows from threat of new entrants (above), threat of substitutes (below), bargaining power of suppliers (left) and bargaining power of buyers (right)." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M350.0 84.0 L350.0 109.0" stroke="var(--vx-a2, #db2777)" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M350.0 118.0 L345.4 108.0 L354.6 108.0 Z" fill="var(--vx-a2, #db2777)"/><path d="M350.0 243.8 L350.0 218.8" stroke="var(--vx-a2, #db2777)" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M350.0 209.8 L354.6 219.8 L345.4 219.8 Z" fill="var(--vx-a2, #db2777)"/><path d="M201.0 167.9 L243.0 166.7" stroke="var(--vx-a2, #db2777)" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M252.0 166.5 L242.1 171.4 L241.9 162.2 Z" fill="var(--vx-a2, #db2777)"/><path d="M499.0 172.2 L457.0 169.9" stroke="var(--vx-a2, #db2777)" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M448.0 169.4 L458.2 165.3 L457.7 174.5 Z" fill="var(--vx-a2, #db2777)"/><rect x="255.0" y="14.0" width="190.0" height="67.0" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="350.0" y="30.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Threat of new entrants</text><text x="350.0" y="51.4" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">strong when barriers to</text><text x="350.0" y="65.8" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">entry are low</text><rect x="255.0" y="246.8" width="190.0" height="67.0" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="350.0" y="262.9" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Threat of substitutes</text><text x="350.0" y="284.2" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">strong when other products</text><text x="350.0" y="298.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">meet the same need</text><rect x="8.0" y="128.9" width="190.0" height="83.3" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="103.0" y="145.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Bargaining power of</text><text x="103.0" y="161.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">suppliers</text><text x="103.0" y="182.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">strong when suppliers are</text><text x="103.0" y="196.9" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">few or switching costs high</text><rect x="502.0" y="128.9" width="190.0" height="97.6" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="597.0" y="145.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Bargaining power of</text><text x="597.0" y="161.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">buyers</text><text x="597.0" y="182.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">strong when buyers are few,</text><text x="597.0" y="196.9" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">large and can switch</text><text x="597.0" y="211.3" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">cheaply</text><rect x="255.0" y="121.0" width="190.0" height="85.8" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity="0.16" stroke="var(--vx-a2, #db2777)" stroke-opacity=".55" stroke-width="1.3"/><text x="350.0" y="137.4" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Rivalry among existing</text><text x="350.0" y="154.3" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">competitors</text><text x="350.0" y="176.3" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">many similar rivals, slow</text><text x="350.0" y="191.3" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">growth, high fixed costs</text></svg>