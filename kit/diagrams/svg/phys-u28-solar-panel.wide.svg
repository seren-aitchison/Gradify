<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.0 302.0" width="680.0" height="302.0" role="img" aria-label="Energy flow diagram: 1600 watts of sunlight in, 352 watts of electrical power out and 1248 watts lost as heat and reflection." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Energy through a solar panel</text><rect x="20.0" y="44.0" width="224.8" height="120.0" fill="var(--vx-a1, #4f46e5)" fill-opacity=".85"/><text x="28.0" y="104.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#fff">sunlight: 1600 W</text><path d="M244.8 44.0 H479.0 l20 13.2 l-20 13.2 H244.8 Z" fill="var(--vx-good, #16a34a)" fill-opacity=".8"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="505.0" y="57.2" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">electrical power: 352 W</text><path d="M244.8 70.4 H250.8 A103.6 103.6 0 0 1 354.4 174.0 V228.0 l-46.8 14 l-46.8 -14 V174.0 A10.0 10.0 0 0 0 250.8 164.0 H244.8 Z" fill="var(--vx-a3, #ea580c)" fill-opacity=".78"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="307.6" y="254.0" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">heat and reflection: 1250 W</text><text x="20.0" y="288.0" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">efficiency = useful ÷ input = 352 ÷ 1600 = 22%</text></svg>