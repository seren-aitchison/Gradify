<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 448.0" width="380.0" height="448.0" role="img" aria-label="A logarithmic distance scale from 1 millimetre to 1 kilometre with three regions: the reactive near field out to 4.8 mm, the radiating near field out to 67 m, and the far field beyond." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Field regions of a 1 m antenna at 10 GHz</text><path d="M62.0 418.0 L62.0 55.2" stroke="var(--vx-ink, #151826)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M62.0 48.0 L65.7 56.0 L58.3 56.0 Z" fill="var(--vx-ink, #151826)"/><text x="70.0" y="44.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">distance from the antenna / m</text><path d="M57.0 418.0 L67.0 418.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="418.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-3</tspan></text><path d="M57.0 358.0 L67.0 358.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="358.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-2</tspan></text><path d="M57.0 298.0 L67.0 298.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="298.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">-1</tspan></text><path d="M57.0 238.0 L67.0 238.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="238.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">0</tspan></text><path d="M57.0 178.0 L67.0 178.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="178.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">1</tspan></text><path d="M57.0 118.0 L67.0 118.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="118.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">2</tspan></text><path d="M57.0 58.0 L67.0 58.0" stroke="var(--vx-ink, #151826)" stroke-width="1.4" stroke-linecap="round" fill="none"/><text x="53.0" y="58.0" font-size="11.5" font-weight="500" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">10<tspan baseline-shift="super" font-size="8.3">3</tspan></text><rect x="230.0" y="377.3" width="14" height="40.7" fill="var(--vx-a5, #7c3aed)" fill-opacity=".75"/><rect x="230.0" y="128.6" width="14" height="248.7" fill="var(--vx-a4, #0d9488)" fill-opacity=".75"/><rect x="230.0" y="58.0" width="14" height="70.6" fill="var(--vx-a1, #4f46e5)" fill-opacity=".75"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="250.0" y="390.1" font-size="11.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">reactive near</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="250.0" y="405.1" font-size="11.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">field</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="250.0" y="245.4" font-size="11.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">radiating near</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="250.0" y="260.4" font-size="11.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">field</text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="250.0" y="93.3" font-size="11.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">far field</text><circle cx="62.0" cy="377.3" r="3.5" fill="var(--vx-a2, #db2777)"/><path d="M62.0 377.3 L78.0 377.3" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="82.0" y="377.3" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">λ/2π = 4.8 mm</text><circle cx="62.0" cy="329.4" r="3.5" fill="var(--vx-a2, #db2777)"/><path d="M62.0 329.4 L78.0 329.4" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="82.0" y="329.4" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">λ = 3 cm</text><circle cx="62.0" cy="238.0" r="3.5" fill="var(--vx-a2, #db2777)"/><path d="M62.0 238.0 L78.0 238.0" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="82.0" y="238.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">D = 1 m</text><circle cx="62.0" cy="128.6" r="3.5" fill="var(--vx-a2, #db2777)"/><path d="M62.0 128.6 L78.0 128.6" stroke="var(--vx-line, #8a92a8)" stroke-width="1" stroke-linecap="round" fill="none"/><text x="82.0" y="128.6" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">2D²/λ = 67 m</text></svg>