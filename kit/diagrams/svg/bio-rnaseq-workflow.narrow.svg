<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 808.0" width="380.0" height="808.0" role="img" aria-label="Eight boxes in order: extract RNA, select mRNA, reverse transcribe, fragment and sequence, quality control, align, count reads per gene, and test for differences." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M190.0 77.0 L190.0 102.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 111.0 L185.9 102.0 L194.1 102.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 184.0 L190.0 209.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 218.0 L185.9 209.0 L194.1 209.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 276.0 L190.0 301.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 310.0 L185.9 301.0 L194.1 301.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 383.0 L190.0 408.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 417.0 L185.9 408.0 L194.1 408.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 475.0 L190.0 500.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 509.0 L185.9 500.0 L194.1 500.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 582.0 L190.0 607.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 616.0 L185.9 607.0 L194.1 607.0 Z" fill="var(--vx-ink, #151826)"/><path d="M190.0 674.0 L190.0 699.9" stroke="var(--vx-ink, #151826)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M190.0 708.0 L185.9 699.0 L194.1 699.0 Z" fill="var(--vx-ink, #151826)"/><rect x="107.6" y="24.0" width="164.9" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">extract RNA</text><text x="190.0" y="57.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">and check its quality</text><rect x="100.0" y="116.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="132.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">select mRNA</text><text x="190.0" y="149.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">by poly-A tail, or remove</text><text x="190.0" y="164.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">ribosomal RNA</text><rect x="107.8" y="223.0" width="164.4" height="48.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="239.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">reverse transcribe</text><text x="190.0" y="256.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">RNA to cDNA</text><rect x="100.0" y="315.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-width="1.6"/><text x="190.0" y="331.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">fragment and sequence</text><text x="190.0" y="348.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">add adapters, then</text><text x="190.0" y="363.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">sequence</text><rect x="119.5" y="422.0" width="141.0" height="48.0" rx="12" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-width="1.6"/><text x="190.0" y="438.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">quality control</text><text x="190.0" y="455.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">check the reads</text><rect x="100.0" y="514.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-width="1.6"/><text x="190.0" y="530.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">align the reads</text><text x="190.0" y="547.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">to a reference genome or</text><text x="190.0" y="562.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">transcriptome</text><rect x="100.0" y="621.0" width="180.0" height="48.0" rx="12" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-width="1.6"/><text x="190.0" y="637.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a5, #7c3aed)">count reads per gene</text><text x="190.0" y="654.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">quantification</text><rect x="100.0" y="713.0" width="180.0" height="63.0" rx="12" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-width="1.6"/><text x="190.0" y="729.0" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)">test for differences</text><text x="190.0" y="746.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">between conditions, with</text><text x="190.0" y="761.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">correction</text></svg>