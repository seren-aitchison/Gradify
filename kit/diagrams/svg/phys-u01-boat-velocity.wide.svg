<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660.0 386.0" width="660.0" height="386.0" role="img" aria-label="Vector triangle: a north arrow of 4.0 m/s, an east arrow of 3.0 m/s from its tip, and the resultant of 5.0 m/s from the start to the end, 37 degrees east of north." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="16.0" y="16.0" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Adding perpendicular velocities</text><circle cx="103.3" cy="336.3" r="4" fill="var(--vx-ink, #151826)"/><path d="M385.6 74.0 L385.6 47.2" stroke="var(--vx-soft, #5b6275)" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M385.6 40.0 L389.3 48.0 L381.9 48.0 Z" fill="var(--vx-soft, #5b6275)"/><text x="385.6" y="32.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">N</text><path d="M103.3 336.3 L103.3 75.6" stroke="var(--vx-a1, #4f46e5)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M103.3 65.7 L108.4 76.7 L98.3 76.7 Z" fill="var(--vx-a1, #4f46e5)"/><path d="M103.3 65.7 L296.4 65.7" stroke="var(--vx-a4, #0d9488)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M306.3 65.7 L295.3 70.8 L295.3 60.6 Z" fill="var(--vx-a4, #0d9488)"/><path d="M103.3 336.3 L300.3 73.6" stroke="var(--vx-a2, #db2777)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M306.3 65.7 L303.7 77.5 L295.6 71.5 Z" fill="var(--vx-a2, #db2777)"/><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="51.1" y="201.0" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)" font-style="italic">v<tspan baseline-shift="sub" font-size="10.4">boat</tspan></text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="204.8" y="49.7" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)" font-style="italic">v<tspan baseline-shift="sub" font-size="10.4">river</tspan></text><text paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round" x="217.6" y="210.6" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" font-style="italic">v</text><text x="402.0" y="60.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">v<tspan baseline-shift="sub" font-size="9.4">boat</tspan> = 4.0 m s<tspan baseline-shift="super" font-size="9.4">-1</tspan>, north</text><text x="402.0" y="82.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">v<tspan baseline-shift="sub" font-size="9.4">river</tspan> = 3.0 m s<tspan baseline-shift="super" font-size="9.4">-1</tspan>, east</text><text x="402.0" y="104.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">v = 5.0 m s<tspan baseline-shift="super" font-size="9.4">-1</tspan>, 37° east of north</text><text x="402.0" y="126.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">|v| = √(4.0<tspan baseline-shift="super" font-size="9.4">2</tspan> + 3.0<tspan baseline-shift="super" font-size="9.4">2</tspan>) = 5.0 m s<tspan baseline-shift="super" font-size="9.4">-1</tspan></text><text x="402.0" y="148.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">tan φ = 3.0/4.0, φ = 37° east of</text><text x="402.0" y="170.0" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">   north</text></svg>