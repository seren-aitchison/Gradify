<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 248.0" width="700.0" height="248.0" role="img" aria-label="A two by two grid: high growth and high share is a star, high growth and low share a question mark, low growth and high share a cash cow, low growth and low share a dog, with the confectionery company's four products placed." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="265.0" y="24.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">High share</text><text x="551.0" y="24.0" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Low share</text><text x="114.0" y="84.0" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">High growth</text><rect x="122.0" y="38.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a4, #0d9488)" fill-opacity=".1" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".5" stroke-width="1.3"/><text x="131.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a4, #0d9488)">Stars</text><text x="131.0" y="70.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">invest to keep pace</text><text x="131.0" y="89.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• vegan chocolate range</text><rect x="408.0" y="38.0" width="280.0" height="86.0" rx="10" fill="var(--vx-a3, #ea580c)" fill-opacity=".1" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".5" stroke-width="1.3"/><text x="417.0" y="55.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">Question marks</text><text x="417.0" y="70.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">need heavy investment</text><text x="417.0" y="89.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• new protein snack (5%)</text><text x="114.0" y="176.0" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Low growth</text><rect x="122.0" y="130.0" width="280.0" height="86.0" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-opacity=".5" stroke-width="1.3"/><text x="131.0" y="147.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Cash cows</text><text x="131.0" y="162.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">more cash than they need</text><text x="131.0" y="181.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• chocolate bar (30%)</text><rect x="408.0" y="130.0" width="280.0" height="86.0" rx="10" fill="var(--vx-bad, #dc2626)" fill-opacity=".1" stroke="var(--vx-bad, #dc2626)" stroke-opacity=".5" stroke-width="1.3"/><text x="417.0" y="147.8" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-bad, #dc2626)">Dogs</text><text x="417.0" y="162.3" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">candidates for divestment</text><text x="417.0" y="181.0" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• boiled-sweet brand</text><text x="408.0" y="234.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">relative market share →</text><g transform="translate(14 130.0) rotate(-90)"><text x="0.0" y="0.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middl