<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 346.0" width="700.0" height="346.0" role="img" aria-label="A water droplet on iron: the anode region in the middle and the cathode region at the edge, with the two half-equations." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><path d="M184.6 178.0 L187.0 280.0 L513.0 280.0 L515.4 178.0 Z" fill="#e0f2fe" fill-opacity=".8"/><path d="M180.0 110.0 L187.0 280.0 L513.0 280.0 L520.0 110.0" fill="none" stroke="var(--vx-ink, #151826)" stroke-width="2.2" stroke-linejoin="round"/><text x="350.0" y="262.0" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">a water droplet on iron</text><rect x="262.8" y="96.0" width="18.0" height="124.0" rx="2" fill="#7a6a5f" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><text x="271.8" y="298.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a3, #ea580c)">iron anode (−)</text><text x="271.8" y="318.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Fe → Fe<tspan baseline-shift="super" font-size="8.6">2+</tspan> + 2e<tspan baseline-shift="super" font-size="8.6">−</tspan></text><text x="287.8" y="150.0" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Fe<tspan baseline-shift="super" font-size="8.6">2+</tspan></text><rect x="419.2" y="96.0" width="18.0" height="124.0" rx="2" fill="#7a6a5f" stroke="var(--vx-ink, #151826)" stroke-width="1.6"/><text x="428.2" y="298.0" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-a1, #4f46e5)">iron cathode (+)</text><text x="428.2" y="318.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">O<tspan baseline-shift="sub" font-size="8.6">2</tspan> + 2H<tspan baseline-shift="sub" font-size="8.6">2</tspan>O + 4e<tspan baseline-shift="super" font-size="8.6">−</tspan> → 4OH<tspan baseline-shift="super" font-size="8.6">−</tspan></text><text x="412.2" y="150.0" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-a2, #db2777)" stroke="var(--vx-card, #fff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">OH<tspan baseline-shift="super" font-size="8.6">−</tspan></text></svg>