<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700.0 107.4" width="700.0" height="107.4" role="img" aria-label="Five boxes in order: forming, storming, norming, performing, adjourning." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><rect x="8.0" y="14.0" width="120.8" height="81.4" rx="9" fill="var(--vx-a1, #4f46e5)" fill-opacity="0.12" stroke="var(--vx-a1, #4f46e5)" stroke-opacity=".55" stroke-width="1.3"/><text x="68.4" y="30.1" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Forming</text><text x="68.4" y="51.4" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">polite,</text><text x="68.4" y="65.8" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">uncertain,</text><text x="68.4" y="80.2" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">leader-dependent</text><rect x="148.8" y="14.0" width="120.8" height="81.4" rx="9" fill="var(--vx-a5, #7c3aed)" fill-opacity="0.12" stroke="var(--vx-a5, #7c3aed)" stroke-opacity=".55" stroke-width="1.3"/><text x="209.2" y="37.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Storming</text><text x="209.2" y="58.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">conflict over</text><text x="209.2" y="73.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">roles and goals</text><rect x="289.6" y="14.0" width="120.8" height="81.4" rx="9" fill="var(--vx-a4, #0d9488)" fill-opacity="0.12" stroke="var(--vx-a4, #0d9488)" stroke-opacity=".55" stroke-width="1.3"/><text x="350.0" y="37.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Norming</text><text x="350.0" y="58.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">agreed ways of</text><text x="350.0" y="73.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">working</text><rect x="430.4" y="14.0" width="120.8" height="81.4" rx="9" fill="var(--vx-a3, #ea580c)" fill-opacity="0.12" stroke="var(--vx-a3, #ea580c)" stroke-opacity=".55" stroke-width="1.3"/><text x="490.8" y="37.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Performing</text><text x="490.8" y="58.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">task focus, high</text><text x="490.8" y="73.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">trust</text><rect x="571.2" y="14.0" width="120.8" height="81.4" rx="9" fill="var(--vx-a2, #db2777)" fill-opacity="0.12" stroke="var(--vx-a2, #db2777)" stroke-opacity=".55" stroke-width="1.3"/><text x="631.6" y="37.3" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-ink, #151826)">Adjourning</text><text x="631.6" y="58.6" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">the group</text><text x="631.6" y="73.0" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">disbands</text><path d="M130.8 54.7 L139.6 54.7" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M146.8 54.7 L138.8 58.4 L138.8 51.0 Z" fill="var(--vx-line, #8a92a8)"/><path d="M271.6 54.7 L280.4 54.7" stroke="var(--vx-line, #8a92a8)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M287.6 54.7 L