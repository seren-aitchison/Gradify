<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380.0 260.4" width="380.0" height="260.4" role="img" aria-label="A two by two grid. Existing products in existing markets: market penetration. New products in existing markets: product development. Existing products in new markets: market development. New products in new markets: diversification." style="color:var(--vx-ink, #151826);font-family:inherit;max-width:100%;height:auto"><text x="153.5" y="28.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Existing products</text><text x="300.5" y="28.0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">New products</text><text x="72.0" y="90.2" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">Existing</text><text x="72.0" y="104.6" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">markets</text><rect x="80.0" y="42.0" width="141.0" height="104.7" rx="10" fill="var(--vx-good, #16a34a)" fill-opacity=".1" stroke="var(--vx-good, #16a34a)" stroke-opacity=".5" stroke-width="1.3"/><text x="89.0" y="59.2" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="var(--vx-good, #16a34a)">Market penetration</text><text x="89.0" y="73.0" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="var(--vx-soft, #5b6275)">lowest risk</text><text x="89.0" y="90.5" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">• referral scheme</text><text x="89.0" y="104.6" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="var(--vx-ink, #151826)">and off-peak pricing</text><rect x="227.0" y="42.0" width="141.0" height="104.7" rx="10" fill="var(--vx-a1, #4f46e5)" fill-opacity=".1" stroke="var(--vx-a1, #4f46