<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{NAME}}</title>
  <!-- {{NAME}}'s homepage, made from kit/templates/subsite by npm run new-site. It's a starting
       point: build the site out from here. The kit's styles give it the Gradify look. -->
  <meta name="gradify-site" content="{{NAME}}">
  <meta name="description" content="{{DESC}}">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../kit/styles/base.css">
  <link rel="stylesheet" href="../kit/styles/components.css">
  <style>
    .site-hero { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; padding: 72px 0 40px; }
    .site-hero .icon { width: 64px; height: 64px; border-radius: 18px; }
    .site-hero .icon .ico { width: 30px; height: 30px; }
    .site-hero h1 { margin: 0; font-size: clamp(40px, 7vw, 72px); letter-spacing: -.04em; line-height: 1; }
    .site-hero p { margin: 0; max-width: 34em; font-size: 18px; color: var(--mute); line-height: 1.5; }
    .site-hero .site-who { font-size: 14px; color: var(--fg); }
    .site-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .site-foot { margin: 60px 0 30px; font-size: 13px; color: var(--faint); }
    .site-foot a { color: var(--mute); }
  </style>
  <script type="module">
    import { SITES, nameHtml } from "../kit/core/site.js";
    import { icon } from "../kit/core/icons.js";
    import { tile, ink } from "../kit/core/colour.js";
    const s = SITES.find((x) => x.n === "{{NAME}}");
    const el = document.querySelector(".site-hero .icon");
    if (s && el) { el.innerHTML = icon(s.i); el.style.cssText = `--c:#${s.c};--tile:${tile(s.c)};--ink:${ink(s.c)}`; }
    // the site's name with its first word in the accent colour, everywhere it appears
    if (s) document.querySelectorAll("[data-site-name]").forEach((n) => { n.innerHTML = nameHtml(s); });
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="wrap">
    <header class="bar glass">
      <a class="brand" href="./" data-site-name>{{NAME}}</a>
      <a class="btn btn-ghost lg btn-sm" href="/"><span>Part of Gradify</span></a>
    </header>
    <main>
      <section class="site-hero">
        <span class="icon"></span>
        <h1 data-site-name>{{NAME}}</h1>
        <p class="site-who"><b>For:</b> {{WHO}}</p>
        <p>{{DESC}}</p>
        <div class="site-actions">
          <a class="btn btn-light lg" href="app.html"><span>Start with your notes</span></a>
          <a class="btn btn-ghost lg" href="/#lifeos"><span>See Gradify LifeOS</span></a>
        </div>
      </section>
    </main>
    <footer class="site-foot"><span data-site-name>{{NAME}}</span> is part of <a href="/">Gradify</a>. One account works on every Gradify site.</footer>
  </div>
</body>
</html>
